<script>
const GLOSS = [{"w":"wake up","es":"despertar(se)","ex":"I wake up early."},{"w":"get up","es":"levantarse","ex":"I get up at seven."},{"w":"wash","es":"lavar(se)","ex":"I wash my face."},{"w":"brush","es":"cepillar(se)","ex":"I brush my teeth."},{"w":"cook","es":"cocinar","ex":"I can cook rice."},{"w":"clean","es":"limpiar","ex":"I clean my room."},{"w":"help","es":"ayudar","ex":"I help at home."},{"w":"can","es":"poder / saber hacer","ex":"I can read."},{"w":"share","es":"compartir","ex":"They share food."},{"w":"every day","es":"cada día","ex":"I do this every day."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"Every Morning","sTitleEs":"Cada mañana","dTitle":"Morning Routine","dTitleEs":"Rutina de la mañana","paras":[[["My name is Marco.","Mi nombre es Marco."],["I get up early.","Me levanto temprano."],["I wash my face.","Me lavo la cara."],["I brush my teeth.","Me cepillo los dientes."],["Then I go to the kitchen.","Luego voy a la cocina."]],[["I make coffee every morning.","Hago café cada mañana."],["I get some bread too.","También agarro un poco de pan."],["I sit down and eat.","Me siento y como."],["It is a simple meal.","Es una comida sencilla."],["I like it a lot.","Me gusta mucho."]],[["After breakfast, I do my chores.","Después del desayuno, hago mis quehaceres."],["I make my bed first.","Primero tiendo mi cama."],["Then I sweep the floor.","Luego barro el piso."],["I keep my room clean.","Mantengo mi cuarto limpio."],["It does not take long.","No tarda mucho."]],[["Then I get my bag.","Luego agarro mi bolsa."],["I take my keys too.","También tomo mis llaves."],["I come back for my phone.","Regreso por mi teléfono."],["I do not want to forget.","No quiero olvidar nada."],["I am ready to go.","Estoy listo para salir."]],[["I do this every day.","Hago esto cada día."],["It is a good habit.","Es un buen hábito."],["A clean start is nice.","Un buen comienzo es agradable."],["I keep my mornings simple.","Mantengo mis mañanas simples."],["That is how I like it.","Así es como me gusta."]],[["I open my window first.","Abro mi ventana primero."],["The fresh air wakes me up.","El aire fresco me despierta."],["I look at the gray sky.","Miro el cielo gris."],["The street is still quiet.","La calle todavía está tranquila."],["A new day begins.","Empieza un nuevo día."]],[["I take a quick shower.","Me doy una ducha rápida."],["The warm water feels nice.","El agua tibia se siente rico."],["I dry myself with a towel.","Me seco con una toalla."],["Then I get dressed fast.","Luego me visto rápido."],["I put on clean clothes.","Me pongo ropa limpia."]],[["I check my bag again.","Reviso mi mochila otra vez."],["I need my notebook today.","Hoy necesito mi cuaderno."],["I put my lunch inside.","Pongo mi almuerzo adentro."],["I do not forget my keys.","No olvido mis llaves."],["Now I am ready.","Ahora estoy listo."]],[["I greet my neighbor outside.","Saludo a mi vecina afuera."],["I say good morning to her.","Le digo buenos días."],["She smiles back at me.","Ella me sonríe de vuelta."],["We talk for a minute.","Conversamos un minuto."],["Then I keep walking.","Luego sigo caminando."]],[["I walk to the bus stop.","Camino al paradero."],["The bus comes on time.","El bus llega a tiempo."],["I find a free seat.","Encuentro un asiento libre."],["I look out the window.","Miro por la ventana."],["The city wakes up too.","La ciudad también despierta."]],[["I arrive at my work.","Llego a mi trabajo."],["I say hello to everyone.","Saludo a todos."],["I start my first task.","Empiezo mi primera tarea."],["I feel calm and awake.","Me siento tranquilo y despierto."],["A good morning helps me.","Una buena mañana me ayuda."]],[["My mornings make me happy.","Mis mañanas me hacen feliz."],["I do not rush at all.","No tengo prisa en absoluto."],["I take my time always.","Siempre me tomo mi tiempo."],["I feel calm and ready.","Me siento tranquilo y listo."],["It is a great start.","Es una gran manera de empezar."]]],"dlg":[["Sara","Good morning, Tom! Do you have coffee?","¡Buenos días, Tom! ¿Tienes café?"],["Tom","Yes, I do. I make coffee every morning.","Sí. Hago café todas las mañanas."],["Sara","That is great. Can I have some?","Qué bien. ¿Puedo tener un poco?"],["Tom","Of course. Come to the kitchen.","Claro que sí. Ven a la cocina."],["Sara","Thanks. Do you make breakfast too?","Gracias. ¿Tú también haces el desayuno?"],["Tom","Not always. Today I just get some bread.","No siempre. Hoy solo agarro un poco de pan."],["Sara","What do you do after breakfast?","¿Qué haces después del desayuno?"],["Tom","I get my bag and go to work. It is a short walk.","Agarro mi bolso y voy al trabajo. Es una caminata corta."],["Sara","Does your job start early?","¿Tu trabajo empieza temprano?"],["Tom","Yes, it is at eight. I have to come in on time.","Sí, es a las ocho. Tengo que llegar a tiempo."],["Sara","I see. I do not start until nine.","Ya veo. Yo no empiezo hasta las nueve."],["Tom","Nice. You can take your time then.","Qué bien. Entonces puedes tomarte tu tiempo."],["Sara","True. I use that extra time to read a little.","Es verdad. Uso ese tiempo extra para leer un poco."],["Tom","That is a good habit. I want to do that too.","Eso es un buen hábito. Yo también quiero hacer eso."],["Tom","Do you walk to work or take the bus?","¿Caminas al trabajo o tomas el bus?"],["Sara","I take the bus. It is faster.","Tomo el bus. Es más rápido."],["Tom","Does it come often?","¿Viene seguido?"],["Sara","Yes. It comes every ten minutes. I do not have to wait long.","Sí. Viene cada diez minutos. No tengo que esperar mucho."],["Tom","I want to use the bus too. Can you show me which one?","Yo también quiero usar el bus. ¿Me puedes mostrar cuál es?"],["Sara","Come with me this morning. I can take you.","Ven conmigo esta mañana. Te puedo llevar."],["Tom","Really? Thank you! I will get my things now.","¿En serio? ¡Gracias! Voy a recoger mis cosas ahora."],["Sara","Okay. We do not have a lot of time. Hurry up!","De acuerdo. No tenemos mucho tiempo. ¡Date prisa!"],["Tom","I am ready! Let us go.","¡Estoy listo! Vamos."],["Sara","Great. I am glad we do this together.","Qué bien. Me alegra que hagamos esto juntos."]],"datos":{"0":"<div class=\"frase\">«I get up at seven»</div><div class=\"lit\">palabra por palabra: “yo consigo arriba a las siete 🤯”</div><div><b>get up</b> = levantarse. El inglés arma verbos con partículas: get + up (arriba).</div>"}},"2":{"sTitle":"What I Can Do","sTitleEs":"Lo que puedo hacer","dTitle":"At School","dTitleEs":"En la escuela","paras":[[["My name is Ana.","Mi nombre es Ana."],["I can do many things.","Puedo hacer muchas cosas."],["I can cook at home.","Puedo cocinar en casa."],["I can read and write.","Puedo leer y escribir."],["I can use a computer.","Puedo usar una computadora."]],[["I can also make things.","También puedo hacer cosas."],["I can make cards for people.","Puedo hacer tarjetas para la gente."],["I use paper and colors.","Uso papel y colores."],["I give them to my friends.","Las doy a mis amigos."],["They love to get them.","Les encanta recibirlas."]],[["But I cannot do everything.","Pero no puedo hacer todo."],["I cannot drive a car.","No puedo manejar un auto."],["I cannot speak French.","No puedo hablar francés."],["That is okay for now.","Eso está bien por ahora."],["We all have things to learn.","Todos tenemos cosas que aprender."]],[["I am learning English now.","Ahora estoy aprendiendo inglés."],["I repeat new words every day.","Repito palabras nuevas cada día."],["I ask my teacher for help.","Le pregunto a mi maestra cuando olvido."],["She is very kind to me.","Ella es muy amable conmigo."],["I keep on trying hard.","Sigo esforzándome mucho."]],[["I want to call my friends.","Quiero llamar a mis amigos."],["I want to use English well.","Quiero usar bien el inglés."],["I can become a good speaker.","Puedo llegar a ser una buena hablante."],["I just have to keep going.","Solo tengo que seguir adelante."],["I will not give up.","No me voy a rendir."]],[["I can ride a bicycle.","Puedo montar bicicleta."],["I can swim in the river.","Puedo nadar en el río."],["I can climb a tall tree.","Puedo trepar un árbol alto."],["I can jump very high.","Puedo saltar muy alto."],["My body is strong.","Mi cuerpo es fuerte."]],[["I can help at home.","Puedo ayudar en casa."],["I can wash the dishes.","Puedo lavar los platos."],["I can clean my room.","Puedo limpiar mi cuarto."],["I can cook simple rice.","Puedo cocinar arroz sencillo."],["My mom is proud.","Mi mamá está orgullosa."]],[["I can sing a little.","Puedo cantar un poco."],["I cannot play guitar yet.","Todavía no puedo tocar guitarra."],["But I want to learn.","Pero quiero aprender."],["My friend can teach me.","Mi amiga me puede enseñar."],["We can practice together.","Podemos practicar juntas."]],[["I can count to one hundred.","Puedo contar hasta cien."],["I can add small numbers.","Puedo sumar números pequeños."],["I cannot do hard math.","No puedo hacer matemáticas difíciles."],["My teacher helps me daily.","Mi maestra me ayuda cada día."],["I get better slowly.","Mejoro poco a poco."]],[["I can write my name.","Puedo escribir mi nombre."],["I can read short stories.","Puedo leer cuentos cortos."],["I can spell easy words.","Puedo deletrear palabras fáciles."],["I cannot read fast yet.","Todavía no puedo leer rápido."],["But I keep trying.","Pero sigo intentando."]],[["I can do many things.","Puedo hacer muchas cosas."],["I cannot do them all.","No puedo hacerlas todas."],["That is okay for me.","Eso está bien para mí."],["I learn a bit daily.","Aprendo un poco cada día."],["I am proud of myself.","Estoy orgullosa de mí."]],[["Small steps are still steps.","Los pasos pequeños siguen siendo pasos."],["I do a little each day.","Hago un poco cada día."],["I keep going every day.","Sigo adelante cada día."],["I know I can do it.","Sé que puedo lograrlo."],["That is enough for me.","Eso es suficiente para mí."]]],"dlg":[["Mrs. Kim","Good morning, Ben. Can you repeat after me?","Buenos días, Ben. ¿Puedes repetir después de mí?"],["Ben","Yes, I can. I am ready.","Sí, puedo. Estoy listo."],["Mrs. Kim","Great. I say the word. You repeat it. Okay?","Bien. Yo digo la palabra. Tú la repites. ¿De acuerdo?"],["Ben","Okay. I can do that.","De acuerdo. Puedo hacer eso."],["Mrs. Kim","Good. Now, do you use a notebook in class?","Bien. Ahora, ¿usas un cuaderno en clase?"],["Ben","Yes. I use it to take notes.","Sí. Lo uso para tomar notas."],["Mrs. Kim","Perfect. Can I ask you something?","Perfecto. ¿Puedo preguntarte algo?"],["Ben","Of course. Please ask me.","Claro que sí. Por favor, pregúnteme."],["Mrs. Kim","What does Ben call his teacher?","¿Cómo llama Ben a su maestra?"],["Ben","He calls her Mrs. Kim. That is me!","La llama Mrs. Kim. ¡Esa soy yo!"],["Mrs. Kim","Very good! Now, can you ask me a question?","¡Muy bien! Ahora, ¿puedes hacerme una pregunta?"],["Ben","Yes! Does the test come on Friday?","¡Sí! ¿El examen es el viernes?"],["Mrs. Kim","Yes, it does. Keep practicing and you will do well.","Sí. Sigue practicando y lo harás bien."],["Ben","Thank you. I will keep trying.","Gracias. Seguiré intentando."],["Ben","Can I ask you something too?","¿Puedo preguntarle algo también?"],["Mrs. Kim","Of course. What do you want to ask?","Claro. ¿Qué quieres preguntar?"],["Ben","Do you use music to teach? I think it can help.","¿Usa música para enseñar? Creo que puede ayudar."],["Mrs. Kim","Yes, I do! Music makes it easier to repeat and remember.","¡Sí! La música hace que sea más fácil repetir y recordar."],["Ben","I want to become a teacher one day.","Quiero llegar a ser maestro algún día."],["Mrs. Kim","That is a great goal. Do what you love.","Eso es una meta excelente. Haz lo que amas."],["Ben","What do good teachers do?","¿Qué hacen los buenos maestros?"],["Mrs. Kim","They listen. They ask good questions. And they make learning fun.","Escuchan. Hacen buenas preguntas. Y hacen que el aprendizaje sea divertido."],["Ben","Just like you! Thank you, Mrs. Kim.","¡Como usted! Gracias, señora Kim."],["Mrs. Kim","You are welcome, Ben. Now get to work!","De nada, Ben. ¡Ahora a trabajar!"]],"datos":{"2":"<div class=\"frase\">«I cannot speak French»</div><div class=\"lit\">palabra por palabra: “yo no puedo hablar francés”</div><div><b>cannot</b> se escribe JUNTO (o can’t). Y los idiomas van con mayúscula: French, English.</div>","3":"<div class=\"frase\">«I keep on trying hard»</div><div class=\"lit\">palabra por palabra: “sigo en intentando duro”</div><div><b>keep on + -ing</b> = seguir haciendo algo sin rendirse.</div>","10":"<div class=\"frase\">«I am proud of myself»</div><div class=\"lit\">palabra por palabra: “estoy orgullosa DE mí misma”</div><div>Las emociones llevan su preposición fija: proud <b>of</b>, good <b>at</b>, afraid <b>of</b>.</div>"}},"3":{"sTitle":"A Typical Day","sTitleEs":"Un día típico","dTitle":"At the Store","dTitleEs":"En la tienda","paras":[[["My name is Sara.","Me llamo Sara."],["I get up at seven.","Me levanto a las siete."],["I make tea first thing.","Lo primero que hago es preparar té."],["I have a small breakfast.","Desayuno algo ligero."],["Then I get ready for work.","Luego me alisto para el trabajo."]],[["I take the bus to work.","Tomo el autobús al trabajo."],["The ride is not long.","El recorrido no es largo."],["I arrive at work on time.","Llego a mi trabajo a tiempo."],["I do many things at work.","Hago muchas cosas en el trabajo."],["I help people every day.","Ayudo a las gente todos los días."]],[["At lunch, I get some food.","En el almuerzo, consigo comida."],["I take a short walk too.","También salgo a caminar un poco."],["The fresh air is very good.","El aire fresco es muy bueno."],["I come back and feel better.","Regreso y me siento mejor."],["Then I do more work.","Luego hago más trabajo."]],[["In the afternoon, I have meetings.","Por la tarde tengo una reunión."],["I ask questions and take notes.","Hago preguntas y tomo notas."],["I make a task list too.","Hago una lista de cosas por hacer."],["I keep it on my desk.","La mantengo en mi escritorio."],["It helps me a lot.","Me ayuda mucho."]],[["I take the bus back home.","Tomo el autobús de regreso a casa."],["I come in and sit down.","Entro y me siento."],["I make a simple dinner.","Preparo una cena sencilla."],["I have it on the couch.","La como en el sofá."],["It is a good end.","Es un buen final."]],[["I wake up before the alarm.","Despierto antes de la alarma."],["I open my eyes slowly.","Abro los ojos despacio."],["I stretch my arms wide.","Estiro bien los brazos."],["I sit up in bed.","Me siento en la cama."],["Then I stand up.","Luego me levanto."]],[["I wash my face with water.","Me lavo la cara con agua."],["I brush my teeth well.","Me cepillo bien los dientes."],["I comb my hair fast.","Me peino rápido."],["I put on my clothes.","Me pongo la ropa."],["I look in the mirror.","Me miro en el espejo."]],[["In the morning I am busy.","En la mañana estoy ocupada."],["I answer many emails.","Respondo muchos correos."],["I talk with my boss.","Hablo con mi jefe."],["I write down my tasks.","Anoto mis tareas."],["The hours pass fast.","Las horas pasan rápido."]],[["After lunch I feel tired.","Después del almuerzo me siento cansada."],["I drink a hot coffee.","Tomo un café caliente."],["It gives me energy.","Me da energía."],["I go back to my desk.","Vuelvo a mi escritorio."],["I finish my work.","Termino mi trabajo."]],[["At home I rest a little.","En casa descanso un poco."],["I take off my shoes.","Me quito los zapatos."],["I sit on the sofa.","Me siento en el sofá."],["I call my mother.","Llamo a mi mamá."],["We talk about the day.","Conversamos sobre el día."]],[["Before bed I read a book.","Antes de dormir leo un libro."],["I turn off the lights.","Apago las luces."],["I close my tired eyes.","Cierro mis ojos cansados."],["I think happy thoughts.","Pienso cosas bonitas."],["Then I fall asleep.","Luego me quedo dormida."]],[["I do this every weekday.","Hago esto cada día de la semana."],["It is a good routine.","Es una buena rutina."],["I keep to my schedule.","Me apego a mi horario."],["It makes my day easy.","Hace mi día más fácil."],["I like my typical day.","Me gusta mi día típico."]]],"dlg":[["Ana","Excuse me. Do you have any pens?","Disculpe. ¿Tienen lapiceros?"],["Mr. Park","Yes, we do. Come this way, please.","Sí, tenemos. Venga por aquí, por favor."],["Ana","Can I ask — what is the price?","¿Puedo preguntar — cuál es el precio?"],["Mr. Park","This one is two soles. It is a good pen.","Este cuesta dos soles. Es un buen lapicero."],["Ana","Can I take two of them?","¿Puedo llevar dos?"],["Mr. Park","Of course. I will give you a small bag too.","Claro que sí. También le daré una bolsita."],["Ana","Thank you. Does this store have notebooks?","Gracias. ¿Esta tienda tiene cuadernos?"],["Mr. Park","Yes, it does. But we do not have big ones today.","Sí. Pero hoy no tenemos los grandes."],["Ana","That is okay. A small one is fine.","Está bien. Uno pequeño sirve."],["Mr. Park","Here you go. Do you need anything else?","Aquí tiene. ¿Necesita algo más?"],["Ana","No, thank you. I just need to get some change.","No, gracias. Solo necesito recibir mi cambio."],["Mr. Park","Of course. Here is your change.","Claro. Aquí tiene su cambio."],["Mr. Park","Do you come here often?","¿Vienes seguido por aquí?"],["Ana","Yes. I come every week. You have good things here.","Sí. Vengo cada semana. Tienen cosas buenas aquí."],["Mr. Park","Thank you! We get new things every Monday.","¡Gracias! Recibimos cosas nuevas cada lunes."],["Ana","Good to know. Do you give discounts for students?","Bueno saberlo. ¿Dan descuentos a estudiantes?"],["Mr. Park","We do not give discounts. But our prices are low.","No damos descuentos. Pero nuestros precios son bajos."],["Ana","That is true. Can I ask one more thing?","Es verdad. ¿Puedo preguntar una cosa más?"],["Mr. Park","Of course. What do you need?","Claro. ¿Qué necesitas?"],["Ana","What time do you open on Sundays?","¿A qué hora abren los domingos?"],["Mr. Park","We open at nine in the morning.","Abrimos a las nueve de la mañana."],["Ana","Perfect. Thank you for your help!","Perfecto. ¡Gracias por su ayuda!"],["Mr. Park","You are welcome. Come back anytime.","De nada. Vuelve cuando quieras."],["Ana","I will. See you next week!","Lo haré. ¡Hasta la próxima semana!"],["Mr. Park","Take care. Have a good day!","Cuídate. ¡Que tengas un buen día!"]],"datos":{"0":"<div class=\"frase\">«I make tea first thing»</div><div class=\"lit\">palabra por palabra: “hago té primera cosa”</div><div><b>first thing</b> function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; const want=(typeof voice!=='undefined'&&voice==='GB')?'en-GB':'en-US'; const pref=['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Michelle','Microsoft Ana','Samantha','Google UK English Female','Microsoft Libby','Microsoft Sonia','Daniel']; const en=vs.filter(v=>v.lang&&v.lang.indexOf('en')===0); const pool=en.filter(v=>v.lang===want).concat(en); for(const p of pref){ const hit=pool.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } return pool[0]||null; }catch(e){ return null; } }
function say(text,onend){ try{ if(!('speechSynthesis' in window))throw 0; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=rate; const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}else u.lang=voice==='US'?'en-US':'en-GB'; if(onend)u.onend=onend; speechSynthesis.speak(u); }catch(e){ if(onend) setTimeout(onend,Math.max(700,String(text).split(' ').length*330/rate)); } }

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var want=FX.cfg.accent==="GB"?"en-GB":"en-US";
    var pref=["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Google UK English Female","Microsoft Libby","Microsoft Sonia","Daniel"];
    var en=vs.filter(function(v){return v.lang&&v.lang.indexOf("en")===0;});
    var pool=en.filter(function(v){return v.lang===want;}).concat(en);
    for(var i=0;i<pref.length;i++){ var hit=null; for(var j=0;j<pool.length;j++){ if(pool[j].name&&pool[j].name.indexOf(pref[i])===0){ hit=pool[j]; break; } } if(hit) return hit; }
    return pool[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
      var fs=p.querySelector('.ptext .sent');
      if(fs&&!fs.querySelector('.dcap')){ var t=fs.textContent; if(t&&t.length>1){ fs.innerHTML='<span class="dcap">'+t.charAt(0)+'</span>'+t.slice(1).replace(/&/g,'&amp;').replace(/</g,'&lt;'); } }
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
