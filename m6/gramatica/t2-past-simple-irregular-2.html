<script>

const MAT = {"title":{"es":"Resumen de Gramática","en":"Grammar Summary"},"subtitle":{"es":"Pasado Irregular · made · gave · took","en":"Irregular Past · made · gave · took"},"reportId":"sum-past-irr-2"};
const PASS = 75;
const STEPS = [{"icon":"🇪🇸","title":{"es":"Repaso en Español","en":"Spanish Recap"},"html":{"es":"<div class=\"gdesc\">Sigues con los irregulares. En español, «hacer» hace <b>hice</b>, «dar» hace <b>di</b> y «tomar» hace <b>tomé</b>. Los dos primeros cambian mucho: son irregulares también en español.</div>\n<div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">🍳 hacer</div><div class=\"role\">Pasado</div><div class=\"desc\">«Hice el almuerzo.»</div></div><div class=\"art-box\"><div class=\"word\">🎁 dar</div><div class=\"role\">Pasado</div><div class=\"desc\">«Le di un regalo.»</div></div></div>\n<div class=\"info-illus\"><span class=\"emo\">✅</span><span class=\"txt\">Estos verbos cuentan acciones <b>que ya terminaron</b>: hice, di, tomé.</span></div>\n<div class=\"info-illus\"><span class=\"emo\">🔔</span><span class=\"txt\">En inglés también son irregulares: <b>make, give y take</b> cambian de forma en pasado.</span></div>\n<div class=\"gnote life\">🌎 <b>De tu vida:</b> «Ayer hice mi tarea», «Mi abuela me dio un libro», «Tomé el bus a las siete». Todo eso ya pasó.</div>","en":"<div class=\"gdesc\">You continue with irregular verbs. In Spanish «hacer» becomes <b>hice</b>, «dar» becomes <b>di</b> and «tomar» becomes <b>tomé</b>. The first two change a lot: they are irregular in Spanish too.</div>\n<div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">🍳 hacer</div><div class=\"role\">Past</div><div class=\"desc\">«Hice el almuerzo.»</div></div><div class=\"art-box\"><div class=\"word\">🎁 dar</div><div class=\"role\">Past</div><div class=\"desc\">«Le di un regalo.»</div></div></div>\n<div class=\"info-illus\"><span class=\"emo\">✅</span><span class=\"txt\">These verbs tell actions <b>that already finished</b>: hice, di, tomé.</span></div>\n<div class=\"info-illus\"><span class=\"emo\">🔔</span><span class=\"txt\">In English they are irregular too: <b>make, give and take</b> change form in the past.</span></div>\n<div class=\"gnote life\">🌎 <b>From your life:</b> «Ayer hice mi tarea», «Mi abuela me dio un libro», «Tomé el bus a las siete». All of it already happened.</div>"},"checks":[{"q":{"es":"«Hice» es el pasado de:","en":"«Hice» is the past of:"},"opts":{"es":["hacer","hablar"],"en":["hacer (make)","hablar (speak)"]},"correct":0,"fb":{"why":{"es":"hacer → hice.","en":"hacer → hice."},"tip":{"es":"hacer → hice","en":"hacer → hice"}}},{"q":{"es":"«Di» es el pasado de:","en":"«Di» is the past of:"},"opts":{"es":["dar","decir"],"en":["dar (give)","decir (say)"]},"correct":0,"fb":{"why":{"es":"dar → di.","en":"dar → di."},"tip":{"es":"dar → di","en":"dar → di"}}},{"q":{"es":"«Tomé el bus» habla:","en":"«Tomé el bus» talks about:"},"opts":{"es":["Del pasado","Del presente"],"en":["The past","The present"]},"correct":0,"fb":{"why":{"es":"Ya terminó: es pasado.","en":"It already finished: it is past."},"tip":{"es":"ya pasó","en":"already happened"}}},{"q":{"es":"Un verbo irregular:","en":"An irregular verb:"},"opts":{"es":["Cambia de forma","Agrega -ed"],"en":["Changes form","Adds -ed"]},"correct":0,"fb":{"why":{"es":"Por eso hay que aprenderlo.","en":"That is why you learn it."},"tip":{"es":"cambia","en":"changes"}}},{"q":{"es":"«Ayer hice mi tarea» ya:","en":"«Ayer hice mi tarea» is:"},"opts":{"es":["Terminó","Está pasando ahora"],"en":["Finished","Happening now"]},"correct":0,"fb":{"why":{"es":"«Ayer» ya terminó.","en":"«Ayer» already finished."},"tip":{"es":"ayer = pasado","en":"ayer = past"}}}]},{"icon":"🤝","title":{"es":"Similitudes","en":"Similarities"},"html":{"es":"<div class=\"gdesc\">Estos tres verbos también <b>cambian de forma</b> en lugar de agregar -ed. Son de los más usados en inglés.</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">🍳</span><span class=\"lbl\">make → made</span><span class=\"es\">hice / hizo</span></div><div class=\"viz-item\"><span class=\"ico\">🎁</span><span class=\"lbl\">give → gave</span><span class=\"es\">di / dio</span></div><div class=\"viz-item\"><span class=\"ico\">✋</span><span class=\"lbl\">take → took</span><span class=\"es\">tomé / tomó</span></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">At noon we <span class=\"tag v\">made</span> lunch.</div><div class=\"es\">Al mediodía hicimos el almuerzo.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('At noon we made lunch.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('At noon we made lunch.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">She <span class=\"tag v\">gave</span> me a small gift.</div><div class=\"es\">Ella me dio un regalito.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('She gave me a small gift.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('She gave me a small gift.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">We <span class=\"tag v\">took</span> many photos.</div><div class=\"es\">Tomamos muchas fotos.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('We took many photos.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('We took many photos.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"sec-label\">Lo igual en los dos idiomas</div>\n<ul class=\"simlist\"><li>En los dos idiomas estos verbos cambian de forma en pasado.</li><li>Los dos usan palabras señal: yesterday · last week.</li><li>El orden no cambia: Sujeto + verbo + complemento.</li></ul>\n<div class=\"gnote\">👍 Con estos tres + los cuatro del resumen anterior ya tienes <b>los 7 irregulares del módulo</b>.</div>","en":"<div class=\"gdesc\">These three verbs also <b>change form</b> instead of adding -ed. They are among the most used in English.</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">🍳</span><span class=\"lbl\">make → made</span><span class=\"es\">hice / hizo</span></div><div class=\"viz-item\"><span class=\"ico\">🎁</span><span class=\"lbl\">give → gave</span><span class=\"es\">di / dio</span></div><div class=\"viz-item\"><span class=\"ico\">✋</span><span class=\"lbl\">take → took</span><span class=\"es\">tomé / tomó</span></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">At noon we <span class=\"tag v\">made</span> lunch.</div><div class=\"es\">Al mediodía hicimos el almuerzo.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('At noon we made lunch.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('At noon we made lunch.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">She <span class=\"tag v\">gave</span> me a small gift.</div><div class=\"es\">Ella me dio un regalito.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('She gave me a small gift.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('She gave me a small gift.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">We <span class=\"tag v\">took</span> many photos.</div><div class=\"es\">Tomamos muchas fotos.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('We took many photos.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('We took many photos.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"sec-label\">The same in both languages</div>\n<ul class=\"simlist\"><li>In both languages these verbs change form in the past.</li><li>Both use signal words: yesterday · last week.</li><li>The order stays the same: Subject + verb + complement.</li></ul>\n<div class=\"gnote\">👍 With these three plus the four from the previous summary you have <b>the 7 irregular verbs of the module</b>.</div>"},"checks":[{"q":{"es":"El pasado de <b>make</b> es:","en":"The past of <b>make</b> is:"},"opts":{"es":["made","maked"],"en":["made","maked"]},"correct":0,"fb":{"why":{"es":"make es irregular: make → made.","en":"make is irregular: make → made."},"tip":{"es":"make → made","en":"make → made"}}},{"q":{"es":"El pasado de <b>give</b> es:","en":"The past of <b>give</b> is:"},"opts":{"es":["gave","gived"],"en":["gave","gived"]},"correct":0,"fb":{"why":{"es":"give es irregular: give → gave.","en":"give is irregular: give → gave."},"tip":{"es":"give → gave","en":"give → gave"}}},{"q":{"es":"El pasado de <b>take</b> es:","en":"The past of <b>take</b> is:"},"opts":{"es":["took","taked"],"en":["took","taked"]},"correct":0,"fb":{"why":{"es":"take es irregular: take → took.","en":"take is irregular: take → took."},"tip":{"es":"take → took","en":"take → took"}}},{"q":{"es":"Estos tres verbos en pasado:","en":"These three verbs in the past:"},"opts":{"es":["Cambian de forma","Agregan -ed"],"en":["Change form","Add -ed"]},"correct":0,"fb":{"why":{"es":"Son irregulares.","en":"They are irregular."},"tip":{"es":"irregulares","en":"irregular"}}},{"q":{"es":"«At noon we ___ lunch»:","en":"«At noon we ___ lunch»:"},"opts":{"es":["made","maked"],"en":["made","maked"]},"correct":0,"fb":{"why":{"es":"make → made.","en":"make → made."},"tip":{"es":"made","en":"made"}}}]},{"icon":"⚡","title":{"es":"Diferencias","en":"Differences"},"html":{"es":"<div class=\"gdesc\">En español cada persona tiene su forma: <b>hice, hiciste, hizo, hicimos</b>. En inglés hay <b>UNA sola forma</b>: <b>made</b>.</div>\n<table class=\"dtab\"><tr><th>Español</th><th>English</th><th>Explicación</th></tr>\n<tr><td>hice, hiciste, hizo, hicimos, hicieron</td><td class=\"en\">made</td><td>Una sola forma para todas las personas</td></tr>\n<tr><td>di, diste, dio, dimos, dieron</td><td class=\"en\">gave</td><td>I gave · she gave · we gave</td></tr>\n<tr><td>tomé, tomaste, tomó, tomamos</td><td class=\"en\">took</td><td>I took · he took · they took</td></tr></table>\n<div class=\"sec-label\">La misma forma para TODAS las personas</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">👤</span><span class=\"lbl\">I gave</span><span class=\"es\">yo di</span></div><div class=\"viz-item\"><span class=\"ico\">👉</span><span class=\"lbl\">You gave</span><span class=\"es\">tú diste · ustedes dieron</span></div><div class=\"viz-item\"><span class=\"ico\">👦</span><span class=\"lbl\">He gave</span><span class=\"es\">él dio</span></div><div class=\"viz-item\"><span class=\"ico\">👧</span><span class=\"lbl\">She gave</span><span class=\"es\">ella dio</span></div><div class=\"viz-item\"><span class=\"ico\">🐶</span><span class=\"lbl\">It gave</span><span class=\"es\">eso dio (animal/cosa)</span></div><div class=\"viz-item\"><span class=\"ico\">👨‍👩‍👧</span><span class=\"lbl\">We / They gave</span><span class=\"es\">dimos · dieron</span></div></div>\n<div class=\"sec-label\">⚠️ El error más común</div>\n<div class=\"info-illus\"><span class=\"emo\">❌</span><span class=\"txt\">No existe «maked», «gived» ni «taked». El verbo irregular <b>ya es pasado</b>: made, gave, took.</span></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">Her mom <span class=\"tag v\">made</span> us tea.</div><div class=\"es\">Su mamá nos hizo un té.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Her mom made us tea.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Her mom made us tea.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card bad\" data-lab=\"❌ MAL\"><span class=\"emo\">💬</span><div><div class=\"en\">Her mom <span class=\"tag v\">maked</span> us tea.</div><div class=\"es\">(forma inventada: no existe)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Her mom maked us tea.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Her mom maked us tea.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"gnote\">🧠 Truco: apréndelos en pareja: <b>make-made · give-gave · take-took</b>.</div>","en":"<div class=\"gdesc\">In Spanish each person has its own form: <b>hice, hiciste, hizo, hicimos</b>. In English there is <b>ONE form</b>: <b>made</b>.</div>\n<table class=\"dtab\"><tr><th>Español</th><th>English</th><th>Explanation</th></tr>\n<tr><td>hice, hiciste, hizo, hicimos, hicieron</td><td class=\"en\">made</td><td>One single form for all persons</td></tr>\n<tr><td>di, diste, dio, dimos, dieron</td><td class=\"en\">gave</td><td>I gave · she gave · we gave</td></tr>\n<tr><td>tomé, tomaste, tomó, tomamos</td><td class=\"en\">took</td><td>I took · he took · they took</td></tr></table>\n<div class=\"sec-label\">The same form for ALL persons</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">👤</span><span class=\"lbl\">I gave</span><span class=\"es\">yo di</span></div><div class=\"viz-item\"><span class=\"ico\">👉</span><span class=\"lbl\">You gave</span><span class=\"es\">tú diste · ustedes dieron</span></div><div class=\"viz-item\"><span class=\"ico\">👦</span><span class=\"lbl\">He gave</span><span class=\"es\">él dio</span></div><div class=\"viz-item\"><span class=\"ico\">👧</span><span class=\"lbl\">She gave</span><span class=\"es\">ella dio</span></div><div class=\"viz-item\"><span class=\"ico\">🐶</span><span class=\"lbl\">It gave</span><span class=\"es\">eso dio</span></div><div class=\"viz-item\"><span class=\"ico\">👨‍👩‍👧</span><span class=\"lbl\">We / They gave</span><span class=\"es\">dimos · dieron</span></div></div>\n<div class=\"sec-label\">⚠️ The most common mistake</div>\n<div class=\"info-illus\"><span class=\"emo\">❌</span><span class=\"txt\">There is no «maked», «gived» or «taked». The irregular verb <b>is already the past</b>: made, gave, took.</span></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">Her mom <span class=\"tag v\">made</span> us tea.</div><div class=\"es\">Su mamá nos hizo un té.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Her mom made us tea.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Her mom made us tea.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card bad\" data-lab=\"❌ MAL\"><span class=\"emo\">💬</span><div><div class=\"en\">Her mom <span class=\"tag v\">maked</span> us tea.</div><div class=\"es\">(invented form: it does not exist)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Her mom maked us tea.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Her mom maked us tea.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"gnote\">🧠 Trick: learn them in pairs: <b>make-made · give-gave · take-took</b>.</div>"},"checks":[{"q":{"es":"«Di, diste, dio, dimos» en inglés son:","en":"«Di, diste, dio, dimos» in English are:"},"opts":{"es":["Una sola forma: gave","Cuatro formas distintas"],"en":["One single form: gave","Four different forms"]},"correct":0,"fb":{"why":{"es":"El inglés usa gave para todas las personas.","en":"English uses gave for every person."},"tip":{"es":"una sola forma","en":"one form"}}},{"q":{"es":"¿Cuál está bien?","en":"Which one is right?"},"opts":{"es":["She gave me a gift","She gived me a gift"],"en":["She gave me a gift","She gived me a gift"]},"correct":0,"fb":{"why":{"es":"«gived» no existe.","en":"«gived» does not exist."},"tip":{"es":"gave","en":"gave"}}},{"q":{"es":"¿Cuál está bien?","en":"Which one is right?"},"opts":{"es":["We took photos","We taked photos"],"en":["We took photos","We taked photos"]},"correct":0,"fb":{"why":{"es":"«taked» no existe.","en":"«taked» does not exist."},"tip":{"es":"took","en":"took"}}},{"q":{"es":"¿Cuál está bien?","en":"Which one is right?"},"opts":{"es":["Her mom made tea","Her mom maked tea"],"en":["Her mom made tea","Her mom maked tea"]},"correct":0,"fb function say(text,acc){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; const vs=speechSynthesis.getVoices()||[]; const want=acc==='US'?'en-US':'en-GB'; const v=vs.find(x=>x.lang===want)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0); if(v){u.voice=v;u.lang=v.lang;}else u.lang=want; speechSynthesis.speak(u); }catch(e){} }
function render(){ cur=0; coreDone=false; doneSteps=new Array(STEPS.length).fill(false); answers=STEPS.map(s=>new Array(s.checks.length).fill(null)); bState={order:[],locked:false};
  document.getElementById('results').classList.remove('show'); document.getElementById('mbody').style.display='block'; document.getElementById('msbanner').style.display='none';
  renderTabs(); applyLang(); showStep(0); }
function renderTabs(){ document.getElementById('steptabs').innerHTML=STEPS.map((s,i)=>`<button class="stab${i===0?' on':''}${doneSteps[i]?' done':''}" id="stab${i}" onclick="goStep(${i})">${s.icon} ${i+1}</button>`).join(''); }
function applyLang(){ const t=L();
  document.getElementById('lsEs').classList.toggle('on',info==='es'); document.getElementById('lsEn').classList.toggle('on',info==='en');
  document.getElementById('mhtitle').textContent=MAT.title[info]; document.getElementById('mhsub').textContent=document.getElementById('screen').getAttribute('data-level').toUpperCase().replace('-',' · ')+' · '+MAT.subtitle[info];
  document.getElementById('unT').textContent=t.unT; document.getElementById('unP').textContent=t.unP;
  document.getElementById('helpT').textContent=t.helpT; document.getElementById('helpTips').innerHTML='<div style="font-size:11.5px;color:var(--text-soft);font-weight:700;margin-bottom:6px">'+t.tipsT+'</div>'+t.tips.map(x=>'<div class="helptip">• <span>'+x+'</span></div>').join('');
  document.getElementById('kpT').textContent=t.kpT; document.getElementById('lBack').textContent=t.back; document.getElementById('lRetry').textContent=t.retry;
  updateMilestone(); renderStep(); }
function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';
  let html=`<div class="gcard"><div class="sec-label">${cur+1}. ${s.icon} ${s.title[info]}</div>${s.html[info]}`;
  if(s.builder) html+=builderHtml(); html+=`</div>`;
  const ansd=answers[cur].filter(x=>x!==null).length;
  html+=`<div class="check"><div class="check-h">🧠 ${t.checkH}<span class="cprog">${ansd}/${s.checks.length}</span></div><div class="check-sub">${t.checkSub}</div>`;
  s.checks.forEach((c,ci)=>{ const sel=answers[cur][ci]; const done=sel!==null; const ok=sel===c.correct;
    let fb='';
    if(done){ const f=c.fb; fb=`<div class="cfb show ${ok?'ok':'no'}"><div class="cfbh">${ok?'✅ '+t.cOk:'❌ '+t.cBad}</div><div class="cfbb">`+
      `<div class="fblk why"><b>🔍 ${t.fWhy}</b>${f.why[info]}</div>`+
      (f.contrast?`<div class="fblk contrast"><b>⚠ ${t.fNo}</b>${f.contrast[info]}</div>`:'')+
      (f.ex?`<div class="fblk ex"><b>📝 ${t.fEx}</b>${f.ex[info]}</div>`:'')+
      (f.tip?`<div class="fblk tip"><b>💡 ${t.fTip}</b>${f.tip[info]}</div>`:'')+`</div></div>`; }
    const trBtn = (c.tr && info==='es') ? `<button class="ctransbtn" onclick="this.nextElementSibling.classList.toggle('show')">🌐 ${t.seeTr}</button><div class="ctrans">${c.tr.es}</div>` : '';
    html+=`<div class="citem"><p class="cq"><span class="n">${ci+1}.</span> ${c.q[info]}</p>${trBtn}<div class="copts">`+
      c.opts[info].map((o,k)=>{ let cl='copt'; if(done){ if(k===c.correct)cl+=' ok'; else if(k===sel)cl+=' no'; } return `<button class="${cl}" ${done?'disabled':''} onclick="checkAns(${ci},${k})">${o}</button>`; }).join('')+
      `</div>${fb}</div>`;
  });
  html+=`</div>`;
  document.getElementById('stepArea').innerHTML=html;
  if(s.builder) initBuilder();
  document.getElementById('navPrev').textContent=t.prev; document.getElementById('navPrev').disabled=cur===0;
  document.getElementById('navNext').textContent= cur===STEPS.length-1? t.finish : t.next;
  document.getElementById('pfill').style.width=(doneSteps.filter(Boolean).length/STEPS.length*100)+'%';
}
function checkAns(ci,k){ if(answers[cur][ci]!==null) return; answers[cur][ci]=k;
  if(answers[cur].every(x=>x!==null)){ doneSteps[cur]=true; document.getElementById('stab'+cur).classList.add('done'); }
  if([0,1,2].every(i=>doneSteps[i]) && !coreDone){ coreDone=true; try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{type:'summary', core:true, mat:MAT.reportId}})); }catch(e){} toast(L().msToast); }
  updateMilestone(); renderStep(); }
function updateMilestone(){ const b=document.getElementById('msbanner'); if([0,1,2].every(i=>doneSteps[i])){ b.style.display='block'; b.textContent=L().msCore; } else b.style.display='none'; }
function builderHtml(){ const t=L(); return `<div class="builder"><div class="bh">🧩 ${t.bH}</div><div class="bsub">${t.bSub}</div><div class="tray" id="tray" data-ph="${t.trayPh}"></div><div class="bank" id="bank"></div><button class="bcheck" id="bchk" onclick="checkBuild()" disabled>${t.bcheck}</button><div class="bres" id="bres"></div></div>`; }
function initBuilder(){ bState={order:[],locked:false}; const sh=[...BUILD.answer.keys()].sort(()=>Math.random()-.5);
  document.getElementById('bank').innerHTML=sh.map(idx=>`<button class="tile ${BUILD.answer[idx].c}" id="tile${idx}" onclick="placeTile(${idx})">${BUILD.answer[idx].w}</button>`).join(''); document.getElementById('tray').innerHTML=''; }
function placeTile(idx){ if(bState.locked)return; bState.order.push(idx); document.getElementById('tile'+idx).classList.add('placed'); const tr=document.getElementById('tray'); const b=document.createElement('button'); b.className='tile '+BUILD.answer[idx].c; b.textContent=BUILD.answer[idx].w; b.onclick=()=>removeTile(idx,b); tr.appendChild(b); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function removeTile(idx,el){ if(bState.locked)return; bState.order=bState.order.filter(x=>x!==idx); el.remove(); document.getElementById('tile'+idx).classList.remove('placed'); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function checkBuild(){ const t=L(); bState.locked=true; const ok=bState.order.join(',')===BUILD.answer.map((_,i)=>i).join(','); document.querySelectorAll('#tray .tile').forEach(x=>x.style.pointerEvents='none');
  const r=document.getElementById('bres'); r.className='bres show '+(ok?'ok':'no'); r.innerHTML=(ok?'✅ '+t.bOk:'❌ '+t.bNo)+`<div class="bex"><div class="tr">${BUILD.answer.map(a=>a.w).join(' ')} — <i>${BUILD.tr[info]}</i></div><button class="audio-btn" onclick="say('${BUILD.say}','US')">🇺🇸 US</button><button class="audio-btn" onclick="say('${BUILD.say}','UK')">🇬🇧 UK</button></div>`; }
function showStep(i){ cur=i; document.querySelectorAll('.stab').forEach((b,x)=>b.classList.toggle('on',x===i)); renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
function goStep(i){ showStep(i); }
function navStep(d){ if(d<0){ if(cur>0) showStep(cur-1); return; } if(cur<STEPS.length-1){ showStep(cur+1); return; } const inc=answers.findIndex(a=>a.some(x=>x===null)); if(inc>=0){ toast(L().finishNeed); showStep(inc); } else finish(); }
function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
  let tot=0,corr=0; answers.forEach((arr,si)=>arr.forEach((k,ci)=>{ if(k!==null){tot++; if(k===STEPS[si].checks[ci].correct)corr++;} })); const pct=tot?Math.round(corr/tot*100):0; const pass=pct>=PASS;
  const db=document.getElementById('doneBar'); db.classList.toggle('fail',!pass); db.textContent= pass? t.done : t.failBar; document.getElementById('fscore').textContent=pct; document.getElementById('fphrase').textContent= pass? t.phrase : t.phraseFail;
  document.getElementById('kpList').innerHTML=SUMMARY[info].map(s=>`<li>${s}</li>`).join('');
  document.getElementById('surprise').style.display= pass? 'block':'none';
  if(pass){ document.getElementById('medalEm').textContent=BADGE.emoji; document.getElementById('surT').textContent=t.surT; document.getElementById('surBadge').textContent=t.surBadge(BADGE.name[info]); document.getElementById('surP').textContent=t.surP; document.getElementById('xpWin').textContent=t.xp(BADGE.xp); }
  try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:pct, pass:pass, type:'summary', badge:BADGE.name.en, xp:BADGE.xp, mat:MAT.reportId, final:true}})); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'}); }
function restart(){ render(); }
function openHelp(){document.getElementById('helpov').classList.add('show');} function closeHelp(){document.getElementById('helpov').classList.remove('show');}
function setInfo(l){ info=l; applyLang(); }
function setLevel(lv){ document.getElementById('screen').setAttribute('data-level',lv); info= lv==='a2'?'en':'es'; render(); }
function volver(){ if(document.referrer){ location.href=document.referrer; } else if(history.length>1){ history.back(); } else { toast(info==='es'?'Vuelve a tu práctica en la plataforma':'Go back to your practice'); } }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.mat')){ e.preventDefault(); toast(info==='es'?'Material protegido © JUCUM EC':'Protected material © JUCUM EC'); }});
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
/* FIN DEL MOTOR */
setLevel(document.getElementById('screen').getAttribute('data-level')||'pre-a1');
</script>
