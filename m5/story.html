,"es":"especial","ex":"Yesterday was a special day."},{"w":"delicious","es":"delicioso / deliciosa","ex":"It was absolutely delicious."},{"w":"famous","es":"famoso / famosa","ex":"We talked about her famous recipes."},{"w":"recipe / recipes","es":"receta / recetas","ex":"We talked about her famous recipes."},{"w":"secret / secrets","es":"secreto / secretos","ex":"Abuela knows these secrets."},{"w":"calm","es":"calmado / tranquilo","ex":"He was warm, calm, and quiet."},{"w":"enormous","es":"enorme","ex":"I wanted an enormous breakfast!"},{"w":"absolutely","es":"absolutamente","ex":"It was absolutely delicious."},{"w":"proud","es":"orgulloso / orgullosa","ex":"I was so proud."},{"w":"pineapple","es":"piña","ex":"I like pineapple juice."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"My Dog Coco","sTitleEs":"Mi perro Coco","dTitle":"At the Park","dTitleEs":"En el parque","paras":[[["Coco is my dog.","Coco es mi perro."],["He is a small, brown puppy.","Es un cachorrito pequeño y marrón."],["His eyes are big.","Sus ojos son grandes."],["One eye is almost yellow.","Un ojo es casi amarillo."],["I love his happy face.","Amo su cara feliz."]],[["Coco was very small.","Coco era muy pequeño."],["His ears were soft.","Sus orejas eran suaves."],["His legs were short.","Sus patas eran cortas."],["He was cold at night.","Tenía frío por la noche."],["Now he is big.","Ahora es grande."]],[["I remember his first day.","Recuerdo su primer día."],["Dad opened a small box.","Papá abrió una cajita."],["Coco looked at me.","Coco me miró."],["I wanted this dog!","¡Yo quería este perro!"],["We played all day.","Jugamos todo el día."]],[["Look at his eyes.","Mira sus ojos."],["They change with the light.","Cambian con la luz."],["In the sun, almost green.","Bajo el sol, casi verdes."],["At night, dark and big.","De noche, oscuros y grandes."],["His eyes talk to me.","Sus ojos me hablan."]],[["Yesterday we walked to the park.","Ayer caminamos al parque."],["The morning was warm.","La mañana estaba cálida."],["Coco played with his ball.","Coco jugó con su pelota."],["His favorite ball is yellow.","Su pelota favorita es amarilla."],["He looked so happy.","Se veía muy feliz."]],[["Coco really loves water.","A Coco le encanta el agua."],["There is a fountain there.","Hay una pileta allí."],["Coco played in the water.","Coco jugó en el agua."],["The water was very cold.","El agua estaba muy fría."],["Coco was wet and happy.","Coco quedó mojado y feliz."]],[["One day, Coco was ill.","Un día, Coco estuvo enfermo."],["His nose was hot.","Su nariz estaba caliente."],["He was not hungry.","No tenía hambre."],["We helped him a lot.","Lo ayudamos mucho."],["Mom changed his food.","Mamá cambió su comida."]],[["Two days later, Coco was fine.","Dos días después, Coco estaba bien."],["He wanted his ball again.","Quería su pelota otra vez."],["His eyes were bright.","Sus ojos estaban brillantes."],["We were so happy.","Estábamos muy felices."],["Dogs grow strong with love.","Los perros crecen fuertes con amor."]],[["Coco grows every month.","Coco crece cada mes."],["His color changed a little.","Su color cambió un poquito."],["Before, he was light brown.","Antes, era marrón claro."],["Now he is dark brown.","Ahora es marrón oscuro."],["But his heart is the same.","Pero su corazón es el mismo."]],[["Coco is my best friend.","Coco es mi mejor amigo."],["He waits at the door.","Me espera en la puerta."],["Every day, we play together.","Cada día, jugamos juntos."],["I talk, and he listens.","Yo hablo y él escucha."],["My dog is my family.","Mi perro es mi familia."]]],"datos":[null,"En inglés, «tener frío» se dice con <b>be</b>: <span class=\"frase\">He was cold.</span> <span class=\"lit\">(lit.: «él estaba frío»)</span> = tenía frío.","Pasado regular = verbo + <b>-ed</b>: <span class=\"frase\">look → looked · play → played · want → wanted.</span>",null,null,null,null,"<b>was</b> = yo, él, ella, eso (I / he / she / it) · <b>were</b> = tú, nosotros, ellos (you / we / they): <span class=\"frase\">Coco was ill · We were so happy.</span>",null,null],"dlg":[["Leo","Hi, Mia! Who is this?","¡Hola, Mia! ¿Quién es este?"],["Mia","This is Coco, my dog.","Este es Coco, mi perro."],["Leo","His eyes are so big!","¡Sus ojos son tan grandes!"],["Mia","Yes, look at them.","Sí, míralos."],["Leo","One eye looks yellow.","Un ojo se ve amarillo."],["Mia","In the sun, almost green.","Bajo el sol, casi verde."],["Leo","Was he always this big?","¿Siempre fue así de grande?"],["Mia","No, he was very small.","No, era muy pequeño."],["Leo","Really? Small like a cat?","¿En serio? ¿Pequeño como un gato?"],["Mia","Yes! His legs were short.","¡Sí! Sus patas eran cortas."],["Leo","And now he is strong.","Y ahora es fuerte."],["Mia","He grows every month.","Crece cada mes."],["Leo","What does he eat?","¿Qué come?"],["Mia","Dog food and some eggs.","Comida de perro y huevos."],["Leo","Eggs? That is funny!","¿Huevos? ¡Qué gracioso!"],["Mia","Yesterday he wanted my apple.","Ayer quería mi manzana."],["Leo","And what happened then?","¿Y qué pasó después?"],["Mia","I played with him outside.","Jugué con él afuera."],["Leo","The park was full today.","El parque estaba lleno hoy."],["Mia","Yes, Coco was so happy.","Sí, Coco estaba muy feliz."],["Leo","He played in the water!","¡Jugó en el agua!"],["Mia","The water was cold!","¡El agua estaba fría!"],["Leo","But he looked happy.","Pero se veía feliz."],["Mia","Dogs love cold water.","A los perros les encanta el agua fría."],["Leo","I want a dog too.","Yo también quiero un perro."],["Mia","Dogs are good friends.","Los perros son buenos amigos."]]},"2":{"sTitle":"Yesterday's Breakfast","sTitleEs":"El desayuno de ayer","dTitle":"At Breakfast","dTitleEs":"En el desayuno","paras":[[["Yesterday was a special day.","Ayer fue un día especial."],["Mom and I cooked breakfast.","Mamá y yo cocinamos el desayuno."],["It was my first time.","Fue mi primera vez."],["I was a little nervous.","Estaba un poco nervioso."],["But mom helped me.","Pero mamá me ayudó."]],[["First, we cooked the eggs.","Primero, cocinamos los huevos."],["Mom opened two eggs.","Mamá abrió dos huevos."],["I added a little salt.","Yo agregué un poquito de sal."],["The eggs changed color fast.","Los huevos cambiaron de color rápido."],["They were white and yellow.","Quedaron blancos y amarillos."]],[["Then we prepared the juice.","Luego preparamos el jugo."],["I like pineapple juice.","Me gusta el jugo de piña."],["Mom added cold water.","Mamá agregó agua fría."],["I mixed everything well.","Yo mezclé todo bien."],["The pineapple juice was so yellow.","El jugo de piña quedó bien amarillo."]],[["There was one green apple.","Había una manzana verde."],["It was for the table.","Era para la mesa."],["I washed the apple.","Lavé la manzana."],["The water was very cold.","El agua estaba muy fría."],["My hands were cold too!","¡Mis manos también estaban frías!"]],[["Dad walked into the kitchen.","Papá entró a la cocina."],["He looked at the table.","Miró la mesa."],["His eyes were big.","Sus ojos estaban muy abiertos."],["\"Who cooked this?\" he asked.","«¿Quién cocinó esto?», preguntó."],["\"We cooked it,\" I answered.","«Lo cocinamos nosotros», respondí."]],[["The breakfast was ready.","El desayuno estaba listo."],["Everyone wanted the eggs.","Todos querían los huevos."],["Dad tasted the delicious juice.","Papá probó el jugo delicioso."],["He smiled at me.","Me sonrió."],["I was so proud.","Yo estaba muy orgulloso."]],[["Abuela visited us later.","La abuela nos visitó más tarde."],["She wanted hot water.","Quería agua caliente."],["I helped with the cups.","Ayudé con las tazas."],["We talked about her famous recipes.","Conversamos sobre sus recetas famosas."],["Her stories were funny.","Sus historias eran graciosas."]],[["Later, I wanted my apple.","Más tarde, quería mi manzana."],["But the apple was not there!","¡Pero la manzana no estaba!"],["I looked under the table.","Miré debajo de la mesa."],["Dad looked at abuela.","Papá miró a la abuela."],["Her face was red!","¡Su cara estaba roja!"]],[["\"I was hungry!\" abuela laughed.","«¡Tenía hambre!», se rió la abuela."],["We laughed together too.","Nos reímos juntos también."],["Mom washed another apple.","Mamá lavó otra manzana."],["This apple was yellow.","Esta manzana era amarilla."],["It was delicious, sweet, and cold.","Estaba deliciosa, dulce y fría."]],[["I eat breakfast every day.","Como desayuno todos los días."],["But yesterday was different.","Pero ayer fue diferente."],["We cooked as a family.","Cocinamos en familia."],["The food was simple.","La comida era sencilla."],["But the morning was perfect.","Pero la mañana fue perfecta."]]],"datos":[null,null,null,"<b>There was</b> = había (una cosa): <span class=\"frase\">There was one green apple.</span>","<span class=\"frase\">Dad walked into the kitchen.</span> <span class=\"lit\">(lit.: «caminó hacia adentro»)</span> = entró caminando.",null,null,null,"<b>I was hungry</b> = tenía hambre. En inglés se dice con <b>was</b>, no con «have».",null],"dlg":[["Mamá","Tomás, breakfast is ready!","Tomás, ¡el desayuno está listo!"],["Tomás","I am coming, mom!","¡Ya voy, mamá!"],["Mamá","Do you want eggs?","¿Quieres huevos?"],["Tomás","Yes, please. Two eggs.","Sí, por favor. Dos huevos."],["Mamá","Here is your juice.","Aquí está tu jugo."],["Tomás","Is it apple juice?","¿Es jugo de manzana?"],["Mamá","Yes, with cold water.","Sí, con agua fría."],["Tomás","Mmm, it is so good.","Mmm, está muy rico."],["Mamá","Wow, you were hungry!","¡Vaya, tenías hambre!"],["Tomás","Yes, I was very hungry.","Sí, tenía mucha hambre."],["Mamá","Do you want an apple?","¿Quieres una manzana?"],["Tomás","Is it a green apple?","¿Es una manzana verde?"],["Mamá","No, this one is yellow.","No, esta es amarilla."],["Tomás","Yellow apples are sweet.","Las manzanas amarillas son dulces."],["Mamá","I washed it for you.","La lavé para ti."],["Tomás","Thank you so much, mom.","Muchas gracias, mamá."],["Mamá","How was school yesterday?","¿Cómo estuvo la escuela ayer?"],["Tomás","It was really fun.","Estuvo muy divertida."],["Mamá","Oh! What happened there?","¡Oh! ¿Qué pasó allí?"],["Tomás","We cooked in class!","¡Cocinamos en clase!"],["Mamá","Really? Tell me more.","¿En serio? Cuéntame más."],["Tomás","We prepared fruit water.","Preparamos agua de frutas."],["Mamá","That sounds very nice.","Suena muy bien."],["Tomás","I added the sugar!","¡Yo agregué el azúcar!"],["Mamá","You are my little cook!","¡Eres mi pequeño cocinero!"],["Tomás","Cooking is fun, mom.","Cocinar es divertido, mamá."]]},"3":{"sTitle":"A Walk in Nature","sTitleEs":"Un paseo en la naturaleza","dTitle":"In the Garden","dTitleEs":"En el jardín","paras":[[["Last Sunday, we visited abuela.","El domingo pasado visitamos a la abuela."],["She lives near a hill.","Vive cerca de un cerro."],["Her garden is beautiful.","Su jardín es hermoso."],["Many plants grow there.","Muchas plantas crecen allí."],["I love that place.","Amo ese lugar."]],[["Abuela waited at the door.","La abuela esperaba en la puerta."],["We walked to the garden.","Caminamos al jardín."],["The morning was cold.","La mañana estaba fría."],["But the sky was blue.","Pero el cielo estaba azul."],["Everything was green and fresh.","Todo estaba verde y fresco."]],[["Plants grow slowly, abuela says.","Las plantas crecen lento, dice la abuela."],["They want water and sun.","Quieren agua y sol."],["Abuela waters them every day.","La abuela las riega cada día."],["Yesterday I watered them too.","Ayer yo también las regué."],["The plants looked happy.","Las plantas se veían felices."]],[["Look at the leaves.","Mira las hojas."],["They change with time.","Cambian con el tiempo."],["Some leaves are green.","Algunas hojas son verdes."],["Other leaves are yellow.","Otras hojas son amarillas."],["Nature changes all the time.","La naturaleza cambia todo el tiempo."]],[["There was an old flower.","Había una flor vieja."],["Its color changed last week.","Su color cambió la semana pasada."],["Yesterday, the flower died.","Ayer, la flor murió."],["I was a little sad.","Me puse un poco triste."],["Abuela looked at me.","La abuela me miró."]],[["\"Flowers die,\" abuela explained.","«Las flores mueren», explicó la abuela."],["\"But seeds grow again.\"","«Pero las semillas crecen de nuevo»."],["She opened her hand.","Abrió su mano."],["There were five small seeds.","Había cinco semillitas."],["We planted them together.","Las sembramos juntas."]],[["Then a dog visited us.","Entonces un perro nos visitó."],["He was brown and white.","Era marrón y blanco."],["His eyes were kind.","Sus ojos eran tiernos."],["The dog wanted water.","El perro quería agua."],["Abuela helped him fast.","La abuela lo ayudó rápido."]],[["Abuela grows apples too.","La abuela también cultiva manzanas."],["Her apples are small and green.","Sus manzanas son pequeñas y verdes."],["We picked two apples.","Recogimos dos manzanas."],["I washed them with water.","Las lavé con agua."],["They were delicious, cold, and sweet.","Estaban deliciosas, frías y dulces."]],[["Later, we walked up the hill.","Más tarde, subimos el cerro caminando."],["The wind was strong.","El viento estaba fuerte."],["Birds danced in the sky.","Los pájaros bailaban en el cielo."],["The city looked so small.","La ciudad se veía muy pequeña."],["We rested on a rock.","Descansamos sobre una roca."]],[["Nature is a big school.","La naturaleza es una gran escuela."],["Things grow, change, and die.","Las cosas crecen, cambian y mueren."],["Then they grow again.","Luego crecen de nuevo."],["Abuela knows these secrets.","La abuela sabe estos secretos."],["I want to learn too.","Yo también quiero aprender."]]],"datos":[null,null,null,null,"Si el verbo termina en <b>-e</b>, solo agrega <b>-d</b>: <span class=\"frase\">die → died · change → changed.</span>","<b>There were</b> = había (varias cosas): <span class=\"frase\">There were five small seeds.</span>",null,"<b>grow</b> = crecer, y también <b>cultivar</b>: <span class=\"frase\">Abuela grows apples.</span>",null,null],"dlg":[["Abuela","Lara! Welcome, my love.","¡Lara! Bienvenida, mi amor."],["Lara","Abuela! Your garden is big!","¡Abuela! ¡Tu jardín está grande!"],["Abuela","Yes, the plants grow fast.","Sí, las plantas crecen rápido."],["Lara","This flower is so yellow!","¡Esta flor es bien amarilla!"],["Abuela","It was small last month.","Era pequeña el mes pasado."],["Lara","Really? It changed a lot.","¿En serio? Cambió mucho."],["Abuela","Water and sun, Lara.","Agua y sol, Lara."],["Lara","What is that tree?","¿Qué es ese árbol?"],["Abuela","That is my apple tree.","Ese es mi manzano."],["Lara","The apples are green!","¡Las manzanas están verdes!"],["Abuela","Green apples need more time.","Las manzanas verdes ne function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; const gb=(typeof voice!=='undefined'&&(voice==='UK'||voice==='GB')); const want=gb?'en-gb':'en-us'; const pref= gb?['Google UK English Female','Google UK English Male','Microsoft Sonia','Microsoft Libby','Microsoft Maisie','Microsoft Ryan','Microsoft Thomas','Daniel','Kate','Serena','Arthur','Martha']:['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Michelle','Microsoft Ana','Microsoft Emma','Microsoft Andrew','Samantha','Alex','Allison','Ava','Fred']; const en=vs.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0); const exact=en.filter(v=>v.lang.replace('_','-').toLowerCase()===want); for(const p of pref){ const hit=exact.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } if(exact.length) return exact[0]; for(const p of pref){ const hit=en.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } return en[0]||null; }catch(e){ return null; } }

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){

    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }

      cloudDone[storyId]=true;

  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }

  })(0);

  ring();
