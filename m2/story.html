<script>
const GLOSS = [{"w":"do / does","es":"hacer (y auxiliar de preguntas)","ex":"Do you study today?"},{"w":"have","es":"tener","ex":"Do you have fruit?"},{"w":"can","es":"poder","ex":"I can draw very well."},{"w":"get","es":"conseguir / traer","ex":"He gets bread and fruit."},{"w":"make","es":"hacer / preparar","ex":"Dad makes breakfast every day."},{"w":"give","es":"dar","ex":"Ana gives me a pencil."},{"w":"take","es":"tomar / llevar","ex":"I take my box home."},{"w":"use","es":"usar","ex":"We use old boxes in art."},{"w":"call","es":"llamar","ex":"He calls us for dinner."},{"w":"ask","es":"preguntar / pedir","ex":"She asks easy questions."},{"w":"come","es":"venir","ex":"Ravi comes to my door."},{"w":"become","es":"volverse / llegar a ser","ex":"I want to become a nurse."},{"w":"keep","es":"guardar / quedarse con","ex":"I keep my books in it."},{"w":"repeat","es":"repetir","ex":"We repeat new words with her."},{"w":"is","es":"es / está (to be)","ex":"The class is excited."},{"w":"wake up / get up","es":"despertar / levantarse","ex":"I get up slowly."},{"w":"wash","es":"lavar(se)","ex":"First, I wash my face."},{"w":"brush","es":"cepillar(se)","ex":"Then I brush my teeth."},{"w":"eat","es":"comer","ex":"We eat together at seven."},{"w":"walk","es":"caminar","ex":"We walk to school together."},{"w":"run","es":"correr","ex":"He runs and runs."},{"w":"read","es":"leer","ex":"I read comic books."},{"w":"play","es":"jugar","ex":"He plays with us."},{"w":"help","es":"ayudar","ex":"After school, I help mom."},{"w":"share","es":"compartir","ex":"Ravi shares his rice."},{"w":"study / practice","es":"estudiar / practicar","ex":"But I practice every day."},{"w":"work","es":"trabajar","ex":"She works at home."},{"w":"want / need","es":"querer / necesitar","ex":"Mom needs eggs and bread."},{"w":"like","es":"gustar","ex":"I like English class."},{"w":"every day","es":"cada día","ex":"He drives it every day."},{"w":"early / late","es":"temprano / tarde","ex":"I do not like early mornings."},{"w":"first / then","es":"primero / luego","ex":"First, I wash my face."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"Every Morning","sTitleEs":"Cada mañana","dTitle":"Morning Routine","dTitleEs":"Rutina de la mañana","paras":[[["Every morning starts the same.","Cada mañana empieza igual."],["Mom opens my door.","Mamá abre mi puerta."],["\"Wake up, Leo!\" she says.","«¡Despierta, Leo!», dice."],["I get up slowly.","Me levanto despacio."],["The sun comes in.","El sol entra."]],[["First, I wash my face.","Primero, me lavo la cara."],["Then I brush my teeth.","Luego me cepillo los dientes."],["Lara brushes her teeth too.","Lara también se cepilla los dientes."],["She sings with the brush.","Canta con el cepillo."],["It takes a long time.","Le toma mucho tiempo."]],[["Dad makes breakfast every day.","Papá hace el desayuno cada día."],["He gets bread and fruit.","Trae pan y fruta."],["Mom makes hot tea.","Mamá hace té caliente."],["I take the cups.","Yo llevo las tazas."],["We eat together at seven.","Comemos juntos a las siete."]],[["After breakfast, I get my bag.","Después del desayuno, tomo mi mochila."],["I keep my books in it.","Guardo mis libros en ella."],["Mom gives me an apple.","Mamá me da una manzana."],["She kisses my head.","Besa mi cabeza."],["\"Have a good day!\" she says.","«¡Que tengas buen día!», dice."]],[["Ravi comes to my door.","Ravi viene a mi puerta."],["We walk to school together.","Caminamos juntos a la escuela."],["He talks about his dog.","Habla de su perro."],["I talk about football.","Yo hablo de fútbol."],["The walk is short and fun.","La caminata es corta y divertida."]],[["Classes start at eight.","Las clases empiezan a las ocho."],["Miss Rosa says good morning.","Miss Rosa dice buenos días."],["We repeat new words with her.","Repetimos palabras nuevas con ella."],["She asks easy questions.","Hace preguntas fáciles."],["I like English class.","Me gusta la clase de inglés."]],[["At noon, we eat lunch.","Al mediodía, almorzamos."],["Ravi shares his rice.","Ravi comparte su arroz."],["I give him some fruit.","Yo le doy fruta."],["We use the long table.","Usamos la mesa larga."],["Lunch tastes better with friends.","El almuerzo sabe mejor con amigos."]],[["After school, I help mom.","Después de clases, ayudo a mamá."],["I get water for her.","Le traigo agua."],["She cooks and sings.","Ella cocina y canta."],["Lara plays with her dolls.","Lara juega con sus muñecas."],["Our house smells like soup.","Nuestra casa huele a sopa."]],[["At night, dad comes home.","De noche, papá llega a casa."],["He calls us for dinner.","Nos llama para cenar."],["We talk about the day.","Hablamos del día."],["Dad laughs at my stories.","Papá se ríe con mis historias."],["Then I wash the dishes.","Luego lavo los platos."]],[["Before bed, I read.","Antes de dormir, leo."],["Mom comes to say good night.","Mamá viene a decir buenas noches."],["I close my eyes.","Cierro mis ojos."],["The house gets quiet.","La casa se pone tranquila."],["Tomorrow starts the same way.","Mañana empieza de la misma forma."]]],"datos":["Con he/she el verbo lleva <b>-s</b>: <span class=\"frase\">mom open<b>s</b> · she say<b>s</b> · dad make<b>s</b>.</span>",null,null,"«Que tengas buen día» = <b>Have a good day!</b> — have también forma deseos.",null,null,null,null,"«Nos llama» = <b>He calls us</b>. call = llamar (también por teléfono).",null],"dlg":[["Ana","Leo, do you wake up early?","Leo, ¿te despiertas temprano?"],["Leo","Yes, I do.","Sí."],["Leo","I wake up at six thirty.","Me despierto a las seis y media."],["Ana","Six thirty! That is early.","¡Seis y media! Eso es temprano."],["Ana","What do you do first?","¿Qué haces primero?"],["Leo","First, I wash my face.","Primero, me lavo la cara."],["Leo","Then I brush my teeth.","Luego me cepillo los dientes."],["Ana","Do you make your breakfast?","¿Preparas tu desayuno?"],["Leo","No, I do not.","No."],["Leo","My dad makes it.","Mi papá lo prepara."],["Ana","What does he make?","¿Qué prepara él?"],["Leo","He gets bread and fruit.","Trae pan y fruta."],["Ana","Does your mom work?","¿Tu mamá trabaja?"],["Leo","Yes, she does.","Sí."],["Leo","She works at home.","Trabaja en casa."],["Ana","Who walks with you?","¿Quién camina contigo?"],["Leo","Ravi comes to my door.","Ravi viene a mi puerta."],["Leo","We walk together.","Caminamos juntos."],["Ana","Do you like mornings?","¿Te gustan las mañanas?"],["Leo","Yes, I like them a lot.","Sí, me gustan mucho."],["Ana","I do not like mornings.","A mí no me gustan las mañanas."],["Ana","I sleep a lot.","Duermo mucho."],["Leo","What time do you get up?","¿A qué hora te levantas?"],["Ana","At seven, very fast!","¡A las siete, muy rápido!"],["Leo","Ha! Do you run to school?","¡Ja! ¿Corres a la escuela?"],["Ana","Yes, I do. Every day!","Sí. ¡Cada día!"]]},"2":{"sTitle":"What I Can Do","sTitleEs":"Lo que puedo hacer","dTitle":"At School","dTitleEs":"En la escuela","paras":[[["My name is Mia.","Me llamo Mia."],["I am seven years old.","Tengo siete años."],["I can do many things.","Puedo hacer muchas cosas."],["Some things are hard.","Algunas cosas son difíciles."],["But I practice every day.","Pero practico cada día."]],[["I can draw very well.","Puedo dibujar muy bien."],["I draw my dog Toby.","Dibujo a mi perro Toby."],["I use three colors.","Uso tres colores."],["My drawings go on the wall.","Mis dibujos van a la pared."],["Mom loves every one.","A mamá le encanta cada uno."]],[["I can run fast too.","También puedo correr rápido."],["I race with Nico.","Corro carreras con Nico."],["He runs very fast.","Él corre muy rápido."],["Sometimes he lets me win.","A veces me deja ganar."],["We laugh at the end.","Nos reímos al final."]],[["I cannot swim yet.","Todavía no puedo nadar."],["Water goes in my nose.","El agua entra a mi nariz."],["Dad says, \"Take your time.\"","Papá dice: «Tómate tu tiempo»."],["He can swim very well.","Él puede nadar muy bien."],["Soon I can do it too.","Pronto yo también podré."]],[["Nico can cook a little.","Nico puede cocinar un poco."],["He makes eggs and rice.","Hace huevos y arroz."],["He gets help from grandma.","Recibe ayuda de la abuela."],["She keeps the kitchen safe.","Ella mantiene la cocina segura."],["The food tastes good.","La comida sabe rica."]],[["My mom can help people.","Mi mamá puede ayudar a la gente."],["She is a nurse.","Es enfermera."],["She takes care of babies.","Cuida bebés."],["She can work at night.","Puede trabajar de noche."],["I want to become a nurse.","Quiero llegar a ser enfermera."]],[["Dad can drive a big bus.","Papá puede manejar un bus grande."],["He drives it every day.","Lo maneja cada día."],["He knows every street.","Conoce cada calle."],["People ask him questions.","La gente le hace preguntas."],["He always helps them.","Siempre los ayuda."]],[["Baby Luli cannot walk yet.","La bebé Luli todavía no camina."],["She can smile now.","Ya puede sonreír."],["She takes my finger.","Toma mi dedo."],["She keeps it very tight.","Lo aprieta muy fuerte."],["We love her so much.","La queremos muchísimo."]],[["At school, I can read.","En la escuela, puedo leer."],["I read short stories.","Leo historias cortas."],["I can ask questions in English.","Puedo hacer preguntas en inglés."],["Miss Pilar says, \"Great job!\"","Miss Pilar dice: «¡Buen trabajo!»."],["Practice makes things easy.","La práctica hace todo fácil."]],[["Everyone can do something.","Todos pueden hacer algo."],["Nico cooks, mom helps people.","Nico cocina, mamá ayuda a la gente."],["Dad drives, I draw.","Papá maneja, yo dibujo."],["Luli smiles at us.","Luli nos sonríe."],["Together we can do everything.","Juntos podemos hacerlo todo."]]],"datos":["<b>can</b> + verbo sin cambios: <span class=\"frase\">I can draw · he can swim</span> (nunca lleva -s).",null,null,"«Todavía no puedo» = <b>I cannot… yet</b>. cannot = can not (no poder).",null,"«Llegar a ser» = <b>become</b>: <span class=\"frase\">I want to become a nurse.</span>",null,null,null,null],"dlg":[["Miss Rosa","Good morning, Ravi.","Buenos días, Ravi."],["Ravi","Good morning, Miss Rosa.","Buenos días, Miss Rosa."],["Miss Rosa","Can you read this word?","¿Puedes leer esta palabra?"],["Ravi","Yes, I can. It says \"family\".","Sí. Dice «family»."],["Miss Rosa","Very good! Can you use it?","¡Muy bien! ¿Puedes usarla?"],["Ravi","My family is big.","Mi familia es grande."],["Miss Rosa","Excellent! Now repeat, please.","¡Excelente! Ahora repite, por favor."],["Ravi","My family is big.","Mi familia es grande."],["Miss Rosa","Can everyone hear Ravi?","¿Todos pueden oír a Ravi?"],["Ravi","I can speak louder.","Puedo hablar más fuerte."],["Miss Rosa","Do you practice at home?","¿Practicas en casa?"],["Ravi","Yes, I do.","Sí."],["Ravi","I read with my brothers.","Leo con mis hermanos."],["Miss Rosa","Does Dev help you?","¿Dev te ayuda?"],["Ravi","Yes, he does.","Sí."],["Ravi","He asks me questions.","Me hace preguntas."],["Miss Rosa","What does Arjun do?","¿Qué hace Arjun?"],["Ravi","He repeats every word!","¡Repite cada palabra!"],["Miss Rosa","Ha! He learns fast.","¡Ja! Aprende rápido."],["Ravi","Can we play the word game?","¿Podemos jugar al juego de palabras?"],["Miss Rosa","Yes, we can.","Sí, podemos."],["Miss Rosa","Take a card, please.","Toma una tarjeta, por favor."],["Ravi","I get the animal card!","¡Me toca la tarjeta de animales!"],["Miss Rosa","Name three animals, Ravi.","Nombra tres animales, Ravi."],["Ravi","Dog, cat, and bird.","Perro, gato y pájaro."],["Miss Rosa","Perfect. You can teach this class!","Perfecto. ¡Tú puedes enseñar esta clase!"]]},"3":{"sTitle":"A Typical Day","sTitleEs":"Un día típico","dTitle":"At the Store","dTitleEs":"En la tienda","paras":[[["My days are very busy.","Mis días son muy ocupados."],["I am nine, remember?","Tengo nueve, ¿recuerdan?"],["Big kids do many things.","Los niños grandes hacen muchas cosas."],["But I do not complain.","Pero no me quejo."],["Well… not every day.","Bueno… no todos los días."]],[["I do not like early mornings.","No me gustan las mañanas tempranas."],["My bed feels so good.","Mi cama se siente tan rica."],["Mom calls me two times.","Mamá me llama dos veces."],["Dad calls me one more.","Papá me llama una vez más."],["Then I finally get up.","Entonces por fin me levanto."]],[["Mia does not wake up late.","Mia no se despierta tarde."],["She gets up with the sun.","Se levanta con el sol."],["She makes her bed fast.","Tiende su cama rápido."],["I do not understand her.","No la entiendo."],["Mornings are not my friends.","Las mañanas no son mis amigas."]],[["At school, I work hard.","En la escuela, trabajo duro."],["I like math and art.","Me gustan las matemáticas y el arte."],["I do not like tests.","No me gustan los exámenes."],["But I study for them.","Pero estudio para ellos."],["Tomás studies with me.","Tomás estudia conmigo."]],[["After school, I take out Toby.","Después de clases, saco a Toby."],["He does not walk slowly.","Él no camina despacio."],["He runs and runs.","Corre y corre."],["I keep the leash tight.","Sujeto firme la correa."],["Toby does not get tired.","Toby no se cansa."]],[["At home, I help mom.","En casa, ayudo a mamá."],["Luli does not sleep much.","Luli no duerme mucho."],["I make funny faces for her.","Hago caras chistosas para ella."],["She laughs and laughs.","Ella ríe y ríe."],["Her laugh makes us happy.","Su risa nos hace felices."]],[["Dad comes home at six.","Papá llega a casa a las seis."],["He does not rest first.","No descansa primero."],["He plays with us.","Juega con nosotros."],["Then he helps with dinner.","Luego ayuda con la cena."],["We eat at seven thirty.","Cenamos a las siete y media."]],[["I do not watch much TV.","No veo mucha tele."],["I read comic books.","Leo historietas."],["Mia does not read comics.","Mia no lee historietas."],["She draws in her notebook.","Dibuja en su cuaderno."],["We share the big lamp.","Compartimos la lámpara grande."]],[["Grandma calls us every night.","La abuela nos llama cada noche."],["We take turns to talk.","Tomamos turnos para hablar."],["She asks about our day.","Pregunta por nuestro día."],["Luli says, \"Ba-ba-ba!\"","Luli dice: «¡Ba-ba-ba!»."],["Grandma understands her, somehow.","La abuela le entiende, no sé cómo."]],[["At nine, the day ends.","A las nueve, el día termina."],["I do not fight bedtime now.","Ya no peleo la hora de dormir."],["Big kids need sleep too.","Los niños grandes también necesitan dormir."],["My bed feels good again.","Mi cama se siente rica otra vez."],["Good night, busy day!","¡Buenas noches, día ocupado!"]]],"datos":[null,"«No me gustan» = <b>I do not like</b>. do not = <b>don't</b>.","Con she/he la negación usa <b>does not</b>: <span class=\"frase\">She does not wake up late</span> (y el verbo queda sin -s).",null,"does not = <b>doesn't</b>: <span class=\"frase\">He doesn't walk slowly.</span>",null,null,null,null,null],"dlg":[["Mia","Good morning, Don Pepe!","¡Buenos días, Don Pepe!"],["Don Pepe","Good morning, Mia!","¡Buenos días, Mia!"],["Don Pepe","What do you need today?","¿Qué necesitas hoy?"],["Mia","Mom needs eggs and bread.","Mamá necesita huevos y pan."],["Don Pepe","Do you want brown eggs?","¿Quieres huevos marrones?"],["Mia","Yes, please. Six eggs.","Sí, por favor. Seis huevos."],["Don Pepe","Here you go. Take the bag.","Aquí tienes. Toma la bolsa."],["Mia","Thank you. Do you have fruit?","Gracias. ¿Tiene fruta?"],["Don Pepe","Yes, I do.","Sí."],["Don Pepe","I get fresh fruit every morning.","Consigo fruta fresca cada mañana."],["Mia","Do you open early?","¿Abre temprano?"],["Don Pepe","Very early! At six.","¡Muy temprano! A las seis."],["Mia","Who helps you here?","¿Quién le ayuda aquí?"],["Don Pepe","My son comes on Saturdays.","Mi hijo viene los sábados."],["Don Pepe","He keeps the store clean.","Mantiene la tienda limpia."],["Mia","Does he like the work?","¿Le gusta el trabajo?"],["Don Pepe","Yes, he does.","Sí."],["Mia","Do you make juice too?","¿También hace jugo?"],["Don Pepe","Yes! I use these oranges.","¡Sí! Uso estas naranjas."],["Mia","Mom loves your juice.","A mamá le encanta su jugo."],["Don Pepe","Then <script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
