const GLOSS = [{"w":"happy","es":"feliz / contento","ex":"I woke up very happy."},{"w":"nice","es":"amable / agradable / lindo","ex":"She is very nice."},{"w":"good","es":"bueno / bien","ex":"My mom made a good breakfast."},{"w":"big","es":"grande","ex":"The farm was very big."},{"w":"old","es":"viejo / mayor / de edad","ex":"Our house is old and big."},{"w":"quick","es":"rápido / rápida","ex":"He is small but quick."},{"w":"possible","es":"posible","ex":"Is it possible to help everyone?"},{"w":"great","es":"genial / grandioso","ex":"It was a great day!"},{"w":"able","es":"capaz (be able to = poder)","ex":"Ana is able to learn fast."},{"w":"very","es":"muy","ex":"The farm was very big."},{"w":"even","es":"incluso / hasta","ex":"Even my brother came."},{"w":"few / a few","es":"pocos / unos pocos","ex":"A few friends came too."},{"w":"help","es":"ayudar / la ayuda","ex":"I helped her with English."},{"w":"care","es":"cuidar / importar / el cariño","ex":"Her family cares a lot."},{"w":"like","es":"gustar (me gusta)","ex":"I like books very much."},{"w":"went","es":"fui / fue / fuimos (pasado de go)","ex":"Then I went to school."},{"w":"came","es":"vine / vino / vinimos (pasado de come)","ex":"The bus came at seven."},{"w":"had","es":"tuve / tuvo / tuvimos (pasado de have)","ex":"At school we had a test."},{"w":"made","es":"hice / hizo / hicimos (pasado de make)","ex":"At noon we made lunch."},{"w":"got","es":"conseguí / saqué / obtuvo (pasado de get)","ex":"I got a great grade."},{"w":"gave","es":"di / dio / dimos (pasado de give)","ex":"She gave me a small gift."},{"w":"took","es":"tomé / tomó / tomamos (pasado de take)","ex":"We took many photos."},{"w":"grade","es":"nota / calificación","ex":"I got a good grade."},{"w":"test / exam","es":"prueba / examen","ex":"We had a big exam."},{"w":"tired","es":"cansado / cansada","ex":"At night I was tired."},{"w":"sad","es":"triste","ex":"On Tuesday I was sad."},{"w":"angry","es":"enojado / enojada","ex":"On Thursday I was angry."},{"w":"nervous","es":"nervioso / nerviosa","ex":"On Wednesday I was nervous."},{"w":"quiet","es":"silencioso / callado","ex":"The classroom was very quiet."},{"w":"feeling / feelings","es":"sentimiento / sentimientos","ex":"Feelings change every day."},{"w":"smile","es":"sonrisa / sonreír","ex":"But she has a nice smile."},{"w":"friend","es":"amigo / amiga","ex":"My friend Ana came with me."},{"w":"gift","es":"regalo","ex":"She gave me a small gift."},{"w":"hug","es":"abrazo","ex":"I gave her a big hug."},{"w":"cake","es":"pastel / torta","ex":"He made a chocolate cake."},{"w":"farm","es":"granja","ex":"My class went to a farm."},{"w":"cow","es":"vaca","ex":"One cow was very old."},{"w":"horse","es":"caballo","ex":"A small horse came to me."},{"w":"bread","es":"pan","ex":"The bread was very good."},{"w":"hat","es":"gorro / sombrero","ex":"She gave us green hats."},{"w":"free time","es":"tiempo libre","ex":"After lunch, we had free time."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"A Great Day","sTitleEs":"Un día genial","dTitle":"At School","dTitleEs":"En la escuela","paras":[[["Yesterday was a great day.","Ayer fue un día genial."],["I woke up very happy.","Me desperté muy feliz."],["The sun was big and bright.","El sol estaba grande y brillante."],["My mom made a good breakfast.","Mi mamá hizo un buen desayuno."],["It was a quick breakfast.","Fue un desayuno rápido."]],[["Then I went to school.","Luego fui a la escuela."],["My friend Ana came with me.","Mi amiga Ana vino conmigo."],["She is very nice.","Ella es muy amable."],["We took the same street.","Tomamos la misma calle."],["The walk was short and quick.","La caminata fue corta y rápida."]],[["At school we had a test.","En la escuela tuvimos una prueba."],["The test was good for me.","La prueba estuvo bien para mí."],["I got a great grade.","Saqué una nota genial."],["My teacher was very happy.","Mi maestra estaba muy feliz."],["She gave me a gold star.","Me dio una estrella dorada."]],[["After class we played outside.","Después de clase jugamos afuera."],["The game was quick and fun.","El juego fue rápido y divertido."],["A few friends came too.","Unos pocos amigos vinieron también."],["Even my brother came.","Incluso mi hermano vino."],["We were all very happy.","Todos estábamos muy felices."]],[["My brother is nine years old.","Mi hermano tiene nueve años."],["He is small but quick.","Él es pequeño pero rápido."],["He got the ball first.","Él consiguió la pelota primero."],["He made a great goal.","Hizo un gol genial."],["Everyone said: good job!","Todos dijeron: ¡buen trabajo!"]],[["At noon we went home.","Al mediodía fuimos a casa."],["Our house is old and big.","Nuestra casa es vieja y grande."],["Dad had a big surprise.","Papá tenía una gran sorpresa."],["He made a chocolate cake.","Hizo un pastel de chocolate."],["The cake was very good.","El pastel estaba muy rico."]],[["My grandma came in the afternoon.","Mi abuela vino en la tarde."],["She gave me a small gift.","Ella me dio un regalito."],["It was a green book.","Era un libro verde."],["I like books very much.","Me gustan mucho los libros."],["I gave her a big hug.","Le di un gran abrazo."]],[["We took many photos together.","Tomamos muchas fotos juntos."],["In one photo, everyone smiled.","En una foto, todos sonrieron."],["My grandma is eighty years old.","Mi abuela tiene ochenta años."],["She is old but very quick.","Ella es mayor pero muy rápida."],["She danced with my brother.","Bailó con mi hermano."]],[["At night I was tired.","En la noche estaba cansada."],["But my heart was happy.","Pero mi corazón estaba feliz."],["I had a great day.","Tuve un día genial."],["Good days are possible every week.","Los días buenos son posibles cada semana."],["You only need good people.","Solo necesitas buena gente."]],[["Today I feel very good.","Hoy me siento muy bien."],["I want another great day.","Quiero otro día genial."],["I am able to make it.","Soy capaz de lograrlo."],["A smile helps a lot.","Una sonrisa ayuda mucho."],["Care for people, and be happy.","Cuida a las personas y sé feliz."]]],"datos":[null,"Pasado irregular: algunos verbos <b>no</b> usan -ed; cambian de forma: go → <b>went</b> · come → <b>came</b> · take → <b>took</b>: <span class=\"frase\">I went to school · Ana came with me · We took the same street.</span>",null,null,"<b>get → got</b> = conseguir / obtener. También se usa para notas: <span class=\"frase\">He got the ball first · I got a great grade.</span>",null,"<b>give → gave</b> = dar: <span class=\"frase\">She gave me a small gift.</span> La forma <b>gave</b> es igual para todas las personas.",null,"La edad se dice con <b>be + años + old</b>: <span class=\"frase\">She is eighty years old.</span> <span class=\"lit\">(lit.: «ella es ochenta años vieja»)</span> = tiene ochenta años.",null],"dlg":[["Ana","Hi Sofía! You look happy.","¡Hola Sofía! Te ves feliz."],["Sofía","Yes! Yesterday was great.","¡Sí! Ayer fue genial."],["Ana","Really? Tell me more.","¿En serio? Cuéntame más."],["Sofía","I got a good grade.","Saqué una buena nota."],["Ana","That is very nice!","¡Eso es muy bueno!"],["Sofía","And my dad made a cake.","Y mi papá hizo un pastel."],["Ana","A big cake?","¿Un pastel grande?"],["Sofía","Yes, a big chocolate cake.","Sí, un pastel grande de chocolate."],["Ana","Mmm, I like chocolate.","Mmm, me gusta el chocolate."],["Sofía","My grandma came too.","Mi abuela también vino."],["Ana","How old is she?","¿Cuántos años tiene ella?"],["Sofía","She is eighty years old.","Tiene ochenta años."],["Ana","Wow! Is she able to dance?","¡Guau! ¿Es capaz de bailar?"],["Sofía","Yes! She is old but quick.","¡Sí! Es mayor pero rápida."],["Ana","That is great.","Eso es genial."],["Sofía","She gave me a green book.","Me dio un libro verde."],["Ana","A book! Is it good?","¡Un libro! ¿Es bueno?"],["Sofía","It is about a horse.","Trata sobre un caballo."],["Ana","I like horse stories.","Me gustan las historias de caballos."],["Sofía","Do you want to read it?","¿Quieres leerlo?"],["Ana","Is that possible?","¿Eso es posible?"],["Sofía","Of course. We are friends.","Claro. Somos amigas."],["Ana","Thank you! You are very nice.","¡Gracias! Eres muy amable."],["Sofía","Read a few pages every day.","Lee unas pocas páginas cada día."],["Ana","Even at night, in bed.","Incluso de noche, en la cama."],["Sofía","Take good care of it!","¡Cuídalo bien!"]]},"2":{"sTitle":"How I Feel","sTitleEs":"Cómo me siento","dTitle":"Are You OK?","dTitleEs":"¿Estás bien?","paras":[[["My name is Mateo.","Me llamo Mateo."],["I am twelve years old.","Tengo doce años."],["Today I feel very good.","Hoy me siento muy bien."],["But feelings change every day.","Pero los sentimientos cambian cada día."],["That is normal and fine.","Eso es normal y está bien."]],[["On Monday I was happy.","El lunes estaba feliz."],["I got a good grade.","Saqué una buena nota."],["My mom made my favorite food.","Mi mamá hizo mi comida favorita."],["We had a nice dinner.","Tuvimos una cena agradable."],["Even my sister smiled.","Incluso mi hermana sonrió."]],[["On Tuesday I was sad.","El martes estaba triste."],["My best friend was ill.","Mi mejor amigo estaba enfermo."],["He was not at school.","Él no estaba en la escuela."],["The classroom was very quiet.","El salón estaba muy silencioso."],["I missed his funny jokes.","Extrañé sus chistes graciosos."]],[["On Wednesday I was nervous.","El miércoles estaba nervioso."],["We had a big exam.","Teníamos un examen grande."],["My hands were very cold.","Mis manos estaban muy frías."],["I took a deep breath.","Tomé una respiración profunda."],["Then I felt calm and able.","Luego me sentí tranquilo y capaz."]],[["On Thursday I was angry.","El jueves estaba enojado."],["A boy took my marker.","Un niño tomó mi plumón."],["He gave it back later.","Me lo devolvió después."],["He said sorry to me.","Me dijo perdón."],["Then everything was good again.","Luego todo estuvo bien otra vez."]],[["On Friday I was tired.","El viernes estaba cansado."],["The week was very long.","La semana fue muy larga."],["But my dad had a plan.","Pero mi papá tenía un plan."],["We went to the park.","Fuimos al parque."],["A quick walk helps a lot.","Una caminata rápida ayuda mucho."]],[["Feelings are not good or bad.","Los sentimientos no son buenos ni malos."],["They are only information.","Solo son información."],["Sadness says: I need care.","La tristeza dice: necesito cariño."],["Anger says: this is not fair.","El enojo dice: esto no es justo."],["Fear says: this is new.","El miedo dice: esto es nuevo."]],[["I talk about my feelings.","Hablo de mis sentimientos."],["My mom listens very well.","Mi mamá escucha muy bien."],["She never says: do not cry.","Ella nunca dice: no llores."],["She only says: I am here.","Solo dice: estoy aquí."],["That is a great help.","Eso es una gran ayuda."]],[["A few things always help me.","Unas pocas cosas siempre me ayudan."],["Water, sleep and a walk.","Agua, sueño y una caminata."],["Music helps me even more.","La música me ayuda aún más."],["I like slow, old songs.","Me gustan las canciones lentas y viejas."],["They make my heart quiet.","Hacen que mi corazón se calme."]],[["Today I am happy again.","Hoy estoy feliz otra vez."],["Tomorrow, maybe not.","Mañana, tal vez no."],["Every feeling is possible.","Todo sentimiento es posible."],["And every feeling passes.","Y todo sentimiento pasa."],["I care about my heart.","Cuido mi corazón."]]],"datos":["<b>very</b> = muy, va <b>antes</b> del adjetivo: <span class=\"frase\">very good · very cold · very quiet.</span> <b>even</b> = incluso: <span class=\"frase\">Even my sister smiled.</span>",null,null,"<b>take → took</b> = tomar: <span class=\"frase\">I took a deep breath.</span> <span class=\"lit\">(lit.: «tomé una respiración profunda»)</span> = respiré hondo.",null,"<b>have → had</b> = tener: <span class=\"frase\">But my dad had a plan.</span> Y <b>go → went</b>: <span class=\"frase\">We went to the park.</span>",null,null,"<b>a few</b> = unos pocos / unas pocas (cosas que se cuentan): <span class=\"frase\">A few things always help me.</span>",null],"dlg":[["Mamá","Mateo, are you OK?","Mateo, ¿estás bien?"],["Mateo","I am tired, mom.","Estoy cansado, mamá."],["Mamá","The week was very long.","La semana fue muy larga."],["Mateo","Yes, and I was nervous.","Sí, y estaba nervioso."],["Mamá","Because of the big exam?","¿Por el examen grande?"],["Mateo","Yes. My hands were cold.","Sí. Mis manos estaban frías."],["Mamá","And how was it?","¿Y cómo estuvo?"],["Mateo","Good! I got a nice grade.","¡Bien! Saqué una buena nota."],["Mamá","I am very happy for you.","Estoy muy feliz por ti."],["Mateo","I took a deep breath first.","Primero tomé una respiración profunda."],["Mamá","That helps a lot.","Eso ayuda mucho."],["Mateo","On Tuesday I was sad.","El martes estaba triste."],["Mamá","What happened on Tuesday?","¿Qué pasó el martes?"],["Mateo","My best friend was ill.","Mi mejor amigo estaba enfermo."],["Mamá","Oh, poor boy.","Ay, pobrecito."],["Mateo","The class was very quiet.","La clase estaba muy silenciosa."],["Mamá","You care about your friends.","Te importan tus amigos."],["Mateo","Yes. I like our jokes.","Sí. Me gustan nuestros chistes."],["Mamá","Is he better now?","¿Está mejor ahora?"],["Mateo","Yes, he came back today.","Sí, volvió hoy."],["Mamá","That is great news!","¡Esa es una gran noticia!"],["Mateo","We had a good day.","Tuvimos un buen día."],["Mamá","Feelings change every week.","Los sentimientos cambian cada semana."],["Mateo","Even in one day, mom.","Incluso en un día, mamá."],["Mamá","True. And you are able to talk.","Cierto. Y eres capaz de hablar."],["Mateo","Talking with you helps me.","Hablar contigo me ayuda."]]},"3":{"sTitle":"Helping Ana","sTitleEs":"Ayudando a Ana","dTitle":"Can I Help?","dTitleEs":"¿Puedo ayudar?","paras":[[["Ana is my classmate.","Ana es mi compañera de clase."],["She is new in school.","Ella es nueva en la escuela."],["Her family came last month.","Su familia vino el mes pasado."],["She knows only a few words.","Ella sabe solo unas pocas palabras."],["But she has a nice smile.","Pero tiene una sonrisa amable."]],[["On day one, Ana was quiet.","El primer día, Ana estuvo callada."],["She sat near the window.","Se sentó cerca de la ventana."],["Nobody talked to her.","Nadie le habló."],["Her eyes were very sad.","Sus ojos estaban muy tristes."],["I felt bad for her.","Me sentí mal por ella."]],[["At lunch I went to her.","En el almuerzo fui hacia ella."],["I said: hi, I am Lucía.","Dije: hola, soy Lucía."],["Ana gave me a small smile.","Ana me dio una pequeña sonrisa."],["I asked: can I help?","Pregunté: ¿puedo ayudar?"],["She said: yes, please.","Ella dijo: sí, por favor."]],[["We had lunch together.","Almorzamos juntas."],["I gave her half my apple.","Le di la mitad de mi manzana."],["She took it and laughed.","La tomó y se rió."],["Her laugh was very nice.","Su risa fue muy agradable."],["That day we became friends.","Ese día nos hicimos amigas."]],[["Ana is able to learn fast.","Ana es capaz de aprender rápido."],["Every day she got better.","Cada día ella mejoraba."],["I helped her with English.","La ayudé con el inglés."],["She helped me with math.","Ella me ayudó con matemática."],["Help goes in two ways.","La ayuda va en dos direcciones."]],[["Last week Ana was ill.","La semana pasada Ana estuvo enferma."],["I went to her house.","Fui a su casa."],["I took my school notes.","Llevé mis apuntes de la escuela."],["Her mom made us tea.","Su mamá nos hizo un té."],["The tea was very good.","El té estaba muy rico."]],[["Ana lives in an old house.","Ana vive en una casa vieja."],["The rooms are small but nice.","Los cuartos son pequeños pero lindos."],["Her family cares a lot.","Su familia se preocupa mucho."],["They gave me a warm welcome.","Me dieron una cálida bienvenida."],["I like that house.","Me gusta esa casa."]],[["Is it possible to help everyone?","¿Es posible ayudar a todos?"],["Maybe not, but we try.","Tal vez no, pero lo intentamos."],["One good act is enough.","Un buen acto es suficiente."],["A few words change a day.","Unas pocas palabras cambian un día."],["Even a smile is help.","Incluso una sonrisa es ayuda."]],[["Today Ana has many friends.","Hoy Ana tiene muchos amigos."],["She is happy in our class.","Ella está feliz en nuestra clase."],["She talks and asks questions.","Habla y hace preguntas."],["Her English got very good.","Su inglés se volvió muy bueno."],["I am proud of her.","Estoy orgullosa de ella."]],[["I like to help people.","Me gusta ayudar a la gente."],["It is quick and free.","Es rápido y gratis."],["Care makes a great difference.","El cariño hace una gran diferencia."],["Ana showed me that.","Ana me mostró eso."],["Now I help without fear.","Ahora ayudo sin miedo."]]],"datos":[null,null,"<b>give → gave</b> = dar: <span class=\"frase\">Ana gave me a small smile.</span> Y <b>go → went</b>: <span class=\"frase\">At lunch I went to her.</span> function say(text,onend){ try{ if(!('speechSynthesis' in window))throw 0; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=rate; const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}else u.lang=voice==='US'?'en-US':'en-GB'; if(onend)u.onend=onend; speechSynthesis.speak(u); }catch(e){ if(onend) setTimeout(onend,Math.max(700,String(text).split(' ').length*330/rate)); } }

function setBtns(){ const all=gPlaying&&gScope==='all'; const pa=document.getElementById('playAll');
  pa.querySelector('.ic').textContent= all?'⏸':'▶'; pa.querySelector('.pl').textContent= all?L().pause:L().play;

function clearHl(){ document.querySelectorAll('.sent.read,.sente.read').forEach(s=>s.classList.remove('read')); document.querySelectorAll('.para.reading').forEach(p=>p.classList.remove('reading')); }
function startRange(st,end,scope){ if(gScope!==scope || gi<st || gi>=end) gi=st; gEnd=end; gScope=scope; gPlaying=true; setBtns(); step(); }
function playAll(){ if(gPlaying&&gScope==='all'){ pausePlay(); return; } startRange(0,ALL.length,'all'); }

function pausePlay(){ gPlaying=false; try{speechSynthesis.cancel();}catch(e){} setBtns(); }
function step(){ if(!gPlaying) return;
  if(gi>=gEnd){ gPlaying=false; if(gScope==='all') gi=0; setBtns(); clearHl(); toast(info==='es'?'✓ Fin del audio':'✓ End of audio'); return; }
  const {pi,si}=ALL[gi]; clearHl(); const para=document.getElementById('p'+pi); para.classList.add('reading');

  const ee=document.getElementById('e'+pi+'_'+si); if(ee)ee.classList.add('read');
  para.scrollIntoView({behavior:'smooth',block:'center'});
  say(VIEW[pi].pairs[si].en, ()=>{ if(!gPlaying)return; try{ if(curView==='story'&&si===VIEW[pi].pairs.length-1&&window.jecParaHeard) jecParaHeard(pi); }catch(e){} gi++; step(); });
}

  const m=Math.floor(secs/60); document.getElementById('eTime').textContent=m+':'+String(secs%60).padStart(2,'0'); document.getElementById('eXp').textContent='+'+(m>=30?15:m>=20?10:m>=10?5:0);

  ['segPre','segA1','segA2'].forEach(id=>{var b=document.getElementById(id);if(b)b.classList.remove('on');}); var _a=document.getElementById(lv==='pre-a1'?'segPre':lv==='a1'?'segA1':'segA2'); if(_a)_a.classList.add('on');
  info= lv==='pre-a1'?'es':'en'; setText(lv==='pre-a1'?'both':'en'); render(); }

0&&document.addEventListener('contextmenu',e=>{ if(e.target.closest('.screen')){ e.preventDefault(); toast('Material protegido © JUCUM EC'); }});

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
