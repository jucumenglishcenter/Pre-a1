const GLOSS = [{"w":"in","es":"en / dentro de","ex":"in the box"},{"w":"on","es":"en / sobre","ex":"on the table"},{"w":"under","es":"debajo de","ex":"under the bed"},{"w":"behind","es":"detrás de","ex":"behind the door"},{"w":"between","es":"entre","ex":"between two boxes"},{"w":"next to","es":"junto a","ex":"next to me"},{"w":"near","es":"cerca de","ex":"near the park"},{"w":"before","es":"antes (de)","ex":"before school"},{"w":"after","es":"después (de)","ex":"after class"},{"w":"run / walk","es":"correr / caminar","ex":"We run and walk."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"A Day at School","sTitleEs":"Un día en la escuela","dTitle":"Where Is My Book?","dTitleEs":"¿Dónde está mi libro?","paras":[[["Every day, Tom gets up early.","Todos los días, Tom se levanta temprano."],["He eats before he goes to school.","Come antes de ir a la escuela."],["His house is near the school.","Su casa está cerca de la escuela."],["He walks there fast.","Camina hasta allá rápido."]],[["At school, he puts his bag inside his desk.","En la escuela, pone su mochila dentro de su escritorio."],["His pencils are between his books.","Sus lápices están entre sus libros."],["He sits down near the window.","Se sienta cerca de la ventana."],["He waits for the teacher.","Espera a la maestra."]],[["During class, they learn about animals.","Durante la clase, aprenden sobre animales."],["The teacher talks about fast animals and slow ones.","La maestra habla de animales rápidos y lentos."],["Tom listens.","Tom escucha."],["He thinks about his dog.","Piensa en su perro."]],[["After class, Tom stays in his seat.","Después de la clase, Tom se queda en su asiento."],["He reads the last page of his notebook.","Lee la última página de su cuaderno."],["He writes down what he learned.","Escribe lo que aprendió."],["Then he puts his book under his arm.","Luego pone su libro debajo del brazo."]],[["At lunch, Tom goes to the yard.","En el almuerzo, Tom va al patio."],["He runs across the open space.","Corre por el espacio abierto."],["He plays behind the big tree.","Juega detrás del árbol grande."],["His ball rolls under a bench.","Su pelota rueda bajo una banca."],["He picks it up fast.","La recoge rápido."]],[["His friends sit next to him.","Sus amigos se sientan junto a él."],["They eat near the wall.","Comen cerca de la pared."],["Their bags are on the ground.","Sus mochilas están en el suelo."],["A bird lands in front of them.","Un pájaro aterriza frente a ellos."],["It looks for some bread.","Busca un poco de pan."]],[["After lunch, they go inside.","Después del almuerzo, entran."],["They walk down the hall.","Caminan por el pasillo."],["The art room is on the left.","El salón de arte está a la izquierda."],["The library is on the right.","La biblioteca está a la derecha."],["Tom goes into the art room.","Tom entra al salón de arte."]],[["In art class, he paints a tree.","En la clase de arte, pinta un árbol."],["He puts the paper on the table.","Pone el papel sobre la mesa."],["His brush is between two cups.","Su pincel está entre dos vasos."],["He draws a bird above the tree.","Dibuja un pájaro encima del árbol."],["He is very happy.","Está muy feliz."]],[["Before the bell rings, he cleans up.","Antes de que suene el timbre, ordena."],["He puts the paint away.","Guarda la pintura."],["He washes his hands.","Se lava las manos."],["He waits beside the door.","Espera al lado de la puerta."],["The long day is almost over.","El largo día casi termina."]],[["At the end of the day, Tom walks home.","Al final del día, Tom camina a casa."],["The sun is going down.","El sol se está poniendo."],["He is happy.","Está feliz."],["He is a little tired, but it was a good day.","Está un poco cansado, pero fue un buen día."]]],"dlg":[["Sam","Lily, where is your book?","Lily, ¿dónde está tu libro?"],["Lily","I don't know. It is not on the table.","No sé. No está en la mesa."],["Sam","Is it under the chair?","¿Está debajo de la silla?"],["Lily","No, it is not under the chair. I already looked.","No, no está debajo de la silla. Ya busqué."],["Sam","Look inside your bag!","¡Mira dentro de tu mochila!"],["Lily","Oh! It is in my bag. Thank you, Sam!","¡Oh! Está en mi mochila. ¡Gracias, Sam!"],["Sam","You're welcome! Is your pencil in your bag too?","¡De nada! ¿Tu lápiz también está en tu mochila?"],["Lily","Yes! It is between my book and my pen.","¡Sí! Está entre mi libro y mi bolígrafo."],["Sam","Good. Now we can start class.","Bien. Ahora podemos empezar la clase."],["Lily","Wait, where is my notebook? It was here before.","Espera, ¿dónde está mi cuaderno? Estaba aquí antes."],["Sam","Is it under your jacket?","¿Está debajo de tu chaqueta?"],["Lily","Let me see. Yes! It is right under it.","Déjame ver. ¡Sí! Está justo debajo."],["Sam","You put things everywhere!","¡Pones las cosas por todas partes!"],["Lily","I know. I am not good with this.","Lo sé. No soy buena con esto."],["Sam","Put your pens in one box. It is easy to find them.","Pon tus bolígrafos en una caja. Es fácil encontrarlos."],["Lily","That is a good idea. I will do it.","Es una buena idea. Lo haré."],["Sam","My desk is near the window. I keep my things there.","Mi escritorio está cerca de la ventana. Guardo mis cosas allí."],["Lily","Mine is between the door and the wall.","El mío está entre la puerta y la pared."],["Sam","Is it dark there? You need light to read.","¿Está oscuro ahí? Necesitas luz para leer."],["Lily","A little. But I read fast, so it is fine.","Un poco. Pero leo rápido, así que está bien."],["Sam","Ha! You read fast but you lose your book!","¡Ja! ¡Lees rápido pero pierdes tu libro!"],["Lily","Stop it! I am better now.","¡Para! Ahora soy mejor."],["Sam","OK, OK. The teacher is near. Let's sit down.","Bueno, bueno. La maestra está cerca. Sentémonos."],["Lily","Yes. I have everything now.","Sí. Ya tengo todo."],["Sam","Great. This is going to be a good class.","Genial. Va a ser una buena clase."],["Lily","I think so too. Thank you for your help!","Yo también lo creo. ¡Gracias por tu ayuda!"]],"datos":{"1":"<div class=\"frase\">«He puts his bag inside his desk»</div><div class=\"lit\">palabra por palabra: “pone su bolso dentro de su escritorio”</div><div>El inglés repite el posesivo: <b>his</b> bag, <b>his</b> desk — donde el español dice “el bolso, el escritorio”.</div>","4":"<div class=\"frase\">«He picks it up fast»</div><div class=\"lit\">palabra por palabra: “lo recoge arriba rápido”</div><div><b>pick up</b> = recoger. La cosita (it) va EN MEDIO: pick <b>it</b> up.</div>","6":"<div class=\"frase\">«The art room is on the left»</div><div class=\"lit\">palabra por palabra: “el salón de arte está EN la izquierda”</div><div><b>on the left / on the right</b> = a la izquierda / a la derecha. Siempre con on.</div>"}},"2":{"sTitle":"Where's My Cat?","sTitleEs":"¿Dónde está mi gato?","dTitle":"Before and After School","dTitleEs":"Antes y después de la escuela","paras":[[["Ana has a cat.","Ana tiene un gato."],["His name is Gris.","Su nombre es Gris."],["Every morning, Gris waits near the door.","Cada mañana, Gris espera cerca de la puerta."],["But today, Ana cannot find him.","Pero hoy, Ana no lo encuentra."]],[["She looks under the table.","Mira debajo de la mesa."],["She looks under the bed.","Mira debajo de la cama."],["No Gris.","Nada de Gris."],["She looks inside the closet.","Mira dentro del clóset."],["He is not there.","No está ahí."]],[["She looks behind the big sofa.","Mira detrás del sofá grande."],["She looks on top of the shelf.","Mira encima del estante."],["She looks next to the green plant.","Mira junto a la planta verde."],["She looks inside an old box.","Mira dentro de una caja vieja."],["Gris is not there.","Gris no está ahí."]],[["She walks into the kitchen.","Entra a la cocina."],["She looks under the sink.","Mira debajo del lavadero."],["She looks among the bags.","Busca entre las bolsas."],["She looks behind the fridge.","Mira detrás de la refrigeradora."],["She only finds an old broom.","Solo encuentra una escoba vieja."]],[["She opens the back door.","Abre la puerta de atrás."],["She looks around the yard.","Mira alrededor del patio."],["She looks behind the wall.","Mira detrás de la pared."],["She looks under the bench.","Mira debajo de la banca."],["The cat is not outside.","El gato no está afuera."]],[["She feels a little sad now.","Se siente un poco triste ahora."],["She sits down on the floor.","Se sienta en el suelo."],["She calls his name softly.","Lo llama bajito por su nombre."],["She waits and she listens.","Espera y escucha."],["Her heart beats fast.","Su corazón late rápido."]],[["She stands up once more.","Se levanta una vez más."],["She walks slowly down the hall.","Camina despacio por el pasillo."],["She looks into every corner.","Mira en cada esquina."],["She will not give up.","No se va a rendir."],["She wants to find Gris.","Quiere encontrar a Gris."]],[["She looks up at the high shelf.","Mira hacia el estante alto."],["She looks down at the cold floor.","Mira hacia el piso frío."],["She checks behind the curtain.","Revisa detrás de la cortina."],["She moves the chairs around.","Mueve las sillas."],["Still she cannot see him.","Aún no lo puede ver."]],[["Then she hears a small sound down the hall.","Luego escucha un pequeño sonido al fondo del pasillo."],["She walks fast.","Camina rápido."],["She looks down.","Mira hacia abajo."],["Gris is between two boxes.","Gris está entre dos cajas."]],[["Ana laughs.","Ana se ríe."],["She picks him up.","Lo levanta."],["He is warm and soft.","Está calentito y suave."],["She holds him near her face.","Lo sostiene cerca de su cara."]],[["Ana puts his food down near the window.","Ana pone su comida abajo cerca de la ventana."],["He eats during the morning sun.","Come durante el sol de la mañana."],["She watches him.","Ella lo mira."],["At the end, she is happy he is home.","Al final, está feliz de que esté en casa."]]],"dlg":[["Ben","Rosa, what do you do before school?","Rosa, ¿qué haces antes de la escuela?"],["Rosa","I eat. I eat early every day.","Como. Como temprano todos los días."],["Ben","Me too. I eat before I walk to school.","Yo también. Como antes de caminar a la escuela."],["Rosa","How long does it take you to walk there?","¿Cuánto tiempo te toma caminar hasta allá?"],["Ben","About ten minutes. I go down the main street.","Como diez minutos. Bajo por la calle principal."],["Rosa","I take the same street! Maybe we can walk together.","¡Yo tomo la misma calle! Quizás podemos caminar juntos."],["Ben","That sounds great! What time do you leave home?","¡Suena genial! ¿A qué hora sales de casa?"],["Rosa","Early. About seven. The street is quiet then.","Temprano. Como a las siete. La calle está tranquila a esa hora."],["Ben","Same for me. We can meet near the corner.","Igual yo. Podemos vernos cerca de la esquina."],["Rosa","Perfect. Is your house far from there?","Perfecto. ¿Tu casa está lejos de ahí?"],["Ben","No, it is close. It is between the bakery and the park.","No, está cerca. Está entre la panadería y el parque."],["Rosa","Oh, I know that park! I play there after school.","¡Ah, conozco ese parque! Juego ahí después de la escuela."],["Ben","Me too! What do you do during the weekend?","¡Yo también! ¿Qué haces durante el fin de semana?"],["Rosa","I read at home. I like to read fast and finish a book.","Leo en casa. Me gusta leer rápido y terminar un libro."],["Ben","What book are you reading?","¿Qué libro estás leyendo?"],["Rosa","A book about animals. I am near the end.","Un libro sobre animales. Estoy cerca del final."],["Ben","Is it good? I need a new book.","¿Es bueno? Necesito un libro nuevo."],["Rosa","It is very good! I can give it to you after I finish.","¡Es muy bueno! Te lo puedo dar después de que termine."],["Ben","Thank you! When will you finish it?","¡Gracias! ¿Cuándo lo terminarás?"],["Rosa","Maybe this week. I read a little before bed.","Quizás esta semana. Leo un poco antes de dormir."],["Ben","I do that too. It helps me sleep.","Yo también hago eso. Me ayuda a dormir."],["Rosa","Yes! After a long day, a book is nice.","¡Sí! Después de un día largo, un libro es agradable."],["Ben","So, tomorrow morning at the corner?","Entonces, ¿mañana en la mañana en la esquina?"],["Rosa","Yes! Don't be late. I leave early.","¡Sí! No llegues tarde. Salgo temprano."],["Ben","I won't. See you near the bakery!","No lo haré. ¡Nos vemos cerca de la panadería!"],["Rosa","See you, Ben! Walk fast tomorrow!","¡Nos vemos, Ben! ¡Camina rápido mañana!"]],"datos":{"0":"<div class=\"frase\">«Ana cannot find him»</div><div class=\"lit\">palabra por palabra: “Ana no puede encontrarLO”</div><div>El gato es <b>he/him</b>: los animales queridos tienen género en inglés. “No encuentra” = cannot find.</div>","2":"<div class=\"frase\">«on top of the shelf»</div><div class=\"lit\">palabra por palabra: “en la cima del estante”</div><div><b>on top of</b> = encima de (tocando la parte más alta).</div>","6":"<div class=\"frase\">«She will not give up»</div><div class=\"lit\">palabra por palabra: “ella no dará arriba 🤯”</div><div><b>give up</b> = rendirse. Nada que ver con “dar”.</div>"}},"3":{"sTitle":"My Week","sTitleEs":"Mi semana","dTitle":"Is the Park Near Here?","dTitleEs":"¿Está cerca el parque?","paras":[[["My name is Mia.","Me llamo Mia."],["My week is busy but good.","Mi semana es ajetreada pero buena."],["Before school, I eat.","Antes de la escuela, como."],["After school, I play near my house.","Después de la escuela, juego cerca de mi casa."]],[["On Monday, I wake up early.","El lunes, me levanto temprano."],["I walk fast to school.","Camino rápido a la escuela."],["I sit near the window.","Me siento cerca de la ventana."],["I like to look outside during class.","Me gusta mirar afuera durante la clase."]],[["On Wednesday, we go outside for our break.","El miércoles, salimos al recreo."],["The yard is between the school and the park.","El patio está entre la escuela y el parque."],["We run and play.","Corremos y jugamos."],["Then we go back inside.","Luego volvemos adentro."]],[["On Saturday, I help at home.","El sábado, ayudo en casa."],["I put things in the right place.","Pongo las cosas en su lugar."],["My books go inside the shelf.","Mis libros van dentro del estante."],["My shoes go under the bed.","Mis zapatos van debajo de la cama."]],[["On Tuesday, I have music class.","El martes tengo clase de música."],["The room is next to the library.","El salón está junto a la biblioteca."],["I sit between two friends.","Me siento entre dos amigas."],["We sing during the lesson.","Cantamos durante la lección."],["The time goes by fast.","El tiempo pasa rápido."]],[["On Thursday, I go to the market.","El jueves voy al mercado."],["It is near the bus stop.","Está cerca del paradero."],["I walk behind my mother.","Camino detrás de mi mamá."],["We put fruit in the bag.","Ponemos fruta en la bolsa."],["Then we go back home.","Luego volvemos a casa."]],[["On Friday, school ends early.","El viernes la escuela termina temprano."],["I run across the yard.","Corro por el patio."],["I jump over a small puddle.","Salto sobre un charco pequeño."],["My friends wait by the gate.","Mis amigos esperan junto al portón."],["We walk home together.","Caminamos juntos a casa."]],[["On Sunday, we rest at home.","El domingo descansamos en casa."],["I stay in my room.","Me quedo en mi cuarto."],["My toys are on the floor.","Mis juguetes están en el suelo."],["I put them inside a box.","Los pongo dentro de una caja."],["Then I read near the window.","Luego leo cerca de la ventana."]],[["Each day has its own time.","Cada día tiene su propio tiempo."],["Some days are fast.","Algunos días son rápidos."],["Some days are slow.","Algunos días son lentos."],["I like every day of the week.","Me gusta cada día de la semana."],["My week is always full.","Mi semana siempre está llena."]],[["At the end of the week, I feel good.","Al final de la semana, me siento bien."],["I walk down to the store near the park.","Camino calle abajo a la tienda cerca del parque."],["I think about all the fun I had.","Pienso en toda la diversión que tuve."],["A good week is one day at a time.","Una buena semana es un día a la vez."]]],"dlg":[["Tomas","Excuse me. Is the park near here?","Disculpe. ¿El parque está cerca de aquí?"],["Neighbor","Yes! It is near the school.","¡Sí! Está cerca de la escuela."],["Tomas","Is it between the school and the store?","¿Está entre la escuela y la tienda?"],["Neighbor","Yes, that's right. It is right between them.","Sí, exacto. Está justo entre ellos."],["Tomas","And is there a library in this town?","¿Y hay una biblioteca en este pueblo?"],["Neighbor","Yes. It is just down the street, on the left.","Sí. Está justo calle abajo, a la izquierda."],["Tomas","Is it open during the day?","¿Está abierta durante el día?"],["Neighbor","Yes! But they close early. Not after six.","¡Sí! Pero cierran temprano. No después de las seis."],["Tomas","Good to know. Do you go there often?","Bueno saberlo. ¿Va seguido?"],["Neighbor","I go the last week of every month. It is a good habit.","Voy la última semana de cada mes. Es un buen hábito."],["Tomas","That sounds nice. Is the library big?","Suena bien. ¿La biblioteca es grande?"],["Neighbor","It is about the size of a small house. It opened last year.","Es como del tamaño de una casa pequeña. Abrió el año pasado."],["Tomas","I love to read. I read very fast.","Me encanta leer. Leo muy rápido."],["Neighbor","Then you will be happy here. Many people read.","Entonces serás feliz aquí. Mucha gente lee."],["Tomas","How do I get to the park from here?","¿Cómo llego al parque desde aquí?"],["Neighbor","Walk down past the big tree, then turn left.","Camina calle abajo pasando el árbol grande, luego dobla a la izquierda."],["Tomas","Is the tree easy to see?","¿Es fácil de ver el árbol?"],["Neighbor","Very easy. It is the tallest one on the street.","Muy fácil. Es el más alto de la calle."],["Tomas","And the store? Is it near the park too?","¿Y la tienda? ¿También está cerca del parque?"],["Neighbor","Yes. The store, the park, and the school are all close.","Sí. La tienda, el parque y la escuela están todos cerca."],["Tomas","This is a small town, then.","Es un pueblo pequeño, entonces."],["Neighbor","Yes! You can walk everywhere. No need for a bus.","¡Sí! Puedes caminar a todas partes. No necesitas autobús."],["Tomas","I like that. I want to walk every morning.","Me gusta eso. Quiero caminar cada mañana."],["Neighbor","Walk early. The town is very quiet then.","Camina temprano. El pueblo está muy tranquilo a esa hora."],["Tomas","I will. Thank you so much for your help!","Lo haré. ¡Muchas gracias por su ayuda!"],["Neighbor","No problem. See you around the town!","De nada. ¡Nos vemos por el pueblo!"]],"datos":{"1":"<div class=\"frase\">«On Monday, I wake up early»</div><div class=\"lit\">palabra por palabra: “EN lunes me despierto temprano”</div><div>Los días llevan <b>on</b>: on Monday, on Saturday. El español no pone nada: “el lunes”.</div>","4":"<div class=\"frase\">«The time goes by fast»</div><div class=\"lit\">palabra por palabra: “el tiempo va por rápido”</div><div><b>go by</b> = pasar (el tiempo). El tiempo “pasa de largo”.</div>","6":"<div class=\"frase\">«I jump over a small puddle»</div><div class=\"lit\">palabra por palabra: “salto por encima de un charquito”</div><div><b>over</b> = por encima de. La preposición dibuja el camino del movimiento.</div>"}},"4":{"sTitle":"The Fast Little Bird","sTitleEs":"El pajarito veloz","dTitle":"Hurry Up!","dTitleEs":"¡Apúrate!","paras":[[["Near our school, there is a big tree.","Cerca de nuestra escuela, hay un árbol grande."],["Birds come and sit in it every day.","Los pájaros vienen y se posan en él todos los días."],["Some are slow.","Algunos son lentos."],["Some are very fast.","Algunos son muy rápidos."]],[["During lunch, we go outside.","Durante el almuerzo, salimos afuera."],["We sit under the tree and eat.","Nos sentamos debajo del árbol y comemos."],["Between bites, we look up at the birds.","Entre bocado y bocado, miramos a los pájaros."],["They move in and out of the branches.","Entran y salen de las ramas."]],[["One bird is very special.","Un pájaro es muy especial."],["It is small.","Es pequeño."],["It goes up and down fast.","Sube y baja rápido."],["It never stops.","Nunca para."],["We call it Flash.","Lo llamamos Flash."]],[["Before the bell rings, Flash flies away.","Antes de que suene el timbre, Flash se va volando."],["We watch it go.","Lo vemos irse."],["After lunch, we talk about it inside our classroom.","Después del almuerzo, hablamos de él dentro de nuestra clase."],["The teacher tells us about fast birds.","La maestra nos cuenta sobre los pájaros rápidos."]],[["Flash is very quick.","Flash es muy veloz."],["He flies up to the top.","Vuela hasta la copa."],["He comes down to the grass.","Baja hasta el pasto."],["He hops between the stones.","Salta entre las piedras."],["He never sits still.","Nunca se queda quieto."]],[["One day, Flash builds a nest.","Un día, Flash hace un nido."],["He puts it inside the tree.","Lo pone dentro del árbol."],["It sits between two branches.","Queda entre dos ramas."],["He flies in and out.","Vuela hacia adentro y afuera."],["He works all morning.","Trabaja toda la mañana."]],[["We watch him from below.","Lo miramos desde abajo."],["We stand under the green leaves.","Nos paramos bajo las hojas verdes."],["He flies above our heads.","Vuela encima de nuestras cabezas."],["He lands near our feet.","Aterriza cerca de nuestros pies."],["Then he jumps away.","Luego salta lejos."]],[["A slow bird sits nearby.","Un pájaro lento se posa cerca."],["It moves behind the branches.","Se mueve detrás de las ramas."],["Flash is much faster.","Flash es mucho más rápido."],["He goes here and there.","Va de aquí para allá."],["The two birds are different.","Los dos pájaros son diferentes."]],[["Before we go inside, we wave.","Antes de entrar, lo saludamos."],["Flash flies over the wall.","Flash vuela sobre la pared."],["He moves past the school.","Pasa por la escuela."],["He goes toward the hills.","Va hacia los cerros."],["We hope he comes back.","Esperamos que regrese."]],[["At the end of the day, we look for Flash near the tree.","Al final del día, buscamos a Flash cerca del árbol."],["He is not there.","No está ahí."],["We smile and walk home.","Sonreímos y caminamos a casa."],["Maybe we will see him early tomorrow.","Quizás lo veamos temprano mañana."]]],"dlg":[["Mom","Hurry up! We need to go. It's getting late.","¡Apúrate! Tenemos que irnos. Se está haciendo tarde."],["Leo","I can't find my shoes, Mom!","¡No encuentro mis zapatos, mamá!"],["Mom","Look down near the door!","¡Mira abajo cerca de la puerta!"],["Leo","I see them! They are under the chair.","¡Los veo! Están debajo de la silla."],["Mom","Good! Our bus comes in five minutes. We need to be fast.","¡Bien! Nuestro autobús llega en cinco minutos. Tenemos que ser rápidos."],["Leo","OK, I'm ready! Before we go, can I take a snack?","¡Listo! Antes de irnos, ¿puedo llevar un bocadillo?"],["Mom","Yes! There is fruit inside your bag.","¡Sí! Hay fruta dentro de tu mochila."],["Leo","Great! I'll eat it during the bus ride.","¡Genial! La comeré durante el viaje en autobús."],["Mom","Perfect. Where is your jacket?","Perfecto. ¿Dónde está tu chaqueta?"],["Leo","It is on my bed. I'll get it fast!","Está en mi cama. ¡La traigo rápido!"],["Mom","Hurry! The bus stop is near, but we still need to walk.","¡Rápido! La parada está cerca, pero igual hay que caminar."],["Leo","Is the stop down the street?","¿La parada está calle abajo?"],["Mom","Yes, between the bakery and the bus sign.","Sí, entre la panadería y el letrero del autobús."],["Leo","Got it! I have my jacket now.","¡Entendido! Ya tengo mi chaqueta."],["Mom","Did you eat early today? You look tired.","¿Comiste temprano hoy? Te ves cansado."],["Leo","A little. I woke up late.","Un poco. Me desperté tarde."],["Mom","You sleep too late. Go to bed before ten.","Duermes muy tarde. Vete a la cama antes de las diez."],["Leo","I know, Mom. I will try.","Lo sé, mamá. Lo intentaré."],["Mom","Good. Now, do you have your book?","Bien. Ahora, ¿tienes tu libro?"],["Leo","Yes, it is inside my bag, near the fruit.","Sí, está dentro de mi mochila, cerca de la fruta."],["Mom","Perfect. We are ready. Let's go down to the street.","Perfecto. Estamos listos. Bajemos a la calle."],["Leo","I can see the bus! It is coming!","¡Veo el autobús! ¡Ya viene!"],["Mom","Run, Leo! We can make it.","¡Corre, Leo! Podemos alcanzarlo."],["Leo","Wait for me, Mom! You go too fast!","¡Espérame, mamá! ¡Vas muy rápido!"],["Mom","Ha! Come on, we're near. Almost there!","¡Ja! Vamos, ya estamos cerca. ¡Casi llegamos!"],["Leo","We made it! That was close.","¡Lo logramos! Estuvo cerca."]],"datos":{"1":"<div class=\"frase\">«They move in and out of the branches»</div><div class=\"lit\">palabra por palabra: “se mueven dentro y fuera de las ramas”</div><div><b>in and out</b> = entra y sale. El inglés junta las dos direcciones en una frase.</div>","3":"<div class=\"frase\">«Flash flies away»</div><div class=\"lit\">palabra por palabra: “Flash vuela lejos”</div><div><b>away</b> = alejándose. fly away = irse volando · run away = escaparse.</div>","8":"<div class=\"frase\">«We hope he comes back»</div><div class=\"lit\">palabra por palabra: “esperamos que venga de vuelta”</div><div><b>come back</b> = volver, regresar.</div>"}}};

function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; const want=(typeof voice!=='undefined'&&voice==='GB')?'en-GB':'en-US'; const pref=['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Michelle','Microsoft Ana','Samantha','Google UK English Female','Microsoft Libby','Microsoft Sonia','Daniel']; const en=vs.filter(v=>v.lang&&v.lang.indexOf('en')===0); const pool=en.filter(v=>v.lang===want).concat(en); for(const p of pref){ const hit=pool.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } return pool[0]||null; }catch(e){ return null; } }
function say(text,onend){ try{ if(!('speechSynthesis' in window))throw 0; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=rate; const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}else u.lang=voice==='US'?'en-US':'en-GB'; if(onend)u.onend=onend; speechSynthesis.speak(u); }catch(e){ if(onend) setTimeout(onend,Math.max(700,String(text).split(' ').length*330/rate)); } }

function pausePlay(){ gPlaying=false; try{speechSynthesis.cancel();}catch(e){} setBtns(); }

  if(gi>=gEnd){ gPlaying=false; if(gScope==='all') gi=0; setBtns(); clearHl(); toast(info==='es'?'✓ Fin del audio':'✓ End of audio'); return; }

}

  ['segPre','segA1','segA2'].forEach(id=>{var b=document.getElementById(id);if(b)b.classList.remove('on');}); var _a=document.getElementById(lv==='pre-a1'?'segPre':lv==='a1'?'segA1':'segA2'); if(_a)_a.classList.add('on');
  info= lv==='pre-a1'?'es':'en'; setText(lv==='pre-a1'?'both':'en'); render(); }

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var want=FX.cfg.accent==="GB"?"en-GB":"en-US";
    var pref=["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Google UK English Female","Microsoft Libby","Microsoft Sonia","Daniel"];
    var en=vs.filter(function(v){return v.lang&&v.lang.indexOf("en")===0;});
    var pool=en.filter(function(v){return v.lang===want;}).concat(en);
    for(var i=0;i<pref.length;i++){ var hit=null; for(var j=0;j<pool.length;j++){ if(pool[j].name&&pool[j].name.indexOf(pref[i])===0){ hit=pool[j]; break; } } if(hit) return hit; }
    return pool[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
