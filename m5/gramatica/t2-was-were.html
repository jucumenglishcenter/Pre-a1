<script>
/* ═══ METADATOS ═══ */
const MAT = {"title":{"es":"Resumen de Gramática","en":"Grammar Summary"},"subtitle":{"es":"Pasado de “to be”: was / were","en":"Past of “to be”: was / were"},"reportId":"sum-was-were"};
const PASS = 75;
const STEPS = [{"icon":"🇪🇸","title":{"es":"Repaso en Español","en":"Spanish Recap"},"html":{"es":"<div class=\"gdesc\">En español usamos <b>«era»</b> y <b>«estaba»</b> para describir el pasado: «Coco <b>era</b> pequeño», «El agua <b>estaba</b> fría». Son el pasado de <b>ser</b> y <b>estar</b>.</div>\n    <div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">🕐 Hoy</div><div class=\"role\">Presente</div><div class=\"desc\">«Coco es grande.»</div></div><div class=\"art-box\"><div class=\"word\">⏪ Antes</div><div class=\"role\">Pasado</div><div class=\"desc\">«Coco era pequeño.»</div></div></div>\n    <div class=\"info-illus\"><span class=\"emo\">🎨</span><span class=\"txt\">«Era / estaba» describen <b>cómo eran</b> las cosas: tamaño, color, lugar, estado.</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🧠</span><span class=\"txt\">Ya conoces el presente (M1): soy, es, está = am, is, are. Hoy aprendes su pasado.</span></div>\n    <div class=\"gnote life\">🌎 <b>De tu vida:</b> «Ayer estaba enfermo», «Mi perro era pequeño», «La sopa estaba rica». Todo eso describe el pasado.</div>","en":"<div class=\"gdesc\">In Spanish we use <b>«era»</b> and <b>«estaba»</b> to describe the past: «Coco <b>era</b> pequeño», «El agua <b>estaba</b> fría». They are the past of <b>ser</b> and <b>estar</b>.</div>\n    <div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">🕐 Today</div><div class=\"role\">Present</div><div class=\"desc\">«Coco es grande.»</div></div><div class=\"art-box\"><div class=\"word\">⏪ Before</div><div class=\"role\">Past</div><div class=\"desc\">«Coco era pequeño.»</div></div></div>\n    <div class=\"info-illus\"><span class=\"emo\">🎨</span><span class=\"txt\">«Era / estaba» describe <b>how things were</b>: size, color, place, state.</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🧠</span><span class=\"txt\">You already know the present (M1): soy, es, está = am, is, are. Today you learn their past.</span></div>\n    <div class=\"gnote life\">🌎 <b>From your life:</b> «Ayer estaba enfermo», «Mi perro era pequeño». All of that describes the past.</div>"},"checks":[{"q":{"es":"«Coco era pequeño» habla de:","en":"«Coco era pequeño» talks about:"},"opts":{"es":["Antes (pasado)","Hoy (presente)"],"en":["Before (past)","Today (present)"]},"correct":0,"fb":{"why":{"es":"«Era» describe el pasado.","en":"«Era» describes the past."},"tip":{"es":"era = pasado","en":"era = past"}}},{"q":{"es":"«Era» y «estaba» son:","en":"«Era» and «estaba» are:"},"opts":{"es":["Pasado de ser y estar","Presente de ser y estar"],"en":["Past of ser and estar","Present of ser and estar"]},"correct":0,"fb":{"why":{"es":"Es / está (hoy) → era / estaba (antes).","en":"Es / está (today) → era / estaba (before)."},"tip":{"es":"pasado de ser/estar","en":"past of ser/estar"}}},{"q":{"es":"«El agua estaba fría» describe:","en":"«El agua estaba fría» describes:"},"opts":{"es":["Cómo estaba el agua","A dónde corre el agua"],"en":["How the water was","Where the water runs"]},"correct":0,"fb":{"why":{"es":"Describe su estado: fría.","en":"It describes its state: cold."},"tip":{"es":"estado","en":"state"}}},{"q":{"es":"El pasado de «Yo estoy enfermo» es:","en":"The past of «Yo estoy enfermo» is:"},"opts":{"es":["Yo estaba enfermo","Yo estoy enfermo"],"en":["Yo estaba enfermo","Yo estoy enfermo"]},"correct":0,"fb":{"why":{"es":"estoy (hoy) → estaba (antes).","en":"estoy (today) → estaba (before)."},"tip":{"es":"estoy → estaba","en":"estoy → estaba"}}},{"q":{"es":"¿Cuál describe el pasado?","en":"Which one describes the past?"},"opts":{"es":["La sopa estaba rica","La sopa está rica"],"en":["La sopa estaba rica","La sopa está rica"]},"correct":0,"fb":{"why":{"es":"«Estaba» = pasado.","en":"«Estaba» = past."},"tip":{"es":"estaba = pasado","en":"estaba = past"}}}]},{"icon":"🤝","title":{"es":"Similitudes","en":"Similarities"},"html":{"es":"<div class=\"gdesc\">El inglés también cambia «ser / estar» para el pasado. <b>is / are</b> se convierten en <b>was / were</b>.</div>\n    <div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">1️⃣</span><span class=\"lbl\">was</span><span class=\"es\">era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👥</span><span class=\"lbl\">were</span><span class=\"es\">eran / estaban</span></div><div class=\"viz-item\"><span class=\"ico\">🕐</span><span class=\"lbl\">yesterday</span><span class=\"es\">ayer</span></div><div class=\"viz-item\"><span class=\"ico\">📅</span><span class=\"lbl\">last week</span><span class=\"es\">la semana pasada</span></div><div class=\"viz-item\"><span class=\"ico\">🎨</span><span class=\"lbl\">was cold</span><span class=\"es\">estaba fría</span></div><div class=\"viz-item\"><span class=\"ico\">🤒</span><span class=\"lbl\">was ill</span><span class=\"es\">estaba enfermo</span></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">Coco <span class=\"tag s\">was</span> very small.</div><div class=\"es\">Coco era muy pequeño.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Coco was very small.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Coco was very small.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">My eyes <span class=\"tag s\">were</span> tired.</div><div class=\"es\">Mis ojos estaban cansados.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('My eyes were tired.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('My eyes were tired.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"sec-label\">Lo igual en los dos idiomas</div>\n    <ul class=\"simlist\"><li>Los dos cambian ser/estar para hablar del pasado.</li><li>Los dos describen estados: frío, enfermo, feliz, pequeño.</li><li>El orden se mantiene: Sujeto + verbo + descripción.</li></ul>\n    <div class=\"gnote\">👍 Buena noticia: <b>was/were</b> cubren «era» Y «estaba». Dos verbos españoles, un solo verbo inglés.</div>","en":"<div class=\"gdesc\">English also changes \"ser / estar\" for the past. <b>is / are</b> become <b>was / were</b>.</div>\n    <div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">1️⃣</span><span class=\"lbl\">was</span><span class=\"es\">era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👥</span><span class=\"lbl\">were</span><span class=\"es\">eran / estaban</span></div><div class=\"viz-item\"><span class=\"ico\">🕐</span><span class=\"lbl\">yesterday</span><span class=\"es\">ayer</span></div><div class=\"viz-item\"><span class=\"ico\">📅</span><span class=\"lbl\">last week</span><span class=\"es\">la semana pasada</span></div><div class=\"viz-item\"><span class=\"ico\">🎨</span><span class=\"lbl\">was cold</span><span class=\"es\">estaba fría</span></div><div class=\"viz-item\"><span class=\"ico\">🤒</span><span class=\"lbl\">was ill</span><span class=\"es\">estaba enfermo</span></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">Coco <span class=\"tag s\">was</span> very small.</div><div class=\"es\">Coco was very small.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Coco was very small.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Coco was very small.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">My eyes <span class=\"tag s\">were</span> tired.</div><div class=\"es\">My eyes were tired.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('My eyes were tired.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('My eyes were tired.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"sec-label\">What is the same in both languages</div>\n    <ul class=\"simlist\"><li>Both change ser/estar to talk about the past.</li><li>Both describe states: cold, ill, happy, small.</li><li>The order stays: Subject + verb + description.</li></ul>\n    <div class=\"gnote\">👍 Good news: <b>was/were</b> cover «era» AND «estaba». Two Spanish verbs, one English verb.</div>"},"checks":[{"q":{"es":"«was / were» son:","en":"«was / were» are:"},"opts":{"es":["El pasado de is / are","El presente de is / are"],"en":["The past of is / are","The present of is / are"]},"correct":0,"fb":{"why":{"es":"is/are (hoy) → was/were (antes).","en":"is/are (today) → was/were (before)."},"tip":{"es":"is→was · are→were","en":"is→was · are→were"}}},{"q":{"es":"«Coco was small» en español:","en":"«Coco was small» in Spanish:"},"opts":{"es":["Coco era pequeño","Coco es pequeño"],"en":["Coco era pequeño","Coco es pequeño"]},"correct":0,"fb":{"why":{"es":"was = era (pasado).","en":"was = era (past)."},"tip":{"es":"was = era","en":"was = era"}},"tr":{"es":"Coco era pequeño.","en":"Coco was small."}},{"q":{"es":"was/were sirven para describir:","en":"was/were are used to describe:"},"opts":{"es":["Cómo eran las cosas","Solo lugares"],"en":["How things were","Only places"]},"correct":0,"fb":{"why":{"es":"Estados, tamaños, colores, lugares…","en":"States, sizes, colors, places…"},"tip":{"es":"describir el pasado","en":"describe the past"}}},{"q":{"es":"«My eyes were tired» habla de:","en":"«My eyes were tired» talks about:"},"opts":{"es":["El pasado","El presente"],"en":["The past","The present"]},"correct":0,"fb":{"why":{"es":"were = estaban (pasado).","en":"were = estaban (past)."},"tip":{"es":"were = pasado","en":"were = past"}},"tr":{"es":"Mis ojos estaban cansados.","en":"My eyes were tired."}},{"q":{"es":"«Era» y «estaba» en inglés se dicen:","en":"«Era» and «estaba» in English are:"},"opts":{"es":["Con el mismo verbo (was)","Con dos verbos distintos"],"en":["With the same verb (was)","With two different verbs"]},"correct":0,"fb":{"why":{"es":"was cubre ser y estar.","en":"was covers ser and estar."},"tip":{"es":"un solo verbo","en":"one verb"}}}]},{"icon":"⚡","title":{"es":"Diferencias","en":"Differences"},"html":{"es":"<div class=\"gdesc\">El español tiene muchas formas (era, eras, éramos, estaba, estaban…). El inglés solo <b>DOS</b>: <b>was</b> y <b>were</b>. La clave es saber cuál va con cada persona.</div>\n    <table class=\"dtab\"><tr><th>Español</th><th>English</th><th>Explicación</th></tr>\n      <tr><td>yo era / estaba</td><td class=\"en\">I was</td><td>was también para I</td></tr>\n      <tr><td>él, ella era / estaba · eso era</td><td class=\"en\">he / she / it was</td><td>was = una persona o cosa</td></tr>\n      <tr><td>tú eras / estabas · ustedes eran</td><td class=\"en\">you were</td><td>were para you (tú Y ustedes)</td></tr>\n      <tr><td>nosotros éramos / estábamos</td><td class=\"en\">we were</td><td>were = varios</td></tr>\n      <tr><td>ellos eran / estaban</td><td class=\"en\">they were</td><td>were = varios</td></tr>\n    </table>\n    <div class=\"sec-label\">El paradigma completo</div>\n    <div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">👤</span><span class=\"lbl\">I was</span><span class=\"es\">yo era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👦</span><span class=\"lbl\">He was</span><span class=\"es\">él era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👧</span><span class=\"lbl\">She was</span><span class=\"es\">ella era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">🐶</span><span class=\"lbl\">It was</span><span class=\"es\">eso era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👉</span><span class=\"lbl\">You were</span><span class=\"es\">tú eras · ustedes eran</span></div><div class=\"viz-item\"><span class=\"ico\">👨‍👩‍👧</span><span class=\"lbl\">We / They were</span><span class=\"es\">éramos · eran</span></div></div>\n    <div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Negativo:</b> was/were + <b>not</b> → «He was not hungry.» = No tenía hambre.</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Pregunta:</b> Was/Were va PRIMERO → «Were you ill?» → «Yes, I was.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🔎</span><span class=\"txt\"><b>There was</b> = había (una cosa) · <b>There were</b> = había (varias): «There were five seeds.»</span></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">He <span class=\"tag v\">was not</span> hungry.</div><div class=\"es\">No tenía hambre.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('He was not hungry.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('He was not hungry.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\"><span class=\"tag v\">Were</span> you ill?</div><div class=\"es\">¿Estuviste enfermo?</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Were you ill?','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Were you ill?','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"gnote\">⚡ <b>was</b> → I, he, she, it · <b>were</b> → you, we, they.</div>","en":"<div class=\"gdesc\">Spanish has many forms (era, eras, éramos, estaba, estaban…). English has only <b>TWO</b>: <b>was</b> and <b>were</b>. The key is which one goes with each person.</div>\n    <table class=\"dtab\"><tr><th>Español</th><th>English</th><th>Explanation</th></tr>\n      <tr><td>yo era / estaba</td><td class=\"en\">I was</td><td>was also for I</td></tr>\n      <tr><td>él, ella era / estaba · eso era</td><td class=\"en\">he / she / it was</td><td>was = one person or thing</td></tr>\n      <tr><td>tú eras / estabas · ustedes eran</td><td class=\"en\">you were</td><td>were for you (singular AND plural)</td></tr>\n      <tr><td>nosotros éramos / estábamos</td><td class=\"en\">we were</td><td>were = several</td></tr>\n      <tr><td>ellos eran / estaban</td><td class=\"en\">they were</td><td>were = several</td></tr>\n    </table>\n    <div class=\"sec-label\">The complete paradigm</div>\n    <div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">👤</span><span class=\"lbl\">I was</span><span class=\"es\">yo era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👦</span><span class=\"lbl\">He was</span><span class=\"es\">él era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👧</span><span class=\"lbl\">She was</span><span class=\"es\">ella era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">🐶</span><span class=\"lbl\">It was</span><span class=\"es\">eso era / estaba</span></div><div class=\"viz-item\"><span class=\"ico\">👉</span><span class=\"lbl\">You were</span><span class=\"es\">tú eras · ustedes eran</span></div><div class=\"viz-item\"><span class=\"ico\">👨‍👩‍👧</span><span class=\"lbl\">We / They were</span><span class=\"es\">éramos · eran</span></div></div>\n    <div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Negative:</b> was/were + <b>not</b> → «He was not hungry.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Question:</b> Was/Were goes FIRST → «Were you ill?» → «Yes, I was.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🔎</span><span class=\"txt\"><b>There was</b> = había (one thing) · <b>There were</b> = había (several): «There were five seeds.»</span></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">He <span class=\"tag v\">was not</span> hungry.</div><div class=\"es\">He was not hungry.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('He was not hungry.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('He was not hungry.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\"><span class=\"tag v\">Were</span> you ill?</div><div class=\"es\">Were you ill?</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Were you ill?','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Were you ill?','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"gnote\">⚡ <b>was</b> → I, he, she, it · <b>were</b> → you, we, they.</div>"},"checks":[{"q":{"es":"«I ___ ill last week.»","en":"«I ___ ill last week.»"},"opts":{"es":["was","were"],"en":["was","were"]},"correct":0,"fb":{"why":{"es":"I va con was.","en":"I goes with was."},"tip":{"es":"I → was","en":"I → was"}},"tr":{"es":"Estuve enfermo la semana pasada.","en":"I was ill last week."}},{"q":{"es":"«They ___ happy.»","en":"«They ___ happy.»"},"opts":{"es":["were","was"],"en":["were","was"]},"correct":0,"fb":{"why":{"es":"They = varios → were.","en":"They = several → were."},"tip":{"es":"they → were","en":"they → were"}},"tr":{"es":"Ellos estaban felices.","en":"They were happy."}},{"q":{"es":"«You ___ at home.»","en":"«You ___ at home.»"},"opts":{"es":["were","was"],"en":["were","was"]},"correct":0,"fb":{"why":{"es":"You SIEMPRE con were.","en":"You ALWAYS with were."},"tip":{"es":"you → were","en":"you → were"}},"tr":{"es":"Tú estabas en casa.","en":"You were at home."}},{"q":{"es":"«The water (it) ___ cold.»","en":"«The water (it) ___ cold.»"},"opts":{"es":["was","were"],"en":["was","were"]},"correct":0,"fb":{"why":{"es":"It (una cosa) → was.","en":"It (one thing) → was."},"tip":{"es":"it → was","en":"it → was"}},"tr":{"es":"El agua estaba fría.","en":"The water was cold."}},{"q":{"es":"«We ___ in the garden.»","en":"«We ___ in the garden.»"},"opts":{"es":["were","was"],"en":["were","was"]},"correct":0,"fb":{"why":{"es":"We = varios → were.","en":"We = several → were."},"tip":{"es":"we → were","en":"we → were"}},"tr":{"es":"Estábamos en el jardín.","en":"We were in the garden."}}]},{"icon":"💡","title":{"es":"Tips Prácticos","en":"Practical Tips"},"html":{"es":"<div class=\"gdesc\">La fórmula de was/were y sus trucos.</div>\n    <div class=\"fbox\"><div class=\"frm\"><span class=\"pill s\">Sujeto</span><span class=\"plus\">+</span><span class=\"pill v\">was / were</span><span class=\"plus\">+</span><span class=\"pill o\">cómo / dónde</span></div><div class=\"fex\">The soup <b>was</b> hot. · My friends <b>were</b> there.</div></div>\n    <div class=\"fbox\"><div class=\"frm\"><span class=\"pill s\">was → 1</span><span class=\"plus\">I · he · she · it</span><span class=\"pill v\">were → 2+</span><span class=\"plus\">you · we · they</span></div><div class=\"fex\">He <b>was</b> ill. · They <b>were</b> happy.</div></div>\n    <div class=\"info-illus\"><span class=\"emo\">1️⃣</span><span class=\"txt\"><b>Tip 1:</b> was = UNA persona o cosa (y también I) · were = VARIOS (y siempre you).</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Tip 2:</b> negativo fácil: + not → «It was not a good day.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Tip 3:</b> pregunta: Was/Were primero → «Was it cold?» «Yes, it was.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🔎</span><span class=\"txt\"><b>Tip 4:</b> there was (una) · there were (varias) = había.</span></div>\n    <div class=\"alert-card\"><div class=\"atitle\">⚠️ Error típico</div><p>❌ «You <b>was</b>» → ✅ «You <b>were</b>» (you siempre con were).<br>❌ «They <b>was</b>» → ✅ «They <b>were</b>».</p></div>","en":"<div class=\"gdesc\">The was/were formula and its tricks.</div>\n    <div class=\"fbox\"><div class=\"frm\"><span class=\"pill s\">Subject</span><span class=\"plus\">+</span><span class=\"pill v\">was / were</span><span class=\"plus\">+</span><span class=\"pill o\">how / where</span></div><div class=\"fex\">The soup <b>was</b> hot. · My friends <b>were</b> there.</div></div>\n    <div class=\"fbox\"><div class=\"frm\"><span class=\"pill s\">was → 1</span><span class=\"plus\">I · he · she · it</span><span class=\"pill v\">were → 2+</span><span class=\"plus\">you · we · they</span></div><div class=\"fex\">He <b>was</b> ill. · They <b>were</b> happy.</div></div>\n    <div class=\"info-illus\"><span class=\"emo\">1️⃣</span><span class=\"txt\"><b>Tip 1:</b> was = ONE person or thing (and also I) · were = SEVERAL (and always you).</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Tip 2:</b> easy negative: + not → «It was not a good day.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Tip 3:</b> question: Was/Were first → «Was it cold?» «Yes, it was.»</span></div>\n    <div class=\"info-illus\"><span class=\"emo\">🔎</span><span class=\"txt\"><b>Tip 4:</b> there was (one) · there were (several) = había.</span></div>\n    <div class=\"alert-card\"><div class=\"atitle\">⚠️ Common mistake</div><p>❌ «You <b>was</b>» → ✅ «You <b>were</b>» (you always with were).<br>❌ «They <b>was</b>» → ✅ «They <b>were</b>».</p></div>"},"checks":[{"q":{"es":"«You ___ ill yesterday.»","en":"«You ___ ill yesterday.»"},"opts":{"es":["were","was"],"en":["were","was"]},"correct":0,"fb":{"why":{"es":"You siempre con were.","en":"You always with were."},"tip":{"es":"you → were","en":"you → were"}},"tr":{"es":"Estuviste enfermo ayer.","en":"You were ill yesterday."}},{"q":{"es":"«The eggs ___ perfect.»","en":"«The eggs ___ perfect.»"},"opts":{"es":["were","was"],"en":["were","was"]},"correct":0,"fb":{"why":{"es":"The eggs = varios → were.","en":"The eggs = several → were."},"tip":{"es":"varios → were","en":"several → were"}},"tr":{"es":"Los huevos estaban perfectos.","en":"The eggs were perfect."}},{"q":{"es":"El negativo de «He was hungry»:","en":"The negative of «He was hungry»:"},"opts":{"es":["He was not hungry","He not was hungry"],"en":["He was not hungry","He not was hungry"]},"correct":0,"fb":{"why":{"es":"El not va DESPUÉS de was.","en":"Not goes AFTER was."},"tip":{"es":"was + not","en":"was + not"}}},{"q":{"es":"Pregunta: «___ you at school?»","en":"Question: «___ you at school?»"},"opts":{"es":["Were","Was"],"en":["Were","Was"]},"correct":0,"fb":{"why":{"es":"You → were, y va primero en la pregunta.","en":"You → were, and it goes first."},"tip":{"es":"Were you…?","en":"Were you…?"}},"tr":{"es":"¿Estabas en la escuela?","en":"Were you at school?"}},{"q":{"es":"«There ___ five seeds.»","en":"«There ___ five seeds.»"},"opts":{"es":["were","was"],"en":["were","was"]},"correct":0,"fb":{"why":{"es":"Varias semillas → there were.","en":"Several seeds → there were."},"tip":{"es":"varias → were","en":"several → were"}},"tr":{"es":"Había cinco semillas.","en":"There were five seeds."}}]},{"icon":"✨","title":{"es":"Práctica Final","en":"Final Practice"},"builder":true,"html":{"es":"<div class=\"gdesc\">Junta todo: was/were + negativo + pregunta. Arma la oración.</div>\n    <div class=\"cboxes\"><div class=\"cbox s\"><span class=\"cl\">1️⃣ was</span><span class=\"cv\">I · he · she · it</span></div><div class=\"cbox o\"><span class=\"cl\">👥 were</span><span class=\"cv\">you · we · they</span></div><div class=\"cbox p\"><span class=\"cl\">Extras</span><span class=\"cv\">+ not (negativo) · Was/Were…? (pregunta) · there was/were (había)</span></div></div>\n    <div class=\"sec-label\">Las reglas en oraciones de tus historias</div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">The juice <span class=\"tag v\">was</span> cold.</div><div class=\"es\">El jugo estaba frío.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('The juice was cold.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('The juice was cold.','UK')\">🇬🇧 UK</button></div></div></div>\n    <div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div clas        done:'📚 Summary passed!', phrase:'Great review. Your grammar gets stronger each pass. 💪', failBar:'🔁 You need '+PASS+'% to claim the surprise. Try again!', phraseFail:'Almost. Review the steps and come back to pass '+PASS+'%. 🌱', kpT:'📝 Master pattern — copy it in your notebook',
       surT:'Surprise unlocked!', surBadge:b=>'🏅 Badge: '+b, surP:'Added to your Weekly League collection. Collect them all!', xp:n=>'⭐ +'+n+' review XP', back:'↩ Back to the platform', retry:'🔁 Review again',
       helpT:'How do I use this material?', tipsT:'What each part is for:', tips:['<b>🔓 Notice:</b> practices unlock; this is review.','<b>ES/EN:</b> switches the WHOLE material\'s language.','<b>🌐 See translation:</b> under a self-check with an English sentence (doesn\'t change the rest).','<b>🔊 US/UK:</b> hear the examples.','<b>Build:</b> in Final Practice you build the sentence.','<b>🎁 Surprise:</b> score at least 75% of the self-checks to earn a badge + XP.'] }
};
let info='es', cur=0, doneSteps=[], answers=[], coreDone=false, bState={order:[],locked:false}, curLab='';
function L(){ return T[info]; }
function say(text,acc){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; const vs=speechSynthesis.getVoices()||[]; const want=acc==='US'?'en-US':'en-GB'; const v=vs.find(x=>x.lang===want)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0); if(v){u.voice=v;u.lang=v.lang;}else u.lang=want; speechSynthesis.speak(u); }catch(e){} }
function render(){ cur=0; coreDone=false; doneSteps=new Array(STEPS.length).fill(false); answers=STEPS.map(s=>new Array(s.checks.length).fill(null)); bState={order:[],locked:false};
  document.getElementById('results').classList.remove('show'); document.getElementById('mbody').style.display='block'; document.getElementById('msbanner').style.display='none';
  renderTabs(); applyLang(); showStep(0); }
function renderTabs(){ document.getElementById('steptabs').innerHTML=STEPS.map((s,i)=>`<button class="stab${i===0?' on':''}${doneSteps[i]?' done':''}" id="stab${i}" onclick="goStep(${i})">${s.icon} ${i+1}</button>`).join(''); }
function applyLang(){ const t=L();
  document.getElementById('lsEs').classList.toggle('on',info==='es'); document.getElementById('lsEn').classList.toggle('on',info==='en');
  document.getElementById('mhtitle').textContent=MAT.title[info]; document.getElementById('mhsub').textContent=document.getElementById('screen').getAttribute('data-level').toUpperCase().replace('-',' · ')+' · '+MAT.subtitle[info];
  document.getElementById('unT').textContent=t.unT; document.getElementById('unP').textContent=t.unP;
  document.getElementById('helpT').textContent=t.helpT; document.getElementById('helpTips').innerHTML='<div style="font-size:11.5px;color:var(--text-soft);font-weight:700;margin-bottom:6px">'+t.tipsT+'</div>'+t.tips.map(x=>'<div class="helptip">• <span>'+x+'</span></div>').join('');
  document.getElementById('kpT').textContent=t.kpT; document.getElementById('lBack').textContent=t.back; document.getElementById('lRetry').textContent=t.retry;
  updateMilestone(); renderStep(); }
function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';
  let html=`<div class="gcard"><div class="sec-label">${cur+1}. ${s.icon} ${s.title[info]}</div>${s.html[info]}`;
  if(s.builder) html+=builderHtml(); html+=`</div>`;
  const ansd=answers[cur].filter(x=>x!==null).length;
  html+=`<div class="check"><div class="check-h">🧠 ${t.checkH}<span class="cprog">${ansd}/${s.checks.length}</span></div><div class="check-sub">${t.checkSub}</div>`;
  s.checks.forEach((c,ci)=>{ const sel=answers[cur][ci]; const done=sel!==null; const ok=sel===c.correct;
    let fb='';
    if(done){ const f=c.fb; fb=`<div class="cfb show ${ok?'ok':'no'}"><div class="cfbh">${ok?'✅ '+t.cOk:'❌ '+t.cBad}</div><div class="cfbb">`+
      `<div class="fblk why"><b>🔍 ${t.fWhy}</b>${f.why[info]}</div>`+
      (f.contrast?`<div class="fblk contrast"><b>⚠ ${t.fNo}</b>${f.contrast[info]}</div>`:'')+
      (f.ex?`<div class="fblk ex"><b>📝 ${t.fEx}</b>${f.ex[info]}</div>`:'')+
      (f.tip?`<div class="fblk tip"><b>💡 ${t.fTip}</b>${f.tip[info]}</div>`:'')+`</div></div>`; }
    const trBtn = (c.tr && info==='es') ? `<button class="ctransbtn" onclick="this.nextElementSibling.classList.toggle('show')">🌐 ${t.seeTr}</button><div class="ctrans">${c.tr.es}</div>` : '';
    html+=`<div class="citem"><p class="cq"><span class="n">${ci+1}.</span> ${c.q[info]}</p>${trBtn}<div class="copts">`+
      c.opts[info].map((o,k)=>{ let cl='copt'; if(done){ if(k===c.correct)cl+=' ok'; else if(k===sel)cl+=' no'; } return `<button class="${cl}" ${done?'disabled':''} onclick="checkAns(${ci},${k})">${o}</button>`; }).join('')+
      `</div>${fb}</div>`;
  });
  html+=`</div>`;
  document.getElementById('stepArea').innerHTML=html;
  if(s.builder) initBuilder();
  document.getElementById('navPrev').textContent=t.prev; document.getElementById('navPrev').disabled=cur===0;
  document.getElementById('navNext').textContent= cur===STEPS.length-1? t.finish : t.next;
  document.getElementById('pfill').style.width=(doneSteps.filter(Boolean).length/STEPS.length*100)+'%';
}
function checkAns(ci,k){ if(answers[cur][ci]!==null) return; answers[cur][ci]=k;
  if(answers[cur].every(x=>x!==null)){ doneSteps[cur]=true; document.getElementById('stab'+cur).classList.add('done'); }
  if([0,1,2].every(i=>doneSteps[i]) && !coreDone){ coreDone=true; try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{type:'summary', core:true, mat:MAT.reportId}})); }catch(e){} toast(L().msToast); }
  updateMilestone(); renderStep(); }
function updateMilestone(){ const b=document.getElementById('msbanner'); if([0,1,2].every(i=>doneSteps[i])){ b.style.display='block'; b.textContent=L().msCore; } else b.style.display='none'; }
function builderHtml(){ const t=L(); return `<div class="builder"><div class="bh">🧩 ${t.bH}</div><div class="bsub">${t.bSub}</div><div class="tray" id="tray" data-ph="${t.trayPh}"></div><div class="bank" id="bank"></div><button class="bcheck" id="bchk" onclick="checkBuild()" disabled>${t.bcheck}</button><div class="bres" id="bres"></div></div>`; }
function initBuilder(){ bState={order:[],locked:false}; const sh=[...BUILD.answer.keys()].sort(()=>Math.random()-.5);
  document.getElementById('bank').innerHTML=sh.map(idx=>`<button class="tile ${BUILD.answer[idx].c}" id="tile${idx}" onclick="placeTile(${idx})">${BUILD.answer[idx].w}</button>`).join(''); document.getElementById('tray').innerHTML=''; }
function placeTile(idx){ if(bState.locked)return; bState.order.push(idx); document.getElementById('tile'+idx).classList.add('placed'); const tr=document.getElementById('tray'); const b=document.createElement('button'); b.className='tile '+BUILD.answer[idx].c; b.textContent=BUILD.answer[idx].w; b.onclick=()=>removeTile(idx,b); tr.appendChild(b); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function removeTile(idx,el){ if(bState.locked)return; bState.order=bState.order.filter(x=>x!==idx); el.remove(); document.getElementById('tile'+idx).classList.remove('placed'); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function checkBuild(){ const t=L(); bState.locked=true; const ok=bState.order.join(',')===BUILD.answer.map((_,i)=>i).join(','); document.querySelectorAll('#tray .tile').forEach(x=>x.style.pointerEvents='none');
  const r=document.getElementById('bres'); r.className='bres show '+(ok?'ok':'no'); r.innerHTML=(ok?'✅ '+t.bOk:'❌ '+t.bNo)+`<div class="bex"><div class="tr">${BUILD.answer.map(a=>a.w).join(' ')} — <i>${BUILD.tr[info]}</i></div><button class="audio-btn" onclick="say('${BUILD.say}','US')">🇺🇸 US</button><button class="audio-btn" onclick="say('${BUILD.say}','UK')">🇬🇧 UK</button></div>`; }
function showStep(i){ cur=i; document.querySelectorAll('.stab').forEach((b,x)=>b.classList.toggle('on',x===i)); renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
function goStep(i){ showStep(i); }
function navStep(d){ if(d<0){ if(cur>0) showStep(cur-1); return; } if(cur<STEPS.length-1){ showStep(cur+1); return; } const inc=answers.findIndex(a=>a.some(x=>x===null)); if(inc>=0){ toast(L().finishNeed); showStep(inc); } else finish(); }
function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
  let tot=0,corr=0; answers.forEach((arr,si)=>arr.forEach((k,ci)=>{ if(k!==null){tot++; if(k===STEPS[si].checks[ci].correct)corr++;} })); const pct=tot?Math.round(corr/tot*100):0; const pass=pct>=PASS;
  const db=document.getElementById('doneBar'); db.classList.toggle('fail',!pass); db.textContent= pass? t.done : t.failBar; document.getElementById('fscore').textContent=pct; document.getElementById('fphrase').textContent= pass? t.phrase : t.phraseFail;
  document.getElementById('kpList').innerHTML=SUMMARY[info].map(s=>`<li>${s}</li>`).join('');
  document.getElementById('surprise').style.display= pass? 'block':'none';
  if(pass){ document.getElementById('medalEm').textContent=BADGE.emoji; document.getElementById('surT').textContent=t.surT; document.getElementById('surBadge').textContent=t.surBadge(BADGE.name[info]); document.getElementById('surP').textContent=t.surP; document.getElementById('xpWin').textContent=t.xp(BADGE.xp); }
  try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:pct, pass:pass, type:'summary', badge:BADGE.name.en, xp:BADGE.xp, mat:MAT.reportId, final:true}})); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'}); }
function restart(){ render(); }
function openHelp(){document.getElementById('helpov').classList.add('show');} function closeHelp(){document.getElementById('helpov').classList.remove('show');}
function setInfo(l){ info=l; applyLang(); }
function setLevel(lv){ document.getElementById('screen').setAttribute('data-level',lv); info= lv==='a2'?'en':'es'; render(); }
function volver(){ if(document.referrer){ location.href=document.referrer; } else if(history.length>1){ history.back(); } else { toast(info==='es'?'Vuelve a tu práctica en la plataforma':'Go back to your practice'); } }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.mat')){ e.preventDefault(); toast(info==='es'?'Material protegido © JUCUM EC':'Protected material © JUCUM EC'); }});
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
/* FIN DEL MOTOR */
setLevel(document.getElementById('screen').getAttribute('data-level')||'pre-a1');
</script>
