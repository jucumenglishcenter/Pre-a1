<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Preposiciones de Lugar y Tiempo',en:'Prepositions of Place & Time'}, reportId:'sum-prepositions' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Las preposiciones dicen <b>dónde</b> está algo o <b>cuándo</b> pasa: «<b>en</b> la mesa», «<b>debajo de</b> la cama», «<b>a</b> las 5».</div>
        <div class="art-hero"><div class="art-box"><div class="word">📍 Lugar</div><div class="role">¿Dónde?</div><div class="desc">en, sobre, debajo de, al lado de.</div></div><div class="art-box"><div class="word">🕐 Tiempo</div><div class="role">¿Cuándo?</div><div class="desc">a las 5, en mayo, el lunes.</div></div></div>
        ${ii('📦','Lugar: dicen la posición de las cosas: «El libro está sobre la mesa».')}
        ${ii('🕐','Tiempo: dicen cuándo pasa algo: «La clase es a las 8».')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «Las llaves están en el cajón» (lugar) y «Nos vemos el viernes» (tiempo). En inglés son in/on/under/next to y at/in/on.</div>`,
      en:`<div class="gdesc">Prepositions say <b>where</b> something is or <b>when</b> it happens: «<b>en</b> la mesa», «<b>debajo de</b> la cama», «<b>a</b> las 5».</div>
        <div class="art-hero"><div class="art-box"><div class="word">📍 Place</div><div class="role">Where?</div><div class="desc">en, sobre, debajo de, al lado de.</div></div><div class="art-box"><div class="word">🕐 Time</div><div class="role">When?</div><div class="desc">a las 5, en mayo, el lunes.</div></div></div>
        ${ii('📦','Place: they tell the position of things: «El libro está sobre la mesa».')}
        ${ii('🕐','Time: they tell when something happens: «La clase es a las 8».')}
        <div class="gnote life">🌎 <b>From your life:</b> «Las llaves están en el cajón» (place) and «Nos vemos el viernes» (time). In English they are in/on/under/next to and at/in/on.</div>`
    },
    checks:[
      { q:{es:'Las preposiciones de lugar dicen:',en:'Prepositions of place tell:'}, opts:{es:['Dónde está algo','Cuándo pasa'],en:['Where something is','When it happens']}, correct:0, fb:{ why:{es:'La posición.',en:'The position.'}, tip:{es:'dónde',en:'where'}} },
      { q:{es:'Las preposiciones de tiempo dicen:',en:'Prepositions of time tell:'}, opts:{es:['Cuándo pasa algo','Dónde está'],en:['When something happens','Where it is']}, correct:0, fb:{ why:{es:'El momento.',en:'The moment.'}, tip:{es:'cuándo',en:'when'}} },
      { q:{es:'«debajo de la cama» es una preposición de:',en:'«debajo de la cama» is a preposition of:'}, opts:{es:['Lugar','Tiempo'],en:['Place','Time']}, correct:0, fb:{ why:{es:'Dice dónde.',en:'It tells where.'}, tip:{es:'lugar',en:'place'}} },
      { q:{es:'«a las 5» es una preposición de:',en:'«a las 5» is a preposition of:'}, opts:{es:['Tiempo','Lugar'],en:['Time','Place']}, correct:0, fb:{ why:{es:'Dice cuándo.',en:'It tells when.'}, tip:{es:'tiempo',en:'time'}} },
      { q:{es:'«El libro está sobre la mesa» indica:',en:'«El libro está sobre la mesa» indicates:'}, opts:{es:['Posición (lugar)','Hora'],en:['Position (place)','Time']}, correct:0, fb:{ why:{es:'Dónde está el libro.',en:'Where the book is.'}, tip:{es:'lugar',en:'place'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés también tiene preposiciones de lugar y de tiempo. Muchas se parecen mucho.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">📦</span><span class="lbl">in</span><span class="es">en (dentro)</span></div><div class="viz-item"><span class="ico">⬆️</span><span class="lbl">on</span><span class="es">sobre/en</span></div><div class="viz-item"><span class="ico">⬇️</span><span class="lbl">under</span><span class="es">debajo de</span></div><div class="viz-item"><span class="ico">↔️</span><span class="lbl">next to</span><span class="es">al lado de</span></div><div class="viz-item"><span class="ico">🔙</span><span class="lbl">behind</span><span class="es">detrás de</span></div><div class="viz-item"><span class="ico">🔜</span><span class="lbl">in front of</span><span class="es">delante de</span></div></div>
        ${eg('The cat is <span class="tag s">under</span> the table.','El gato está debajo de la mesa.','ok')}
        ${eg('The class is <span class="tag s">at</span> 8.','La clase es a las 8.','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos tienen palabras para lugar (in, on, under…) y tiempo (at, in, on).</li><li>La preposición va antes del lugar o del tiempo.</li><li>La idea de posición es la misma (debajo = under).</li></ul>
        <div class="gnote">👍 in, on, under, next to, behind, in front of (lugar). Lo nuevo: at/on/in para el tiempo (siguiente paso).</div>`,
      en:`<div class="gdesc">English also has prepositions of place and time. Many are very similar.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">📦</span><span class="lbl">in</span><span class="es">en (dentro)</span></div><div class="viz-item"><span class="ico">⬆️</span><span class="lbl">on</span><span class="es">sobre/en</span></div><div class="viz-item"><span class="ico">⬇️</span><span class="lbl">under</span><span class="es">debajo de</span></div><div class="viz-item"><span class="ico">↔️</span><span class="lbl">next to</span><span class="es">al lado de</span></div><div class="viz-item"><span class="ico">🔙</span><span class="lbl">behind</span><span class="es">detrás de</span></div><div class="viz-item"><span class="ico">🔜</span><span class="lbl">in front of</span><span class="es">delante de</span></div></div>
        ${eg('The cat is <span class="tag s">under</span> the table.','The cat is under the table.','ok')}
        ${eg('The class is <span class="tag s">at</span> 8.','The class is at 8.','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both have words for place (in, on, under…) and time (at, in, on).</li><li>The preposition goes before the place or the time.</li><li>The idea of position is the same (debajo = under).</li></ul>
        <div class="gnote">👍 in, on, under, next to, behind, in front of (place). The new part: at/on/in for time (next step).</div>`
    },
    checks:[
      { q:{es:'«under» = ',en:'«under» = '}, opts:{es:['debajo de','sobre'],en:['debajo de','sobre']}, correct:0, fb:{ why:{es:'under = debajo de.',en:'under = debajo de.'}, tip:{es:'under = debajo',en:'under = debajo'}} },
      { q:{es:'«next to» = ',en:'«next to» = '}, opts:{es:['al lado de','detrás de'],en:['al lado de','detrás de']}, correct:0, fb:{ why:{es:'next to = al lado de.',en:'next to = al lado de.'}, tip:{es:'next to = al lado',en:'next to = al lado'}} },
      { q:{es:'«behind» = ',en:'«behind» = '}, opts:{es:['detrás de','delante de'],en:['detrás de','delante de']}, correct:0, fb:{ why:{es:'behind = detrás de.',en:'behind = detrás de.'}, tip:{es:'behind = detrás',en:'behind = detrás'}} },
      { q:{es:'«The cat is under the table» en español:',en:'«The cat is under the table» in Spanish:'}, opts:{es:['El gato está debajo de la mesa','El gato está sobre la mesa'],en:['El gato está debajo de la mesa','El gato está sobre la mesa']}, correct:0, fb:{ why:{es:'under = debajo.',en:'under = debajo.'}, ex:{es:'under the table → debajo de la mesa',en:'under the table'}, tip:{es:'under = debajo',en:'under = debajo'}}, tr:{es:'El gato está debajo de la mesa.',en:'The cat is under the table.'} },
      { q:{es:'La preposición va:',en:'The preposition goes:'}, opts:{es:['Antes del lugar/tiempo','Al final'],en:['Before the place/time','At the end']}, correct:0, fb:{ why:{es:'under the table.',en:'under the table.'}, tip:{es:'antes',en:'before'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">Lo que hay que memorizar: <b>in/on</b> sirven para lugar Y tiempo, pero con reglas distintas en cada caso.</div>
        <table class="dtab"><tr><th></th><th>Lugar 📍</th><th>Tiempo 🕐</th></tr>
          <tr><td class="en">at</td><td>en un punto (at the door)</td><td>horas (at 5, at night)</td></tr>
          <tr><td class="en">on</td><td>sobre una superficie (on the table)</td><td>días (on Monday)</td></tr>
          <tr><td class="en">in</td><td>dentro de algo (in the box)</td><td>meses/años (in May, in 2020)</td></tr>
        </table>
        <div class="sec-label">⚠️ La misma palabra, distinto uso</div>
        ${ii('📍','<b>Lugar:</b> at = punto · on = superficie · in = dentro. «at the bus stop», «on the wall», «in the room».')}
        ${ii('🕐','<b>Tiempo:</b> at = hora · on = día · in = mes/año. «at 7», «on Friday», «in July».')}
        ${eg('The keys are <span class="tag s">in</span> the drawer.','Las llaves están en el cajón (dentro).','ok')}
        ${eg('We meet <span class="tag s">on</span> Monday.','Nos vemos el lunes.','ok')}
        <div class="gnote">📍 Lugar: at (punto) · on (superficie) · in (dentro). Tiempo: at (hora) · on (día) · in (mes/año).</div>`,
      en:`<div class="gdesc">What you must memorize: <b>in/on</b> work for place AND time, but with different rules in each case.</div>
        <table class="dtab"><tr><th></th><th>Place 📍</th><th>Time 🕐</th></tr>
          <tr><td class="en">at</td><td>at a point (at the door)</td><td>hours (at 5, at night)</td></tr>
          <tr><td class="en">on</td><td>on a surface (on the table)</td><td>days (on Monday)</td></tr>
          <tr><td class="en">in</td><td>inside something (in the box)</td><td>months/years (in May, in 2020)</td></tr>
        </table>
        <div class="sec-label">⚠️ Same word, different use</div>
        ${ii('📍','<b>Place:</b> at = point · on = surface · in = inside. «at the bus stop», «on the wall», «in the room».')}
        ${ii('🕐','<b>Time:</b> at = hour · on = day · in = month/year. «at 7», «on Friday», «in July».')}
        ${eg('The keys are <span class="tag s">in</span> the drawer.','The keys are in the drawer.','ok')}
        ${eg('We meet <span class="tag s">on</span> Monday.','We meet on Monday.','ok')}
        <div class="gnote">📍 Place: at (point) · on (surface) · in (inside). Time: at (hour) · on (day) · in (month/year).</div>`
    },
    checks:[
      { q:{es:'«The book is ___ the table.» (sobre):',en:'«The book is ___ the table.» (surface):'}, opts:{es:['on','in'],en:['on','in']}, correct:0, fb:{ why:{es:'Sobre una superficie → on.',en:'On a surface → on.'}, ex:{es:'on the table → sobre la mesa',en:'on the table'}, tip:{es:'superficie → on',en:'surface → on'}}, tr:{es:'El libro está sobre la mesa.',en:'The book is on the table.'} },
      { q:{es:'«The toys are ___ the box.» (dentro):',en:'«The toys are ___ the box.» (inside):'}, opts:{es:['in','on'],en:['in','on']}, correct:0, fb:{ why:{es:'Dentro → in.',en:'Inside → in.'}, ex:{es:'in the box → en la caja',en:'in the box'}, tip:{es:'dentro → in',en:'inside → in'}}, tr:{es:'Los juguetes están en la caja.',en:'The toys are in the box.'} },
      { q:{es:'«The party is ___ Saturday.» (día):',en:'«The party is ___ Saturday.» (day):'}, opts:{es:['on','in'],en:['on','in']}, correct:0, fb:{ why:{es:'Día → on.',en:'Day → on.'}, ex:{es:'on Saturday → el sábado',en:'on Saturday'}, tip:{es:'día → on',en:'day → on'}}, tr:{es:'La fiesta es el sábado.',en:'The party is on Saturday.'} },
      { q:{es:'«I get up ___ 7.» (hora):',en:'«I get up ___ 7.» (hour):'}, opts:{es:['at','in'],en:['at','in']}, correct:0, fb:{ why:{es:'Hora → at.',en:'Hour → at.'}, ex:{es:'at 7 → a las 7',en:'at 7'}, tip:{es:'hora → at',en:'hour → at'}}, tr:{es:'Me levanto a las 7.',en:'I get up at 7.'} },
      { q:{es:'«My birthday is ___ June.» (mes):',en:'«My birthday is ___ June.» (month):'}, opts:{es:['in','on'],en:['in','on']}, correct:0, fb:{ why:{es:'Mes → in.',en:'Month → in.'}, ex:{es:'in June → en junio',en:'in June'}, tip:{es:'mes → in',en:'month → in'}}, tr:{es:'Mi cumpleaños es en junio.',en:'My birthday is in June.'} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Dos mini-mapas: uno para lugar, otro para tiempo.</div>
        <div class="fbox"><div class="frm"><span class="pill s">📍 Lugar</span><span class="plus">at punto ·</span><span class="pill v">on superficie ·</span><span class="pill o">in dentro</span></div><div class="fex">at the door · on the wall · in the room</div></div>
        <div class="fbox"><div class="frm"><span class="pill s">🕐 Tiempo</span><span class="plus">at hora ·</span><span class="pill v">on día ·</span><span class="pill o">in mes/año</span></div><div class="fex">at 5 · on Monday · in May</div></div>
        ${ii('📍','<b>Tip 1 — Lugar:</b> at = un punto exacto · on = encima de algo · in = dentro de algo.')}
        ${ii('🕐','<b>Tip 2 — Tiempo (tamaño):</b> at (hora, lo más pequeño) → on (día) → in (mes/año, lo más grande).')}
        ${ii('⚠️','<b>Tip 3 — Trampas:</b> at night (de noche), in the morning (en la mañana).')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «in Monday» → ✅ «<b>on</b> Monday».<br>❌ «in the table» (encima) → ✅ «<b>on</b> the table».</p></div>
        ${ii('⚡','in = dentro · on = sobre (tocando) · under = debajo: «The book is on the table».')}`,
      en:`<div class="gdesc">Two mini-maps: one for place, one for time.</div>
        <div class="fbox"><div class="frm"><span class="pill s">📍 Place</span><span class="plus">at point ·</span><span class="pill v">on surface ·</span><span class="pill o">in inside</span></div><div class="fex">at the door · on the wall · in the room</div></div>
        <div class="fbox"><div class="frm"><span class="pill s">🕐 Time</span><span class="plus">at hour ·</span><span class="pill v">on day ·</span><span class="pill o">in month/year</span></div><div class="fex">at 5 · on Monday · in May</div></div>
        ${ii('📍','<b>Tip 1 — Place:</b> at = an exact point · on = on top of something · in = inside something.')}
        ${ii('🕐','<b>Tip 2 — Time (size):</b> at (hour, smallest) → on (day) → in (month/year, biggest).')}
        ${ii('⚠️','<b>Tip 3 — Traps:</b> at night, in the morning.')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «in Monday» → ✅ «<b>on</b> Monday».<br>❌ «in the table» (on top) → ✅ «<b>on</b> the table».</p></div>
        ${ii('⚡','in = inside · on = on top (touching) · under = below: «The book is on the table».')}`
    },
    checks:[
      { q:{es:'«The picture is ___ the wall.» (en la pared):',en:'«The picture is ___ the wall.» (surface):'}, opts:{es:['on','in'],en:['on','in']}, correct:0, fb:{ why:{es:'Sobre una superficie → on.',en:'On a surface → on.'}, ex:{es:'on the wall → en la pared',en:'on the wall'}, tip:{es:'superficie → on',en:'surface → on'}}, tr:{es:'El cuadro está en la pared.',en:'The picture is on the wall.'} },
      { q:{es:'«We have class ___ the morning.» (en la mañana):',en:'«We have class ___ the morning.»:'}, opts:{es:['in','at'],en:['in','at']}, correct:0, fb:{ why:{es:'Partes del día → in.',en:'Parts of the day → in.'}, ex:{es:'in the morning → en la mañana',en:'in the morning'}, tip:{es:'morning → in',en:'morning → in'}}, tr:{es:'Tenemos clase en la mañana.',en:'We have class in the morning.'} },
      { q:{es:'«The dog sleeps ___ night.» (de noche):',en:'«The dog sleeps ___ night.»:'}, opts:{es:['at','in'],en:['at','in']}, correct:0, fb:{ why:{es:'«night» es excepción → at.',en:'«night» is an exception → at.'}, ex:{es:'at night → de noche',en:'at night'}, tip:{es:'at night',en:'at night'}}, tr:{es:'El perro duerme de noche.',en:'The dog sleeps at night.'} },
      { q:{es:'«Stand ___ the door.» (en la puerta, punto):',en:'«Stand ___ the door.» (point):'}, opts:{es:['at','on'],en:['at','on']}, correct:0, fb:{ why:{es:'Un punto → at.',en:'A point → at.'}, ex:{es:'at the door → en la puerta',en:'at the door'}, tip:{es:'punto → at',en:'point → at'}}, tr:{es:'Párate en la puerta.',en:'Stand at the door.'} },
