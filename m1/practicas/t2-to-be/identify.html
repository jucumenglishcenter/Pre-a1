    <style>
        :root {

        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }

        .fb-error { background:var(--error-light); }
        .fb-error .fb-block-title { color:var(--error-dark); }
        .error-badge { display:inline-block; background:var(--error); color:white; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; }
        .word-swap { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; flex-wrap:wrap; }
        .ws-box { padding:0.4rem 1rem; border-radius:8px; font-weight:700; font-size:1rem; }
        .ws-wrong { background:white; color:var(--error); border:2px solid var(--error); text-decoration:line-through; }

        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }

        .nav-buttons { display:flex; gap:0.75rem; margin-top:1.25rem; }

        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }

        .results-emoji { font-size:4rem; margin-bottom:1rem; }

        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }

        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }
        .sent-option { border:2.5px solid #E5E7EB; border-radius:14px; padding:1rem 1.1rem; cursor:pointer; transition:all .2s; background:white; text-align:left; font-family:'Nunito',sans-serif; display:flex; gap:0.75rem; align-items:flex-start; width:100%; }
        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

    <script>
    const quizData = [{"badge":"🅰️ I → am","options":[{"text":"I am seven years old.","correct":true,"es":"Tengo siete años."},{"text":"I is seven years old.","correct":false,"errorWord":"is","correctWord":"am","errorType":"Concordancia","explanation":"«Is» es para he/she/it. Con «I» el verbo to be es siempre «am».","es":"Tengo siete años (is con I)."},{"text":"I be seven years old.","correct":false,"errorWord":"be","correctWord":"am","errorType":"Forma sin conjugar","explanation":"«Be» es la forma base, sin conjugar. Con «I» se dice «am».","es":"Tengo siete años (verbo sin conjugar)."}],"clue":"I → am","clueExplain":"con I, el verbo to be es siempre am.","correctReason":"Con «I» el único to be posible es «am».","hint":"El sujeto es «I». Recuerda: cada persona tiene SU forma de to be."},{"badge":"👥 plural → are","options":[{"text":"Leo and Ana are in class.","correct":true,"es":"Leo y Ana están en clase."},{"text":"Leo and Ana is in class.","correct":false,"errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"«Leo and Ana» son dos personas (plural). El to be plural es «are».","es":"Leo y Ana están en clase (is con sujeto plural)."},{"text":"Leo and Ana be in class.","correct":false,"errorWord":"be","correctWord":"are","errorType":"Forma sin conjugar","explanation":"«Be» es la forma base. Con un sujeto plural se conjuga: «are».","es":"Leo y Ana están en clase (verbo sin conjugar)."}],"clue":"and = plural","clueExplain":"dos nombres unidos con «and» son plural → are.","correctReason":"Dos personas unidas con «and» piden el plural «are».","hint":"Cuenta cuántas personas hay en el sujeto antes de elegir el verbo."},{"badge":"🙋 she → is","options":[{"text":"She is very funny.","correct":true,"es":"Ella es muy chistosa."},{"text":"She are very funny.","correct":false,"errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"«Are» es para you/we/they. Con «she» el to be es «is».","es":"Ella es muy chistosa (are con she)."},{"text":"She am very funny.","correct":false,"errorWord":"am","correctWord":"is","errorType":"Concordancia","explanation":"«Am» es solo para «I». Con «she» va «is».","es":"Ella es muy chistosa (am con she)."}],"clue":"she → is","clueExplain":"con he/she/it el verbo to be es is.","correctReason":"Con «she» el to be correcto es «is».","hint":"El sujeto es UNA persona (ella). ¿Qué forma de to be le toca?"},{"badge":"🚫 negativo","options":[{"text":"Ravi isn't the oldest.","correct":true,"es":"Ravi no es el mayor."},{"text":"Ravi not is the oldest.","correct":false,"errorWord":"not is","correctWord":"isn't","errorType":"Orden del negativo","explanation":"El «not» va DESPUÉS del verbo: is + not = isn't. Nunca antes.","es":"Ravi no es el mayor (negativo en orden invertido)."},{"text":"Ravi aren't the oldest.","correct":false,"errorWord":"aren't","correctWord":"isn't","errorType":"Concordancia","explanation":"Ravi es una persona (singular) → is; su negativo es «isn't».","es":"Ravi no es el mayor (negativo plural con sujeto singular)."}],"clue":"isn't = is + not","clueExplain":"el «not» se pega después del verbo to be.","correctReason":"«Isn't» niega correctamente: is + not, con sujeto singular.","hint":"Para negar, el «not» tiene un lugar fijo. Y ojo con el número del sujeto."},{"badge":"🚫 negativo plural","options":[{"text":"They aren't the same age.","correct":true,"es":"No tienen la misma edad."},{"text":"They isn't the same age.","correct":false,"errorWord":"isn't","correctWord":"aren't","errorType":"Concordancia","explanation":"«They» es plural → are; su negativo es «aren't».","es":"No tienen la misma edad (negativo singular con sujeto plural)."},{"text":"They not are the same age.","correct":false,"errorWord":"not are","correctWord":"aren't","errorType":"Orden del negativo","explanation":"El «not» va después del verbo: are + not = aren't.","es":"No tienen la misma edad (negativo en orden invertido)."}],"clue":"aren't = are + not","clueExplain":"el negativo plural: are + not, pegado tras el verbo.","correctReason":"«Aren't» es el negativo correcto para «they» (plural).","hint":"Sujeto plural + negación: revisa la forma Y el orden del «not»."},{"badge":"❓ pregunta","options":[{"text":"Are you new here?","correct":true,"es":"¿Eres nuevo aquí?"},{"text":"Is you new here?","correct":false,"errorWord":"Is","correctWord":"Are","errorType":"Concordancia","explanation":"Con «you» el to be es «are», también en preguntas: Are you…?","es":"¿Eres nuevo aquí? (is con you)."},{"text":"Am you new here?","correct":false,"errorWord":"Am","correctWord":"Are","errorType":"Concordancia","explanation":"«Am» es solo para «I». Con «you» la pregunta empieza con «Are».","es":"¿Eres nuevo aquí? (am con you)."}],"clue":"Are you…?","clueExplain":"con you, la pregunta empieza con Are.","correctReason":"La pregunta con «you» empieza correctamente con «Are».","hint":"Es una pregunta para TI (you). ¿Con qué forma de to be empieza?"},{"badge":"❓ everyone = singular","options":[{"text":"Is everyone friendly here?","correct":true,"es":"¿Todos son amables aquí?"},{"text":"Are everyone friendly here?","correct":false,"errorWord":"Are","correctWord":"Is","errorType":"Concordancia","explanation":"«Everyone» funciona como singular (cada uno) → «Is».","es":"¿Todos son amables aquí? (are con everyone)."},{"text":"Be everyone friendly here?","correct":false,"errorWord":"Be","correctWord":"Is","errorType":"Forma sin conjugar","explanation":"«Be» es la forma base, sin conjugar. La pregunta usa «Is».","es":"¿Todos son amables aquí? (verbo sin conjugar)."}],"clue":"everyone → is","clueExplain":"aunque hable de todos, «everyone» es gramaticalmente singular.","correctReason":"«Everyone» es singular, así que la pregunta empieza con «Is».","hint":"«Everyone» engaña: parece muchos, pero el inglés lo trata como UNO."},{"badge":"🙋 he → is","options":[{"text":"Don Beto is from town.","correct":true,"es":"Don Beto es del pueblo."},{"text":"Don Beto are from town.","correct":false,"errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"Don Beto = él (una persona) → «is».","es":"Don Beto es del pueblo (are con sujeto singular)."},{"text":"Don Beto am from town.","correct":false,"errorWord":"am","correctWord":"is","errorType":"Concordancia","explanation":"«Am» es solo para «I». Don Beto = he → «is».","es":"Don Beto es del pueblo (am con él)."}],"clue":"Don Beto = he","clueExplain":"un nombre de persona (él) usa is.","correctReason":"Don Beto es «he», y con he el to be es «is».","hint":"Cambia el nombre por un pronombre en tu mente. ¿Cuál le toca?"},{"badge":"🫵 you → are","options":[{"text":"You are my friend now.","correct":true,"es":"Ahora eres mi amigo."},{"text":"You is my friend now.","correct":false,"errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"Con «you» el to be es «are», siempre.","es":"Ahora eres mi amigo (is con you)."},{"text":"You am my friend now.","correct":false,"errorWord":"am","correctWord":"are","errorType":"Concordancia","explanation":"«Am» es solo para «I». Con «you» va «are».","es":"Ahora eres mi amigo (am con you)."}],"clue":"you → are","clueExplain":"con you el verbo to be es are.","correctReason":"Con «you» la única forma correcta es «are».","hint":"«You» tiene una sola pareja en el to be. ¿Cuál es?"},{"badge":"📦 it → is","options":[{"text":"It is on my wall.","correct":true,"es":"Está en mi pared."},{"text":"It are on my wall.","correct":false,"errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"«It» es singular (una cosa) → «is».","es":"Está en mi pared (are con it)."},{"text":"It be on my wall.","correct":false,"errorWord":"be","correctWord":"is","errorType":"Forma sin conjugar","explanation":"«Be» es la forma base. Con «it» se conjuga: «is».","es":"Está en mi pared (verbo sin conjugar)."}],"clue":"it → is","clueExplain":"it (una cosa) usa is.","correctReason":"Con «it» el to be correcto es «is».","hint":"El sujeto es una cosa. ¿Qué forma de to be usan las cosas?"},{"badge":"1️⃣ there is","options":[{"text":"There is a free seat.","correct":true,"es":"Hay un asiento libre."},{"text":"There are a free seat.","correct":false,"errorWord":"are","correctWord":"is","errorType":"Concordancia","explanation":"«A free seat» es UNA sola cosa → there is.","es":"Hay un asiento libre (plural con una sola cosa)."},{"text":"There be a free seat.","correct":false,"errorWord":"be","correctWord":"is","errorType":"Forma sin conjugar","explanation":"«Be» es la forma base. Aquí se conjuga: there is.","es":"Hay un asiento libre (verbo sin conjugar)."}],"clue":"a = uno","clueExplain":"«a» indica una sola cosa → there is.","correctReason":"«A» dice que hay UNA cosa: there is es correcto.","hint":"Mira la palabrita antes de «seat»: ¿cuántos asientos hay?"},{"badge":"🔢 there are","options":[{"text":"There are many friends here.","correct":true,"es":"Hay muchos amigos aquí."},{"text":"There is many friends here.","correct":false,"errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"«Many friends» es plural (varios) → there are.","es":"Hay muchos amigos aquí (singular con plural)."},{"text":"There am many friends here.","correct":false,"errorWord":"am","correctWord":"are","errorType":"Concordancia","explanation":"«Am» es solo para «I». Con plural va «are».","es":"Hay muchos amigos aquí (am en there is/are)."}],"clue":"many = varios","clueExplain":"«many» indica varios → there are.","correctReason":"«Many friends» es plural: there are es correcto.","hint":"«Many» te dice cuántos son. Elige el to be del número correcto."},{"badge":"👥 we → are","options":[{"text":"We are the same age.","correct":true,"es":"Tenemos la misma edad."},{"text":"We is the same age.","correct":false,"errorWord":"is","correctWord":"are","errorType":"Concordancia","explanation":"«We» es plural (nosotros) → «are».","es":"Tenemos la misma edad (is con we)."},{"text":"We be the same age.","correct":false,"errorWord":"be","correctWord":"are","errorType":"Forma sin conjugar","explanation":"«Be» es la forma base. Con «we» se conjuga: «are».","es":"Tenemos la misma edad (verbo sin conjugar)."}],"clue":"we → are","clueExplain":"nosotros somos varios → are.","correctReason":"Con «we» el to be correcto es «are».","hint":"¿Cuántas personas incluye «we»? El verbo debe estar de acuerdo."},{"badge":"❓ Am I…?","options":[{"text":"Am I in your class?","correct":true,"es":"¿Estoy en tu clase?"},{"text":"Is I in your class?","correct":false,"errorWord":"Is","correctWord":"Am","errorType":"Concordancia","explanation":"Con «I» el to be es «am», también en preguntas: Am I…?","es":"¿Estoy en tu clase? (is con I)."},{"text":"Are I in your class?","correct":false,"errorWord":"Are","correctWord":"Am","errorType":"Concordancia","explanation":"«Are» no va con «I». La pregunta correcta es «Am I…?».","es":"¿Estoy en tu clase? (are con I)."}],"clue":"Am I…?","clueExplain":"la pregunta con I empieza con Am.","correctReason":"«Am I…?» es la única pregunta correcta con «I».","hint":"Pregunta sobre quien habla (I). Solo una forma de to be le pertenece."},{"badge":"🚫 negativo plural","options":[{"text":"Lara and I aren't tall.","correct":true,"es":"Lara y yo no somos altos."},{"text":"Lara and I isn't tall.","correct":false,"errorWord":"isn't","correctWord":"aren't","errorType":"Concordancia","explanation":"«Lara and I» somos dos (plural) → are; su negativo es «aren't».","es":"Lara y yo no somos altos (negativo singular con plural)."},{"text":"Lara and I not are tall.","correct":false,"errorWord":"not are","correctWord":"aren't","errorType":"Orden del negativo","explanation":"El «not» va después del verbo: are + not = aren't.","es":"Lara y yo no somos altos (negativo en orden invertido)."}],"clue":"and = plural","clueExplain":"dos personas → are; el negativo es aren't.","correctReason":"Plural «are» + not = «aren't»: forma y orden correctos.","hint":"Dos personas y una negación: revisa número y el lugar del «not»."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('\\b'+escReg(o.errorWord)+'\\b'),'<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=70?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=70?'¡Muy bien! Sigue practicando. 💪'
            :'Buen esfuerzo. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
