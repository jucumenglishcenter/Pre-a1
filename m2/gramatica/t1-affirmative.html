<!-- ═══ PLANTILLA RESUMEN DE GRAMÁTICA (con nota · repaso) — JUCUM English Center ═══
     1) Nivel en <div id="screen" data-level="pre-a1|a1|a2"> (A2 arranca en inglés).
     2) Edita MAT + el bloque CONTENIDO (STEPS / BUILD / SUMMARY / BADGE). Todo es BILINGÜE {es,en}.
        · El botón ES/EN cambia TODO el material (explicación + indicaciones + auto-chequeos).
        · REGLA «el español se queda en español»: cuando el texto MENCIONA una palabra española o da un
          EJEMPLO en español (p. ej. el paso 1 «Repaso en Español»: «Él», «Ella», «Nosotros», «Juan… Él…»),
          en el lado en:'' repite esas palabras/ejemplos TAL CUAL en español; solo traduce la prosa que los rodea.
        · 'tr' (botón 🌐 traducción por pregunta): ponlo SOLO en auto-chequeos donde una oración en inglés

          no hay ninguno). Sí aplica en temas como To be / There is_are con frases más largas. Sintaxis:
          { q:{...}, opts:{...}, correct:0, fb:{...}, tr:{es:'significado en español',en:'meaning in English'} }
     3) Deja el conector antes de </body>. catalogo.json → type:"summary".
     El motor (debajo de "FIN DEL MOTOR") no se toca. ═══ -->

<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Present Simple — Afirmativo',en:'Present Simple — Affirmative'}, reportId:'sum-afirmativo' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">El presente habla de lo que haces <b>siempre, todos los días o por costumbre</b>: «<b>como</b>», «<b>juegas</b>», «<b>trabaja</b>».</div>
        <div class="art-hero"><div class="art-box"><div class="word">como</div><div class="role">Yo</div><div class="desc">«Yo como a la una.»</div></div><div class="art-box"><div class="word">juega</div><div class="role">Él / Ella</div><div class="desc">«Ella juega fútbol.»</div></div></div>
        ${ii('🔁','Sirve para rutinas y hábitos: «Me levanto a las 7», «Estudio todos los días».')}
        ${ii('✅','También para hechos: «El sol sale por el este».')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «Trabajo de lunes a viernes y los domingos descanso». Todo eso es presente simple.</div>`,
      en:`<div class="gdesc">The present talks about what you do <b>always, every day or by habit</b>: «<b>como</b>», «<b>juegas</b>», «<b>trabaja</b>».</div>
        <div class="art-hero"><div class="art-box"><div class="word">como</div><div class="role">Yo</div><div class="desc">«Yo como a la una.»</div></div><div class="art-box"><div class="word">juega</div><div class="role">Él / Ella</div><div class="desc">«Ella juega fútbol.»</div></div></div>
        ${ii('🔁','It works for routines and habits: «Me levanto a las 7», «Estudio todos los días».')}
        ${ii('✅','Also for facts: «El sol sale por el este».')}
        <div class="gnote life">🌎 <b>From your life:</b> «Trabajo de lunes a viernes y los domingos descanso». All of that is present simple.</div>`
    },
    checks:[
      { q:{es:'El presente simple habla de:',en:'The present simple talks about:'}, opts:{es:['Rutinas y hábitos','Algo de hace 10 años'],en:['Routines and habits','Something 10 years ago']}, correct:0, fb:{ why:{es:'Lo que haces normalmente.',en:'What you normally do.'}, tip:{es:'rutina',en:'routine'}} },
      { q:{es:'«Yo ___ a la una.» (comer):',en:'«Yo ___ a la una.» (eat):'}, opts:{es:['como','come'],en:['como','come']}, correct:0, fb:{ why:{es:'Con «yo» → como.',en:'With «yo» → como.'}, tip:{es:'yo → como',en:'yo → como'}} },
      { q:{es:'«Ella ___ fútbol.» (jugar):',en:'«Ella ___ fútbol.» (play):'}, opts:{es:['juega','juego'],en:['juega','juego']}, correct:0, fb:{ why:{es:'Con «ella» → juega.',en:'With «ella» → juega.'}, tip:{es:'ella → juega',en:'ella → juega'}} },
      { q:{es:'«El sol sale por el este» es:',en:'«El sol sale por el este» is:'}, opts:{es:['Un hecho','Un plan'],en:['A fact','A plan']}, correct:0, fb:{ why:{es:'Es algo que siempre pasa.',en:'It always happens.'}, tip:{es:'hecho',en:'fact'}} },
      { q:{es:'«Estudio todos los días» indica:',en:'«Estudio todos los días» indicates:'}, opts:{es:['Un hábito','Algo de una sola vez'],en:['A habit','A one-time event']}, correct:0, fb:{ why:{es:'«todos los días» = costumbre.',en:'«every day» = habit.'}, tip:{es:'hábito',en:'habit'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés también usa el presente para rutinas. Con la mayoría de personas, el verbo va en su <b>forma base</b> (como en español, sin cambios raros).</div>
        <table class="dtab"><tr><th>Persona</th><th>Verbo</th><th>Ejemplo</th></tr>
          <tr><td>I / You / We / They</td><td class="en">base</td><td>I eat · They play</td></tr>
        </table>
        ${eg('I <span class="tag s">eat</span> rice every day.','Como arroz todos los días.','ok')}
        ${eg('They <span class="tag s">play</span> football.','Ellos juegan fútbol.','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos usan el presente para hábitos y hechos.</li><li>Con I/you/we/they el verbo casi no cambia (eat, play, work).</li><li>El orden es el mismo: sujeto + verbo + resto.</li></ul>
        <div class="gnote">👍 I/You/We/They + verbo base. Lo único nuevo es la «-s» de he/she/it (siguiente paso).</div>`,
      en:`<div class="gdesc">English also uses the present for routines. With most persons, the verb is in its <b>base form</b> (like Spanish, no odd changes).</div>
        <table class="dtab"><tr><th>Person</th><th>Verb</th><th>Example</th></tr>
          <tr><td>I / You / We / They</td><td class="en">base</td><td>I eat · They play</td></tr>
        </table>
        ${eg('I <span class="tag s">eat</span> rice every day.','I eat rice every day.','ok')}
        ${eg('They <span class="tag s">play</span> football.','They play football.','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both use the present for habits and facts.</li><li>With I/you/we/they the verb barely changes (eat, play, work).</li><li>The order is the same: subject + verb + rest.</li></ul>
        <div class="gnote">👍 I/You/We/They + base verb. The only new thing is the «-s» for he/she/it (next step).</div>`
    },
    checks:[
      { q:{es:'«I ___ coffee every morning.»',en:'«I ___ coffee every morning.»'}, opts:{es:['drink','drinks'],en:['drink','drinks']}, correct:0, tr:{es:'Tomo café',en:'I drink coffee'}, fb:{ why:{es:'Con «I» → base (drink).',en:'With «I» → base (drink).'}, ex:{es:'I drink coffee → Tomo café',en:'I drink coffee'}, tip:{es:'I → base',en:'I → base'}} },
      { q:{es:'«They ___ in Lima.»',en:'«They ___ in Lima.»'}, opts:{es:['live','lives'],en:['live','lives']}, correct:0, tr:{es:'Viven en Lima',en:'They live in Lima'}, fb:{ why:{es:'Con «they» → base (live).',en:'With «they» → base (live).'}, ex:{es:'They live in Lima → Viven en Lima',en:'They live in Lima'}, tip:{es:'they → base',en:'they → base'}} },
      { q:{es:'«We ___ English.»',en:'«We ___ English.»'}, opts:{es:['study','studies'],en:['study','studies']}, correct:0, tr:{es:'Estudiamos inglés',en:'We study English'}, fb:{ why:{es:'Con «we» → base (study).',en:'With «we» → base (study).'}, ex:{es:'We study English → Estudiamos inglés',en:'We study English'}, tip:{es:'we → base',en:'we → base'}} },
      { q:{es:'«You ___ very fast.»',en:'«You ___ very fast.»'}, opts:{es:['run','runs'],en:['run','runs']}, correct:0, tr:{es:'Corres rápido',en:'You run fast'}, fb:{ why:{es:'Con «you» → base (run).',en:'With «you» → base (run).'}, ex:{es:'You run fast → Corres rápido',en:'You run fast'}, tip:{es:'you → base',en:'you → base'}} },
      { q:{es:'El orden de la oración es:',en:'The sentence order is:'}, opts:{es:['Sujeto + verbo + resto','Verbo + sujeto'],en:['Subject + verb + rest','Verb + subject']}, correct:0, fb:{ why:{es:'I eat rice.',en:'I eat rice.'}, tip:{es:'S + V + resto',en:'S + V + rest'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">El cambio estrella del inglés: con <b>he / she / it</b> el verbo lleva una <b>-s</b> al final.</div>
        <table class="dtab"><tr><th>Persona</th><th>Verbo</th><th>Ejemplo</th></tr>
          <tr><td>He / She / It</td><td class="en">verbo + s</td><td>He eats · She plays</td></tr>
        </table>
        <div class="sec-label">Reglas de ortografía de la «-s»</div>
        ${ii('🔤','Casi siempre solo agregas <b>-s</b>: play → plays, eat → eats.')}
        ${ii('➕','Después de ch, sh, x, s, o → agregas <b>-es</b>: watch → watch<b>es</b>, go → go<b>es</b>, do → do<b>es</b>.')}
        ${ii('🔁','Consonante + y → la y cambia a <b>-ies</b>: study → stud<b>ies</b>, fly → fl<b>ies</b>.')}
        ${ii('⭐','Irregular clave: have → <b>has</b>.')}
        ${eg('She <span class="tag s">plays</span> the guitar.','Ella toca la guitarra. (she → plays)','ok')}
        ${eg('He play football.','Falta la «-s»: «He <b>plays</b> football».','bad')}
        <div class="gnote">📍 Regla de oro: He / She / It → verbo con <b>-s</b>. Las demás personas, verbo base.</div>`,
      en:`<div class="gdesc">English's star change: with <b>he / she / it</b> the verb takes an <b>-s</b> at the end.</div>
        <table class="dtab"><tr><th>Person</th><th>Verb</th><th>Example</th></tr>
          <tr><td>He / She / It</td><td class="en">verb + s</td><td>He eats · She plays</td></tr>
        </table>
        <div class="sec-label">Spelling rules for the «-s»</div>
        ${ii('🔤','Most of the time just add <b>-s</b>: play → plays, eat → eats.')}
        ${ii('➕','After ch, sh, x, s, o → add <b>-es</b>: watch → watch<b>es</b>, go → go<b>es</b>, do → do<b>es</b>.')}
        ${ii('🔁','Consonant + y → the y changes to <b>-ies</b>: study → stud<b>ies</b>, fly → fl<b>ies</b>.')}
        ${ii('⭐','Key irregular: have → <b>has</b>.')}
        ${eg('She <span class="tag s">plays</span> the guitar.','She plays the guitar. (she → plays)','ok')}
        ${eg('He play football.','The «-s» is missing: «He <b>plays</b> football».','bad')}
        <div class="gnote">📍 Golden rule: He / She / It → verb with <b>-s</b>. Other persons, base verb.</div>`
    },
    checks:[
      { q:{es:'«She ___ in a bank.» (trabajar):',en:'«She ___ in a bank.» (work):'}, opts:{es:['works','work'],en:['works','work']}, correct:0, tr:{es:'Ella trabaja',en:'She works'}, fb:{ why:{es:'she → verbo + s.',en:'she → verb + s.'}, ex:{es:'She works → Ella trabaja',en:'She works'}, tip:{es:'she → -s',en:'she → -s'}} },
      { q:{es:'«He ___ TV every night.» (watch):',en:'«He ___ TV every night.» (watch):'}, opts:{es:['watches','watchs'],en:['watches','watchs']}, correct:0, tr:{es:'Él ve tele',en:'He watches TV'}, fb:{ why:{es:'Después de «ch» → -es.',en:'After «ch» → -es.'}, ex:{es:'He watches TV → Él ve tele',en:'He watches TV'}, tip:{es:'ch → -es',en:'ch → -es'}} },
      { q:{es:'«She ___ math.» (study):',en:'«She ___ math.» (study):'}, opts:{es:['studies','studys'],en:['studies','studys']}, correct:0, tr:{es:'Ella estudia',en:'She studies'}, fb:{ why:{es:'Consonante + y → -ies.',en:'Consonant + y → -ies.'}, ex:{es:'She studies → Ella estudia',en:'She studies'}, tip:{es:'y → -ies',en:'y → -ies'}} },
      { q:{es:'«He ___ a sister.» (have):',en:'«He ___ a sister.» (have):'}, opts:{es:['has','haves'],en:['has','haves']}, correct:0, tr:{es:'Él tiene una hermana',en:'He has a sister'}, fb:{ why:{es:'have → has (irregular).',en:'have → has (irregular).'}, ex:{es:'He has a sister → Él tiene una hermana',en:'He has a sister'}, tip:{es:'have → has',en:'have → has'}} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:['She plays tennis','She play tennis'],en:['She plays tennis','She play tennis']}, correct:0, fb:{ why:{es:'she → plays (con -s).',en:'she → plays (with -s).'}, ex:{es:'She plays tennis → Ella juega tenis',en:'She plays tennis'}, tip:{es:'she → -s',en:'she → -s'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">La estructura y el truco de la «-s»:</div>
        <div class="fbox"><div class="frm"><span class="pill s">Sujeto</span><span class="plus">+</span><span class="pill v">verbo (+s si he/she/it)</span><span class="plus">+</span><span class="pill o">resto</span></div><div class="fex"><span class="s">She</span> <span class="v">eats</span> <span class="o">breakfast</span>. — Ella desayuna.</div></div>
        ${ii('👉','<b>Tip 1 — La regla de oro:</b> solo He / She / It llevan la «-s». Lo demás, verbo base.')}
        ${ii('🔤','<b>Tip 2 — Ortografía:</b> +s normal · +es tras ch/sh/x/s/o · y → ies tras consonante.')}
        ${ii('⭐','<b>Tip 3 — Memoriza:</b> have → has · do → does · go → goes.')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «He go to school» → ✅ «He <b>goes</b> to school».<br>❌ «She have a cat» → ✅ «She <b>has</b> a cat».</p></div>`,
      en:`<div class="gdesc">The structure and the «-s» trick:</div>
        <div class="fbox"><div class="frm"><span class="pill s">Subject</span><span class="plus">+</span><span class="pill v">verb (+s if he/she/it)</span><span class="plus">+</span><span class="pill o">rest</span></div><div class="fex"><span class="s">She</span> <span class="v">eats</span> <span class="o">breakfast</span>. — Ella desayuna.</div></div>
        ${ii('👉','<b>Tip 1 — The golden rule:</b> only He / She / It take the «-s». Everything else, base verb.')}
        ${ii('🔤','<b>Tip 2 — Spelling:</b> +s normal · +es after ch/sh/x/s/o · y → ies after a consonant.')}
        ${ii('⭐','<b>Tip 3 — Memorize:</b> have → has · do → does · go → goes.')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «He go to school» → ✅ «He <b>goes</b> to school».<br>❌ «She have a cat» → ✅ «She <b>has</b> a cat».</p></div>`
    },
    checks:[
      { q:{es:'«My dad ___ to work by bus.» (go):',en:'«My dad ___ to work by bus.» (go):'}, opts:{es:['goes','go'],en:['goes','go']}, correct:0, tr:{es:'Va al trabajo',en:'He goes to work'}, fb:{ why:{es:'go → goes (tras «o»).',en:'go → goes (after «o»).'}, ex:{es:'He goes to work → Va al trabajo',en:'He goes to work'}, tip:{es:'go → goes',en:'go → goes'}} },
      { q:{es:'«We ___ dinner at 8.» (have):',en:'«We ___ dinner at 8.» (have):'}, opts:{es:['have','has'],en:['have','has']}, correct:0, tr:{es:'Cenamos',en:'We have dinner'}, fb:{ why:{es:'Con «we» → have (base).',en:'With «we» → have (base).'}, ex:{es:'We have dinner → Cenamos',en:'We have dinner'}, tip:{es:'we → have',en:'we → have'}} },
      { q:{es:'«She ___ her homework.» (do):',en:'«She ___ her homework.» (do):'}, opts:{es:['does','do'],en:['does','do']}, correct:0, tr:{es:'Hace su tarea',en:'She does her homework'}, fb:{ why:{es:'do → does (she).',en:'do → does (she).'}, ex:{es:'She does her homework → Hace su tarea',en:'She does her homework'}, tip:{es:'do → does',en:'do → does'}} },
      { q:{es:'«I ___ to music.» (listen):',en:'«I ___ to music.» (listen):'}, opts:{es:['listen','listens'],en:['listen','listens']}, correct:0, tr:{es:'Escucho música',en:'I listen to music'}, fb:{ why:{es:'Con «I» → base.',en:'With «I» → base.'}, ex:{es:'I listen to music → Escucho música',en:'I listen to music'}, tip:{es:'I → base',en:'I → base'}} },
      { q:{es:'«The baby ___ a lot.» (cry):',en:'«The baby ___ a lot.» (cry):'}, opts:{es:['cries','crys'],en:['cries','crys']}, correct:0, tr:{es:'El bebé llora',en:'The baby cries'}, fb:{ why:{es:'Consonante + y → -ies.',en:'Consonant + y → -ies.'}, ex:{es:'The baby cries → El bebé llora',en:'The baby cries'}, tip:{es:'y → -ies',en:'y → -ies'}} }
    ] },
  { icon:'✨', title:{es:'Práctica Final',en:'Final Practice'}, builder:true,
    html:{
      es:`<div class="gdesc">Junta todo: I/you/we/they + verbo base · he/she/it + verbo con «-s». Arma la oración.</div>
        <div class="cboxes"><div class="cbox s"><span class="cl">Base</span><span class="cv">I · You · We · They</span></div><div class="cbox o"><span class="cl">+ s</span><span class="cv">He · She · It</span></div><div class="cbox p"><span class="cl">Irregulares</span><span class="cv">have→has · do→does · go→goes</span></div></div>
        <div class="sec-label">Las reglas en una oración</div>
        ${eg('I <span class="tag s">work</span> every day.','Trabajo todos los días. (I → base)','ok')}
        ${eg('She <span class="tag s">works</span> in a shop.','Ella trabaja en una tienda. (she → -s)','ok')}
        ${eg('He <b style="color:#7B1FA2">has</b> two dogs.','Él tiene dos perros. (have → has)','ok')}

function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';
