const STORYDATA = {"1":{"sTitle":"My School","sTitleEs":"Mi escuela","dTitle":"At School","dTitleEs":"En la escuela","paras":[[["My name is Pablo.","Me llamo Pablo."],["I go to a nice school.","Voy a una escuela linda."],["The school is big and bright.","La escuela es grande y luminosa."],["I like it a lot.","Me gusta mucho."],["I go there every day.","Voy ahí todos los días."]],[["My classroom is on the first floor.","Mi salón está en el primer piso."],["There are many tables and chairs.","Hay muchas mesas y sillas."],["My book is on my desk.","Mi libro está sobre mi escritorio."],["My marker is next to it.","Mi marcador está al lado."],["My bag is under my chair.","Mi mochila está bajo mi silla."]],[["Right now, my teacher is talking.","Ahora mismo, mi profesora está hablando."],["She is writing on the board.","Está escribiendo en la pizarra."],["We are listening to her.","La estamos escuchando."],["Everyone is quiet.","Todos están callados."],["I am taking notes in my book.","Estoy tomando notas en mi libro."]],[["After class, I clean my desk.","Después de clase, limpio mi escritorio."],["I put my book in my bag.","Pongo mi libro en mi mochila."],["I am happy at school.","Estoy feliz en la escuela."],["My friends are here too.","Mis amigos también están aquí."],["We talk and laugh together.","Hablamos y reímos juntos."]],[["At the end of the day, I walk home.","Al final del día, camino a casa."],["My house is near the school.","Mi casa está cerca de la escuela."],["I am a little tired, but it was a good day.","Estoy un poco cansado, pero fue un buen día."],["Tomorrow, I am coming back.","Mañana, vuelvo otra vez."]]],"dlg":[["Ben","Hi, Mia! Are you at school now?","¡Hola, Mia! ¿Estás en la escuela ahora?"],["Mia","Yes, I am. I am in my classroom.","Sí, lo estoy. Estoy en mi salón."],["Ben","Is this your book on the table?","¿Es este tu libro sobre la mesa?"],["Mia","Yes, that is my book. It is for class.","Sí, ese es mi libro. Es para la clase."],["Ben","Where is your marker? I need one.","¿Dónde está tu marcador? Necesito uno."],["Mia","My marker is in my bag. Here you go.","Mi marcador está en mi mochila. Aquí tienes."],["Ben","Thank you. Is the teacher here?","Gracias. ¿Está aquí la profesora?"],["Mia","No, she is not. She is coming now.","No, no está. Está viniendo ahora."],["Ben","What are you doing right now?","¿Qué estás haciendo ahora mismo?"],["Mia","I am writing in my book. It is easy.","Estoy escribiendo en mi libro. Es fácil."],["Ben","The school is big. I like it.","La escuela es grande. Me gusta."],["Mia","Me too. Our classroom is my favorite.","Yo también. Nuestro salón es mi favorito."],["Ben","Is your house near the school?","¿Está tu casa cerca de la escuela?"],["Mia","Yes, my house is very close.","Sí, mi casa está muy cerca."],["Ben","Are you walking home today?","¿Caminas a casa hoy?"],["Mia","No, my mom is coming for me.","No, mi mamá viene por mí."],["Ben","Look, the teacher is here now.","Mira, la profesora ya está aquí."],["Mia","Yes. She is opening the door.","Sí. Está abriendo la puerta."],["Ben","Where is my book? I need it.","¿Dónde está mi libro? Lo necesito."],["Mia","It is on your chair, Ben.","Está en tu silla, Ben."],["Ben","Oh, thank you. You are kind.","Ah, gracias. Eres amable."],["Mia","Of course. Now, let us sit down.","Claro. Ahora, sentémonos."],["Ben","Good idea. The class is starting.","Buena idea. La clase está empezando."],["Mia","Yes! I am ready to learn.","¡Sí! Estoy lista para aprender."]],"datos":{"1":"<div class=\"frase\">«There are many tables and chairs»</div><div class=\"lit\">palabra por palabra: “ahí son muchas mesas y sillas”</div><div><b>There are</b> = “hay” (varios) · <b>There is</b> = “hay” (uno).</div>","2":"<div class=\"frase\">«I am taking notes»</div><div class=\"lit\">palabra por palabra: “estoy tomando notas”</div><div><b>am/is/are + -ing</b> = está pasando AHORA MISMO. Este módulo entero vive en ese tiempo.</div>"}},"2":{"sTitle":"At Home","sTitleEs":"En casa","dTitle":"My Things","dTitleEs":"Mis cosas","paras":[[["I am at home now.","Estoy en casa ahora."],["My house is small but warm.","Mi casa es pequeña pero cálida."],["I am in my room.","Estoy en mi cuarto."],["It is my favorite place.","Es mi lugar favorito."],["I feel happy here.","Me siento feliz aquí."]],[["There are many objects in my room.","Hay muchos objetos en mi cuarto."],["My key is on the table.","Mi llave está sobre la mesa."],["My book is on the bed.","Mi libro está sobre la cama."],["My game is on the floor.","Mi juego está en el piso."],["My marker is by the window.","Mi marcador está junto a la ventana."]],[["Right now, I am painting a picture.","Ahora mismo, estoy pintando un cuadro."],["I am using green paint.","Estoy usando pintura verde."],["The paint is on my hands.","La pintura está en mis manos."],["It is a little messy.","Está un poco sucio."],["But I am having fun.","Pero me estoy divirtiendo."]],[["Later, I am writing an email to my friend.","Más tarde, escribo un correo a mi amiga."],["I am telling her about my day.","Le cuento sobre mi día."],["She is far away.","Ella está lejos."],["I miss her.","La extraño."],["I hope she writes back.","Espero que me responda."]],[["At night, I put my things away.","Por la noche, guardo mis cosas."],["My key goes by the door.","Mi llave va junto a la puerta."],["My book goes on the shelf.","Mi libro va en el estante."],["Then I rest.","Luego descanso."],["It is a good day at home.","Es un buen día en casa."]]],"dlg":[["Tom","Ana, your desk is very messy.","Ana, tu escritorio está muy desordenado."],["Ana","I know. I am cleaning it now.","Lo sé. Lo estoy limpiando ahora."],["Tom","What is this small object?","¿Qué es este objeto pequeño?"],["Ana","Let me see. It is my house key.","Déjame ver. Es la llave de mi casa."],["Tom","Oh, here you go. And this book?","Ah, toma. ¿Y este libro?"],["Ana","That book is mine. It is for class.","Ese libro es mío. Es para la clase."],["Tom","Is this game yours too?","¿Este juego también es tuyo?"],["Ana","No, it is not mine. It is Leo's.","No, no es mío. Es de Leo."],["Tom","Okay. What is in your hand now?","Bien. ¿Qué tienes en la mano ahora?"],["Ana","It is my marker. I am using it.","Es mi marcador. Lo estoy usando."],["Tom","What are you drawing?","¿Qué estás dibujando?"],["Ana","I am drawing a happy face.","Estoy dibujando una cara feliz."],["Tom","It is nice. You draw well.","Está linda. Dibujas bien."],["Ana","Thank you! Do you want a marker?","¡Gracias! ¿Quieres un marcador?"],["Tom","Yes, please. Mine is at home.","Sí, por favor. El mío está en casa."],["Ana","Here, this red marker is for you.","Toma, este marcador rojo es para ti."],["Tom","Thank you, Ana. You are kind.","Gracias, Ana. Eres amable."],["Ana","Now my desk is clean again.","Ahora mi escritorio está limpio otra vez."],["Tom","Good. Where are your keys?","Bien. ¿Dónde están tus llaves?"],["Ana","They are right here, in my bag.","Están aquí mismo, en mi mochila."],["Tom","Great. Are you ready for class?","Genial. ¿Estás lista para la clase?"],["Ana","Yes, I am. My things are ready.","Sí, lo estoy. Mis cosas están listas."],["Tom","Then let us go. It is time.","Entonces vamos. Es la hora."],["Ana","Okay! I am coming with you.","¡Bien! Voy contigo."]],"datos":{"2":"<div class=\"frase\">«I am painting a picture»</div><div class=\"lit\">palabra por palabra: “estoy pintando una pintura”</div><div>Otra vez el “ahora”: am + -ing. <b>paint a picture</b> = hacer un dibujo o cuadro.</div>","4":"<div class=\"frase\">«I put my things away»</div><div class=\"lit\">palabra por palabra: “pongo mis cosas lejos”</div><div><b>put away</b> = guardar en su sitio.</div>"}},"3":{"sTitle":"What Is Everyone Doing?","sTitleEs":"¿Qué está haciendo cada uno?","dTitle":"What Are You Doing?","dTitleEs":"¿Qué estás haciendo?","paras":[[["It is afternoon at school.","Es la tarde en la escuela."],["My group of friends is in the art room.","Mi grupo de amigos está en el salón de arte."],["We are not sitting still.","No estamos quietos."],["We are all busy.","Todos estamos ocupados."],["Everyone is making something.","Cada uno está haciendo algo."]],[["Ana is painting a big face.","Ana está pintando una cara grande."],["She is using bright paint.","Está usando pintura brillante."],["Tom is drawing with a marker.","Tom está dibujando con un marcador."],["He is making a game.","Está haciendo un juego."],["They are working hard.","Están trabajando duro."]],[["I am not painting today.","Hoy no estoy pintando."],["I am reading my book.","Estoy leyendo mi libro."],["It is a good story.","Es una buena historia."],["I am learning new words.","Estoy aprendiendo palabras nuevas."],["The book is about a school.","El libro trata de una escuela."]],[["The teacher is walking around the room.","La profesora está caminando por el salón."],["She is helping the group.","Está ayudando al grupo."],["She is asking us questions.","Nos está haciendo preguntas."],["We are answering her.","Le estamos respondiendo."],["She likes our work.","Le gusta nuestro trabajo."]],[["At the end, we clean the room.","Al final, limpiamos el salón."],["We put the paint and the markers away.","Guardamos la pintura y los marcadores."],["Then we go home.","Luego vamos a casa."],["We are tired but happy.","Estamos cansados pero felices."],["It was a busy day.","Fue un día ocupado."]]],"dlg":[["Lia","Hi, Sam. What are you doing?","Hola, Sam. ¿Qué estás haciendo?"],["Sam","I am painting a small picture.","Estoy pintando un cuadro pequeño."],["Lia","Are you using red paint?","¿Estás usando pintura roja?"],["Sam","No, I am not. I am using blue.","No. Estoy usando azul."],["Lia","It is nice. Is it for school?","Está bonito. ¿Es para la escuela?"],["Sam","Yes, it is for my class.","Sí, es para mi clase."],["Lia","What is the picture about?","¿De qué trata el cuadro?"],["Sam","It is a tree and a house.","Es un árbol y una casa."],["Lia","Where is your marker?","¿Dónde está tu marcador?"],["Sam","It is here, next to my book.","Está aquí, al lado de mi libro."],["Lia","Can I see your picture?","¿Puedo ver tu cuadro?"],["Sam","Of course. I am holding it up.","Claro. Lo estoy levantando."],["Lia","I love it! You are a good artist.","¡Me encanta! Eres un buen artista."],["Sam","Thank you. Now I am cleaning up.","Gracias. Ahora estoy limpiando."],["Lia","Is your group still painting?","¿Tu grupo sigue pintando?"],["Sam","Yes, they are. They are very busy.","Sí. Están muy ocupados."],["Lia","What is Ana doing now?","¿Qué está haciendo Ana ahora?"],["Sam","She is painting a big face.","Está pintando una cara grande."],["Lia","And Tom? Is he painting too?","¿Y Tom? ¿También está pintando?"],["Sam","No, he is not. He is drawing.","No. Él está dibujando."],["Lia","Are you using my marker?","¿Estás usando mi marcador?"],["Sam","No, this marker is mine.","No, este marcador es mío."],["Lia","Okay. The room looks nice.","Bien. El salón se ve lindo."],["Sam","Yes. Our class is doing great work.","Sí. Nuestra clase hace buen trabajo."]],"datos":{"0":"<div class=\"frase\">«We are not sitting still»</div><div class=\"lit\">palabra por palabra: “no estamos sentados quietos”</div><div><b>still</b> aquí = quieto: sit still = quedarse quieto. (También significa “todavía” en otras frases.)</div>","3":"<div class=\"frase\">«The teacher is walking around the room»</div><div class=\"lit\">palabra por palabra: “camina alrededor del salón”</div><div><b>around</b> = por todos lados, dando vueltas: walk around, look around.</div>"}},"4":{"sTitle":"A Good Question","sTitleEs":"Una buena pregunta","dTitle":"A Question About Work","dTitleEs":"Una pregunta sobre el trabajo","paras":[[["My sister has a question. She asks me about school. Why do we go to school? she says. It is a good question. I want to help her.","Mi hermana tiene una pregunta. Me pregunta sobre la escuela. \"¿Por qué vamos a la escuela?\", dice. Es una buena pregunta. Quiero ayudarla."]],[["I think about the reason.","Pienso en la razón."],["School is part of our education.","La escuela es parte de nuestra educación."],["We read books.","Leemos libros."],["We learn many things every day.","Aprendemos muchas cosas cada día."],["Each day, we know more.","Cada día sabemos más."]],[["At school, you learn for your future, I say.","\"En la escuela, aprendes para tu futuro\", digo."],["One day, you will have a job.","\"Un día, tendrás un trabajo."],["Your education will help you.","Tu educación te ayudará."],["It opens many doors.","Te abre muchas puertas.\""]],[["My sister is listening to me.","Mi hermana me está escuchando."],["She is thinking about my words.","Está pensando en mis palabras."],["Now she is smiling.","Ahora está sonriendo."],["She likes the answer.","Le gusta la respuesta."],["She nods her head.","Asiente con la cabeza."]],[["School is good, she says. I like to learn. That is the best reason of all. I am proud of her. We hug and go home.","\"La escuela es buena\", dice. \"Me gusta aprender.\" Esa es la mejor razón de todas. Estoy orgulloso de ella. Nos abrazamos y vamos a casa."]]],"dlg":[["Eva","Leo, can I ask you a question?","Leo, ¿puedo hacerte una pregunta?"],["Leo","Yes, of course. What is it?","Sí, claro. ¿Cuál es?"],["Eva","Is your new job good?","¿Es bueno tu nuevo trabajo?"],["Leo","Yes, it is. I like it a lot.","Sí, lo es. Me gusta mucho."],["Eva","What do you do there?","¿Qué haces ahí?"],["Leo","I work in education. I teach kids.","Trabajo en educación. Enseño a niños."],["Eva","Oh, that is a great job!","¡Ah, ese es un gran trabajo!"],["Leo","I think so. I like to teach.","Eso creo. Me gusta enseñar."],["Eva","What are you doing right now?","¿Qué estás haciendo ahora mismo?"],["Leo","I am writing an email.","Estoy escribiendo un correo."],["Eva","Is the email for your boss?","¿Es el correo para tu jefe?"],["Leo","No, it is not. It is for a friend.","No. Es para un amigo."],["Eva","Do you work with a group?","¿Trabajas con un grupo?"],["Leo","Yes, my group is very kind.","Sí, mi grupo es muy amable."],["Eva","That is a good reason to stay.","Esa es una buena razón para quedarte."],["Leo","I think so too. The job is fun.","Yo también lo creo. El trabajo es divertido."],["Eva","Do the kids ask many questions?","¿Los niños hacen muchas preguntas?"],["Leo","Yes, and I love their questions.","Sí, y me encantan sus preguntas."],["Eva","Why do you like teaching so much?","¿Por qué te gusta tanto enseñar?"],["Leo","Because education is important to me.","Porque la educación es importante para mí."],["Eva","Is your office near your house?","¿Está tu oficina cerca de tu casa?"],["Leo","Yes, it is close. That is nice.","Sí, está cerca. Eso es bueno."],["Eva","Thank you for the answers, Leo.","Gracias por las respuestas, Leo."],["Leo","Of course. Ask me anytime.","Claro. Pregúntame cuando quieras."]],"datos":{"2":"<div class=\"frase\">«It opens many doors»</div><div class=\"lit\">palabra por palabra: “abre muchas puertas”</div><div>¡Esta sí se traduce directo! La educación “abre puertas” igual que en español. 😊</div>","3":"<div class=\"frase\">«She is listening to me»</div><div class=\"lit\">palabra por palabra: “está escuchando A mí”</div><div><b>listen</b> siempre lleva <b>to</b>: listen to music, listen to me.</div>"}}};

function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; const want=(typeof voice!=='undefined'&&voice==='GB')?'en-GB':'en-US'; const pref=['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Michelle','Microsoft Ana','Samantha','Google UK English Female','Microsoft Libby','Microsoft Sonia','Daniel']; const en=vs.filter(v=>v.lang&&v.lang.indexOf('en')===0); const pool=en.filter(v=>v.lang===want).concat(en); for(const p of pref){ const hit=pool.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } return pool[0]||null; }catch(e){ return null; } }

function setBtns(){ const all=gPlaying&&gScope==='all'; const pa=document.getElementById('playAll');

function startRange(st,end,scope){ if(gScope!==scope || gi<st || gi>=end) gi=st; gEnd=end; gScope=scope; gPlaying=true; setBtns(); step(); }

function playPara(pi){ const idxs=ALL.map((a,k)=>a.pi===pi?k:-1).filter(k=>k>=0); if(gPlaying&&gScope==='p'+pi){ pausePlay(); return; } startRange(idxs[0],idxs[idxs.length-1]+1,'p'+pi); }
function pausePlay(){ gPlaying=false; try{speechSynthesis.cancel();}catch(e){} setBtns(); }
function step(){ if(!gPlaying) return;
  if(gi>=gEnd){ gPlaying=false; if(gScope==='all') gi=0; setBtns(); clearHl(); toast(info==='es'?'✓ Fin del audio':'✓ End of audio'); return; }
  const {pi,si}=ALL[gi]; clearHl(); const para=document.getElementById('p'+pi); para.classList.add('reading');
  const se=document.getElementById('s'+pi+'_'+si); if(se)se.classList.add('read');
  const ee=document.getElementById('e'+pi+'_'+si); if(ee)ee.classList.add('read');

}

  const m=Math.floor(secs/60); document.getElementById('eTime').textContent=m+':'+String(secs%60).padStart(2,'0'); document.getElementById('eXp').textContent='+'+(m>=30?15:m>=20?10:m>=10?5:0);

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var want=FX.cfg.accent==="GB"?"en-GB":"en-US";
    var pref=["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Google UK English Female","Microsoft Libby","Microsoft Sonia","Daniel"];
    var en=vs.filter(function(v){return v.lang&&v.lang.indexOf("en")===0;});
    var pool=en.filter(function(v){return v.lang===want;}).concat(en);
    for(var i=0;i<pref.length;i++){ var hit=null; for(var j=0;j<pool.length;j++){ if(pool[j].name&&pool[j].name.indexOf(pref[i])===0){ hit=pool[j]; break; } } if(hit) return hit; }
    return pool[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
<script id="jecback">
