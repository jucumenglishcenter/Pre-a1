<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Summary — Present Continuous (Negativo y Preguntas) | Pre-A1 | JUCUM</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
--bg:#FAFAF6;--card:#fff;--text:#2A2A2A;--text-soft:#777;--border:#E8E5DC;
--shadow:0 3px 16px rgba(0,0,0,.06);--radius:14px;
--lp:#F9A825;--ld:#E65100;--ll:#FFF9C4;--lm:#FFECB3;
--lg:linear-gradient(135deg,#F9A825,#FF8F00);--lglow:rgba(249,168,37,.15);
--badge-text:#4E3800;
--subj:#1565C0;--subj-bg:#E3F2FD;
--verb:#E53935;--verb-bg:#FFEBEE;
--comp:#00897B;--comp-bg:#E0F2F1;
--neg:#AD1457;--neg-bg:#FCE4EC;
--quest:#7B1FA2;--quest-bg:#F3E5F5;
--ok:#2E7D32;--ok-bg:#E8F5E9;
--err:#C62828;--err-bg:#FFEBEE;
--note-bg:#FFFDE7;--note-border:#FBC02D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:1.5rem 1rem;-webkit-font-smoothing:antialiased}
.container{max-width:780px;margin:0 auto}
.level-header{text-align:center;padding:2rem;border-radius:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:1.2rem;background:var(--lg)}
.level-header::before{content:'';position:absolute;top:-40%;right:-15%;width:250px;height:250px;background:rgba(255,255,255,.1);border-radius:50%}
.level-header h1{font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:600;position:relative;z-index:1}
.level-header .module-name{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:500;opacity:.95;position:relative;z-index:1;margin-top:.2rem}
.level-header .subtitle{opacity:.8;font-size:.85rem;position:relative;z-index:1;margin-top:.15rem}
.level-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ll);color:var(--badge-text);padding:4px 12px;border-radius:20px;border:1.5px solid var(--lm);margin-bottom:.8rem;position:relative;z-index:1}
.step-tabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.step-tab{padding:.45rem .85rem;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);transition:.2s;font-family:'Nunito',sans-serif}
.step-tab:hover{background:var(--ll)}
.step-tab.active{background:var(--ll);border-color:var(--lp);color:var(--ld)}
.step-tab.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-bottom:1.2rem;box-shadow:var(--shadow);border-top:3.5px solid var(--lp);display:none}
.card.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.section-label{display:flex;align-items:center;gap:.5rem;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--ld);margin-bottom:.3rem}
.section-label::before{content:"";width:20px;height:3px;background:var(--lp);border-radius:2px}
.section-title{font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:600;margin-bottom:.1rem}
.section-desc{font-size:.85rem;color:var(--text-soft);margin-bottom:1rem;line-height:1.6}
.g-subj,.g-verb,.g-comp,.g-neg,.g-quest,.g-prep,.g-time,.g-art{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;margin:0 1px;line-height:1.5}
.g-subj{background:var(--subj-bg);color:var(--subj);border-bottom:2.5px solid var(--subj)}
.g-verb{background:var(--verb-bg);color:var(--verb);border-bottom:2.5px solid var(--verb)}
.g-comp{background:var(--comp-bg);color:var(--comp);border-bottom:2.5px solid var(--comp)}
.g-neg{background:var(--neg-bg);color:var(--neg);border-bottom:2.5px solid var(--neg)}
.g-quest{background:var(--quest-bg);color:var(--quest);border-bottom:2.5px solid var(--quest)}
.g-prep{background:#FFE0B2;color:#E65100;border-bottom:2.5px solid #FB8C00}
.g-time{background:#F8BBD0;color:#AD1457;border-bottom:2.5px solid #C2185B}
.g-art{background:#FFF59D;color:#F57F17;border-bottom:2.5px solid #FBC02D}
.g-table{width:100%;border-collapse:separate;border-spacing:0;margin:.8rem 0;border-radius:10px;overflow:hidden;font-size:.83rem;border:1px solid var(--border)}
.g-table th{background:var(--lg);color:#fff;padding:.65rem .6rem;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.g-table td{padding:.6rem;border-bottom:1px solid #f0f0f0;vertical-align:middle;line-height:1.65}
.g-table tr:nth-child(even) td{background:var(--ll)}
.g-table tr:last-child td{border-bottom:none}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0}
.compare-card{padding:1rem;border-radius:12px;text-align:center}
.compare-card.esp{background:var(--ll);border:2px solid var(--lm)}

.compare-card h4{font-family:'Fredoka',sans-serif;font-size:.85rem;margin-bottom:.5rem}
.compare-card.esp h4{color:var(--ld)}

.compare-card ul{list-style:none;font-size:.82rem;color:var(--text-soft)}

.formula-box{background:var(--note-bg);border:2px solid var(--note-border);border-radius:12px;padding:1rem;margin:.8rem 0;text-align:center;font-family:'Fredoka',sans-serif;font-size:.95rem;color:var(--ld);line-height:2.1}
.tip-card{background:var(--ll);border-radius:10px;padding:.8rem 1rem;margin:.5rem 0;font-size:.83rem;border-left:3px solid var(--lp);line-height:1.65}
.tip-card strong{color:var(--ld)}
.alert-card{background:var(--err-bg);border:2px solid #EF5350;border-radius:10px;padding:.8rem 1rem;margin:.8rem 0}
.alert-card .atitle{font-family:'Fredoka',sans-serif;color:var(--err);font-size:.82rem;margin-bottom:.3rem}
.alert-card p{font-size:.82rem;color:var(--text-soft);line-height:1.65}
.viz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.8rem 0}
.viz-item{padding:.7rem .5rem;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--lm);font-size:.82rem}
.viz-item .ico{font-size:1.6rem;display:block;margin-bottom:.3rem}
.viz-item .lbl{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.95rem;display:block}
.viz-item .es{font-style:italic;color:var(--text-soft);font-size:.74rem;display:block;margin-top:2px}
.rule-grid{display:grid;grid-template-columns:1fr;gap:.5rem;margin:.8rem 0}
.rule-item{padding:.7rem 1rem;border-radius:10px;background:var(--card);border:1.5px solid var(--lm);display:flex;align-items:flex-start;gap:.7rem}
.rule-item .num{font-family:'Fredoka',sans-serif;background:var(--lp);color:#fff;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem}
.rule-item .info{flex:1;font-size:.85rem;line-height:1.6}
.rule-item .info strong{color:var(--ld);display:block;margin-bottom:2px}
.timeline{display:flex;align-items:center;justify-content:space-between;margin:1rem 0;padding:.8rem;background:var(--ll);border-radius:12px;border:1.5px solid var(--lm);gap:.4rem;flex-wrap:wrap}
.tl-point{flex:1;min-width:75px;text-align:center;padding:.5rem .3rem;background:#fff;border-radius:8px;border:2px solid var(--lm)}
.tl-point .ico{font-size:1.3rem;display:block}
.tl-point .lbl{font-family:'Fredoka',sans-serif;font-size:.78rem;color:var(--ld);margin-top:2px;display:block}
.tl-arrow{color:var(--lp);font-size:1.2rem;font-weight:700}
.ex-row{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .8rem;border-radius:10px;margin:.4rem 0;font-size:.88rem;transition:background .2s}
.ex-row:hover{background:var(--lglow)}
.ex-row .icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.ex-row .body{flex:1;min-width:0}
.ex-row .en{font-weight:700;color:var(--text);line-height:1.7;word-spacing:1px}
.ex-row .es{font-family:'Lora',serif;font-style:italic;font-size:.82rem;color:var(--text-soft);margin-top:3px;line-height:1.5}
.ex-right{border-left:3px solid var(--ok);background:var(--ok-bg)}
.ex-wrong{border-left:3px solid var(--err);background:var(--err-bg)}
.ex-section{margin-top:1.2rem;padding-top:1rem;border-top:2px dashed var(--lm)}
.ex-section h3{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.95rem;margin-bottom:.8rem}
.exercise{background:#fafafa;border-radius:12px;padding:1rem;margin-bottom:.7rem;border:2px solid #eee;transition:.2s}
.exercise.correct{border-color:var(--ok);background:var(--ok-bg)}
.exercise.incorrect{border-color:var(--err);background:var(--err-bg)}
.exercise-q{font-size:.9rem;margin-bottom:.7rem;line-height:1.55;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.opt-btn{padding:.7rem .55rem;border:2px solid #e0e0e0;border-radius:10px;background:var(--card);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s;font-family:'Nunito',sans-serif;text-align:center;line-height:1.35}
.opt-btn:hover:not(:disabled){border-color:var(--lp);background:var(--ll)}
.opt-btn:disabled{cursor:not-allowed;opacity:.7}
.opt-btn.sel-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt-btn.sel-bad{background:var(--err);color:#fff;border-color:var(--err)}
.opt-btn.show-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.fb{margin-top:.7rem;padding:0;border-radius:12px;font-size:.82rem;display:none;line-height:1.6;overflow:hidden}
.fb.show{display:block;animation:fbSlide .35s ease}
@keyframes fbSlide{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:600px;transform:translateY(0)}}
.fb-header{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;font-family:'Fredoka',sans-serif;font-size:.88rem;font-weight:600}
.fb.fb-ok .fb-header{background:#C8E6C9;color:var(--ok)}
.fb.fb-bad .fb-header{background:#FFCDD2;color:var(--err)}
.fb-header .fb-icon{font-size:1.2rem}
.fb-body{padding:.8rem 1rem}
.fb.fb-ok .fb-body{background:var(--ok-bg)}
.fb.fb-bad .fb-body{background:var(--err-bg)}
.fb-row{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem}
.fb-row:last-child{margin-bottom:0}
.fb-row .fb-dot{font-size:.95rem;flex-shrink:0;margin-top:1px}
.fb-row .fb-text{flex:1;line-height:1.55}
.fb-row .fb-text strong{color:var(--text)}
.fb-correct-answer{color:var(--ok);font-weight:700}
.fb-wrong-reason{color:var(--err);font-weight:600}
.fb-example{display:inline-block;margin-top:.5rem;padding:5px 12px;border-radius:6px;font-size:.79rem;font-weight:700}
.fb.fb-ok .fb-example{background:#A5D6A7;color:#1B5E20}
.fb.fb-bad .fb-example{background:#EF9A9A;color:#B71C1C}
.fb-tip{margin-top:.5rem;padding:.5rem .75rem;border-radius:8px;background:var(--note-bg);border:1px solid var(--note-border);font-size:.78rem;color:#6D4C00;line-height:1.5}
.fb-tip strong{color:var(--ld)}
.score-bar{text-align:center;padding:.8rem;background:var(--ll);border-radius:10px;margin-top:.8rem;border:1px solid var(--lm)}
.score-bar .num{font-family:'Fredoka',sans-serif;font-size:1.4rem;color:var(--ld)}
.score-bar .lbl{font-size:.7rem;color:var(--lp);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.summary-final{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-top:1rem;box-shadow:var(--shadow);border-top:3.5px solid var(--ok);display:none}
.summary-final.show{display:block;animation:fadeIn .4s ease}
.summary-final h3{font-family:'Fredoka',sans-serif;color:var(--ok);margin-bottom:.6rem;font-size:1.15rem}
.summary-final ul{list-style:none}
.summary-final li{padding:5px 0 5px 22px;position:relative;font-size:.85rem;color:var(--text-soft);line-height:1.6}
.summary-final li:before{content:"\2713";position:absolute;left:0;color:var(--lp);font-weight:700;font-size:1rem}
.summary-final .total-score{margin-top:1rem;padding:.8rem;background:var(--ll);border-radius:10px;text-align:center;font-family:'Fredoka',sans-serif}
.summary-final .total-score .big{font-size:1.6rem;color:var(--ld)}
.summary-final .total-score .small{font-size:.8rem;color:var(--text-soft);font-weight:600}
@media(max-width:600px){
.level-header h1{font-size:1.4rem}
.card{padding:1.2rem}
.compare-grid,.viz-grid{grid-template-columns:1fr 1fr}
.timeline{flex-direction:column}
.tl-arrow{transform:rotate(90deg)}
.opts{grid-template-columns:1fr}
}
.why-box{background:#EDF7ED;border:1.5px solid #A5D6A7;border-left:4px solid var(--ok);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.83rem;line-height:1.6}.why-box .wt{font-family:'Fredoka',sans-serif;color:var(--ok);font-size:.8rem;display:block;margin-bottom:.2rem}.note-box{background:var(--note-bg);border:1.5px solid var(--note-border);border-left:4px solid var(--lp);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.83rem;line-height:1.6}.note-box .nt{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.8rem;display:block;margin-bottom:.2rem}.illus{display:flex;justify-content:center;align-items:center;gap:.5rem;margin:.4rem 0 1rem;background:linear-gradient(135deg,#FFF9C4,#FFECB3);border:2px dashed var(--lm);border-radius:16px;padding:1rem}.illus .big{font-size:3.2rem;line-height:1}.illus .big.sm{font-size:2.4rem}.info-illus{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.8rem 1rem;margin:.6rem 0}.info-illus .emo{font-size:2.4rem;line-height:1;flex-shrink:0}.info-illus .txt{font-size:.85rem;line-height:1.55}.info-illus .txt b{color:var(--ld)}.eg-card{position:relative;display:flex;align-items:center;gap:.7rem;background:#E3F2FD;border:2px solid #64B5F6;border-radius:12px;padding:1rem .9rem .9rem;margin:.4rem 0 1.1rem}.eg-card .eg-emo{font-size:2.3rem;line-height:1;flex-shrink:0}.eg-card .eg-body .en{font-weight:800;color:#0D47A1;font-size:.95rem;line-height:1.4}.eg-card .eg-body .es{font-family:'Lora',serif;font-style:italic;color:#1565C0;font-size:.82rem;margin-top:3px}.eg-card::before{content:'\1F4DD EJEMPLO';position:absolute;top:-11px;left:14px;background:#1565C0;color:#fff;font-family:'Fredoka',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.06em;padding:2px 9px;border-radius:20px}.eg-card.ok{background:#E8F5E9;border-color:#81C784}.eg-card.ok .en{color:#1B5E20}.eg-card.ok .es{color:#2E7D32}.eg-card.ok::before{content:'\2705 BIEN';background:#2E7D32}.eg-card.bad{background:#FFEBEE;border-color:#EF9A9A}.eg-card.bad .en{color:#B71C1C}.eg-card.bad .es{color:#C62828}.eg-card.bad::before{content:'\274C MAL';background:#C62828}
.art-hero{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.8rem 0}.art-hero.three{grid-template-columns:1fr 1fr 1fr}.art-box{background:#fff;border:2px solid var(--lm);border-radius:16px;padding:1rem .9rem;text-align:center;box-shadow:0 2px 10px rgba(249,168,37,.10)}.art-box .word{font-family:'Fredoka',sans-serif;font-size:2.6rem;font-weight:700;color:var(--ld);line-height:1;background:linear-gradient(135deg,#FFF9C4,#FFE082);border-radius:12px;padding:.5rem 0;margin-bottom:.5rem}.art-box.eng .word{background:linear-gradient(135deg,#E3F2FD,#90CAF9);color:#0D47A1}.art-box .role{font-family:'Fredoka',sans-serif;font-size:.78rem;color:var(--lp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}.art-box.eng .role{color:#1976D2}.art-box .desc{font-size:.8rem;color:var(--text-soft);line-height:1.5}.vs-grid{margin:.8rem 0}.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:.5rem;margin:.55rem 0}.vs-side{border-radius:12px;padding:.7rem .8rem;font-size:.84rem;line-height:1.45}.vs-side .flag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.2rem;opacity:.85}.vs-side.es{background:var(--ll);border:1.5px solid var(--lm)}.vs-side.es .flag{color:var(--ld)}.vs-side.en{background:#E3F2FD;border:1.5px solid #90CAF9}.vs-side.en .flag{color:#1565C0}.vs-mid{display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--lp)}@media(max-width:600px){.art-hero,.art-hero.three{grid-template-columns:1fr}.vs-row{grid-template-columns:1fr;gap:.3rem}.vs-mid{transform:rotate(90deg);padding:.1rem 0}}</style>

<body>
<div class="container">
<div class="level-header">
<div class="level-badge">Pre-A1 · Nivel Básico</div>
<h1>Grammar Summary</h1>
<div class="module-name">📰 Present Continuous — Negativo y Preguntas</div>
<p class="subtitle">Negar y preguntar: I'm not... / Are you...? · 5 pasos × 5 ejercicios</p>
</div>
<div class="step-tabs" id="stepTabs"></div>
<div id="cardArea"></div>
<div class="summary-final" id="summaryFinal">
<h3>🎓 Resumen del Tema</h3>
<ul id="summaryList"></ul>
<div class="total-score" id="totalScore"></div>
</div>
</div>
<script>
const ICON_PARTY="🎉";
const ICON_CHECK="✅";
const ICON_X="❌";
const ICON_BULB="💡";
const ICON_NOTE="📝";
const ICON_THINK="😕";
const DASH="—";
const TEXT_CORRECT="¡Correcto!";
const TEXT_INCORRECT="No es correcto";
const TEXT_OTHER_OPT="La otra opción";
const TEXT_CORRECT_IS="La respuesta correcta es";
const TEXT_REMEMBER="Recuerda";
const TEXT_SCORE="Puntuación";
const TEXT_TOTAL="Total del tema";
const EX_HEADER="✏️ Ejercicios —";

const DATA={"summary": ["<b>Negativo:</b> sujeto + be + <b>not</b> + verbo-ing → He is not reading", "<b>Pregunta:</b> <b>be</b> + sujeto + verbo-ing + ? → Are you reading?", "El <b>not</b> va <b>después</b> del be (no antes): is not ✅, \"not is\" ❌", "Contracciones: <b>isn't, aren't, I'm not</b> (no existe \"amn't\")", "El <b>sujeto es obligatorio</b> también en preguntas: Are <b>you</b> reading?", "Respuestas cortas repiten el be: <b>Yes, I am · No, they aren't</b>"], "steps": [{"icon": "🇪🇸", "title": "Repaso en Español", "html": "<div class=\"section-label\">Paso 1</div><div class=\"section-title\">Paso 1: 🇪🇸 Repaso en Español</div><div class=\"illus\"><span class=\"big\">🚫</span><span class=\"big\">❓</span></div><div class=\"section-desc\">Ya sabes el continuo afirmativo (estoy leyendo). Ahora veremos cómo decir que algo <b>NO</b> ocurre y cómo <b>preguntar</b> si ocurre.</div><div class=\"section-label\">Negar y preguntar en español</div><div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">No</div><div class=\"role\">Negación</div><div class=\"desc\">Ponemos \"no\" antes del verbo estar: \"No estoy leyendo\". Así negamos la acción.</div></div><div class=\"art-box\"><div class=\"word\">¿…?</div><div class=\"role\">Pregunta</div><div class=\"desc\">Subimos el tono o cambiamos el orden: \"¿Estás leyendo?\". Pedimos información.</div></div></div><div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Negativo.</b> En español el \"no\" va justo antes del verbo: \"No estoy jugando\".</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🎮</span><div class=\"eg-body\"><div class=\"en\">Yo <b>no</b> estoy jugando.</div><div class=\"es\">El \"no\" niega la acción de ahora.</div></div></div><div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Pregunta.</b> En español muchas veces solo cambia la entonación: \"¿Estás leyendo?\".</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📖</span><div class=\"eg-body\"><div class=\"en\">¿<b>Estás</b> leyendo?</div><div class=\"es\">Pregunta de sí/no: pedimos confirmación.</div></div></div><div class=\"why-box\"><span class=\"wt\">💡 ¿Por qué importa?</span>En inglés también se niega y se pregunta con el verbo \"be\", pero las reglas de posición son un poco distintas. Verlas en español primero hace todo más fácil.</div>", "exercises": [{"q": "Para negar en español, el \"no\" se coloca:", "a": "b", "o": ["al final de la frase", "antes del verbo estar"], "fc": "El \"no\" va justo antes: \"No estoy leyendo\".", "fi": "Ponerlo al final no es natural en español.", "ex": "No estoy jugando → niega la acción", "tip": "no + estar + acción"}, {"q": "\"¿Estás leyendo?\" es una pregunta de tipo:", "a": "a", "o": ["sí / no", "abierta (pide explicación)"], "fc": "Se responde con sí o no: es pregunta cerrada.", "fi": "Una abierta sería \"¿Qué estás leyendo?\".", "ex": "¿Estás leyendo? → sí / no", "tip": "Sí/No = respuesta corta"}, {"q": "\"Yo no estoy pintando\" expresa que la acción:", "a": "b", "o": ["sí ocurre ahora", "no ocurre ahora"], "fc": "El \"no\" niega: la acción NO está pasando.", "fi": "Si ocurriera, no llevaría \"no\".", "ex": "No estoy pintando → la acción se niega", "tip": "no = la acción se cancela"}, {"q": "En la pregunta \"¿Está él escribiendo?\", ¿qué pedimos?", "a": "a", "o": ["información / confirmación", "dar una orden"], "fc": "Preguntar es pedir información o confirmar algo.", "fi": "Una orden no lleva signos de pregunta.", "ex": "¿Está escribiendo? → pedimos confirmar", "tip": "Pregunta = pedir información"}, {"q": "¿Cuál frase es negativa?", "a": "b", "o": ["Ella está leyendo un libro", "Ella no está leyendo un libro"], "fc": "Lleva \"no\" antes del verbo: es negativa.", "fi": "Sin \"no\", la frase es afirmativa.", "ex": "Ella no está leyendo → negativa", "tip": "Busca el \"no\" para reconocer la negación"}]}, {"icon": "🤝", "title": "Similitudes", "html": "<div class=\"section-label\">Paso 2</div><div class=\"section-title\">Paso 2: 🤝 Similitudes ESP ↔ ENG</div><div class=\"illus\"><span class=\"big\">🇪🇸</span><span class=\"big\">🤝</span><span class=\"big\">🇬🇧</span></div><div class=\"section-desc\">Los dos idiomas niegan y preguntan usando el mismo verbo de apoyo (estar / be). La acción sigue terminando en -ando/-iendo o en -ing.</div><table class=\"g-table\"><tr><th>Idea</th><th>🇪🇸 Español</th><th>🇬🇧 English</th></tr><tr><td>Negar la acción</td><td>no estoy leyendo</td><td>I am <span class=\"g-neg\">not</span> reading</td></tr><tr><td>Preguntar sí/no</td><td>¿estás leyendo?</td><td><span class=\"g-quest\">Are</span> you reading?</td></tr><tr><td>Usa el verbo de apoyo</td><td>estar</td><td><span class=\"g-verb\">be</span> (am/is/are)</td></tr><tr><td>La acción no cambia</td><td>-ando / -iendo</td><td><span class=\"g-verb\">-ing</span></td></tr></table><div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Negativo:</b> ambos usan una palabra para negar (no / not) junto al verbo de apoyo.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🎮</span><div class=\"eg-body\"><div class=\"en\">I am <span class=\"g-neg\">not</span> playing a game.</div><div class=\"es\">No estoy jugando un juego. (game = juego)</div></div></div><div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Pregunta:</b> los dos cambian para preguntar; el verbo de apoyo lidera.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📖</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-quest\">Are</span> you reading a book?</div><div class=\"es\">¿Estás leyendo un libro? (book = libro)</div></div></div><div class=\"info-illus\"><span class=\"emo\">✍️</span><span class=\"txt\"><b>La acción se mantiene:</b> reading, writing siguen igual en negativo y en pregunta.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">✍️</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-quest\">Is</span> he writing an email?</div><div class=\"es\">¿Está él escribiendo un correo? (email = correo)</div></div></div><div class=\"why-box\"><span class=\"wt\">💡 ¿Por qué importa?</span>El \"not\" del inglés es como el \"no\" del español, y la pregunta mueve el \"be\" al frente, parecido a cuando en español decimos \"¿Estás…?\".</div>", "exercises": [{"q": "El \"no\" del español equivale en inglés a:", "a": "b", "o": ["never", "not"], "fc": "\"not\" es la palabra que niega: I am not reading.", "fi": "\"never\" significa \"nunca\", no es la negación simple.", "ex": "I am not playing → No estoy jugando", "tip": "no ↔ not"}, {"q": "Para preguntar sí/no en inglés, ¿qué palabra va primero?", "a": "a", "o": ["el verbo be (am/is/are)", "la acción con -ing"], "fc": "El \"be\" lidera la pregunta: Are you reading?", "fi": "La acción con -ing no va al inicio de la pregunta.", "ex": "Are you reading? → ¿Estás leyendo?", "tip": "Pregunta: be primero"}, {"q": "En negativo y en pregunta, la acción con -ing:", "a": "b", "o": ["cambia de forma", "se mantiene igual"], "fc": "reading/writing no cambian: solo se mueve o se niega el \"be\".", "fi": "La acción no cambia; lo que cambia es el \"be\".", "ex": "Is he writing? / He is not writing → writing igual", "tip": "El -ing no cambia"}, {"q": "\"Are you reading a book?\" es una pregunta de tipo:", "a": "b", "o": ["abierta", "sí / no"], "fc": "Se responde con yes/no: es cerrada.", "fi": "Una abierta empezaría con What, Where, etc.", "ex": "Are you reading? → Yes / No", "tip": "be + sujeto = pregunta sí/no"}, {"q": "Para \"¿Está él escribiendo un correo?\" (email = correo) en inglés:", "a": "a", "o": ["Is he writing an email?", "He is writing an email?"], "fc": "\"Is he writing…?\": el \"be\" va al frente.", "fi": "Dejar \"He is…?\" sin invertir no es la forma correcta de preguntar.", "ex": "Is he writing an email? → ¿Está escribiendo un correo?", "tip": "Invierte: Is + he…?"}]}, {"icon": "⚡", "title": "Diferencias", "html": "<div class=\"section-label\">Paso 3</div><div class=\"section-title\">Paso 3: ⚡ Diferencias Importantes</div><div class=\"illus\"><span class=\"big\">🚫</span><span class=\"big\">↔️</span><span class=\"big\">❓</span></div><div class=\"section-desc\">Diferencia clave: el inglés coloca <b>not después del be</b> para negar, y <b>mueve el be al frente</b> para preguntar. El sujeto nunca se quita. Compara los dos idiomas:</div><div class=\"section-label\">Comparación Español ↔ English</div><div class=\"vs-grid\"><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span>El \"no\" va <b>antes</b> del verbo: \"No estoy leyendo\".</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span>El \"not\" va <b>después</b> del be: \"I am <b>not</b> reading\".</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span>Para preguntar basta el <b>tono</b>: \"¿Estás leyendo?\".</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span>Hay que <b>mover el be</b> al frente: \"<b>Are</b> you reading?\".</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span>El sujeto puede <b>desaparecer</b>: \"¿Estás leyendo?\".</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span>El sujeto es <b>obligatorio</b>: \"Are <b>you</b> reading?\".</div></div></div><div class=\"section-label\">Las tres estructuras del inglés</div><div class=\"art-hero three\"><div class=\"art-box eng\"><div class=\"word\">+</div><div class=\"role\">Afirmativo</div><div class=\"desc\">Sujeto + be + verbo-ing. \"She is painting.\"</div></div><div class=\"art-box eng\"><div class=\"word\">−</div><div class=\"role\">Negativo</div><div class=\"desc\">Sujeto + be + not + verbo-ing. \"She is not painting.\"</div></div><div class=\"art-box eng\"><div class=\"word\">?</div><div class=\"role\">Pregunta</div><div class=\"desc\">Be + sujeto + verbo-ing. \"Is she painting?\"</div></div></div><div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Negativo:</b> el \"not\" se mete entre el be y la acción. (job = trabajo)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">💼</span><div class=\"eg-body\"><div class=\"en\">He <span class=\"g-verb\">is</span> <span class=\"g-neg\">not</span> look<span class=\"g-verb\">ing</span> for a job.</div><div class=\"es\">Él no está buscando trabajo. (job = trabajo)</div></div></div><div class=\"eg-card bad\"><span class=\"eg-emo\">🚫</span><div class=\"eg-body\"><div class=\"en\">He not is looking for a job.</div><div class=\"es\">Incorrecto: el \"not\" va DESPUÉS del be, no antes.</div></div></div><div class=\"alert-card\"><div class=\"atitle\">⭐ Caso especial: contracciones negativas</div><p>🔸 is not → <b>isn't</b> · are not → <b>aren't</b><br>🔸 \"I am not\" se contrae como <b>I'm not</b> (no existe \"amn't\").</p></div><div class=\"info-illus\"><span class=\"emo\">❓</span><span class=\"txt\"><b>Pregunta:</b> el be salta al inicio y el sujeto va después. (question = pregunta)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">❓</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-quest\">Are</span> <span class=\"g-subj\">you</span> ask<span class=\"g-verb\">ing</span> a question?</div><div class=\"es\">¿Estás haciendo una pregunta? (question = pregunta)</div></div></div>", "exercises": [{"q": "En inglés, ¿dónde va el \"not\" para negar?", "a": "b", "o": ["antes del be", "después del be"], "fc": "El \"not\" va después del be: \"is not reading\".", "fi": "Ponerlo antes del be (\"not is\") es incorrecto.", "ex": "He is not looking for a job → No está buscando trabajo", "tip": "be + not + acción"}, {"q": "Para preguntar en inglés, el verbo \"be\":", "a": "a", "o": ["se mueve al frente", "se queda en su lugar"], "fc": "El be salta al inicio: \"Are you reading?\".", "fi": "Si se queda en su lugar, no es una pregunta correcta.", "ex": "Are you reading? → ¿Estás leyendo?", "tip": "Pregunta: be al frente"}, {"q": "La contracción de \"is not\" es:", "a": "a", "o": ["isn't", "isnt"], "fc": "\"isn't\" lleva apóstrofo: She isn't painting.", "fi": "\"isnt\" sin apóstrofo está mal escrito.", "ex": "She isn't painting → Ella no está pintando", "tip": "is not → isn't"}, {"q": "\"I am not\" se contrae correctamente como:", "a": "b", "o": ["I amn't", "I'm not"], "fc": "\"I'm not\" es la forma correcta; no existe \"amn't\".", "fi": "\"amn't\" no existe en inglés.", "ex": "I'm not playing → No estoy jugando", "tip": "I am not → I'm not"}, {"q": "¿Cuál pregunta está bien formada? (question = pregunta)", "a": "a", "o": ["Are you asking a question?", "You are asking a question?"], "fc": "\"Are you asking…?\": el be va al frente.", "fi": "\"You are…?\" no invierte el be; no es la forma correcta.", "ex": "Are you asking a question? → ¿Estás preguntando?", "tip": "Invierte be + sujeto"}]}, {"icon": "💡", "title": "Tips", "html": "<div class=\"section-label\">Paso 4</div><div class=\"section-title\">Paso 4: 💡 Tips Prácticos</div><div class=\"illus\"><span class=\"big sm\">💡</span><span class=\"big sm\">🧠</span></div><div class=\"section-desc\">Trucos para negar y preguntar sin errores. Cada tip va con su ejemplo.</div><div class=\"info-illus\"><span class=\"emo\">➕</span><span class=\"txt\"><b>Tip 1:</b> Para negar, mete \"not\" justo después del be. El resto queda igual.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📖</span><div class=\"eg-body\"><div class=\"en\">I am <span class=\"g-neg\">not</span> read<span class=\"g-verb\">ing</span> a book.</div><div class=\"es\">No estoy leyendo un libro. (book = libro)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🔄</span><span class=\"txt\"><b>Tip 2:</b> Para preguntar, mueve el be al inicio y deja la acción igual.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🎨</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-quest\">Is</span> she paint<span class=\"g-verb\">ing</span> the house?</div><div class=\"es\">¿Está ella pintando la casa? (house = casa)</div></div></div><div class=\"info-illus\"><span class=\"emo\">✂️</span><span class=\"txt\"><b>Tip 3:</b> Usa contracciones para sonar natural: isn't, aren't, I'm not.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🎮</span><div class=\"eg-body\"><div class=\"en\">They <span class=\"g-neg\">aren't</span> play<span class=\"g-verb\">ing</span> a game.</div><div class=\"es\">Ellos no están jugando un juego. (game = juego)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🙋</span><span class=\"txt\"><b>Tip 4:</b> Responde corto repitiendo el be: \"Yes, I am.\" / \"No, I'm not.\"</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📧</span><div class=\"eg-body\"><div class=\"en\">Are you writing an email? — <span class=\"g-quest\">Yes, I am.</span></div><div class=\"es\">¿Estás escribiendo un correo? — Sí. (email = correo)</div></div></div><div class=\"note-box\"><span class=\"nt\">⚠️ Error típico del hispanohablante</span>En español el \"no\" va antes (\"No está leyendo\"). En inglés el \"not\" va <b>después</b> del be: \"He is <b>not</b> reading\" ✅, no \"He not is reading\" ❌.</div><div class=\"formula-box\"><span class=\"g-neg\">−</span> Sujeto + <span class=\"g-verb\">be</span> + <span class=\"g-neg\">not</span> + <span class=\"g-comp\">verbo-ing</span><br><span class=\"g-quest\">?</span> <span class=\"g-verb\">be</span> + Sujeto + <span class=\"g-comp\">verbo-ing</span> + ?</div>", "exercises": [{"q": "Completa el negativo: \"I am ___ reading a book.\" (book = libro)", "a": "b", "o": ["no", "not"], "fc": "En inglés se niega con \"not\": I am not reading.", "fi": "\"no\" no se usa para negar el verbo en inglés.", "ex": "I am not reading a book → No estoy leyendo", "tip": "negación = not"}, {"q": "Forma la pregunta: \"___ she painting the house?\" (house = casa)", "a": "a", "o": ["Is", "She is"], "fc": "\"Is she painting…?\": el be va al frente.", "fi": "\"She is…?\" no invierte el be.", "ex": "Is she painting the house? → ¿Está pintando la casa?", "tip": "Pregunta: Is + sujeto"}, {"q": "La contracción de \"are not\" es:", "a": "a", "o": ["aren't", "arent"], "fc": "\"aren't\" lleva apóstrofo.", "fi": "\"arent\" sin apóstrofo está mal.", "ex": "They aren't playing → No están jugando", "tip": "are not → aren't"}, {"q": "Respuesta corta a \"Are you writing an email?\" (afirmativa):", "a": "b", "o": ["Yes, I writing.", "Yes, I am."], "fc": "Se repite el be: \"Yes, I am.\".", "fi": "\"Yes, I writing\" olvida el be.", "ex": "Are you writing? — Yes, I am.", "tip": "Respuesta corta repite el be"}, {"q": "¿Cuál negativo está bien ordenado?", "a": "b", "o": ["He not is reading", "He is not reading"], "fc": "\"is not\": el not va después del be.", "fi": "\"not is\" invierte mal el orden.", "ex": "He is not reading → No está leyendo", "tip": "be + not, en ese orden"}]}, {"icon": "🎯", "title": "Práctica Final", "html": "<div class=\"section-label\">Paso 5</div><div class=\"section-title\">Paso 5: 🎯 Práctica Final — Reto</div><div class=\"illus\"><span class=\"big\">🎯</span><span class=\"big\">🔥</span></div><div class=\"section-desc\">Junta todo: elige el <b>be</b> correcto, coloca el <b>not</b> en su lugar, e <b>invierte</b> para preguntar. ¡Más difíciles!</div><div class=\"formula-box\">Negar: <span class=\"g-verb\">be</span> + <span class=\"g-neg\">not</span> + <span class=\"g-comp\">-ing</span><br>Preguntar: <span class=\"g-verb\">be</span> + sujeto + <span class=\"g-comp\">-ing</span> + ?</div><div class=\"info-illus\"><span class=\"emo\">🧩</span><span class=\"txt\"><b>Negativo + persona:</b> \"the group\" (el grupo) pide \"is\", y el not va después.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👥</span><div class=\"eg-body\"><div class=\"en\">The group <span class=\"g-verb\">is</span> <span class=\"g-neg\">not</span> study<span class=\"g-verb\">ing</span> education today.</div><div class=\"es\">El grupo no está estudiando educación hoy. (education = educación)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🔄</span><span class=\"txt\"><b>Pregunta + ortografía:</b> invierte el be y cuida el -ing de write.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📧</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-quest\">Is</span> <span class=\"g-subj\">he</span> writ<span class=\"g-verb\">ing</span> an email?</div><div class=\"es\">¿Está él escribiendo un correo? (email = correo)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🙋</span><span class=\"txt\"><b>Pregunta + respuesta corta:</b> contesta repitiendo solo el be.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🔑</span><div class=\"eg-body\"><div class=\"en\">Are they looking for the key? — <span class=\"g-quest\">No, they aren't.</span></div><div class=\"es\">¿Están buscando la llave? — No. (key = llave)</div></div></div><div class=\"alert-card\"><div class=\"atitle\">⚠️ Errores Comunes</div><p>❌ \"She no is painting\" → ✅ \"She is <b>not</b> painting\" (not después del be)<br>❌ \"You are reading?\" → ✅ \"<b>Are</b> you reading?\" (invierte el be)<br>❌ \"Yes, I writing\" → ✅ \"Yes, I <b>am</b>\" (respuesta corta repite el be)</p></div>", "exercises": [{"q": "\"The group\" (el grupo) es una unidad. Niega: \"The group ___ studying.\"", "a": "a", "o": ["is not", "are not"], "fc": "\"the group\" pide \"is\": is not studying.", "fi": "\"are not\" sería para varios sujetos separados.", "ex": "The group is not studying → El grupo no está estudiando", "tip": "group → is (not)"}, {"q": "Forma la pregunta: \"___ he writing an email?\" (email = correo)", "a": "b", "o": ["He is", "Is"], "fc": "\"Is he writing…?\": el be al frente.", "fi": "\"He is…?\" no invierte el be.", "ex": "Is he writing an email? → ¿Está escribiendo un correo?", "tip": "Pregunta: Is + sujeto"}, {"q": "Respuesta corta negativa a \"Are they looking for the key?\" (key = llave):", "a": "b", "o": ["No, they don't.", "No, they aren't."], "fc": "Se repite el be en negativo: \"No, they aren't.\".", "fi": "\"don't\" no se usa en el continuo; aquí va el be.", "ex": "Are they looking…? — No, they aren't.", "tip": "Continuo: respuesta con be, no con do"}, {"q": "¿Cuál negativo está totalmente correcto?", "a": "a", "o": ["She is not painting", "She no is painting"], "fc": "\"is not\": el not va después del be.", "fi": "\"no is\" copia el orden del español; en inglés es \"is not\".", "ex": "She is not painting → Ella no está pintando", "tip": "be + not, nunca \"no is\""}, {"q": "Completa la pregunta: \"___ you painting your face?\" (face = cara)", "a": "a", "o": ["Are", "You are"], "fc": "\"Are you painting…?\": el be lidera la pregunta.", "fi": "\"You are…?\" deja el be sin invertir.", "ex": "Are you painting your face? → ¿Te estás pintando la cara?", "tip": "Invierte: Are + you"}]}]};

let curStep=0;const scores={};const answered={};

function renderStepTabs(){
var c=document.getElementById("stepTabs");c.innerHTML="";
DATA.steps.forEach(function(s,i){
var b=document.createElement("button");
b.className="step-tab"+(i===curStep?" active":"");
if(allAnswered(i)&&i!==curStep)b.classList.add("done");
b.textContent=(i+1)+". "+s.icon+" "+s.title;
b.addEventListener("click",function(){curStep=i;renderStepTabs();renderCard();document.getElementById("summaryFinal").classList.remove("show")});
c.appendChild(b);
});
}

function allAnswered(stepIdx){
for(var i=0;i<5;i++){if(!answered["s"+stepIdx+"e"+i])return false}
return true;
}

function renderCard(){
var s=DATA.steps[curStep];
var k="s"+curStep;
if(scores[k]===undefined)scores[k]=0;
var area=document.getElementById("cardArea");
area.innerHTML="";

var card=document.createElement("div");
card.className="card active";
card.innerHTML=s.html;

var exSec=document.createElement("div");
exSec.className="ex-section";
var h3=document.createElement("h3");
h3.textContent=EX_HEADER+" "+s.title;
exSec.appendChild(h3);

s.exercises.forEach(function(e,i){
var eid=k+"e"+i;
var div=document.createElement("div");
div.className="exercise";
div.id=eid;

var qDiv=document.createElement("div");
qDiv.className="exercise-q";
qDiv.innerHTML=(i+1)+". "+e.q;
div.appendChild(qDiv);

var opts=document.createElement("div");
opts.className="opts";
var btnA=document.createElement("button");
btnA.className="opt-btn";
btnA.textContent="a) "+e.o[0];
btnA.addEventListener("click",function(){chk(eid,"a",e.a)});
opts.appendChild(btnA);
var btnB=document.createElement("button");
btnB.className="opt-btn";
btnB.textContent="b) "+e.o[1];
btnB.addEventListener("click",function(){chk(eid,"b",e.a)});
opts.appendChild(btnB);
div.appendChild(opts);

var fbOk=document.createElement("div");
fbOk.className="fb fb-ok";
fbOk.id="fbok-"+eid;
var correctText=e.o[e.a==="a"?0:1];
var fbOkParts=[];
fbOkParts.push("<div class=\"fb-header\"><span class=\"fb-icon\">"+ICON_PARTY+"</span> "+TEXT_CORRECT+"</div>");
fbOkParts.push("<div class=\"fb-body\">");
fbOkParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_CHECK+"</span><div class=\"fb-text\"><span class=\"fb-correct-answer\">"+correctText+"</span> "+DASH+" "+e.fc+"</div></div>");
fbOkParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_BULB+"</span><div class=\"fb-text\">"+TEXT_OTHER_OPT+": "+e.fi+"</div></div>");
if(e.ex)fbOkParts.push("<div class=\"fb-example\">"+ICON_NOTE+" "+e.ex+"</div>");
if(e.tip)fbOkParts.push("<div class=\"fb-tip\"><strong>"+ICON_BULB+" "+TEXT_REMEMBER+":</strong> "+e.tip+"</div>");
fbOkParts.push("</div>");
fbOk.innerHTML=fbOkParts.join("");
div.appendChild(fbOk);

var fbBad=document.createElement("div");
fbBad.className="fb fb-bad";
fbBad.id="fbbad-"+eid;
var fbBadParts=[];
fbBadParts.push("<div class=\"fb-header\"><span class=\"fb-icon\">"+ICON_THINK+"</span> "+TEXT_INCORRECT+"</div>");
fbBadParts.push("<div class=\"fb-body\">");
fbBadParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_X+"</span><div class=\"fb-text\"><span class=\"fb-wrong-reason\">"+e.fi+"</span></div></div>");
fbBadParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_CHECK+"</span><div class=\"fb-text\">"+TEXT_CORRECT_IS+" <span class=\"fb-correct-answer\">"+correctText+"</span> "+DASH+" "+e.fc+"</div></div>");
if(e.ex)fbBadParts.push("<div class=\"fb-example\">"+ICON_NOTE+" "+e.ex+"</div>");
if(e.tip)fbBadParts.push("<div class=\"fb-tip\"><strong>"+ICON_BULB+" "+TEXT_REMEMBER+":</strong> "+e.tip+"</div>");
fbBadParts.push("</div>");
fbBad.innerHTML=fbBadParts.join("");
div.appendChild(fbBad);

exSec.appendChild(div);

if(answered[eid]){
var btns=div.querySelectorAll(".opt-btn");
btns.forEach(function(b){b.disabled=true});
var sel=answered[eid].sel;
var correct=e.a;
if(sel===correct){
div.classList.add("correct");
btns.forEach(function(b){if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-ok")});
fbOk.classList.add("show");
}else{
div.classList.add("incorrect");
btns.forEach(function(b){
if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-bad");
if(b.textContent.indexOf(correct+")")===0)b.classList.add("show-ok");
});
fbBad.classList.add("show");
}
}
});

var sb=document.createElement("div");
sb.className="score-bar";
sb.innerHTML="<div class=\"num\" id=\"sc-"+k+"\">"+scores[k]+"/5</div><div class=\"lbl\">"+TEXT_SCORE+"</div>";
exSec.appendChild(sb);

card.appendChild(exSec);
area.appendChild(card);
}

function chk(eid,sel,correct){
if(answered[eid])return;
answered[eid]={sel:sel};
var ex=document.getElementById(eid);
var btns=ex.querySelectorAll(".opt-btn");
btns.forEach(function(b){b.disabled=true});
var k=eid.match(/s\d+/)[0];
if(sel===correct){
ex.classList.add("correct");
btns.forEach(function(b){if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-ok")});
document.getElementById("fbok-"+eid).classList.add("show");
scores[k]=(scores[k]||0)+1;
}else{
ex.classList.add("incorrect");
btns.forEach(function(b){
if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-bad");
if(b.textContent.indexOf(correct+")")===0)b.classList.add("show-ok");
});
document.getElementById("fbbad-"+eid).classList.add("show");
}
document.getElementById("sc-"+k).textContent=scores[k]+"/5";

if(allAnswered(curStep)){
renderStepTabs();
}

if(curStep===4&&allAnswered(4)){
setTimeout(function(){
var sf=document.getElementById("summaryFinal");
var sl=document.getElementById("summaryList");
sl.innerHTML=DATA.summary.map(function(s){return "<li>"+s+"</li>"}).join("");
var total=0;
for(var i=0;i<5;i++)total+=(scores["s"+i]||0);
var ts=document.getElementById("totalScore");
if(ts)ts.innerHTML="<div class=\"big\">"+total+"/25</div><div class=\"small\">"+TEXT_TOTAL+"</div>";
sf.classList.add("show");try{var _t=0;for(var _i=0;_i<5;_i++)_t+=(scores["s"+_i]||0);window.dispatchEvent(new CustomEvent("jucum:done",{detail:{score:Math.round(_t/25*100)}}));}catch(e){}
sf.scrollIntoView({behavior:"smooth"});
},500);
}
}

renderStepTabs();renderCard();
</script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
