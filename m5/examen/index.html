<style>

rrect":"changed","why":{"es":"⏮️ El <b>-ed</b> al final avisa que la acción ya terminó: change (cambiar) → chang<b>ed</b> (cambió).","en":"-ed = past."}},{"part":"L","lvl":2,"type":"single","audio":"His ears were soft.","prompt":{"es":"🔊 ¿Qué dice de sus orejas?","en":"What does he say about his ears?"},"opts":["Que eran suaves","Que son grandes","Que están frías"],"correct":"Que eran suaves","why":{"es":"👂 <b>were</b> = eran/estaban (pasado de «are», para varios). <b>soft</b> = suave.","en":"were soft."}},{"part":"L","lvl":3,"type":"single","audio":"Were you at home yesterday?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["Yes, I was.","Yes, I were.","Yes, I am.","Yes, I did."],"correct":"Yes, I was.","why":{"es":"✅ Con <b>Were you…?</b> la respuesta corta es «Yes, I <b>was</b>» (nunca «I were»).","en":"Yes, I was."}},{"part":"L","lvl":3,"type":"single","audio":"What did you cook yesterday?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["I cooked eggs and rice.","I cook eggs and rice.","Yes, I did cook.","I am cooking eggs."],"correct":"I cooked eggs and rice.","why":{"es":"🍳 La pregunta es de PASADO (did) → la respuesta también lleva <b>-ed</b>: «I <b>cooked</b>» (cociné). «I cook» es costumbre y «I am cooking» es ahora mismo.","en":"I cooked."}},{"part":"L","lvl":2,"type":"single","audio":"Plants grow slowly.","prompt":{"es":"🔊 ¿Cómo crecen las plantas?","en":"How do plants grow?"},"opts":["Despacio","Rápido","De noche"],"correct":"Despacio","why":{"es":"🌱 <b>grow</b> = crecer · <b>slowly</b> = despacio (es un adverbio: dice CÓMO se hace la acción).","en":"slowly."}},{"part":"L","lvl":2,"type":"single","rev":4,"audio":"She is cooking in the kitchen.","prompt":{"es":"🔁 Repaso del M4 · 🔊 ¿Qué está haciendo?","en":"What is she doing?"},"opts":["Está cocinando ahora","Cocina todos los días","Cocinó ayer"],"correct":"Está cocinando ahora","why": e nervous."],"c":["My hands were cold too."]},"why":{"es":"🔍 <b>was</b> = era/estaba (uno) · <b>were</b> = eran/estaban (varios: my hands). ¡Fíjate en cuántos son!","en":"was vs were."}},{"part":"R","lvl":3,"type":"single","frag":3,"prompt":{"es":"El texto dice «Nature changes all the time». ¿Qué muestra ese cambio en el jardín?","en":"What shows that change?"},"opts":["Que unas hojas están verdes y otras amarillas","Que la abuela riega las plantas","Que el cielo estaba azul"],"correct":"Que unas hojas están verdes y otras amarillas","why":{"es":"🍃 El texto usa las hojas como ejemplo: «Some leaves are green. Other leaves are yellow» — el color muestra el cambio.","en":"leaves change color."}},{"part":"R","lvl":3,"type":"seq","prompt":{"es":"Ordena la conversación (1 → 5):","en":"Order the conversation (1 → 5):"},"items":["Hi Ana! Were you at abuela’s house yesterday?","Yes, I was. We visited her garden.","Nice! What did you do there?","I watered the plants with her.","That is great! I want to go next Sunday."],"why":{"es":"💬 Pistas: «Yes, I was» solo responde a una pregunta con <b>Were</b>; «I watered the plants» responde a <b>What did you do?</b>; el deseo final cierra la charla.","en":"Conversation logic."}},{"part":"R","lvl":2,"type":"single","rev":4,"text":"In the kitchen, mom is cooking. She is making her famous soup. Dad is reading his emails.","prompt":{"es":"🔁 Repaso del M4 · ¿Qué está haciendo el papá?","en":"What is dad doing?"},"opts":["Leyendo sus correos","Cocinando la sopa","Pintando"],"correct":"Leyendo sus correos","why":{"es":"📧 «Dad <b>is reading</b> his emails» = está leyendo sus correos. 🔁 Repaso del M4.","en":"is reading emails."}},{"part":"R","lvl":3,"type":"boxes","single":true,"prompt":{"es":"Coloca cada trozo del texto frente a su significado:","en":"Match each piece with its meaning:"},"chips":["Coco was very small.","His ears were soft.","I added a little salt.","The water was very cold."],"boxes":[{"id":"a","lab":"Coco era muy pequeño."}, ":"Complemento (el resto)"}],"key":{"S":["Mom"],"V":["opened"],"C":["two eggs"]},"why":{"es":"👤 Sujeto = Mom · 🏃 Verbo = <b>opened</b> (open + ed = pasado) · 🎯 Complemento = two eggs. En pasado el verbo NO cambia por el sujeto: todos usan «opened».","en":"Subject · verb · complement."}},{"part":"G","lvl":2,"type":"boxes","prompt":{"es":"Coloca cada sujeto en la columna de su verbo:","en":"Sort each subject by its verb:"},"chips":["I","they","my dog","we","she","the eggs"],"boxes":[{"id":"was","lab":"… WAS"},{"id":"were","lab":"… WERE"}],"key":{"was":["I","my dog","she"],"were":["they","we","the eggs"]},"why":{"es":"⏮️ Pasado de «to be»: <b>was</b> con I, he, she, it y una cosa/persona · <b>were</b> con we, you, they y varias cosas.","en":"was vs were."}},{"part":"G","lvl":2,"type":"tap","prompt":{"es":"Toca la palabra INCORRECTA: 👆","en":"Tap the INCORRECT word:"},"words":["Yesterday","I","water","the","plants."],"err":2,"fix":"watered","why":{"es":"📅 «Yesterday» avisa que ya pasó → el verbo lleva <b>-ed</b>: water<b>ed</b>.","en":"watered."}},{"part":"G","lvl":2,"type":"tap","prompt":{"es":"Toca la palabra INCORRECTA: 👆","en":"Tap the INCORRECT word:"},"words":["My","hands","was","very","cold."],"err":2,"fix":"were","why":{"es":"✋ «My hands» son varias → <b>were</b>. «was» es para uno solo.","en":"were."}},{"part":"G","lvl":1,"type":"order","prompt":{"es":"Ordena las fichas: 🧩","en":"Order the chips:"},"tr":"«Ayer cociné el desayuno.»","chips":["Yesterday","I","cooked","breakfast."],"why":{"es":"🧩 Pasado simple: sujeto + verbo con <b>-ed</b> + resto. La palabra de tiempo puede ir al inicio.","en":"Yesterday I cooked breakfast."}},{"part":"G","lvl":2,"type":"order","prompt":{"es":"Ordena las fichas para hacer la PREGUNTA: 🧩","en":"Order the chips (question):"},"tr":"«¿Estabas en casa ayer?»","chips":["Were","you","at","home","yesterday?"],"why":{"es":"❓ Pregunta con el pasado de «to be»: <b>Were</b> + sujeto + resto. Nunca «Did you were».","en":"Were you at home yesterday?"}},{"part":"G","lvl":2,"type":"single","prompt":{"es":"Completa: «Yesterday the water ___ very fast.» (change → pasado) 💧","en":"Complete: \"Yesterday the water ___ very fast.\""},"opts":["changed","changing","change"],"correct":"changed","why":{"es":"🍃 Para el pasado se agrega <b>-ed</b>: change → chang<b>ed</b> (la «e» final se pierde). «changing» es la forma -ing y «change» es el presente.","en":"changed."}},{"part":"G","lvl":3,"type":"single","prompt":{"es":"¿Cuál está en PASADO?","en":"Which one is in the PAST?"},"opts":["I washed the apple.","I wash the apple.","I am washing the apple."],"correct":"I washed the apple.","why":{"es":"⏮️ <b>washed</b> (con -ed) = ya lo hice · <b>wash</b> = costumbre · <b>am washing</b> = ahora mismo.","en":"washed = past."}},{"part":"G","lvl":2,"type":"single","rev":4,"prompt":{"es":"🔁 Repaso del M4 · Completa: «She ___ cooking right now.»","en":"Complete: \"She ___ cooking right now.\""},"opts":["is","does","was"],"correct":"is","why":{"es":"👩‍🍳 «right now» → Present Continuous: <b>is</b> + cooking. 🔁 Repaso del M4.","en":"is cooking."}},{"part":"G","lvl":3,"type":"boxes","prompt":{"es":"Coloca cada verbo según cómo forma su pasado:","en":"Sort each verb by its past ending:"},"chips":["wash","want","change","close"],"boxes":[{"id":"ed","lab":"+ ED (washed)"},{"id":"d","lab":"termina en E: + D (changed)"}],"key":{"ed":["wash","want"],"d":["change","close"]},"why":{"es":"⏮️ Si el verbo termina en consonante se agrega <b>-ed</b> (washed, wanted); si ya termina en <b>e</b>, solo se agrega <b>-d</b> (changed, closed).","en":"-ed vs -d."}},{"part":"G","lvl":3,"type":"tap","prompt":{"es":"Toca la palabra INCORRECTA: 👆","en":"Tap the INCORRECT word:"},"words":["Yesterday","the","eggs","change","color","fast."],"err":3,"fix":"changed","why":{"es":"🍳 «Yesterday» pide pasado → chang<b>ed</b>.","en":"changed."}}],"kids":[{"part":"L","lvl":1,"type":"single","audio":"The apple is green.","prompt":{"es":"🔊 Escucha y elige la imagen cor let lang='es',QS=[],LIMIT=0,picks=[],plays=[],cur=0,remain=0,timer=null,startedAt=0,exits=0,submitted=false,lastTimedOut=false,myAttempts=[];
const fmt=s=>Math.floor(s/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
function fy(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[.?!¿¡,]+\s*$/,'').replace(/\s+/g,' ').trim();}
function eqSet(a,b){if(a.length!==b.length)return false;const s=new Set(a);return b.every(x=>s.has(x));}
function isRight(q,p){
  if(!q||p==null)return false;
  if((q.type==='order'||q.type==='multi')&&!Array.isArray(p))return false;
  if(q.type==='single')return p===q.correct;
  if(q.type==='multi')return Array.isArray(p)&&eqSet(p,q.correct);
  if(q.type==='write')return q.acc.some(a=>norm(a)===norm(p));
  if(q.type==='tap')return p===q.err;
  if(q.type==='order')return Array.isArray(p)&&p.length===q.chips.length&&p.every((c,i)=>c===q.chips[i]);
  if(q.type==='boxes'){const st=p||{};const n=[].concat.apply([],Object.keys(st).map(k=>st[k]||[])).length;
    return n===q.chips.length&&Object.keys(q.key).every(k=>eqSet(st[k]||[],q.key[k]));}
  if(q.type==='cloze')return Object.keys(q.key).every(g=>(p||{})[g]===q.key[g]);
  if(q.type==='match')return q.left.every((_,li)=>(p||{})[li]===li);
  if(q.type==='seq')return Array.isArray(p)&&p.length===q.items.length&&p.every((v,x)=>v===x);
  return false;
}
function isAnswered(i){const q=QS[i],p=picks[i];
  if(p==null)return false;
  if(q.type==='multi')return p.length>0;
  if(q.type==='write')return String(p).trim()!=='';
  if(q.type==='order')return p.length===q.chips.length;
  if(q.type==='boxes')return [].concat.apply([],Object.keys(p).map(k=>p[k]||[])).length===q.chips.length;
  if(q.type==='cloze')return Object.keys(q.key).every(g=>!!p[g]);
  if(q.type==='match')return Object.keys(p).length===q.left.length;
  if(q.type==='seq')return Array.isArray(p)&&p.length===q.items.length;
  return true;}
function ansText(q,p){
  if(!q||p==null)return null;
  if(q.type==='order'&&!Array.isArray(p))return String(p);
  if(q.type==='multi'&&!Array.isArray(p))return String(p);
  if(q.type==='tap')return q.words[p];
  if(q.type==='boxes')return q.boxes.map(b=>b.lab+': '+((p||{})[b.id]||[]).join(' / ')).join(' · ');
  if(q.type==='cloze')return Object.keys(q.key).map((g,x)=>(x+1)+') '+((p||{})[g]||'—')).join(' · ');
  if(q.type==='match')return q.left.map((tx,li)=>(li+1)+') '+(q.right[(p||{})[li]]||'—')).join(' · ');
  if(q.type==='seq')return (Array.isArray(p)?p:[]).map(x=>q.items[x]).join(' → ');
  if(q.type==='order')return p.join(' ');
  if(Array.isArray(p))return p.length?p.join(', '):null;
  return String(p).trim()||null;}
function corrText(q){
  if(q.type==='single')return q.correct;
  if(q.type==='multi')return q.correct.join(', ');
  if(q.type==='write')return q.show||q.acc[0];
  if(q.type==='tap')return '«'+q.words[q.err]+'» → '+q.fix;
  if(q.type==='boxes')return q.boxes.map(b=>b.lab+': '+(q.key[b.id]||[]).join(' / ')).join(' · ');
  if(q.type==='cloze')return Object.keys(q.key).map((g,x)=>(x+1)+') '+q.key[g]).join(' · ');
  if(q.type==='match')return q.left.map((tx,li)=>tx+' → '+q.right[li]).join(' · ');
  if(q.type==='seq')return q.items.map((tx,x)=>(x+1)+') '+tx).join(' · ');
  if(q.type==='order')return q.chips.join(' ');
  return '';}

let accent='US';let rateMode='normal';function toggleRate(i){rateMode=rateMode==='slow'?'normal':'slow';renderQ(i);}
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];const want=accent==='UK'?'en-gb':'en-us';
  let v=vs.find(x=>x.lang&&x.lang.toLowerCase().replace('_','-').startsWith(want)&&/google/i.test(x.name));
  if(!v)v=vs.find(x=>x.lang&&x.lang.toLowerCase().replace('_','-').startsWith(want));
  if(!v)v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'));
  return v||null;}catch(e){return null;}}
function say(text){try{if(!('speechSynthesis'in window)){toast('🔇 Tu navegador no tiene voz');return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=(rateMode==='slow'?0.6:0.9);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang=accent==='UK'?'en-GB':'en-US';
  speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.onvoiceschanged=function(){pickVoice();};}catch(e){}
function playAudio(i){const q=QS[i];if(!q.audio)return;
  if((plays[i]||0)>=3){toast(T[lang].noPlays);return;}
  plays[i]=(plays[i]||0)+1;say(q.audio);saveProg();
  const el=document.getElementById('pl'+i);if(el)el.textContent=Math.max(0,3-plays[i])+' '+T[lang].plays;
  if(plays[i]>=3){const b=document.getElementById('pb'+i);if(b)b.disabled=true;}}
function cycleAcc(){accent=accent==='US'?'UK':'US';document.querySelectorAll('.accb').forEach(b=>b.textContent=accent==='US'?'🇺🇸 US':'🇬🇧 UK');}

/* ═══════════ PERSISTENCIA DE PROGRESO (resume) ═══════════ */
function saveProg(){if(submitted)return;try{localStorage.setItem(PROGKEY(),JSON.stringify({v:VARIANT,s:startedAt,p:picks,c:cur,x:exits,pl:plays}));}catch(e){}}
function loadProg(){try{return JSON.parse(localStorage.getItem(PROGKEY())||'null');}catch(e){return null;}}
function clearProg(){try{localStorage.removeItem(PROGKEY());}catch(e){}}

/* ═══════════ RUTEO ═══════════ */
function hideAll(){['hub','mbody','results','reviewview','teacherview'].forEach(id=>{const e=document.getElementById(id);e.style.display='none';e.classList.remove('show');});
  document.getElementById('timerBox').style.display='none';document.getElementById('counter').style.display='none';document.getElementById('pfill').style.width='0';}
async function route(){
  hideAll();stopTimer();
  if(IS_TEACHER){document.getElementById('teacherview').style.display='block';renderTeacher();return;}
  document.getElementById('hub').style.display='block';
  if(!VARIANT||!BANK[VARIANT]){renderPicker();return;}
  QS=BANK[VARIANT];LIMIT=LIMITS[VARIANT];
  myAttempts=await loadMyAttempts();
  renderHub();
}
function renderPicker(){
  const t=T[lang];
  document.getElementById('hub').innerHTML=langHTML()+
  `<div class="intro-hero"><div class="em">🎓</div><h1>${t.hubT}</h1><p>${t.hubS}</p></div>
   <div class="card"><h3>${t.pickT}</h3><p style="font-size:12px;color:var(--text-soft);margin:0;line-height:1.5">${t.pickS}</p>
   <div class="vpick">
     <button onclick="chooseVariant('kids')"><span class="ve">🧒</span><b>Niños</b><span>${VMETA.kids.qs} preguntas · ${VMETA.kids.min} min · aprueba con ${VMETA.kids.pass}</span></button>
     <button onclick="chooseVariant('adults')"><span class="ve">🧑</span><b>Adultos</b><span>${VMETA.adults.qs} preguntas · ${VMETA.adults.min} min · aprueba con ${VMETA.adults.pass}</span></button>
   </div></div>`;
}
function chooseVariant(v){VARIANT=v;route();}
function langHTML(){return `<div class="langsw"><span class="lsw-lab">🌐</span><div class="lsw"><button class="${lang==='es'?'on':''}" onclick="setLang('es')">Español</button><button class="${lang==='en'?'on':''}" onclick="setLang('en')">English</button></div></div>`;}
function renderHub(){
  const t=T[lang],vm=VMETA[VARIANT];
  const done=myAttempts.length>0&&!ALLOW_RETRY;
  const prog=loadProg();
  const inProgress=prog&&prog.v===VARIANT&&!done;
  const counts={};QS.forEach(q=>counts[q.part]=(counts[q.part]||0)+1);
  const partsHTML=PORDER.map(p=>`<div class="pmini"><div class="pe">${PARTS[p].emo}</div><b>${PARTS[p].name[lang]}</b><span>${counts[p]} · ${PARTS[p].w}%</span></div>`).join('');
  let mid='';
  if(done){
    const a=myAttempts[0];
    const passed=a.score>=passMark((a.sections&&a.sections._v)||VARIANT);
    const bank=BANK[(a.sections&&a.sections._v)||VARIANT]||QS;
    mid=`<div class="card" style="text-align:center"><div style="font-size:38px">${passed?'🎉':'🌱'}</div><h3 style="justify-content:center">${t.done1}</h3>
      <div style="font-family:var(--font-display);font-weight:600;font-size:38px;color:${passed?'var(--correct)':'#B26A00'}">${a.score}<span style="font-size:16px;color:#999">/100</span></div>
      <div style="display:inline-block;margin-top:4px;font-size:12px;font-weight:800;border-radius:14px;padding:4px 14px;background:${passed?'var(--correct-bg)':'#FFF7E8'};color:${passed?'var(--correct)':'#9A3412'}">${passed?t.passedChip:t.failChip}</div>
      <p style="font-size:12.5px;color:var(--text-soft);line-height:1.55;margin:8px 0 0;font-weight:600">${t.done2}</p>
      <button class="rev-toggle" onclick="toggleRev('hubrev',this)">${t.revShow}</button><div class="review" id="hubrev" style="text-align:left">${sameBank(a)?buildReview(a.answers,bank,'s'):oldVerNote()}</div></div>`;
  }else{
    mid=`<div class="card"><h3>📋 ${lang==='es'?'Reglas del examen':'Exam rules'}</h3><ul>${t.rules.map(r=>`<li>${r}</li>`).join('')}</ul></div>
      <div class="neuro"><span class="nem">🧠</span><div>${t.neuroHub}</div></div>
      <button class="start-btn" onclick="startExam(${inProgress?'true':'false'})">${inProgress?t.resume:t.start}</button>
      <div class="limitnote">⏱ <span>${lang==='es'?'➡️ Avance lineal: al pasar de pregunta no puedes volver.':'➡️ One-way: you cannot return to a question.'}<br>${vm.qs} ${lang==='es'?'preguntas':'questions'} · <b>${vm.min} min</b> · ${lang==='es'?'4 partes':'4 parts'}: 🎧 📖 🔤 📝 · ${lang==='es'?'apruebas con':'pass mark'} <b>${vm.pass}</b></span></div>`;
  }
  document.getElementById('hub').innerHTML=langHTML()+
    `${(!UID&&!IS_TEACHER)?`<div class="demo-flag">${t.demo}</div>`:''}
     <div class="intro-hero"><div class="em">${vm.emo} 🎓</div><h1>${t.hubT}</h1><p>${t.hubS} · ${lang==='es'?'Versión':'Version'} ${vm.label}</p></div>
     <div class="partsrow">${partsHTML}</div>${mid}`;
}

/* ═══════════ TIMER ═══════════ */
function startTimer(){stopTimer();paintTimer();timer=setInterval(()=>{remain=LIMIT-Math.floor((Date.now()-startedAt)/1000);paintTimer();if(remain<=900&&chimed<2){chimed++;chime();toast('⏱ Quedan 15 minutos — vas bien, respira y sigue con calma 🌿');setTimeout(function(){if(chimed<2){chimed++;chime();}},8000);}if(remain<=0){stopTimer();lastTimedOut=true;submitExam(true);}},1000);}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function paintTimer(){const b=document.getElementById('timerBox');document.getElementById('timer').textContent=fmt(remain);
  b.className='mh-timer'+(remain<=60?' crit':remain<=300?' warn':'');}

/* ═══════════ EXAMEN ═══════════ */
function startExam(resume){
  const prog=resume?loadProg():null;
  if(prog&&prog.v===VARIANT){startedAt=prog.s;picks=prog.p||[];cur=Math.min(prog.c||0,QS.length-1);exits=prog.x||0;plays=prog.pl||[];}
  else{startedAt=Date.now();picks=new Array(QS.length).fill(null);plays=new Array(QS.length).fill(0);cur=0;exits=0;}
  while(picks.length<QS.length)picks.push(null);
  submitted=false;lastTimedOut=false;
  remain=LIMIT-Math.floor((Date.now()-startedAt)/1000);
  if(remain<=0){lastTimedOut=true;hideAll();document.getElementById('mbody').style.display='block';submitExam(true);return;}
  saveProg();
  hideAll();
  document.getElementById('mbody').style.display='block';
  document.getElementById('counter').style.display='inline-block';
  document.getElementById('timerBox').style.display='flex';
  document.getElementById('tq').textContent=QS.length;
  renderQ(cur);startTimer();window.scrollTo({top:0});
}
function partBanner(i){
  const q=QS[i];const first=i===0||QS[i-1].part!==q.part;
  if(!first)return '';
  const pm=PARTS[q.part];const idx=PORDER.indexOf(q.part)+1;
  return `<div class="partban"><div class="pbh"><span class="pe">${pm.emo}</span><div><b>${T[lang].partOf} ${idx} · ${pm.name[lang]}</b><span>${pm.w}% ${lang==='es'?'de la nota':'of the score'}</span></div></div><div class="pbb">${pm.instr[lang]}</div></div>`;
}
function passageHTML(q){
  if(q.frag==null)return '';
  const set=PASSAGES[VARIANT];
  const frs=q.frag===0?set:[set[q.frag-1]];
  return frs.map(f=>`<div class="passage"><div class="plab">📖 ${f.t}</div>${f.p.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`).join('');
}
function bodyHTML(q,i){
  const t=T[lang],p=picks[i];
  if(q.type==='single'||q.type==='multi'){
    const multi=q.type==='multi';
    const shuf=q._shuf||(q._shuf=fy(q.opts));
    return `<div class="opts${q.pics?' pics':''}" id="op${i}">${shuf.map(o=>{
      const sel=multi?(Array.isArray(p)&&p.includes(o)):p===o;
      if(q.pics){const sc=String(q.pics[o]||'🖼️');
        return `<button class="opt pic ${sel?'sel':''}" data-v="${esc(o)}" onclick="pick(${i},this)"><span class="pcell">${sc}</span><span>${esc(o)}</span></button>`;}
      return `<button class="opt ${multi?'multi':'single'} ${sel?'sel':''}" data-v="${esc(o)}" onclick="pick(${i},this)"><span class="mk"></span><span>${esc(o)}</span></button>`;}).join('')}</div>`;
  }
  if(q.type==='write')return `${q.text?`<div class="qquote">${esc(q.text)}</div>`:''}<input class="win" id="wi${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t.writeHere}" value="${p?esc(p):''}" oninput="writeIn(${i},this.value)">`;
  if(q.type==='tap')return `<div class="words" id="tp${i}">${q.words.map((w,x)=>`<button class="wd ${p===x?'sel':''}" onclick="tapWord(${i},${x})">${esc(w)}</button>`).join('')}</div><div class="winlab">${t.tapNote}</div>`;
  if(q.type==='order'){
    const chosen=Array.isArray(p)?p:[];
    const bag=q._bag||(q._bag=fy(q.chips.map((c,x)=>c+'\u2063'+x)));  /* fichas únicas aunque se repita palabra */
    const left=bag.filter(tk=>{const w=tk.split('\u2063')[0];const used=chosen.filter(c=>c===w).length;const before=bag.slice(0,bag.indexOf(tk)).filter(b=>b.split('\u2063')[0]===w).length;return before>=used;});
    return `<div class="ordlab">${t.orderTap}</div><div class="ordans" id="oa${i}">${chosen.map((w,x)=>`<button class="wd" onclick="ordRemove(${i},${x})">${esc(w)}</button>`).join('')}</div>
      <div class="ordlab">${t.orderBank}</div><div class="ordbank" id="ob${i}">${left.map(tk=>`<button class="wd" onclick="ordAdd(${i},'${esc(tk.split('\u2063')[0]).replace(/'/g,"\\'")}')">${esc(tk.split('\u2063')[0])}</button>`).join('')}</div>`;
  }
  if(q.type==='boxes'){
    const st=picks[i]||{},placed=[].concat.apply([],Object.keys(st).map(k=>st[k]||[]));
    const bag=q._sh||(q._sh=fy(q.chips)),pool=bag.filter(c=>placed.indexOf(c)<0);
    return `<div class="ordlab">${t.poolNote}</div><div class="pool" id="pl${i}">${pool.length?pool.map(c=>`<button class="wd ${SEL[i]===c?'sel':''}" data-c="${esc(c)}" onclick="bxSel(${i},this.dataset.c)">${esc(c)}</button>`).join(''):`<span class="winlab">${t.allPlaced}</span>`}</div>
      <div class="bxs c${q.boxes.length>=3?3:2}">${q.boxes.map(b=>`<div class="bx ${SEL[i]?'hit':''}" onclick="bxDrop(${i},'${b.id}')"><div class="bxl">${esc(b.lab)}</div><div class="slot">${(st[b.id]||[]).map(c=>`<button class="wd" data-c="${esc(c)}" onclick="bxBack(event,${i},this.dataset.c)">${esc(c)}</button>`).join('')}</div></div>`).join('')}</div>`;
  }
  if(q.type==='cloze'){
    const st=picks[i]||{},used=Object.keys(st).map(k=>st[k]).filter(Boolean);
    const bag=q._sh||(q._sh=fy(q.bank)),pool=bag.filter(w=>used.indexOf(w)<0);
    return `<div class="ordlab">${t.poolNote}</div><div class="pool" id="pl${i}">${pool.length?pool.map(w=>`<button class="wd ${SEL[i]===w?'sel':''}" data-c="${esc(w)}" onclick="bxSel(${i},this.dataset.c)">${esc(w)}</button>`).join(''):`<span class="winlab">${t.bankEmpty}</span>`}</div>
      <div class="stx">${q.text.map(p=>typeof p==='string'?esc(p):`<span class="gapw ${st[p.g]?'':'empty'}" onclick="clzTap(${i},'${p.g}')">${st[p.g]?esc(st[p.g]):'______'}</span>`).join('')}</div>`;
  }
  if(q.type==='match'){
    const st=picks[i]||{},rord=q._rord||(q._rord=fy(q.right.map((_,j)=>j)));
    return `<div class="ordlab">${t.mtNote}</div><div class="mt"><div class="mtc">${q.left.map((tx,li)=>`<button class="mti ${MSEL[i]===li?'on':''}" onclick="mtL(${i},${li})">${st[li]!=null?`<span class="mtn" style="background:${PAIRC[li%4]}">${li+1}</span>`:''}<span>${esc(tx)}</span></button>`).join('')}</div>
      <div class="mtc">${rord.map(j=>{const own=Object.keys(st).filter(k=>st[k]===j)[0];return `<button class="mti" onclick="mtR(${i},${j})">${own!=null?`<span class="mtn" style="background:${PAIRC[Number(own)%4]}">${Number(own)+1}</span>`:''}<span>${esc(q.right[j])}</span></button>`;}).join('')}</div></div>`;
  }
  if(q.type==='seq'){
    const ord=Array.isArray(picks[i])?picks[i]:[],iord=q._iord||(q._iord=fy(q.items.map((_,x)=>x)));
    return `<div class="ordlab">${t.seqNote}</div><div class="seqbox">${iord.map(x=>{const pz=ord.indexOf(x);return `<button class="sqi ${pz>=0?'on':''}" onclick="sqTap(${i},${x})"><span class="sqn">${pz>=0?pz+1:'·'}</span><span>${esc(q.items[x])}</span></button>`;}).join('')}</div>`;
  }
  return '';
}
const SEL={},MSEL={},PAIRC=['#42A5F5','#66BB6A','#AB47BC','#EF6C00'];
function bxSel(i,c){SEL[i]=(SEL[i]===c?null:c);renderQ(i);}
function bxDrop(i,bid){const q=QS[i];if(!SEL[i])return;const st=Object.assign({},picks[i]||{});
  Object.keys(st).forEach(k=>{st[k]=(st[k]||[]).filter(x=>x!==SEL[i]);});
  if(q.single)st[bid]=[];
  st[bid]=(st[bid]||[]).concat([SEL[i]]);picks[i]=st;SEL[i]=null;saveProg();renderQ(i);}
function bxBack(e,i,c){e.stopPropagation();const st=Object.assign({},picks[i]||{});Object.keys(st).forEach(k=>{st[k]=(st[k]||[]).filter(x=>x!==c);});picks[i]=st;saveProg();renderQ(i);}
function clzTap(i,g){const st=Object.assign({},picks[i]||{});
  if(st[g]){st[g]=null;picks[i]=st;saveProg();renderQ(i);return;}
  if(!SEL[i])return;st[g]=SEL[i];picks[i]=st;SEL[i]=null;saveProg();renderQ(i);}
function mtL(i,li){const st=Object.assign({},picks[i]||{});
  if(st[li]!=null){delete st[li];picks[i]=st;MSEL[i]=null;saveProg();renderQ(i);return;}
  MSEL[i]=(MSEL[i]===li?null:li);renderQ(i);}
function mtR(i,j){const st=Object.assign({},picks[i]||{});const own=Object.keys(st).filter(k=>st[k]===j)[0];
  if(own!=null){delete st[own];picks[i]=st;saveProg();renderQ(i);return;}
  if(MSEL[i]==null)return;st[MSEL[i]]=j;picks[i]=st;MSEL[i]=null;saveProg();renderQ(i);}
function sqTap(i,x){const ord=Array.isArray(picks[i])?picks[i].slice():[];const p=ord.indexOf(x);
  if(p>=0)ord.splice(p,1);else ord.push(x);picks[i]=ord;saveProg();renderQ(i);}
const CHEERS=['🌟 ¡Vas muy bien! Sigue así.','💪 ¡Buen ritmo! Confía en lo que practicaste.','🚀 ¡Ya pasaste otra parte! Respira y continúa.','🌱 Cada pregunta también es práctica. ¡Sigue!','🎯 ¡Excelente concentración! Ya falta menos.','🏅 ¡Tu esfuerzo se nota! Vamos con calma.'];
function renderQ(i){
  cur=i;const q=QS[i],t=T[lang];
  const cheer=(i>0&&i%7===0)?'<div class="cheer">'+CHEERS[Math.floor(i/7-1)%CHEERS.length]+'</div>':'';
  const audio=q.audio?`<div class="audiorow"><button class="playb" id="pb${i}" ${plays[i]>=3?'disabled':''} onclick="playAudio(${i})">${t.play}</button><button class="accb" onclick="toggleRate(${i})" title="Velocidad del audio">${rateMode==='slow'?'🐢 Lento':'🚶 Normal'}</button><button class="accb" onclick="cycleAcc()">${accent==='US'?'🇺🇸 US':'🇬🇧 UK'}</button><span class="playsleft" id="pl${i}">${Math.max(0,3-(plays[i]||0))} ${t.plays}</span></div>`:'';
  const tr=q.tr?`<div class="qtr">(${esc(q.tr)})</div>`:'';
  document.getElementById('qbox').innerHTML=cheer+partBanner(i)+
  `<div class="qcard">
    <div class="qtop"><div class="qnum">${i+1}</div><span class="qsec">${PARTS[q.part].emo} ${PARTS[q.part].name[lang]}</span>${q.rev?`<span class="qrev">🔁 ${lang==='es'?'Repaso':'Review'} M${q.rev}</span>`:''}${q.type==='multi'?`<span class="qmulti">✔ ${lang==='es'?'Marca todas':'Mark all'}</span>`:''}</div>
    ${passageHTML(q)}${audio}<p class="qtext">${q.prompt[lang]}</p>${tr}
    ${typeof q.text==='string'&&q.type!=='write'?`<div class="qquote">${esc(q.text)}</div>`:''}
    ${bodyHTML(q,i)}
    <div class="nav"><button class="nb next" onclick="${i===QS.length-1?'askSubmit()':'nextQ('+i+')'}">${i===QS.length-1?t.finish:t.next}</button></div>
    <div class="oneway">${t.oneway}</div>
  </div>`;
  document.getElementById('cq').textContent=i+1;
  paintDots();progress();window.scrollTo({top:0});
}
function go(i){if(i<0||i>=QS.length)return;if(i<cur){toast(T[lang].noBack);return;}saveProg();renderQ(i);}
function nextQ(i){if(!isAnswered(i)&&!confirm(T[lang].skipQ))return;go(i+1);}
function paintDots(){
  document.getElementById('dots').innerHTML=QS.map((q,i)=>`<span class="dot ${i===cur?'cur':i<cur?(isAnswered(i)?'ans':'skip'):''}">${i+1}</span>`).join('');}
function progress(){document.getElementById('pfill').style.width=(picks.filter((_,i)=>isAnswered(i)).length/QS.length*100)+'%';}
function pick(i,btn){
  const q=QS[i];
  if(q.type==='multi'){const v=btn.dataset.v;let arr=Array.isArray(picks[i])?[...picks[i]]:[];
    if(arr.includes(v))arr=arr.filter(x=>x!==v);else arr.push(v);
    picks[i]=arr;btn.classList.toggle('sel');}
  else{picks[i]=btn.dataset.v;document.querySelectorAll('#op'+i+' .opt').forEach(b=>b.classList.toggle('sel',b===btn));}
  saveProg();paintDots();progress();
}
function writeIn(i,v){picks[i]=v;saveProg();paintDots();progress();}
function tapWord(i,x){picks[i]=x;document.querySelectorAll('#tp'+i+' .wd').forEach((b,bi)=>b.classList.toggle('sel',bi===x));saveProg();paintDots();progress();}
function ordAdd(i,w){let arr=Array.isArray(picks[i])?[...picks[i]]:[];if(arr.length>=QS[i].chips.length)return;arr.push(w);picks[i]=arr;saveProg();renderQ(i);}
function ordRemove(i,x){let arr=[...picks[i]];arr.splice(x,1);picks[i]=arr;saveProg();renderQ(i);}

/* ═══════════ ENTREGA ═══════════ */
function askSubmit(){
  const t=T[lang];const missing=QS.map((_,i)=>i).filter(i=>!isAnswered(i));
  document.getElementById('modal').innerHTML=`<div class="mbox"><div class="me">${missing.length?'🤔':'🎓'}</div><h3>${t.confirmT}</h3>
    <p>${missing.length?t.confirmMiss(missing.length):t.confirmOk}</p>
    <button class="mb1" onclick="closeModal();submitExam(false)">${t.confirmGo}</button>
    <button class="mb2" onclick="closeModal()${missing.length?';go('+missing[0]+')':''}">${t.confirmNo}</button></div>`;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function compute(){
  const agg={};PORDER.forEach(p=>agg[p]={h:0,t:0});
  let correct=0;
  QS.forEach((q,i)=>{agg[q.part].t++;if(isRight(q,picks[i])){agg[q.part].h++;correct++;}});
  let score=0;PORDER.forEach(p=>{const a=agg[p];if(a.t)score+=(a.h/a.t)*PARTS[p].w;});
  score=Math.round(score);
  const answers=QS.map((q,i)=>({i,p:picks[i],ok:isRight(q,picks[i])}));
  return {score,correct,total:QS.length,agg,answers,duration:Math.min(LIMIT,Math.floor((Date.now()-startedAt)/1000))};
}
async function submitExam(timedOut){
  if(submitted)return;submitted=true;stopTimer();try{speechSynthesis.cancel();}catch(e){}
  const A=compute(),t=T[lang];
  const secs={};PORDER.forEach(p=>secs[p]=A.agg[p]);
  secs._v=VARIANT;secs._exits=exits;
  const row={id:'ex-'+(UID||'demo')+'-'+Date.now(),user_id:UID||'demo',module_id:MOD,activity_id:ACT,
    attempt_no:(myAttempts.length||0)+1,score:A.score,correct:A.correct,total:A.total,duration_sec:A.duration,
    timed_out:!!timedOut,sections:Object.assign({_bv:BANKV},secs),answers:A.answers,ready:A.score>=passMark(VARIANT),created_at:new Date().toISOString()};
  myAttempts.push(row);saveLocalAttempt(row);clearProg();cloudSaveAttempt(row);
  try{window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:A.score,pass:passMark(VARIANT),type:'exam',mat:'PreA1_M5_Examen_'+VARIANT,topic:'examen-m5'}}));}catch(e){}
  hideAll();
  const R=document.getElementById('results');R.style.display='block';R.classList.add('show');
  const passed=A.score>=passMark(VARIANT);
  R.innerHTML=`<div class="verdict ${passed?'hi':''}"><div class="em">${passed?'🎉':'🌱'}</div><div class="score">${A.score}<small>/100</small></div><h2>${passed?t.pass:t.fail}</h2><p>${passed?t.passS:t.failS}</p></div>
    ${timedOut?`<div class="timeoutbar" style="display:block">${t.timeout}</div>`:''}
    <div class="strip"><div class="stat"><b>${A.correct}/${A.total}</b><span>${t.hits}</span></div><div class="stat"><b>${fmt(A.duration)}</b><span>${t.time}</span></div><div class="stat"><b>${A.score}</b><span>${t.score}</span></div><div class="stat"><b>${passMark(VARIANT)}</b><span>${t.needed}</span></div></div>
    <div class="rblock"><h3>${t.breakT}</h3><p class="sub">${t.breakS}</p>${PORDER.map(p=>{const a=A.agg[p];if(!a.t)return'';const pc=Math.round(a.h/a.t*100);const col=pc>=75?'#2E7D32':pc>=50?'#F9A825':'#C62828';
      return `<div class="srow"><span class="snm">${PARTS[p].emo} ${PARTS[p].name[lang]}</span><span class="sbar"><i style="width:${pc}%;background:${col}"></i></span><span class="spct" style="color:${col}">${a.h}/${a.t}</span></div>`;}).join('')}</div>
    <div class="rblock" style="background:#FFFDF6"><p style="margin:0;font-size:13px;line-height:1.6;font-weight:600">${t.resNote}</p></div>
    <div class="neuro"><span class="nem">🧠</span><div>${t.neuroEnd}</div></div>
    <button class="rev-toggle" onclick="toggleRev('rev',this)">${t.revShow}</button><div class="review" id="rev">${buildReview(A.answers,QS,'s')}</div>
    <div class="rbtns"><button class="rbtn" onclick="goBack()">${t.backPlat}</button></div>`;
  window.scrollTo({top:0});
}

/* ═══════════ VIGILANCIA DE PESTAÑA ═══════════ */
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&!submitted&&document.getElementById('mbody').style.display==='block'){exits++;saveProg();}
  else if(!document.hidden&&exits>0&&!submitted&&document.getElementById('mbody').style.display==='block'){toast(T[lang].tabWarn);}
});

/* ═══════════ REVISIÓN (alumno y profesor) ═══════════ */
function sameBank(a){return !!(a&&a.sections&&a.sections._bv===BANKV);}
function oldVerNote(){return '<div style="background:#FFF3E0;border:1.5px solid #FFB74D;border-radius:10px;padding:9px 12px;font-size:12px;color:#8A5100;font-weight:700;line-height:1.55">ℹ️ Este intento es de una <b>versión anterior</b> del examen. Se conserva su nota, pero el detalle pregunta por pregunta no se puede mostrar (las preguntas cambiaron).</div>';}
function buildReview(answers,bank,who){const t=T[lang];return (answers||[]).map(x=>{const q=bank&&bank[x.i];if(!q)return'';const yours=ansText(q,x.p);
  return `<div class="rvq"><div class="rvh"><span class="rvn">#${x.i+1} · ${PARTS[q.part].emo} ${PARTS[q.part].name[lang]}</span><span class="rvmark">${x.ok?'✅':'❌'}</span></div>
  <p class="rvp">${q.prompt[lang]}${q.text?` <span style="color:var(--text-soft);font-weight:600">— ${esc(q.text)}</span>`:''}${q.audio?` <span style="color:var(--text-soft);font-weight:600">🎧 "${esc(q.audio)}"</span>`:''}</p>
  <div class="rva">${x.ok?`<span class="good">${t.correctAns}${esc(corrText(q))}</span>`:`<span class="yours">${who==='t'?t.yourAns:t.myAns}${yours?esc(yours):t.noAns}</span><br><span class="good">${t.correctAns}${esc(corrText(q))}</span>`}${q.why?`<div class="rvwhy">💡 ${q.why[lang]||q.why.es}</div>`:''}</div></div>`;}).join('');}
function toggleRev(id,btn){const el=document.getElementById(id);const show=!el.classList.contains('show');el.classList.toggle('show',show);btn.textContent=show?T[lang].revHide:T[lang].revShow;}

/* ═══════════ PANEL DEL PROFESOR ═══════════ */
let tData=null,tGroupSel='';
async function renderTeacher(){
  const t=T[lang],el=document.getElementById('teacherview');
  el.innerHTML=`<div class="t-hero"><h2>👩‍🏫 ${t.tT}</h2><p>${t.tS}</p></div>${langHTML()}<div id="tbody"><div class="empty">${t.tLoad}</div></div>`;
  try{
    const [students,groups,attempts]=await Promise.all([
      sbFetch('users?role=eq.student&select=id,full_name,username,group_id,level'),
      sbFetch('groups?select=id,name,level'),
      sbFetch('diagnostic_attempts?activity_id=eq.'+encodeURIComponent(ACT)+'&order=created_at.asc&select=*')
    ]);
    tData={students:students||[],groups:groups||[],attempts:attempts||[]};
    if(GROUP)tGroupSel=GROUP;
    paintTeacher();
  }catch(e){document.getElementById('tbody').innerHTML=`<div class="empty">${t.tFail}</div>`;}
}
function paintTeacher(){
  const t=T[lang];if(!tData)return;
  const byUser={};tData.attempts.forEach(a=>{(byUser[a.user_id]=byUser[a.user_id]||[]).push(a);});
  const gname={};tData.groups.forEach(g=>gname[g.id]=g.name);
  let studs=tData.students.filter(s=>byUser[s.id]&&byUser[s.id].length);
  if(tGroupSel)studs=studs.filter(s=>s.group_id===tGroupSel);
  studs.sort((a,b)=>byUser[b.id][0].score-byUser[a.id][0].score);
  const groupsWith=[...new Set(tData.students.filter(s=>byUser[s.id]&&byUser[s.id].length).map(s=>s.group_id))];
  const opts=`<option value="">${t.tAll}</option>`+tData.groups.filter(g=>groupsWith.includes(g.id)).map(g=>`<option value="${g.id}" ${g.id===tGroupSel?'selected':''}>${esc(g.name||g.id)}</option>`).join('');
  const avg=studs.length?Math.round(studs.reduce((s,x)=>s+byUser[x.id][0].score,0)/studs.length):0;
  const rows=studs.map(s=>{
    const a=byUser[s.id][0];const sec=a.sections||{};const v=sec._v==='kids'?'🧒':'🧑';const ex=sec._exits||0;
    const ini=(s.full_name||s.username||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const dt=new Date(a.created_at||Date.now());
    const partline=PORDER.map(p=>sec[p]&&sec[p].t?PARTS[p].emo+' '+sec[p].h+'/'+sec[p].t:'').filter(Boolean).join(' · ');
    return `<div class="t-student"><div class="t-srow">
      <div class="t-ava">${ini||'?'}</div>
      <div class="t-sinfo"><b>${esc(s.full_name||s.username||s.id)}</b><span>${esc(gname[s.group_id]||'')} · ${v} · ${dt.toLocaleDateString('es-PE',{day:'numeric',month:'short'})} ${dt.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}${a.timed_out?' · ⏱':''}</span></div>
      ${ex?`<span class="t-flag">📵 ${ex} ${t.tExits}</span>`:''}
      <span class="t-sc" style="color:${a.score>=75?'var(--correct)':a.score>=51?'#B26A00':'var(--wrong)'}">${a.score}</span></div>
      <div class="t-att"><span>${partline}</span><button style="margin-left:auto" onclick='tReview(${JSON.stringify(s.id)})'>${t.view}</button></div></div>`;
  }).join('');
  document.getElementById('tbody').innerHTML=`
    <div class="t-controls"><label>${t.tGroup}</label><select class="t-sel" onchange="tGroupSel=this.value;paintTeacher()">${opts}</select><button class="t-refresh" onclick="renderTeacher()">${t.tRefresh}</button></div>
    <div class="t-summary"><div class="t-sum"><b>${studs.length}</b><span>${t.tDone}</span></div><div class="t-sum"><b>${avg}</b><span>${t.tAvg} /100</span></div></div>
    ${studs.length?rows:`<div class="empty">${t.tNone}</div>`}`;
}
function tReview(sid){
  const a=(tData.attempts.filter(x=>x.user_id===sid))[0];if(!a)return;
  const s=tData.students.find(x=>x.id===sid)||{};const t=T[lang];
  const bank=BANK[(a.sections&&a.sections._v)||'adults'];
  hideAll();const el=document.getElementById('reviewview');el.style.display='block';
  const dt=new Date(a.created_at||Date.now());
  el.innerHTML=`<button class="backbtn" onclick="backToTeacher()">${t.back}</button>
    <div class="rv-head"><div class="big">${a.score}</div><div class="meta"><b>${esc(s.full_name||sid)}</b>
    <span>${a.correct}/${a.total} · ${Math.round((a.duration_sec||0)/60)} min · ${dt.toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'})}${a.timed_out?' · ⏱':''}${(a.sections&&a.sections._exits)?' · 📵 '+a.sections._exits:''}</span></div></div>
    <div style="margin-top:14px">${sameBank(a)?buildReview(a.answers||[],bank,'t'):oldVerNote()}</div>
    <button class="backbtn" style="margin-top:6px" onclick="backToTeacher()">${t.back}</button>`;
  window.scrollTo({top:0});
}
function backToTeacher(){hideAll();document.getElementById('teacherview').style.display='block';paintTeacher();window.scrollTo({top:0});}

/* ═══════════ VARIOS ═══════════ */
function setLang(l){lang=l;
  if(document.getElementById('hub').style.display!=='none'){(!VARIANT||!BANK[VARIANT])?renderPicker():renderHub();}
  if(document.getElementById('mbody').style.display!=='none')renderQ(cur);
  if(document.getElementById('teacherview').style.display!=='none'&&tData)paintTeacher();}
function goBack(){if(document.referrer){history.back();}else{try{window.dispatchEvent(new CustomEvent('jucum:back'));}catch(e){}}}
let chimed=0;function chime(){try{const C=new (window.AudioContext||window.webkitAudioContext)();[0,.35].forEach(function(d){const o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.type='sine';o.frequency.value=d?659:523;g.gain.setValueAtTime(0.0001,C.currentTime+d);g.gain.exponentialRampToValueAtTime(0.12,C.currentTime+d+0.03);g.gain.exponentialRampToValueAtTime(0.0001,C.currentTime+d+0.5);o.start(C.currentTime+d);o.stop(C.currentTime+d+0.55);});}catch(e){}}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.app')){e.preventDefault();toast(T[lang].protect);}});
window.addEventListener('beforeunload',function(){if(!submitted&&document.getElementById('mbody').style.display==='block')saveProg();});

route();
</script>
