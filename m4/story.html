 our family."},{"w":"draw","es":"dibujar","ex":"She is drawing the rain."}];

const STORYDATA = {"1":{"sTitle":"My School","sTitleEs":"Mi escuela","dTitle":"At School","dTitleEs":"En la escuela","paras":[[["My school is not big.","Mi escuela no es grande."],["But it is full of life.","Pero está llena de vida."],["The building is yellow and white.","El edificio es amarillo y blanco."],["A garden grows at the door.","Un jardín crece en la puerta."],["I love this place.","Amo este lugar."]],[["Classes start at eight.","Las clases empiezan a las ocho."],["Before class, we form groups.","Antes de clase, formamos grupos."],["My group has four kids.","Mi grupo tiene cuatro niños."],["We share one big table.","Compartimos una mesa grande."],["Teamwork is fun here.","El trabajo en equipo es divertido aquí."]],[["Our classroom has many objects.","Nuestro salón tiene muchos objetos."],["There are books on the shelves.","Hay libros en los estantes."],["The markers live in a box.","Los plumones viven en una caja."],["A world map covers the wall.","Un mapa del mundo cubre la pared."],["Every object has its place.","Cada objeto tiene su lugar."]],[["Today we are painting.","Hoy estamos pintando."],["I am painting my house.","Estoy pintando mi casa."],["Tomás is painting a green bus.","Tomás está pintando un bus verde."],["The paint gets on our hands.","La pintura llega a nuestras manos."],["Nobody cares one bit.","A nadie le importa ni un poco."]],[["Miss Pilar walks between the tables.","Miss Pilar camina entre las mesas."],["She asks us questions.","Nos hace preguntas."],["\"What are you painting, Mia?\"","«¿Qué estás pintando, Mia?»"],["\"My house, with a garden!\"","«¡Mi casa, con un jardín!»"],["She smiles at my answer.","Sonríe con mi respuesta."]],[["At noon, the bell rings.","Al mediodía, suena el timbre."],["We eat under the big tree.","Comemos bajo el árbol grande."],["Some kids are playing a game.","Algunos niños están jugando un juego."],["Others are reading near the garden.","Otros están leyendo cerca del jardín."],["The hour goes by fast.","La hora pasa rápido."]],[["After lunch, we have computers.","Después del almuerzo, tenemos computación."],["We are learning about email.","Estamos aprendiendo sobre el correo electrónico."],["I am writing my first email.","Estoy escribiendo mi primer correo."],["It goes to my cousin.","Va para mi prima."],["Technology is like magic.","La tecnología es como magia."]],[["My teacher loves her job.","Mi maestra ama su trabajo."],["\"Education opens doors,\" she says.","«La educación abre puertas», dice."],["I think about her words.","Pienso en sus palabras."],["School is my open door.","La escuela es mi puerta abierta."],["I walk in every day.","Entro por ella cada día."]],[["At the end, we clean the room.","Al final, limpiamos el salón."],["The markers go in their box.","Los plumones van a su caja."],["The brushes rest in water.","Los pinceles descansan en agua."],["Our paintings dry near the window.","Nuestras pinturas se secan cerca de la ventana."],["Tomorrow they go home.","Mañana se van a casa."]],[["I walk home with my group.","Camino a casa con mi grupo."],["We talk about the paintings.","Hablamos de las pinturas."],["My house waits at the end.","Mi casa espera al final."],["The real one, not the painting!","¡La de verdad, no la pintada!"],["School days are good days.","Los días de escuela son buenos días."]]],"datos":[null,null,null,"Presente continuo = <b>am/is/are + verbo-ing</b>: <span class=\"frase\">I am painting · Tomás is painting.</span>",null,null,"<b>email</b> = correo electrónico (una sola palabra en inglés).","<b>job</b> = trabajo (el puesto) · <b>education</b> = educación.",null,null],"dlg":[["Miss Pilar","Tomás, what are you doing?","Tomás, ¿qué estás haciendo?"],["Tomás","I am painting, Miss Pilar.","Estoy pintando, Miss Pilar."],["Miss Pilar","What are you painting?","¿Qué estás pintando?"],["Tomás","A big green bus.","Un bus verde grande."],["Miss Pilar","Are you using the markers?","¿Estás usando los plumones?"],["Tomás","No, I am not.","No."],["Tomás","I am using the paint.","Estoy usando la pintura."],["Miss Pilar","Where is your group?","¿Dónde está tu grupo?"],["Tomás","They are working near the window.","Están trabajando cerca de la ventana."],["Miss Pilar","Is Mia painting too?","¿Mia también está pintando?"],["Tomás","Yes, she is.","Sí."],["Tomás","She is painting her house.","Está pintando su casa."],["Miss Pilar","And what is Ana doing?","¿Y qué está haciendo Ana?"],["Tomás","She is washing the brushes.","Está lavando los pinceles."],["Miss Pilar","Great teamwork, kids.","Buen trabajo en equipo, chicos."],["Tomás","Miss, I have a question.","Miss, tengo una pregunta."],["Miss Pilar","Questions are always welcome.","Las preguntas siempre son bienvenidas."],["Tomás","Why do we paint at school?","¿Por qué pintamos en la escuela?"],["Miss Pilar","Good question! Art teaches patience.","¡Buena pregunta! El arte enseña paciencia."],["Tomás","And it is fun!","¡Y es divertido!"],["Miss Pilar","That is the best reason.","Esa es la mejor razón."],["Tomás","Can I add a yellow sun?","¿Puedo agregar un sol amarillo?"],["Miss Pilar","Of course you can.","Claro que puedes."],["Tomás","My bus is going to the beach!","¡Mi bus va a la playa!"],["Miss Pilar","Ha! Send me an email from there.","¡Ja! Mándame un correo desde ahí."],["Tomás","Deal, Miss Pilar!","¡Trato, Miss Pilar!"]]},"2":{"sTitle":"At Home","sTitleEs":"En casa","dTitle":"My Things","dTitleEs":"Mis cosas","paras":[[["Our house is small and warm.","Nuestra casa es pequeña y cálida."],["It has two floors.","Tiene dos pisos."],["My room is up the stairs.","Mi cuarto está subiendo las escaleras."],["Lara's room is next to mine.","El cuarto de Lara está junto al mío."],["Every corner tells a story.","Cada rincón cuenta una historia."]],[["The keys hang near the door.","Las llaves cuelgan cerca de la puerta."],["Dad's key is the big one.","La llave de papá es la grande."],["My key is small and new.","Mi llave es pequeña y nueva."],["I keep it in my bag.","La guardo en mi mochila."],["Big kids carry keys.","Los niños grandes llevan llaves."]],[["The kitchen is my favorite room.","La cocina es mi cuarto favorito."],["Good smells live there.","Los buenos olores viven ahí."],["Mom's plants sit on the window.","Las plantas de mamá están en la ventana."],["A little radio sings all day.","Una radio pequeña canta todo el día."],["Home smells like soup and songs.","El hogar huele a sopa y canciones."]],[["Right now, Lara is painting.","Ahora mismo, Lara está pintando."],["She is using her fingers!","¡Está usando sus dedos!"],["The paint is on her face.","La pintura está en su cara."],["It is on the table too.","También está en la mesa."],["Mom is not looking… yet.","Mamá no está mirando… todavía."]],[["My things live in my room.","Mis cosas viven en mi cuarto."],["The books stand in a line.","Los libros están parados en fila."],["My football waits under the bed.","Mi pelota espera bajo la cama."],["A photo of Ravi and me.","Una foto de Ravi y yo."],["Every object has a memory.","Cada objeto tiene un recuerdo."]],[["At night, we play a game.","De noche, jugamos un juego."],["The name is \"Question Time\".","El nombre es «Hora de preguntas»."],["Everyone asks one question.","Todos hacen una pregunta."],["Dad asks about our day.","Papá pregunta por nuestro día."],["Lara asks about the moon.","Lara pregunta por la luna."]],[["Tonight, mom is working late.","Esta noche, mamá está trabajando hasta tarde."],["Dad is making the dinner.","Papá está preparando la cena."],["He is not a great cook.","No es un gran cocinero."],["But he is trying hard.","Pero se está esforzando."],["The rice looks… interesting.","El arroz se ve… interesante."]],[["After dinner, I do homework.","Después de la cena, hago la tarea."],["Lara is drawing near me.","Lara está dibujando cerca de mí."],["She is not using paint now.","Ya no está usando pintura."],["Only crayons, mom says.","Solo crayones, dice mamá."],["The table stays clean tonight.","La mesa queda limpia esta noche."]],[["Before bed, dad checks the doors.","Antes de dormir, papá revisa las puertas."],["The keys go to their place.","Las llaves van a su lugar."],["The lights go out one by one.","Las luces se apagan una por una."],["The house gets quiet and dark.","La casa queda callada y oscura."],["Only the radio whispers low.","Solo la radio susurra bajito."]],[["A house is walls and doors.","Una casa es paredes y puertas."],["A home is something more.","Un hogar es algo más."],["It is the smell of soup.","Es el olor a sopa."],["It is Lara's painted face.","Es la cara pintada de Lara."],["Home is my favorite place.","El hogar es mi lugar favorito."]]],"datos":[null,"<b>key</b> = llave · plural: key<b>s</b>.",null,"Continuo negativo: <b>is not looking</b> = no está mirando.",null,null,null,null,null,"<b>house</b> = la construcción · <b>home</b> = el hogar (donde vives con los tuyos)."],"dlg":[["Lara","Leo, what is this object?","Leo, ¿qué es este objeto?"],["Leo","That is my old camera.","Esa es mi cámara vieja."],["Lara","Is it working now?","¿Funciona ahora?"],["Leo","No, it is not working.","No, no funciona."],["Leo","But I keep it anyway.","Pero igual la guardo."],["Lara","Why do you keep it?","¿Por qué la guardas?"],["Leo","It was grandpa's camera.","Era la cámara del abuelo."],["Lara","Oh… that is a good reason.","Oh… esa es una buena razón."],["Lara","And what is in this box?","¿Y qué hay en esta caja?"],["Leo","My markers and my cards.","Mis plumones y mis cartas."],["Lara","Can I use the markers?","¿Puedo usar los plumones?"],["Leo","Are your hands clean?","¿Están limpias tus manos?"],["Lara","Yes! Look at them.","¡Sí! Míralas."],["Leo","Okay. Use them on paper.","Bueno. Úsalos en papel."],["Lara","Not on my face?","¿No en mi cara?"],["Leo","Lara! Not on your face!","¡Lara! ¡En tu cara no!"],["Lara","Ha! I am joking.","¡Ja! Estoy bromeando."],["Lara","What is that key?","¿Qué es esa llave?"],["Leo","It opens my secret box.","Abre mi caja secreta."],["Lara","A secret box?! Show me!","¡¿Una caja secreta?! ¡Muéstrame!"],["Leo","Secrets are secrets, little sister.","Los secretos son secretos, hermanita."],["Lara","I can trade my doll!","¡Puedo cambiarla por mi muñeca!"],["Leo","Hmm… tempting. But no.","Mmm… tentador. Pero no."],["Lara","I am not giving up!","¡No me rindo!"],["Leo","Ha! Good luck, detective Lara.","¡Ja! Suerte, detective Lara."],["Lara","Detectives always find things!","¡Los detectives siempre encuentran cosas!"]]},"3":{"sTitle":"What Is Everyone Doing?","sTitleEs":"¿Qué está haciendo cada uno?","dTitle":"What Are You Doing?","dTitleEs":"¿Qué estás haciendo?","paras":[[["It is Sunday afternoon.","Es domingo por la tarde."],["Rain is falling outside.","La lluvia está cayendo afuera."],["Everyone is at home today.","Todos están en casa hoy."],["The house feels full and warm.","La casa se siente llena y cálida."],["Let me show you around.","Déjenme mostrarles la casa."]],[["In the kitchen, mom is cooking.","En la cocina, mamá está cocinando."],["She is making her famous soup.","Está haciendo su sopa famosa."],["The pot is singing on the fire.","La olla está cantando en el fuego."],["Steam is painting the window white.","El vapor está pintando la ventana de blanco."],["The smell walks around the house.","El olor pasea por la casa."]],[["In the living room, dad is reading.","En la sala, papá está leyendo."],["He is not reading a book.","No está leyendo un libro."],["He is reading his work emails.","Está leyendo sus correos del trabajo."],["His face looks very serious.","Su cara se ve muy seria."],["Sundays are not for emails, dad!","¡Los domingos no son para correos, papá!"]],[["Mia is sitting near the window.","Mia está sentada cerca de la ventana."],["She is drawing the rain.","Está dibujando la lluvia."],["Gray drops on white paper.","Gotas grises sobre papel blanco."],["She is using her new markers.","Está usando sus plumones nuevos."],["Her tongue sticks out. Focus!","Su lengua se asoma. ¡Concentración atos":[null,"Continuo afirmativo: <b>is/are + -ing</b>: <span class=\"frase\">mom is cooking · we are eating.</span>","Continuo negativo: <b>is not reading</b> = no está leyendo.",null,null,null,"Pregunta en continuo: <b>What are you doing?</b> = ¿Qué estás/están haciendo?",null,null,null],"dlg":[["Ravi","Hello? Leo? It is Ravi.","¿Aló? ¿Leo? Soy Ravi."],["Leo","Hi, Ravi! What is happening?","¡Hola, Ravi! ¿Qué pasa?"],["Ravi","Are you doing something now?","¿Estás haciendo algo ahora?"],["Leo","I am doing my homework.","Estoy haciendo mi tarea."],["Ravi","On a Saturday?! Why?","¡¿Un sábado?! ¿Por qué?"],["Leo","Ha! I am finishing early.","¡Ja! Estoy terminando temprano."],["Leo","Then I am free all day.","Luego estoy libre todo el día."],["Ravi","Smart. Very smart.","Listo. Muy listo."],["Leo","And you? What are you doing?","¿Y tú? ¿Qué estás haciendo?"],["Ravi","I am watching my brothers.","Estoy cuidando a mis hermanos."],["Leo","What are they doing?","¿Qué están haciendo ellos?"],["Ravi","Dev is fixing his bike.","Dev está arreglando su bici."],["Ravi","Arjun is… hmm…","Arjun está… mmm…"],["Leo","Is he painting the dog again?","¿Está pintando al perro otra vez?"],["Ravi","No! He is not painting anything.","¡No! No está pintando nada."],["Ravi","He is hiding under the table.","Está escondido bajo la mesa."],["Leo","Why is he hiding there?","¿Por qué está escondido ahí?"],["Ravi","We are playing hide and seek.","Estamos jugando a las escondidas."],["Ravi","But he always picks the table.","Pero siempre elige la mesa."],["Leo","Ha! Same place every time.","¡Ja! El mismo lugar cada vez."],["Ravi","Do you want to come?","¿Quieres venir?"],["Leo","Yes! I am finishing this page.","¡Sí! Estoy terminando esta página."],["Ravi","Bring your football too.","Trae tu pelota también."],["Leo","Okay! I am leaving in ten.","¡Ya! Salgo en diez."],["Ravi","See you, homework hero.","Nos vemos, héroe de la tarea."],["Leo","See you, big brother Ravi!","¡Nos vemos, hermano mayor Ravi!"]]},"4":{"sTitle":"A Good Question","sTitleEs":"Una buena pregunta","dTitle":"A Question About Work","dTitleEs":"Una pregunta sobre el trabajo","paras":[[["Questions live in my head.","Las preguntas viven en mi cabeza."],["Big ones and small ones.","Grandes y pequeñas."],["Mom says questions are seeds.","Mamá dice que las preguntas son semillas."],["They grow into answers.","Crecen hasta ser respuestas."],["Today I have a big one.","Hoy tengo una grande."]],[["Dad drives a bus, remember?","Papá maneja un bus, ¿recuerdan?"],["He leaves before the sun.","Sale antes que el sol."],["He comes home very tired.","Llega a casa muy cansado."],["But he always smiles at us.","Pero siempre nos sonríe."],["My question is about that.","Mi pregunta es sobre eso."]],[["At dinner, I ask him.","En la cena, le pregunto."],["\"Dad, do you like your job?\"","«Papá, ¿te gusta tu trabajo?»"],["The table goes quiet.","La mesa queda en silencio."],["Dad puts down his spoon.","Papá baja su cuchara."],["He thinks before speaking.","Piensa antes de hablar."]],[["\"Good question, Mia,\" he says.","«Buena pregunta, Mia», dice."],["\"Yes and no. Listen.\"","«Sí y no. Escucha»."],["\"The hours are very long.\"","«Las horas son muy largas»."],["\"My back hurts some days.\"","«Mi espalda duele algunos días»."],["\"But I meet good people.\"","«Pero conozco buena gente»."]],[["\"An old man rides at seven.\"","«Un señor mayor sube a las siete»."],["\"He always says good morning.\"","«Siempre dice buenos días»."],["\"Kids ride to their school.\"","«Los niños van a su escuela»."],["\"I take them safe and happy.\"","«Los llevo seguros y felices»."],["\"That is a good reason.\"","«Esa es una buena razón»."]],[["\"And there is another reason.\"","«Y hay otra razón»."],["\"This job pays your education.\"","«Este trabajo paga tu educación»."],["\"Your books, your school, your future.\"","«Tus libros, tu escuela, tu futuro»."],["\"That reason wins every morning.\"","«Esa razón gana cada mañana»."],["My eyes get ive more.","Pero los buenos trabajos dan más."],["Mia","More? Like what?","¿Más? ¿Como qué?"],["Papá","Friends, pride, and purpose.","Amigos, orgullo y propósito."],["Mia","Is driving a bus hard?","¿Manejar un bus es difícil?"],["Papá","Some days, yes.","Algunos días, sí."],["Papá","The city gets very loud.","La ciudad se pone muy ruidosa."],["Mia","What is the best part?","¿Cuál es la mejor parte?"],["Papá","The people on my bus.","La gente de mi bus."],["Papá","I know their faces now.","Ya conozco sus caras."],["Mia","Do they know your face?","¿Ellos conocen tu cara?"],["Papá","Ha! Yes, and my name.","¡Ja! Sí, y mi nombre."],["Mia","Why do you work so much?","¿Por qué trabajas tanto?"],["Papá","For a very good reason.","Por una muy buena razón."],["Mia","What reason, dad?","¿Qué razón, papá?"],["Papá","Your education, and Nico's, and Luli's.","Tu educación, la de Nico y la de Luli."],["Mia","School costs money?","¿La escuela cuesta dinero?"],["Papá","Books, uniforms, many things.","Libros, uniformes, muchas cosas."],["Papá","But it is the best money.","Pero es el dinero mejor usado."],["Mia","One day I can work too.","Un día yo también puedo trabajar."],["Papá","First, study. That is your job.","Primero, estudia. Ese es tu trabajo."],["Mia","Then my job is questions!","¡Entonces mi trabajo son las preguntas!"],["Papá","And you are great at it.","Y eres genial en eso."]]}};

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
