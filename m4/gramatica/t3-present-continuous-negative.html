<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Present Continuous — Negativo y Preguntas',en:'Present Continuous — Negative & Questions'}, reportId:'sum-pc-neg-q' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Ya sabes decir lo que pasa <b>ahora</b>: «estoy comiendo». Para <b>negar</b> pones «no» y para <b>preguntar</b> subes el tono.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">está comiendo</div><div class="role">Afirma</div><div class="desc">«Ella está comiendo.»</div></div><div class="art-box"><div class="word">no está comiendo</div><div class="role">Niega</div><div class="desc">«No está comiendo.»</div></div><div class="art-box"><div class="word">¿está comiendo?</div><div class="role">Pregunta</div><div class="desc">«¿Está comiendo?»</div></div></div>
        ${ii('🚫','Negar: pones «no» antes: «No está durmiendo».')}
        ${ii('❓','Preguntar: el verbo «estar» va al frente o subes la voz: «¿Estás trabajando?».')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «No estoy mirando el teléfono» o «¿Qué estás haciendo?». En inglés se usa el verbo «be» (am/is/are) para negar y preguntar.</div>`,
      en:`<div class="gdesc">You already know how to say what\'s happening <b>now</b>: «estoy comiendo». To <b>negate</b> you add «no», and to <b>ask</b> you raise your tone.</div>
        <div class="art-hero three"><div class="art-box"><div class="word">está comiendo</div><div class="role">Affirm</div><div class="desc">«Ella está comiendo.»</div></div><div class="art-box"><div class="word">no está comiendo</div><div class="role">Negate</div><div class="desc">«No está comiendo.»</div></div><div class="art-box"><div class="word">¿está comiendo?</div><div class="role">Ask</div><div class="desc">«¿Está comiendo?»</div></div></div>
        ${ii('🚫','Negate: put «no» before: «No está durmiendo».')}
        ${ii('❓','Ask: the verb «estar» goes to the front or you raise your voice: «¿Estás trabajando?».')}
        <div class="gnote life">🌎 <b>From your life:</b> «No estoy mirando el teléfono» or «¿Qué estás haciendo?». In English you use the verb «be» (am/is/are) to negate and ask.</div>`
    },
    checks:[
      { q:{es:'Para negar «está comiendo» pones:',en:'To negate «está comiendo» you put:'}, opts:{es:['«no» antes','«no» al final'],en:['«no» before','«no» at the end']}, correct:0, fb:{ why:{es:'No está comiendo.',en:'No está comiendo.'}, tip:{es:'no + verbo',en:'no + verb'}} },
      { q:{es:'«¿Está comiendo?» es:',en:'«¿Está comiendo?» is:'}, opts:{es:['Pregunta','Afirmación'],en:['Question','Affirmation']}, correct:0, fb:{ why:{es:'Pregunta lo que pasa ahora.',en:'Asks what\'s happening now.'}, tip:{es:'¿…?',en:'¿…?'}} },
      { q:{es:'Estas frases hablan de algo:',en:'These sentences talk about something:'}, opts:{es:['Que pasa ahora','Del pasado'],en:['Happening now','In the past']}, correct:0, fb:{ why:{es:'Es el presente en proceso.',en:'It\'s the present in progress.'}, tip:{es:'ahora',en:'now'}} },
      { q:{es:'«No está durmiendo» — ¿qué hace el «no»?',en:'«No está durmiendo» — what does «no» do?'}, opts:{es:['Niega la acción','La confirma'],en:['Negates the action','Confirms it']}, correct:0, fb:{ why:{es:'Niega.',en:'It negates.'}, tip:{es:'negar',en:'negate'}} },
      { q:{es:'«¿Qué estás haciendo?» pide:',en:'«¿Qué estás haciendo?» asks for:'}, opts:{es:['Lo que pasa ahora','Lo que pasará'],en:['What\'s happening now','What will happen']}, correct:0, fb:{ why:{es:'Acción actual.',en:'Current action.'}, tip:{es:'ahora',en:'now'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés usa el mismo verbo «be» (am/is/are) + verbo-ing. Para negar agrega «not»; para preguntar, «be» va al frente.</div>
        <div class="vs-grid">
          <div class="vs-row"><div class="vs-side es"><span class="flag">afirma</span>Está comiendo</div><div class="vs-mid">=</div><div class="vs-side en"><span class="flag">+</span>She <b>is eating</b></div></div>
          <div class="vs-row"><div class="vs-side es"><span class="flag">niega</span>No está comiendo</div><div class="vs-mid">=</div><div class="vs-side en"><span class="flag">−</span>She <b>isn't eating</b></div></div>
          <div class="vs-row"><div class="vs-side es"><span class="flag">pregunta</span>¿Está comiendo?</div><div class="vs-mid">=</div><div class="vs-side en"><span class="flag">?</span><b>Is</b> she eating?</div></div>
        </div>
        ${eg('They <span class="tag s">aren\'t playing</span>.','No están jugando.','ok')}
        ${eg('<span class="tag s">Are</span> you working?','¿Estás trabajando?','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos usan «estar/be + verbo-ing» para el ahora.</li><li>Los dos niegan con una palabra (no → not).</li><li>Los dos preguntan poniendo el verbo «be» al frente o cambiando el tono.</li></ul>
        <div class="gnote">👍 isn\'t/aren\'t eating (negar) · Is/Are…eating? (preguntar). Lo nuevo: el orden exacto (siguiente paso).</div>`,
      en:`<div class="gdesc">English uses the same verb «be» (am/is/are) + verb-ing. To negate it adds «not»; to ask, «be» goes to the front.</div>
        <div class="vs-grid">
          <div class="vs-row"><div class="vs-side es"><span class="flag">affirm</span>Está comiendo</div><div class="vs-mid">=</div><div class="vs-side en"><span class="flag">+</span>She <b>is eating</b></div></div>
          <div class="vs-row"><div class="vs-side es"><span class="flag">negate</span>No está comiendo</div><div class="vs-mid">=</div><div class="vs-side en"><span class="flag">−</span>She <b>isn't eating</b></div></div>
          <div class="vs-row"><div class="vs-side es"><span class="flag">ask</span>¿Está comiendo?</div><div class="vs-mid">=</div><div class="vs-side en"><span class="flag">?</span><b>Is</b> she eating?</div></div>
        </div>
        ${eg('They <span class="tag s">aren\'t playing</span>.','They aren\'t playing.','ok')}
        ${eg('<span class="tag s">Are</span> you working?','Are you working?','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both use «estar/be + verb-ing» for the now.</li><li>Both negate with one word (no → not).</li><li>Both ask by putting «be» at the front or changing the tone.</li></ul>
        <div class="gnote">👍 isn\'t/aren\'t eating (negate) · Is/Are…eating? (ask). The new part: the exact order (next step).</div>`
    },
    checks:[
      { q:{es:'«No está comiendo» en inglés:',en:'«No está comiendo» in English:'}, opts:{es:['She isn\'t eating','She not eating'],en:['She isn\'t eating','She not eating']}, correct:0, fb:{ why:{es:'is + not = isn\'t.',en:'is + not = isn\'t.'}, ex:{es:'She isn\'t eating → No está comiendo',en:'She isn\'t eating'}, tip:{es:'isn\'t + -ing',en:'isn\'t + -ing'}}, tr:{es:'Ella no está comiendo.',en:'She isn\'t eating.'} },
      { q:{es:'«¿Estás trabajando?» en inglés:',en:'«¿Estás trabajando?» in English:'}, opts:{es:['Are you working?','You are working?'],en:['Are you working?','You are working?']}, correct:0, fb:{ why:{es:'Are va al frente.',en:'Are goes to the front.'}, ex:{es:'Are you working? → ¿Estás trabajando?',en:'Are you working?'}, tip:{es:'Are + sujeto + -ing',en:'Are + subject + -ing'}}, tr:{es:'¿Estás trabajando?',en:'Are you working?'} },
      { q:{es:'Para negar se agrega:',en:'To negate you add:'}, opts:{es:['not','do'],en:['not','do']}, correct:0, fb:{ why:{es:'be + not (isn\'t/aren\'t).',en:'be + not (isn\'t/aren\'t).'}, tip:{es:'not',en:'not'}} },
      { q:{es:'Para preguntar, ¿qué va al frente?',en:'To ask, what goes to the front?'}, opts:{es:['El verbo be (am/is/are)','El verbo-ing'],en:['The verb be (am/is/are)','The verb-ing']}, correct:0, fb:{ why:{es:'Is she eating?',en:'Is she eating?'}, tip:{es:'be al frente',en:'be to the front'}} },
      { q:{es:'«They aren\'t playing» significa:',en:'«They aren\'t playing» means:'}, opts:{es:['No están jugando','Están jugando'],en:['They aren\'t playing','They are playing']}, correct:0, fb:{ why:{es:'aren\'t = no están.',en:'aren\'t = no están.'}, tip:{es:'aren\'t = no están',en:'aren\'t = no están'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">El orden exacto: para negar va <b>be + not + verbo-ing</b>; para preguntar, <b>be + sujeto + verbo-ing</b>.</div>
        <table class="dtab"><tr><th>Tipo</th><th>Orden</th><th>Ejemplo</th></tr>
          <tr><td>afirmativo</td><td class="en">sujeto + be + -ing</td><td>She is eating.</td></tr>
          <tr><td>negativo</td><td class="en">sujeto + be + not + -ing</td><td>She isn't eating.</td></tr>
          <tr><td>pregunta</td><td class="en">be + sujeto + -ing?</td><td>Is she eating?</td></tr>
        </table>
        <div class="sec-label">⚠️ El verbo «be» es la clave</div>
        ${ii('🚫','Negar: solo agrega «not» a am/is/are → I\'m not, isn\'t, aren\'t. El verbo-ing no cambia.')}
        ${ii('❓','Preguntar: mueve am/is/are al frente: «Are they coming?». Respuesta corta: «Yes, they are».')}
        ${eg('<span class="tag s">Is</span> he <span class="tag s">sleeping</span>?','¿Está durmiendo? (Is al frente)','ok')}
        ${eg('Does she eating?','Con continuous se usa «be», no «do»: «Is she eating?».','bad')}
        <div class="gnote">📍 Negar: be + not + -ing · Preguntar: be + sujeto + -ing. ¡Nunca uses «do/does» aquí!</div>`,
      en:`<div class="gdesc">The exact order: to negate it\'s <b>be + not + verb-ing</b>; to ask, <b>be + subject + verb-ing</b>.</div>
        <table class="dtab"><tr><th>Type</th><th>Order</th><th>Example</th></tr>
          <tr><td>affirmative</td><td class="en">subject + be + -ing</td><td>She is eating.</td></tr>
          <tr><td>negative</td><td class="en">subject + be + not + -ing</td><td>She isn't eating.</td></tr>
          <tr><td>question</td><td class="en">be + subject + -ing?</td><td>Is she eating?</td></tr>
        </table>
        <div class="sec-label">⚠️ The verb «be» is the key</div>
        ${ii('🚫','Negate: just add «not» to am/is/are → I\'m not, isn\'t, aren\'t. The verb-ing doesn\'t change.')}
        ${ii('❓','Ask: move am/is/are to the front: «Are they coming?». Short answer: «Yes, they are».')}
        ${eg('<span class="tag s">Is</span> he <span class="tag s">sleeping</span>?','Is he sleeping? (Is at the front)','ok')}
        ${eg('Does she eating?','With the continuous you use «be», not «do»: «Is she eating?».','bad')}
        <div class="gnote">📍 Negate: be + not + -ing · Ask: be + subject + -ing. Never use «do/does» here!</div>`
    },
    checks:[
      { q:{es:'Negativo: «I ___ working now.» (no estoy):',en:'Negative: «I ___ working now.» (I\'m not):'}, opts:{es:['\'m not','don\'t'],en:['\'m not','don\'t']}, correct:0, fb:{ why:{es:'I am not = I\'m not.',en:'I am not = I\'m not.'}, ex:{es:'I\'m not working → No estoy trabajando',en:'I\'m not working'}, tip:{es:'be + not',en:'be + not'}}, tr:{es:'No estoy trabajando ahora.',en:'I\'m not working now.'} },
      { q:{es:'Pregunta: «___ they coming?»',en:'Question: «___ they coming?»'}, opts:{es:['Are','Do'],en:['Are','Do']}, correct:0, fb:{ why:{es:'be al frente → Are.',en:'be to the front → Are.'}, ex:{es:'Are they coming? → ¿Están viniendo?',en:'Are they coming?'}, tip:{es:'Are + sujeto + -ing',en:'Are + subject + -ing'}}, tr:{es:'¿Están viniendo?',en:'Are they coming?'} },
      { q:{es:'¿Cuál está bien?',en:'Which one is right?'}, opts:{es:['Is she eating?','Does she eating?'],en:['Is she eating?','Does she eating?']}, correct:0, fb:{ why:{es:'Con continuous se usa «be», no «do».',en:'With the continuous you use «be», not «do».'}, ex:{es:'Is she eating? → ¿Está comiendo?',en:'Is she eating?'}, tip:{es:'be, no do',en:'be, not do'}} },
      { q:{es:'Negativo: «He ___ listening.» (no está):',en:'Negative: «He ___ listening.» (isn\'t):'}, opts:{es:['isn\'t','doesn\'t'],en:['isn\'t','doesn\'t']}, correct:0, fb:{ why:{es:'he → isn\'t + -ing.',en:'he → isn\'t + -ing.'}, ex:{es:'He isn\'t listening → No está escuchando',en:'He isn\'t listening'}, tip:{es:'isn\'t + -ing',en:'isn\'t + -ing'}}, tr:{es:'Él no está escuchando.',en:'He isn\'t listening.'} },
      { q:{es:'Respuesta a «Are you studying?» (sí):',en:'Answer to «Are you studying?» (yes):'}, opts:{es:['Yes, I am.','Yes, I do.'],en:['Yes, I am.','Yes, I do.']}, correct:0, fb:{ why:{es:'Con be → Yes, I am.',en:'With be → Yes, I am.'}, ex:{es:'Yes, I am → Sí',en:'Yes, I am'}, tip:{es:'be → am/is/are',en:'be → am/is/are'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Las tres formas, lado a lado:</div>
        <div class="fbox"><div class="frm"><span class="pill s">+ S + be + -ing</span><span class="plus">·</span><span class="pill v">− S + be + not + -ing</span><span class="plus">·</span><span class="pill o">? be + S + -ing</span></div><div class="fex"><span class="s">She is eating</span> · <span class="v">isn't eating</span> · <span class="o">Is she eating?</span></div></div>
        ${ii('🚫','<b>Tip 1 — Negar:</b> agrega «not» a be: I\'m not, you/we/they aren\'t, he/she/it isn\'t. El -ing no cambia.')}
        ${ii('❓','<b>Tip 2 — Preguntar:</b> mueve be al frente: «Are you…?». Con WH: «What are you doing?».')}
        ${ii('⚠️','<b>Tip 3 — Nunca «do/does»:</b> el continuous solo usa «be». «Is he working?», no «Does he working?».')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «Does she eating?» → ✅ «<b>Is</b> she eating?»<br>❌ «He not working» → ✅ «He <b>isn\'t</b> working».</p></div>
        ${ii('⚡','not va después de to be: «She is not sleeping»; en pregunta, invierte: «Is she sleeping?».')}`,
      en:`<div class="gdesc">The three forms, side by side:</div>
        <div class="fbox"><div class="frm"><span class="pill s">+ S + be + -ing</span><span class="plus">·</span><span class="pill v">− S + be + not + -ing</span><span class="plus">·</span><span class="pill o">? be + S + -ing</span></div><div class="fex"><span class="s">She is eating</span> · <span class="v">isn't eating</span> · <span class="o">Is she eating?</span></div></div>
        ${ii('🚫','<b>Tip 1 — Negate:</b> add «not» to be: I\'m not, you/we/they aren\'t, he/she/it isn\'t. The -ing doesn\'t change.')}
        ${ii('❓','<b>Tip 2 — Ask:</b> move be to the front: «Are you…?». With WH: «What are you doing?».')}
        ${ii('⚠️','<b>Tip 3 — Never «do/does»:</b> the continuous only uses «be». «Is he working?», not «Does he working?».')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «Does she eating?» → ✅ «<b>Is</b> she eating?»<br>❌ «He not working» → ✅ «He <b>isn\'t</b> working».</p></div>
        ${ii('⚡','not goes after to be: «She is not sleeping»; in questions, invert: «Is she sleeping?».')}`
    },
    checks:[
