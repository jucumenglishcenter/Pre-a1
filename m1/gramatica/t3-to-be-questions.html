<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'El verbo To be — Preguntas',en:'The verb To be — Questions'}, reportId:'sum-tobe-q' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">En español preguntas con «ser/estar» solo <b>cambiando el tono</b> de la voz: «Eres feliz» → «<b>¿Eres feliz?</b>».</div>
        <div class="art-hero"><div class="art-box"><div class="word">Afirmación</div><div class="role">Bajas el tono</div><div class="desc">«Tú eres estudiante.»</div></div><div class="art-box"><div class="word">¿Pregunta?</div><div class="role">Subes el tono ↗</div><div class="desc">«¿Tú eres estudiante?»</div></div></div>
        ${ii('🗣️','En español las palabras casi no cambian; solo subes la voz y agregas los signos «¿?».')}
        ${ii('🔑','También preguntas con palabras como «¿Quién?», «¿Dónde?», «¿Cómo?», «¿Cuántos años?».')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «¿Eres de Lima?», «¿Estás bien?», «¿Dónde está el baño?». En inglés, la pregunta cambia el ORDEN de las palabras.</div>`,
      en:`<div class="gdesc">In Spanish you ask with «ser/estar» just by <b>changing your tone</b>: «Eres feliz» → «<b>¿Eres feliz?</b>».</div>
        <div class="art-hero"><div class="art-box"><div class="word">Afirmación</div><div class="role">Tone goes down</div><div class="desc">«Tú eres estudiante.»</div></div><div class="art-box"><div class="word">¿Pregunta?</div><div class="role">Tone goes up ↗</div><div class="desc">«¿Tú eres estudiante?»</div></div></div>
        ${ii('🗣️','In Spanish the words barely change; you just raise your voice and add «¿?».')}
        ${ii('🔑','You also ask with words like «¿Quién?», «¿Dónde?», «¿Cómo?», «¿Cuántos años?».')}
        <div class="gnote life">🌎 <b>From your life:</b> «¿Eres de Lima?», «¿Estás bien?», «¿Dónde está el baño?». In English, the question changes the WORD ORDER.</div>`
    },
    checks:[
      { q:{es:'En español preguntas con «ser/estar»:',en:'In Spanish you ask with «ser/estar»:'}, opts:{es:['Cambiando el tono de voz','Cambiando todas las palabras'],en:['By changing the tone','By changing all the words']}, correct:0, fb:{ why:{es:'Subes la voz y pones «¿?».',en:'You raise your voice and add «¿?».'}, tip:{es:'tono ↗',en:'tone ↗'}} },
      { q:{es:'«¿Eres feliz?» — el verbo es:',en:'«¿Eres feliz?» — the verb is:'}, opts:{es:['eres (ser)','tener'],en:['eres (ser)','tener']}, correct:0, fb:{ why:{es:'«Eres» es del verbo «ser».',en:'«Eres» is from the verb «ser».'}, tip:{es:'ser/estar',en:'ser/estar'}} },
      { q:{es:'«¿Dónde está…?» pregunta por:',en:'«¿Dónde está…?» asks about:'}, opts:{es:['Un lugar','Una hora'],en:['A place','A time']}, correct:0, fb:{ why:{es:'«Dónde» = lugar.',en:'«Dónde» = place.'}, tip:{es:'dónde = lugar',en:'dónde = place'}} },
      { q:{es:'En español, ¿cambia mucho el orden al preguntar?',en:'In Spanish, does the order change a lot when asking?'}, opts:{es:['No, casi nada','Sí, todo'],en:['No, barely','Yes, everything']}, correct:0, fb:{ why:{es:'Casi solo cambia el tono.',en:'Mostly only the tone changes.'}, tip:{es:'tono, no orden',en:'tone, not order'}} },
      { q:{es:'«¿Cómo estás?» pregunta por:',en:'«¿Cómo estás?» asks about:'}, opts:{es:['Cómo te sientes','Tu nombre'],en:['How you feel','Your name']}, correct:0, fb:{ why:{es:'«Cómo» = de qué manera / cómo te sientes.',en:'«Cómo» = how / how you feel.'}, tip:{es:'cómo = how',en:'cómo = how'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés también usa am/is/are para preguntar, y tiene las mismas palabras de pregunta.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">❓</span><span class="lbl">What</span><span class="es">Qué</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">Where</span><span class="es">Dónde</span></div><div class="viz-item"><span class="ico">👤</span><span class="lbl">Who</span><span class="es">Quién</span></div><div class="viz-item"><span class="ico">🕐</span><span class="lbl">When</span><span class="es">Cuándo</span></div><div class="viz-item"><span class="ico">💭</span><span class="lbl">How</span><span class="es">Cómo</span></div><div class="viz-item"><span class="ico">🔢</span><span class="lbl">How old</span><span class="es">Qué edad</span></div></div>
        ${eg('<span class="tag s">Are</span> you happy?','¿Estás feliz?','ok')}
        ${eg('<span class="tag s">Where</span> is the bank?','¿Dónde está el banco?','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos usan el mismo verbo (am/is/are) para preguntar.</li><li>Los dos tienen palabras de pregunta (What, Where, Who…).</li><li>Los dos esperan una respuesta corta: «Yes» o «No».</li></ul>
        <div class="gnote">👍 El verbo es el mismo. Lo nuevo es que en inglés el verbo va PRIMERO (siguiente paso).</div>`,
      en:`<div class="gdesc">English also uses am/is/are to ask, and it has the same question words.</div>
        <div class="viz-grid"><div class="viz-item"><span class="ico">❓</span><span class="lbl">What</span><span class="es">Qué</span></div><div class="viz-item"><span class="ico">📍</span><span class="lbl">Where</span><span class="es">Dónde</span></div><div class="viz-item"><span class="ico">👤</span><span class="lbl">Who</span><span class="es">Quién</span></div><div class="viz-item"><span class="ico">🕐</span><span class="lbl">When</span><span class="es">Cuándo</span></div><div class="viz-item"><span class="ico">💭</span><span class="lbl">How</span><span class="es">Cómo</span></div><div class="viz-item"><span class="ico">🔢</span><span class="lbl">How old</span><span class="es">Qué edad</span></div></div>
        ${eg('<span class="tag s">Are</span> you happy?','Are you happy?','ok')}
        ${eg('<span class="tag s">Where</span> is the bank?','Where is the bank?','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both use the same verb (am/is/are) to ask.</li><li>Both have question words (What, Where, Who…).</li><li>Both expect a short answer: «Yes» or «No».</li></ul>
        <div class="gnote">👍 The verb is the same. The new part is that in English the verb goes FIRST (next step).</div>`
    },
    checks:[
      { q:{es:'«Where» significa:',en:'«Where» means:'}, opts:{es:['Dónde','Qué'],en:['Dónde','Qué']}, correct:0, fb:{ why:{es:'Where = Dónde (lugar).',en:'Where = Dónde (place).'}, tip:{es:'Where = Dónde',en:'Where = Dónde'}} },
      { q:{es:'«Who» significa:',en:'«Who» means:'}, opts:{es:['Quién','Cuándo'],en:['Quién','Cuándo']}, correct:0, fb:{ why:{es:'Who = Quién (persona).',en:'Who = Quién (person).'}, tip:{es:'Who = Quién',en:'Who = Quién'}} },
      { q:{es:'Para preguntar usas el verbo:',en:'To ask you use the verb:'}, opts:{es:['am/is/are','do/does'],en:['am/is/are','do/does']}, correct:0, fb:{ why:{es:'Con «to be» se usa am/is/are.',en:'With «to be» you use am/is/are.'}, tip:{es:'to be → am/is/are',en:'to be → am/is/are'}} },
      { q:{es:'«How» significa:',en:'«How» means:'}, opts:{es:['Cómo','Dónde'],en:['Cómo','Dónde']}, correct:0, fb:{ why:{es:'How = Cómo.',en:'How = Cómo.'}, ex:{es:'How are you? → ¿Cómo estás?',en:'How are you?'}, tip:{es:'How = Cómo',en:'How = Cómo'}} },
      { q:{es:'«How old» pregunta por:',en:'«How old» asks about:'}, opts:{es:['La edad','El lugar'],en:['The age','The place']}, correct:0, fb:{ why:{es:'How old = qué edad.',en:'How old = what age.'}, ex:{es:'How old are you? → ¿Cuántos años tienes?',en:'How old are you?'}, tip:{es:'How old = edad',en:'How old = age'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">El gran cambio: en inglés, para preguntar, el verbo <b>am/is/are va PRIMERO</b> (antes del sujeto). Esto se llama «inversión».</div>
        <table class="dtab"><tr><th>Afirmación</th><th>Pregunta (verbo primero)</th></tr>
          <tr><td class="en">You are happy.</td><td><b>Are</b> you happy?</td></tr>
          <tr><td class="en">She is a teacher.</td><td><b>Is</b> she a teacher?</td></tr>
          <tr><td class="en">They are ready.</td><td><b>Are</b> they ready?</td></tr>
        </table>
        <div class="sec-label">Respuestas cortas</div>
        ${ii('✅','Para responder repites el verbo: «Yes, I <b>am</b>» / «No, she <b>isn\'t</b>».')}
        <div class="sec-label">Preguntas con palabra (WH)</div>
        ${ii('🔑','La palabra de pregunta va primero, luego el verbo: «<b>Where</b> is he?», «<b>How</b> are you?».')}
        ${eg('<span class="tag s">Is</span> she your sister?','¿Ella es tu hermana? (Is primero)','ok')}
        ${eg('She is your sister? (sin invertir)','Mejor: «Is she your sister?» (verbo primero).','bad')}
        <div class="gnote">📍 Pregunta: <b>am/is/are</b> + sujeto + resto. Con WH: <b>palabra</b> + am/is/are + sujeto.</div>`,
      en:`<div class="gdesc">The big change: in English, to ask, the verb <b>am/is/are goes FIRST</b> (before the subject). This is called «inversion».</div>
        <table class="dtab"><tr><th>Statement</th><th>Question (verb first)</th></tr>
          <tr><td class="en">You are happy.</td><td><b>Are</b> you happy?</td></tr>
          <tr><td class="en">She is a teacher.</td><td><b>Is</b> she a teacher?</td></tr>
          <tr><td class="en">They are ready.</td><td><b>Are</b> they ready?</td></tr>
        </table>
        <div class="sec-label">Short answers</div>
        ${ii('✅','To answer you repeat the verb: «Yes, I <b>am</b>» / «No, she <b>isn\'t</b>».')}
        <div class="sec-label">WH questions</div>
        ${ii('🔑','The question word goes first, then the verb: «<b>Where</b> is he?», «<b>How</b> are you?».')}
        ${eg('<span class="tag s">Is</span> she your sister?','Is she your sister? (Is first)','ok')}
        ${eg('She is your sister? (no inversion)','Better: «Is she your sister?» (verb first).','bad')}
        <div class="gnote">📍 Question: <b>am/is/are</b> + subject + rest. With WH: <b>word</b> + am/is/are + subject.</div>`
    },
    checks:[
      { q:{es:'Pregunta de «You are tired»:',en:'Question from «You are tired»:'}, opts:{es:['Are you tired?','You are tired?'],en:['Are you tired?','You are tired?']}, correct:0, fb:{ why:{es:'El verbo «are» va primero.',en:'The verb «are» goes first.'}, ex:{es:'Are you tired? → ¿Estás cansado?',en:'Are you tired?'}, tip:{es:'verbo primero',en:'verb first'}} },
      { q:{es:'«___ she a doctor?»',en:'«___ she a doctor?»'}, opts:{es:['Is','Are'],en:['Is','Are']}, correct:0, tr:{es:'¿Es doctora?',en:'Is she a doctor?'}, fb:{ why:{es:'She → is, y va primero.',en:'She → is, and it goes first.'}, ex:{es:'Is she a doctor? → ¿Es doctora?',en:'Is she a doctor?'}, tip:{es:'she → Is',en:'she → Is'}} },
      { q:{es:'Respuesta corta: «Are you ready?» →',en:'Short answer: «Are you ready?» →'}, opts:{es:['Yes, I am.','Yes, I do.'],en:['Yes, I am.','Yes, I do.']}, correct:0, fb:{ why:{es:'Con «to be» respondes con am/is/are.',en:'With «to be» you answer with am/is/are.'}, ex:{es:'Yes, I am → Sí, lo estoy',en:'Yes, I am'}, tip:{es:'to be → am/is/are',en:'to be → am/is/are'}} },
      { q:{es:'«___ is your teacher?» (Quién):',en:'«___ is your teacher?» (Who):'}, opts:{es:['Who','Where'],en:['Who','Where']}, correct:0, tr:{es:'¿Quién es tu profesor?',en:'Who is your teacher?'}, fb:{ why:{es:'«Who» = quién (persona).',en:'«Who» = quién (person).'}, ex:{es:'Who is your teacher? → ¿Quién es tu profesor?',en:'Who is your teacher?'}, tip:{es:'Who = Quién',en:'Who = Quién'}} },
      { q:{es:'¿Cuál es una pregunta bien formada?',en:'Which is a well-formed question?'}, opts:{es:['Where are you from?','You are from where?'],en:['Where are you from?','You are from where?']}, correct:0, fb:{ why:{es:'WH + are + sujeto.',en:'WH + are + subject.'}, ex:{es:'Where are you from? → ¿De dónde eres?',en:'Where are you from?'}, tip:{es:'WH + verbo + sujeto',en:'WH + verb + subject'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Las dos fórmulas para preguntar con «to be»:</div>
        <div class="fbox"><div class="frm"><span class="pill v">am/is/are</span><span class="plus">+</span><span class="pill s">sujeto</span><span class="plus">+</span><span class="pill o">resto?</span></div><div class="fex"><span class="v">Are</span> <span class="s">you</span> <span class="o">happy</span>? — ¿Estás feliz?</div></div>
        <div class="fbox"><div class="frm"><span class="pill p">WH</span><span class="plus">+</span><span class="pill v">am/is/are</span><span class="plus">+</span><span class="pill s">sujeto?</span></div><div class="fex"><span class="p">Where</span> <span class="v">is</span> <span class="s">he</span>? — ¿Dónde está él?</div></div>
        ${ii('🔄','<b>Tip 1 — Voltea:</b> «She is…» → «Is she…?». El verbo salta al inicio.')}
        ${ii('✅','<b>Tip 2 — Respuesta corta:</b> repite el verbo: «Yes, I am» / «No, he isn\'t».')}
        ${ii('🔑','<b>Tip 3 — Con WH:</b> primero la palabra (What/Where/Who), luego el verbo: «What is your name?».')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «You are happy?» → ✅ «<b>Are you</b> happy?» (verbo primero).</p></div>`,
      en:`<div class="gdesc">The two formulas to ask with «to be»:</div>
        <div class="fbox"><div class="frm"><span class="pill v">am/is/are</span><span class="plus">+</span><span class="pill s">subject</span><span class="plus">+</span><span class="pill o">rest?</span></div><div class="fex"><span class="v">Are</span> <span class="s">you</span> <span class="o">happy</span>? — ¿Estás feliz?</div></div>
        <div class="fbox"><div class="frm"><span class="pill p">WH</span><span class="plus">+</span><span class="pill v">am/is/are</span><span class="plus">+</span><span class="pill s">subject?</span></div><div class="fex"><span class="p">Where</span> <span class="v">is</span> <span class="s">he</span>? — ¿Dónde está él?</div></div>
        ${ii('🔄','<b>Tip 1 — Flip it:</b> «She is…» → «Is she…?». The verb jumps to the start.')}
        ${ii('✅','<b>Tip 2 — Short answer:</b> repeat the verb: «Yes, I am» / «No, he isn\'t».')}
        ${ii('🔑','<b>Tip 3 — With WH:</b> first the word (What/Where/Who), then the verb: «What is your name?».')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «You are happy?» → ✅ «<b>Are you</b> happy?» (verb first).</p></div>`
    },
    checks:[
      { q:{es:'Pregunta de «He is at home»:',en:'Question from «He is at home»:'}, opts:{es:['Is he at home?','He is at home?'],en:['Is he at home?','He is at home?']}, correct:0, fb:{ why:{es:'«Is» va primero.',en:'«Is» goes first.'}, ex:{es:'Is he at home? → ¿Está en casa?',en:'Is he at home?'}, tip:{es:'verbo primero',en:'verb first'}} },

let info='es', cur=0, doneSteps=[], answers=[], coreDone=false, bState={order:[],locked:false}, curLab='';

function say(text,acc){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; const vs=speechSynthesis.getVoices()||[]; const want=acc==='US'?'en-US':'en-GB'; const v=vs.find(x=>x.lang===want)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0); if(v){u.voice=v;u.lang=v.lang;}else u.lang=want; speechSynthesis.speak(u); }catch(e){} }
function render(){ cur=0; coreDone=false; doneSteps=new Array(STEPS.length).fill(false); answers=STEPS.map(s=>new Array(s.checks.length).fill(null)); bState={order:[],locked:false};
  document.getElementById('results').classList.remove('show'); document.getElementById('mbody').style.display='block'; document.getElementById('msbanner').style.display='none';

function renderTabs(){ document.getElementById('steptabs').innerHTML=STEPS.map((s,i)=>`<button class="stab${i===0?' on':''}${doneSteps[i]?' done':''}" id="stab${i}" onclick="goStep(${i})">${s.icon} ${i+1}</button>`).join(''); }
function applyLang(){ const t=L();

  document.getElementById('mhtitle').textContent=MAT.title[info]; document.getElementById('mhsub').textContent=document.getElementById('screen').getAttribute('data-level').toUpperCase().replace('-',' · ')+' · '+MAT.subtitle[info];

  document.getElementById('helpT').textContent=t.helpT; document.getElementById('helpTips').innerHTML='<div style="font-size:11.5px;color:var(--text-soft);font-weight:700;margin-bottom:6px">'+t.tipsT+'</div>'+t.tips.map(x=>'<div class="helptip">• <span>'+x+'</span></div>').join('');
  document.getElementById('kpT').textContent=t.kpT; document.getElementById('lBack').textContent=t.back; document.getElementById('lRetry').textContent=t.retry;
  updateMilestone(); renderStep(); }
function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';

  const ansd=answers[cur].filter(x=>x!==null).length;
  html+=`<div class="check"><div class="check-h">🧠 ${t.checkH}<span class="cprog">${ansd}/${s.checks.length}</span></div><div class="check-sub">${t.checkSub}</div>`;
  s.checks.forEach((c,ci)=>{ const sel=answers[cur][ci]; const done=sel!==null; const ok=sel===c.correct;

      (f.tip?`<div class="fblk tip"><b>💡 ${t.fTip}</b>${f.tip[info]}</div>`:'')+`</div></div>`; }

function initBuilder(){ bState={order:[],locked:false}; const sh=[...BUILD.answer.keys()].sort(()=>Math.random()-.5);

function placeTile(idx){ if(bState.locked)return; bState.order.push(idx); document.getElementById('tile'+idx).classList.add('placed'); const tr=document.getElementById('tray'); const b=document.createElement('button'); b.className='tile '+BUILD.answer[idx].c; b.textContent=BUILD.answer[idx].w; b.onclick=()=>removeTile(idx,b); tr.appendChild(b); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function removeTile(idx,el){ if(bState.locked)return; bState.order=bState.order.filter(x=>x!==idx); el.remove(); document.getElementById('tile'+idx).classList.remove('placed'); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function checkBuild(){ const t=L(); bState.locked=true; const ok=bState.order.join(',')===BUILD.answer.map((_,i)=>i).join(','); document.querySelectorAll('#tray .tile').forEach(x=>x.style.pointerEvents='none');

function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
