/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"A Day at School","sTitleEs":"Un día en la escuela","dTitle":"Where Is My Book?","dTitleEs":"¿Dónde está mi libro?","paras":[[["The school day starts early.","El día de escuela empieza temprano."],["A bell rings at eight.","Una campana suena a las ocho."],["The doors open fast.","Las puertas se abren rápido."],["Kids run to their classes.","Los niños corren a sus clases."],["Our class is the last door.","Nuestra clase es la última puerta."]],[["My classroom has many things.","Mi salón tiene muchas cosas."],["There are books and pencils.","Hay libros y lápices."],["The window is always open.","La ventana está siempre abierta."],["An old map is on the wall.","Un mapa viejo está en la pared."],["I like the map a lot.","Me gusta mucho el mapa."]],[["Before class, we play outside.","Antes de clase, jugamos afuera."],["Ravi brings a small ball.","Ravi trae una pelota pequeña."],["The girls jump rope fast.","Las niñas saltan la cuerda rápido."],["The boys pass the ball.","Los niños pasan la pelota."],["Then the bell calls us in.","Luego la campana nos llama."]],[["During class, we read stories.","Durante la clase, leemos historias."],["Miss Rosa opens a big book.","Miss Rosa abre un libro grande."],["The story is about an elephant.","La historia es sobre un elefante."],["An elephant with huge ears!","¡Un elefante con orejas enormes!"],["We listen with open mouths.","Escuchamos con la boca abierta."]],[["My friends sit near me.","Mis amigos se sientan cerca de mí."],["Ana shares her colored pencils.","Ana comparte sus lápices de colores."],["Ravi draws in his notebook.","Ravi dibuja en su cuaderno."],["Our drawings go on the wall.","Nuestros dibujos van a la pared."],["The wall looks like a museum.","La pared parece un museo."]],[["At noon, we eat lunch.","Al mediodía, almorzamos."],["The tables are long and full.","Las mesas son largas y están llenas."],["I sit between Ravi and Ana.","Me siento entre Ravi y Ana."],["We trade some snacks.","Intercambiamos algunas meriendas."],["Lunch always ends too fast.","El almuerzo siempre termina muy rápido."]],[["After lunch, we have art.","Después del almuerzo, tenemos arte."],["The teacher gives us paper.","La maestra nos da papel."],["We make paper boats.","Hacemos barcos de papel."],["My boat is small and fast.","Mi barco es pequeño y rápido."],["We race them in a tub.","Los hacemos competir en una tina."]],[["The last class is English.","La última clase es inglés."],["We learn new words.","Aprendemos palabras nuevas."],["The words go in our notebooks.","Las palabras van en nuestros cuadernos."],["Miss Rosa says them slowly.","Miss Rosa las dice despacio."],["We repeat them all together.","Las repetimos todos juntos."]],[["At the end, we clean up.","Al final, ordenamos todo."],["The pencils go in a box.","Los lápices van en una caja."],["The books go on the shelves.","Los libros van en los estantes."],["Our chairs go under the desks.","Nuestras sillas van bajo las carpetas."],["The room gets neat again.","El salón queda ordenado otra vez."]],[["I walk home with Ravi.","Camino a casa con Ravi."],["We talk about the elephant.","Hablamos del elefante."],["The sun goes down slowly.","El sol baja despacio."],["A good day ends again.","Un buen día termina otra vez."],["Tomorrow brings another one.","Mañana trae otro más."]]],"datos":[null,"<b>a / an</b> = un/una (an antes de vocal: <span class=\"frase\">an old map, an elephant</span>) · <b>the</b> = el/la (algo ya conocido).",null,"«Durante» = <b>during</b>: <span class=\"frase\">During class, we read stories.</span>",null,null,null,null,"Plurales: pencil→pencil<b>s</b> · box→box<b>es</b> · shelf→shel<b>ves</b> (irregular).",null],"dlg":[["Leo","Lara, where is my book?","Lara, ¿dónde está mi libro?"],["Lara","Which book, Leo?","¿Cuál libro, Leo?"],["Leo","The English book. It is blue.","El libro de inglés. Es azul."],["Lara","Is it under the table?","¿Está bajo la mesa?"],["Leo","No, it is not there.","No, ahí no está."],["Lara","Look inside your bag!","¡Mira dentro de tu mochila!"],["Leo","The bag is empty.","La mochila está vacía."],["Lara","Hmm. Near the door?","Mmm. ¿Cerca de la puerta?"],["Leo","No. Only my shoes are there.","No. Solo mis zapatos están ahí."],["Lara","Is it between the cushions?","¿Está entre los cojines?"],["Leo","Good idea! Let me look.","¡Buena idea! Déjame ver."],["Leo","No book. Only your doll!","No hay libro. ¡Solo tu muñeca!"],["Lara","My doll! Thank you!","¡Mi muñeca! ¡Gracias!"],["Leo","But where is my book?","¿Pero dónde está mi libro?"],["Lara","When do you use it?","¿Cuándo lo usas?"],["Leo","Before bed. I read in bed!","Antes de dormir. ¡Leo en la cama!"],["Lara","Then look under your pillow.","Entonces mira bajo tu almohada."],["Leo","Lara… you are right!","Lara… ¡tienes razón!"],["Leo","The book is under the pillow.","El libro está bajo la almohada."],["Lara","Little sisters know things.","Las hermanitas saben cosas."],["Leo","Yes, you are very smart.","Sí, eres muy lista."],["Lara","Can you read it to me?","¿Me lo puedes leer?"],["Leo","After my homework, yes.","Después de mi tarea, sí."],["Lara","I can wait near you.","Puedo esperar cerca de ti."],["Leo","Deal. Bring your doll too.","Trato. Trae a tu muñeca también."],["Lara","Her name is Coco!","¡Su nombre es Coco!"]]},"2":{"sTitle":"Where's My Cat?","sTitleEs":"¿Dónde está mi gata?","dTitle":"Before and After School","dTitleEs":"Antes y después de la escuela","paras":[[["I have a white cat.","Tengo una gata blanca."],["Her name is Luna.","Su nombre es Luna."],["She is small and fast.","Es pequeña y rápida."],["Luna loves funny places.","A Luna le encantan los lugares curiosos."],["Today I cannot find her.","Hoy no puedo encontrarla."]],[["I look under my bed.","Busco bajo mi cama."],["There are only two boxes.","Solo hay dos cajas."],["My old toys sleep there.","Mis juguetes viejos duermen ahí."],["No cat under the bed.","No hay gata bajo la cama."],["Where is that little cat?","¿Dónde está esa gatita?"]],[["I look inside the closet.","Busco dentro del clóset."],["My dresses hang in a line.","Mis vestidos cuelgan en fila."],["The shoes wait in pairs.","Los zapatos esperan en pares."],["A soft sound comes out.","Un sonido suave sale."],["But it is only the wind.","Pero es solo el viento."]],[["Maybe she is in the kitchen.","Quizás está en la cocina."],["Her bowl is near the door.","Su plato está cerca de la puerta."],["The milk is still there.","La leche sigue ahí."],["Luna never misses her milk.","Luna nunca se pierde su leche."],["Now I am a little worried.","Ahora estoy un poco preocupada."]],[["I ask my mom for help.","Le pido ayuda a mi mamá."],["\"Look between the plants,\" she says.","«Busca entre las plantas», dice."],["Our garden has many pots.","Nuestro jardín tiene muchas macetas."],["I look behind every one.","Miro detrás de cada una."],["Only a small bird flies out.","Solo un pajarito sale volando."]],[["Dad looks under the car.","Papá busca bajo el auto."],["Cats like dark places.","A los gatos les gustan los lugares oscuros."],["He calls her name two times.","Llama su nombre dos veces."],["No answer from the street.","Ninguna respuesta desde la calle."],["The sun starts to go down.","El sol empieza a bajar."]],[["Then I hear a tiny cry.","Entonces oigo un llanto pequeñito."],["It comes from up high.","Viene desde lo alto."],["I look at the tree.","Miro el árbol."],["Two eyes shine between the leaves.","Dos ojos brillan entre las hojas."],["\"Luna! You silly cat!\"","«¡Luna! ¡Gata tontita!»"]],[["She is on a high branch.","Está en una rama alta."],["Her tail moves fast.","Su cola se mueve rápido."],["She cannot come down alone.","No puede bajar sola."],["Dad brings the tall ladder.","Papá trae la escalera alta."],["He goes up slowly.","Sube despacio."]],[["Luna jumps to his arms.","Luna salta a sus brazos."],["Her heart beats very fast.","Su corazón late muy rápido."],["We give her warm milk.","Le damos leche tibia."],["She drinks it all.","Se la toma toda."],["Then she sleeps on my legs.","Luego duerme en mis piernas."]],[["Cats love high places.","A los gatos les encantan los lugares altos."],["But ladders are for people.","Pero las escaleras son para personas."],["Luna learns her lesson… maybe.","Luna aprende su lección… quizás."],["Tomorrow she can play inside.","Mañana puede jugar adentro."],["My funny cat is home.","Mi gata graciosa está en casa."]]],"datos":["«Su nombre» (de ella, la gata) = <b>her</b> name. A las mascotas queridas les decimos he/she.",null,null,null,"Plurales: plant→plant<b>s</b> · pot→pot<b>s</b> · box→box<b>es</b>.",null,"Plural irregular: leaf→lea<b>ves</b> (hojas).","<b>the</b> tall ladder = LA escalera (la que ya conocemos de casa).",null,null],"dlg":[["Ana","Leo, what do you do before school?","Leo, ¿qué haces antes de la escuela?"],["Leo","I feed my fish.","Alimento a mis peces."],["Ana","You have fish? How many?","¿Tienes peces? ¿Cuántos?"],["Leo","Three little fish.","Tres pececitos."],["Ana","Fish… not fishes?","¿Fish… no fishes?"],["Leo","Ha! Yes, just \"fish\".","¡Ja! Sí, solo «fish»."],["Ana","English is funny sometimes.","El inglés es gracioso a veces."],["Leo","And you? Before school?","¿Y tú? ¿Antes de la escuela?"],["Ana","I play with Luna.","Juego con Luna."],["Ana","Her ball is her favorite toy.","Su pelota es su juguete favorito."],["Leo","What about after school?","¿Y después de la escuela?"],["Ana","I do my homework first.","Primero hago mi tarea."],["Ana","Then I help my mom.","Luego ayudo a mi mamá."],["Leo","I play football after school.","Yo juego fútbol después de la escuela."],["Ana","During the week, every day?","¿Durante la semana, cada día?"],["Leo","No, only three days.","No, solo tres días."],["Ana","And during the weekend?","¿Y durante el fin de semana?"],["Leo","We go to the park.","Vamos al parque."],["Ana","Your family loves that park!","¡A tu familia le encanta ese parque!"],["Leo","Yes! Our Saturdays are the best.","¡Sí! Nuestros sábados son los mejores."],["Ana","My Saturdays are for grandma.","Mis sábados son para la abuela."],["Ana","Her house is near the market.","Su casa está cerca del mercado."],["Leo","Do you walk there?","¿Caminas hasta ahí?"],["Ana","Yes, it is very near.","Sí, está muy cerca."],["Leo","The bell! Time for class.","¡La campana! Hora de clase."],["Ana","Fast! We are late!","¡Rápido! ¡Llegamos tarde!"]]},"3":{"sTitle":"My Week","sTitleEs":"Mi semana","dTitle":"Is the Park Near Here?","dTitleEs":"¿El parque está cerca?","paras":[[["A week has seven days.","Una semana tiene siete días."],["Five days are for school.","Cinco días son para la escuela."],["Two days are for home.","Dos días son para la casa."],["My week is always full.","Mi semana siempre está llena."],["Let me tell you about it.","Déjenme contarles sobre ella."]],[["On Mondays, I wake up early.","Los lunes, me despierto temprano."],["The house is still dark.","La casa sigue oscura."],["Mia and I get our bags.","Mia y yo tomamos nuestras mochilas."],["Our uniforms wait on the chairs.","Nuestros uniformes esperan en las sillas."],["The week starts fast.","La semana empieza rápido."]],[["On Tuesdays, I have art class.","Los martes, tengo clase de arte."],["It is my favorite day.","Es mi día favorito."],["We paint during the afternoon.","Pintamos durante la tarde."],["The brushes dance on the paper.","Los pinceles bailan sobre el papel."],["Time flies in art class.","El tiempo vuela en la clase de arte."]],[["On Wednesdays, mom works late.","Los miércoles, mamá trabaja hasta tarde."],["Grandma comes to our house.","La abuela viene a nuestra casa."],["Her stories are about her town.","Sus historias son sobre su pueblo."],["We drink tea and listen.","Tomamos té y escuchamos."],["Wednesdays taste like honey.","Los miércoles saben a miel."]],[["On Thursdays, we visit the library.","Los jueves, visitamos la biblioteca."],["The shelves go up high.","Los estantes suben muy alto."],["I take three books home.","Llevo tres function pickVoice(){ try{ const vs=speechSynthesis.getVoices()||[]; const gb=(typeof voice!=='undefined'&&(voice==='UK'||voice==='GB')); const want=gb?'en-gb':'en-us'; const pref= gb?['Google UK English Female','Google UK English Male','Microsoft Sonia','Microsoft Libby','Microsoft Maisie','Microsoft Ryan','Microsoft Thomas','Daniel','Kate','Serena','Arthur','Martha']:['Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Michelle','Microsoft Ana','Microsoft Emma','Microsoft Andrew','Samantha','Alex','Allison','Ava','Fred']; const en=vs.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0); const exact=en.filter(v=>v.lang.replace('_','-').toLowerCase()===want); for(const p of pref){ const hit=exact.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } if(exact.length) return exact[0]; for(const p of pref){ const hit=en.find(v=>v.name&&v.name.indexOf(p)===0); if(hit) return hit; } return en[0]||null; }catch(e){ return null; } }

  pa.querySelector('.ic').textContent= all?'⏸':'▶'; pa.querySelector('.pl').textContent= all?L().pause:L().play;
  VIEW.forEach((p,pi)=>{ const b=document.getElementById('play'+pi); if(!b)return; const on=gPlaying&&gScope==='p'+pi; b.classList.toggle('on',on); b.querySelector('.pl').textContent= on?L().pPause:L().pPlay; b.firstChild.textContent= on?'⏸ ':'▶ '; }); }
function clearHl(){ document.querySelectorAll('.sent.read,.sente.read').forEach(s=>s.classList.remove('read')); document.querySelectorAll('.para.reading').forEach(p=>p.classList.remove('reading')); }
function startRange(st,end,scope){ if(gScope!==scope || gi<st || gi>=end) gi=st; gEnd=end; gScope=scope; gPlaying=true; setBtns(); step(); }
function playAll(){ if(gPlaying&&gScope==='all'){ pausePlay(); return; } startRange(0,ALL.length,'all'); }
function playPara(pi){ const idxs=ALL.map((a,k)=>a.pi===pi?k:-1).filter(k=>k>=0); if(gPlaying&&gScope==='p'+pi){ pausePlay(); return; } startRange(idxs[0],idxs[idxs.length-1]+1,'p'+pi); }
function pausePlay(){ gPlaying=false; try{speechSynthesis.cancel();}catch(e){} setBtns(); }
function step(){ if(!gPlaying) return;
  if(gi>=gEnd){ gPlaying=false; if(gScope==='all') gi=0; setBtns(); clearHl(); toast(info==='es'?'✓ Fin del audio':'✓ End of audio'); return; }
  const {pi,si}=ALL[gi]; clearHl(); const para=document.getElementById('p'+pi); para.classList.add('reading');
  const se=document.getElementById('s'+pi+'_'+si); if(se)se.classList.add('read');
  const ee=document.getElementById('e'+pi+'_'+si); if(ee)ee.classList.add('read');
  para.scrollIntoView({behavior:'smooth',block:'center'});
  say(VIEW[pi].pairs[si].en, ()=>{ if(!gPlaying)return; try{ if(curView==='story'&&si===VIEW[pi].pairs.length-1&&window.jecParaHeard) jecParaHeard(pi); }catch(e){} gi++; step(); });
}
function setText(m){ document.getElementById('screen').setAttribute('data-text',m); ['txEn','txEs','txBoth'].forEach(id=>document.getElementById(id).classList.remove('on')); document.getElementById(m==='en'?'txEn':m==='es'?'txEs':'txBoth').classList.add('on'); }
function setInfo(l){ info=l; applyInfo(); renderStPick(); if(document.getElementById('stpick').style.display==='none') updateTitles(); }
function toggleVoice(){ voice=voice==='US'?'UK':'US'; document.getElementById('voiceBtn').textContent='🔊 '+voice; try{localStorage.setItem('jucum_accent',voice);}catch(e){}
  try{ const gb=voice==='UK'; const vs=speechSynthesis.getVoices()||[]; const has=vs.some(v=>v.lang&&v.lang.replace('_','-').toLowerCase().indexOf(gb?'en-gb':'en-us')===0);
    if(!has&&vs.length) toast(gb?'⚠ Este equipo no tiene voz británica instalada; se usará la más parecida':'⚠ Este equipo no tiene voz americana; se usará la más parecida');
    else if(typeof gPlaying==='undefined'||!gPlaying) say(gb?'Hello! This is the British voice.':'Hello! This is the American voice.');
  }catch(e){} }
function setRate(v){ rate=parseFloat(v); }
function textSize(d){ let s=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--reading'))||18; s=Math.max(14,Math.min(26,s+d)); document.documentElement.style.setProperty('--reading',s+'px'); try{localStorage.setItem('jucum_read_fs',s);}catch(e){} }
function markDone(){ marked=true; const b=document.getElementById('markBtn'); b.classList.add('done'); b.querySelector('.mi').textContent='✅'; document.getElementById('markLab').textContent=L().marked;
  const m=Math.floor(secs/60); document.getElementById('eTime').textContent=m+':'+String(secs%60).padStart(2,'0'); document.getElementById('eXp').textContent='+'+(m>=30?15:m>=20?10:m>=10?5:0);
  try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{type:'story', story:storyId, minutes:m, xp:(m>=30?15:m>=20?10:m>=10?5:0), finished:true}})); }catch(e){}
  const ec=document.getElementById('endcard'); ec.style.display='block'; ec.scrollIntoView({behavior:'smooth'}); }
setInterval(()=>{ secs++; const m=Math.floor(secs/60),s=secs%60; document.getElementById('ringT').textContent=m+':'+String(s).padStart(2,'0'); const frac=Math.min(1,secs/600); document.getElementById('ringFill').setAttribute('stroke-dashoffset',(88*(1-frac)).toFixed(1)); [10,20,30].forEach(mm=>{ if(m>=mm&&!milestones[mm]){ milestones[mm]=true; toast(L().xpMsg(mm)); } }); },1000);
function setLevel(lv){ pausePlay(); const s=document.getElementById('screen'); s.setAttribute('data-level',lv); const n={'pre-a1':'Pre-A1','a1':'A1','a2':'A2'}; var _c=document.getElementById('capLvl'); if(_c)_c.textContent=n[lv]; document.getElementById('mhsub').textContent=n[lv]+' · M1 · Personal Identity';
  ['segPre','segA1','segA2'].forEach(id=>{var b=document.getElementById(id);if(b)b.classList.remove('on');}); var _a=document.getElementById(lv==='pre-a1'?'segPre':lv==='a1'?'segA1':'segA2'); if(_a)_a.classList.add('on');
  info= lv==='pre-a1'?'es':'en'; setText(lv==='pre-a1'?'both':'en'); render(); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
0&&document.addEventListener('contextmenu',e=>{ if(e.target.closest('.screen')){ e.preventDefault(); toast('Material protegido © JUCUM EC'); }});
try{ speechSynthesis.onvoiceschanged=()=>pickVoice(); }catch(e){}
try{ var _ac=localStorage.getItem('jucum_accent'); if(_ac==='UK'||_ac==='US'){ voice=_ac; var _vb=document.getElementById('voiceBtn'); if(_vb)_vb.textContent='🔊 '+voice; } }catch(e){}
try{ var _fs0=parseInt(localStorage.getItem('jucum_read_fs')); if(_fs0>=14&&_fs0<=26) document.documentElement.style.setProperty('--reading',_fs0+'px'); }catch(e){}
render(); setLevel('pre-a1'); renderStPick();

<script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
<script id="v5ajs">
(function(){
  function $g(id){return document.getElementById(id);}
  function KEY(){ return 'jec_heard_'+location.pathname+'_'+(typeof storyId!=='undefined'?storyId:0); }
  var cloudDone={};
  function heard(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY())||'[]')); }catch(e){ return new Set(); } }
  function saveHeard(s){ try{ localStorage.setItem(KEY(), JSON.stringify(Array.from(s))); }catch(e){} }
  window.jecParaHeard=function(pi){ try{ var s=heard(); if(!s.has(pi)){ s.add(pi); saveHeard(s); } paintHeard(); ring(); }catch(e){} };
  function total(){ try{ return PARAS.length; }catch(e){ return 0; } }
  function ring(){ var el=$g('ring5'); if(!el) return; var t=total()||1; var n=heard().size; if(cloudDone[storyId]) n=t; var pct=Math.min(100,Math.round(n/t*100));
    $g('ring5T').textContent=pct+'%'; el.style.background='conic-gradient(#fff 0 '+pct+'%, rgba(255,255,255,.25) '+pct+'% 100%)'; }
  function paintHeard(){ try{ if(typeof curView!=='undefined'&&curView!=='story') return; var s=heard();
    document.querySelectorAll('#paras .para:not(.dlgrow)').forEach(function(p){ var pi=+p.id.slice(1); p.classList.toggle('heard5', s.has(pi)||!!cloudDone[storyId]);
    }); }catch(e){} }
  var _pick=window.pickStory; window.pickStory=function(n){ _pick(n);
    try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.setActivePart) JUCUM_CONNECT.setActivePart(Number(n)); }catch(e){}
    ring(); paintHeard(); };
  var _render=window.render; if(_render){ window.render=function(){ _render(); paintHeard(); ring(); }; }
  var _mark=window.markDone; window.markDone=function(){
    try{
      var t=total(); var n=cloudDone[storyId]?t:heard().size;
      if(n<t){ var falta=t-n; var es=(typeof info==='undefined')||info==='es';
        toast(es?('🎧 Escucha y lee TODA la historia antes de marcarla: te '+(falta>1?'faltan ':'falta ')+falta+' párrafo'+(falta>1?'s':'')+'. Usa ▶ en cada uno.')
               :('🎧 Listen to and read the WHOLE story first: '+falta+' paragraph'+(falta>1?'s':'')+' left. Use ▶ on each one.'));
        return; }
      cloudDone[storyId]=true;
      try{ if(window.JUCUM_CONNECT&&JUCUM_CONNECT.savePart) JUCUM_CONNECT.savePart(Number(storyId),100,0); }catch(e){}
    }catch(e){}
    if(_mark) _mark();
  };
  (function seed(k){ var api=window.JUCUM_CONNECT;
    if(!api||!api.getCompletedParts){ if(k<20) setTimeout(function(){seed(k+1);},700); return; }
    api.getCompletedParts(function(parts){ try{ (parts||[]).forEach(function(x){ var n=Number(x.part); if(n) cloudDone[n]=true; }); ring(); paintHeard(); annotate(); }catch(e){} });
  })(0);
  function annotate(){ try{ var list=$g('spkList'); if(!list) return;
    Array.prototype.forEach.call(list.children,function(el,ix){ var n=ix+1; if(cloudDone[n]&&!el.querySelector('.cl5')){ var s=document.createElement('span'); s.className='cl5'; s.textContent=' ✓'; s.style.cssText='color:#1B5E20;font-weight:800;'; el.appendChild(s); } }); }catch(e){} }
  ring();
})();
</script>
