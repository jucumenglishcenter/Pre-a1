<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Summary — To Be: Aff/Neg | Pre-A1 | JUCUM</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
--bg:#FAFAF6;--card:#fff;--text:#2A2A2A;--text-soft:#777;--border:#E8E5DC;
--shadow:0 3px 16px rgba(0,0,0,.06);--radius:14px;
--lp:#F9A825;--ld:#E65100;--ll:#FFF9C4;--lm:#FFECB3;
--lg:linear-gradient(135deg,#F9A825,#FF8F00);--lglow:rgba(249,168,37,.15);
--badge-text:#4E3800;
--subj:#1565C0;--subj-bg:#E3F2FD;
--verb:#E53935;--verb-bg:#FFEBEE;
--comp:#00897B;--comp-bg:#E0F2F1;
--neg:#AD1457;--neg-bg:#FCE4EC;
--quest:#7B1FA2;--quest-bg:#F3E5F5;
--ok:#2E7D32;--ok-bg:#E8F5E9;
--err:#C62828;--err-bg:#FFEBEE;
--note-bg:#FFFDE7;--note-border:#FBC02D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:1.5rem 1rem;-webkit-font-smoothing:antialiased}
.container{max-width:780px;margin:0 auto}

.level-header{text-align:center;padding:2rem;border-radius:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:1.2rem;background:var(--lg)}
.level-header::before{content:'';position:absolute;top:-40%;right:-15%;width:250px;height:250px;background:rgba(255,255,255,.1);border-radius:50%}
.level-header h1{font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:600;position:relative;z-index:1}
.level-header .module-name{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:500;opacity:.95;position:relative;z-index:1;margin-top:.2rem}
.level-header .subtitle{opacity:.8;font-size:.85rem;position:relative;z-index:1;margin-top:.15rem}
.level-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ll);color:var(--badge-text);padding:4px 12px;border-radius:20px;border:1.5px solid var(--lm);margin-bottom:.8rem;position:relative;z-index:1}

.step-tabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.step-tab{padding:.45rem .85rem;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);transition:.2s;font-family:'Nunito',sans-serif}
.step-tab:hover{background:var(--ll)}
.step-tab.active{background:var(--ll);border-color:var(--lp);color:var(--ld)}
.step-tab.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-bottom:1.2rem;box-shadow:var(--shadow);border-top:3.5px solid var(--lp);display:none}
.card.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.section-label{display:flex;align-items:center;gap:.5rem;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--ld);margin-bottom:.3rem}
.section-label::before{content:"";width:20px;height:3px;background:var(--lp);border-radius:2px}
.section-title{font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:600;margin-bottom:.1rem}
.section-desc{font-size:.85rem;color:var(--text-soft);margin-bottom:1rem;line-height:1.6}

/* GRAMMAR TAGS - inline-block prevents overlap */
.g-subj,.g-verb,.g-comp,.g-neg,.g-quest,.g-prep,.g-time,.g-art{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;margin:0 1px;line-height:1.5}
.g-subj{background:var(--subj-bg);color:var(--subj);border-bottom:2.5px solid var(--subj)}
.g-verb{background:var(--verb-bg);color:var(--verb);border-bottom:2.5px solid var(--verb)}
.g-comp{background:var(--comp-bg);color:var(--comp);border-bottom:2.5px solid var(--comp)}
.g-neg{background:var(--neg-bg);color:var(--neg);border-bottom:2.5px solid var(--neg)}
.g-quest{background:var(--quest-bg);color:var(--quest);border-bottom:2.5px solid var(--quest)}
.g-prep{background:#FFE0B2;color:#E65100;border-bottom:2.5px solid #FB8C00}
.g-time{background:#F8BBD0;color:#AD1457;border-bottom:2.5px solid #C2185B}
.g-art{background:#FFF59D;color:#F57F17;border-bottom:2.5px solid #FBC02D}

.g-table{width:100%;border-collapse:separate;border-spacing:0;margin:.8rem 0;border-radius:10px;overflow:hidden;font-size:.83rem;border:1px solid var(--border)}
.g-table th{background:var(--lg);color:#fff;padding:.65rem .6rem;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.g-table td{padding:.6rem;border-bottom:1px solid #f0f0f0;vertical-align:middle;line-height:1.65}
.g-table tr:nth-child(even) td{background:var(--ll)}
.g-table tr:last-child td{border-bottom:none}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0}
.compare-card{padding:1rem;border-radius:12px;text-align:center}
.compare-card.esp{background:var(--ll);border:2px solid var(--lm)}
.compare-card.eng{background:var(--subj-bg);border:2px solid #90CAF9}
.compare-card h4{font-family:'Fredoka',sans-serif;font-size:.85rem;margin-bottom:.5rem}
.compare-card.esp h4{color:var(--ld)}
.compare-card.eng h4{color:var(--subj)}
.compare-card ul{list-style:none;font-size:.82rem;color:var(--text-soft)}
.compare-card li{padding:3px 0;line-height:1.5}

.formula-box{background:var(--note-bg);border:2px solid var(--note-border);border-radius:12px;padding:1rem;margin:.8rem 0;text-align:center;font-family:'Fredoka',sans-serif;font-size:.95rem;color:var(--ld);line-height:2.1}
.tip-card{background:var(--ll);border-radius:10px;padding:.8rem 1rem;margin:.5rem 0;font-size:.83rem;border-left:3px solid var(--lp);line-height:1.65}
.tip-card strong{color:var(--ld)}
.alert-card{background:var(--err-bg);border:2px solid #EF5350;border-radius:10px;padding:.8rem 1rem;margin:.8rem 0}
.alert-card .atitle{font-family:'Fredoka',sans-serif;color:var(--err);font-size:.82rem;margin-bottom:.3rem}
.alert-card p{font-size:.82rem;color:var(--text-soft);line-height:1.65}

.viz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.8rem 0}
.viz-item{padding:.7rem .5rem;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--lm);font-size:.82rem}
.viz-item .ico{font-size:1.6rem;display:block;margin-bottom:.3rem}
.viz-item .lbl{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.95rem;display:block}
.viz-item .es{font-style:italic;color:var(--text-soft);font-size:.74rem;display:block;margin-top:2px}

.rule-grid{display:grid;grid-template-columns:1fr;gap:.5rem;margin:.8rem 0}
.rule-item{padding:.7rem 1rem;border-radius:10px;background:var(--card);border:1.5px solid var(--lm);display:flex;align-items:flex-start;gap:.7rem}
.rule-item .num{font-family:'Fredoka',sans-serif;background:var(--lp);color:#fff;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem}
.rule-item .info{flex:1;font-size:.85rem;line-height:1.6}
.rule-item .info strong{color:var(--ld);display:block;margin-bottom:2px}

.timeline{display:flex;align-items:center;justify-content:space-between;margin:1rem 0;padding:.8rem;background:var(--ll);border-radius:12px;border:1.5px solid var(--lm);gap:.4rem;flex-wrap:wrap}
.tl-point{flex:1;min-width:75px;text-align:center;padding:.5rem .3rem;background:#fff;border-radius:8px;border:2px solid var(--lm)}
.tl-point .ico{font-size:1.3rem;display:block}
.tl-point .lbl{font-family:'Fredoka',sans-serif;font-size:.78rem;color:var(--ld);margin-top:2px;display:block}
.tl-arrow{color:var(--lp);font-size:1.2rem;font-weight:700}

.ex-row{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .8rem;border-radius:10px;margin:.4rem 0;font-size:.88rem;transition:background .2s}
.ex-row:hover{background:var(--lglow)}
.ex-row .icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.ex-row .body{flex:1;min-width:0}
.ex-row .en{font-weight:700;color:var(--text);line-height:1.7;word-spacing:1px}
.ex-row .es{font-family:'Lora',serif;font-style:italic;font-size:.82rem;color:var(--text-soft);margin-top:3px;line-height:1.5}
.ex-right{border-left:3px solid var(--ok);background:var(--ok-bg)}
.ex-wrong{border-left:3px solid var(--err);background:var(--err-bg)}

.ex-section{margin-top:1.2rem;padding-top:1rem;border-top:2px dashed var(--lm)}
.ex-section h3{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.95rem;margin-bottom:.8rem}
.exercise{background:#fafafa;border-radius:12px;padding:1rem;margin-bottom:.7rem;border:2px solid #eee;transition:.2s}
.exercise.correct{border-color:var(--ok);background:var(--ok-bg)}
.exercise.incorrect{border-color:var(--err);background:var(--err-bg)}
.exercise-q{font-size:.9rem;margin-bottom:.7rem;line-height:1.55;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.opt-btn{padding:.7rem .55rem;border:2px solid #e0e0e0;border-radius:10px;background:var(--card);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s;font-family:'Nunito',sans-serif;text-align:center;line-height:1.35}
.opt-btn:hover:not(:disabled){border-color:var(--lp);background:var(--ll)}
.opt-btn:disabled{cursor:not-allowed;opacity:.7}
.opt-btn.sel-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt-btn.sel-bad{background:var(--err);color:#fff;border-color:var(--err)}
.opt-btn.show-ok{background:var(--ok);color:#fff;border-color:var(--ok)}

.fb{margin-top:.7rem;padding:0;border-radius:12px;font-size:.82rem;display:none;line-height:1.6;overflow:hidden}
.fb.show{display:block;animation:fbSlide .35s ease}
@keyframes fbSlide{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:600px;transform:translateY(0)}}
.fb-header{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;font-family:'Fredoka',sans-serif;font-size:.88rem;font-weight:600}
.fb.fb-ok .fb-header{background:#C8E6C9;color:var(--ok)}
.fb.fb-bad .fb-header{background:#FFCDD2;color:var(--err)}
.fb-header .fb-icon{font-size:1.2rem}
.fb-body{padding:.8rem 1rem}
.fb.fb-ok .fb-body{background:var(--ok-bg)}
.fb.fb-bad .fb-body{background:var(--err-bg)}
.fb-row{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem}
.fb-row:last-child{margin-bottom:0}
.fb-row .fb-dot{font-size:.95rem;flex-shrink:0;margin-top:1px}
.fb-row .fb-text{flex:1;line-height:1.55}
.fb-row .fb-text strong{color:var(--text)}
.fb-correct-answer{color:var(--ok);font-weight:700}
.fb-wrong-reason{color:var(--err);font-weight:600}
.fb-example{display:inline-block;margin-top:.5rem;padding:5px 12px;border-radius:6px;font-size:.79rem;font-weight:700}
.fb.fb-ok .fb-example{background:#A5D6A7;color:#1B5E20}
.fb.fb-bad .fb-example{background:#EF9A9A;color:#B71C1C}
.fb-tip{margin-top:.5rem;padding:.5rem .75rem;border-radius:8px;background:var(--note-bg);border:1px solid var(--note-border);font-size:.78rem;color:#6D4C00;line-height:1.5}
.fb-tip strong{color:var(--ld)}

.score-bar{text-align:center;padding:.8rem;background:var(--ll);border-radius:10px;margin-top:.8rem;border:1px solid var(--lm)}
.score-bar .num{font-family:'Fredoka',sans-serif;font-size:1.4rem;color:var(--ld)}
.score-bar .lbl{font-size:.7rem;color:var(--lp);font-weight:700;text-transform:uppercase;letter-spacing:1px}

.summary-final{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-top:1rem;box-shadow:var(--shadow);border-top:3.5px solid var(--ok);display:none}
.summary-final.show{display:block;animation:fadeIn .4s ease}
.summary-final h3{font-family:'Fredoka',sans-serif;color:var(--ok);margin-bottom:.6rem;font-size:1.15rem}
.summary-final ul{list-style:none}
.summary-final li{padding:5px 0 5px 22px;position:relative;font-size:.85rem;color:var(--text-soft);line-height:1.6}
.summary-final li:before{content:"\2713";position:absolute;left:0;color:var(--lp);font-weight:700;font-size:1rem}
.summary-final .total-score{margin-top:1rem;padding:.8rem;background:var(--ll);border-radius:10px;text-align:center;font-family:'Fredoka',sans-serif}
.summary-final .total-score .big{font-size:1.6rem;color:var(--ld)}
.summary-final .total-score .small{font-size:.8rem;color:var(--text-soft);font-weight:600}

@media(max-width:600px){
.level-header h1{font-size:1.4rem}
.card{padding:1.2rem}
.compare-grid,.viz-grid{grid-template-columns:1fr 1fr}
.timeline{flex-direction:column}
.tl-arrow{transform:rotate(90deg)}
.opts{grid-template-columns:1fr}
}

.why-box{background:#EDF7ED;border:1.5px solid #A5D6A7;border-left:4px solid var(--ok);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.83rem;line-height:1.6}.why-box .wt{font-family:'Fredoka',sans-serif;color:var(--ok);font-size:.8rem;display:block;margin-bottom:.2rem}.note-box{background:var(--note-bg);border:1.5px solid var(--note-border);border-left:4px solid var(--lp);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.83rem;line-height:1.6}.note-box .nt{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.8rem;display:block;margin-bottom:.2rem}.illus{display:flex;justify-content:center;align-items:center;gap:.5rem;margin:.4rem 0 1rem;background:linear-gradient(135deg,#FFF9C4,#FFECB3);border:2px dashed var(--lm);border-radius:16px;padding:1rem}.illus .big{font-size:3.2rem;line-height:1}.illus .big.sm{font-size:2.4rem}.info-illus{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.8rem 1rem;margin:.6rem 0}.info-illus .emo{font-size:2.4rem;line-height:1;flex-shrink:0}.info-illus .txt{font-size:.85rem;line-height:1.55}.info-illus .txt b{color:var(--ld)}.eg-card{position:relative;display:flex;align-items:center;gap:.7rem;background:#E3F2FD;border:2px solid #64B5F6;border-radius:12px;padding:1rem .9rem .9rem;margin:.4rem 0 1.1rem}.eg-card .eg-emo{font-size:2.3rem;line-height:1;flex-shrink:0}.eg-card .eg-body .en{font-weight:800;color:#0D47A1;font-size:.95rem;line-height:1.4}.eg-card .eg-body .es{font-family:'Lora',serif;font-style:italic;color:#1565C0;font-size:.82rem;margin-top:3px}.eg-card::before{content:'\1F4DD EJEMPLO';position:absolute;top:-11px;left:14px;background:#1565C0;color:#fff;font-family:'Fredoka',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.06em;padding:2px 9px;border-radius:20px}.eg-card.ok{background:#E8F5E9;border-color:#81C784}.eg-card.ok .en{color:#1B5E20}.eg-card.ok .es{color:#2E7D32}.eg-card.ok::before{content:'\2705 BIEN';background:#2E7D32}.eg-card.bad{background:#FFEBEE;border-color:#EF9A9A}.eg-card.bad .en{color:#B71C1C}.eg-card.bad .es{color:#C62828}.eg-card.bad::before{content:'\274C MAL';background:#C62828}
.art-hero{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.8rem 0}.art-hero.three{grid-template-columns:1fr 1fr 1fr}.art-box{background:#fff;border:2px solid var(--lm);border-radius:16px;padding:1rem .9rem;text-align:center;box-shadow:0 2px 10px rgba(249,168,37,.10)}.art-box .word{font-family:'Fredoka',sans-serif;font-size:2.6rem;font-weight:700;color:var(--ld);line-height:1;background:linear-gradient(135deg,#FFF9C4,#FFE082);border-radius:12px;padding:.5rem 0;margin-bottom:.5rem}.art-box.eng .word{background:linear-gradient(135deg,#E3F2FD,#90CAF9);color:#0D47A1}.art-box .role{font-family:'Fredoka',sans-serif;font-size:.78rem;color:var(--lp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}.art-box.eng .role{color:#1976D2}.art-box .desc{font-size:.8rem;color:var(--text-soft);line-height:1.5}.vs-grid{margin:.8rem 0}.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:.5rem;margin:.55rem 0}.vs-side{border-radius:12px;padding:.7rem .8rem;font-size:.84rem;line-height:1.45}.vs-side .flag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.2rem;opacity:.85}.vs-side.es{background:var(--ll);border:1.5px solid var(--lm)}.vs-side.es .flag{color:var(--ld)}.vs-side.en{background:#E3F2FD;border:1.5px solid #90CAF9}.vs-side.en .flag{color:#1565C0}.vs-mid{display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--lp)}@media(max-width:600px){.art-hero,.art-hero.three{grid-template-columns:1fr}.vs-row{grid-template-columns:1fr;gap:.3rem}.vs-mid{transform:rotate(90deg);padding:.1rem 0}}.audio-row{display:flex;gap:6px;margin-top:.55rem;flex-wrap:wrap}.audio-btn{display:inline-flex;align-items:center;gap:4px;font-family:'Nunito',sans-serif;font-size:.72rem;font-weight:700;border:1.5px solid #90CAF9;background:#fff;color:#0D47A1;padding:3px 11px;border-radius:8px;cursor:pointer;transition:all .2s;user-select:none}.audio-btn:hover{background:#E3F2FD;border-color:#42A5F5;transform:translateY(-1px)}.audio-btn.playing{border-color:var(--lp);background:var(--lglow);color:var(--ld)}.audio-btn .flag{font-size:.85rem}.eg-card.ok .audio-btn{border-color:#81C784;color:#1B5E20}.eg-card.ok .audio-btn:hover{background:#E8F5E9;border-color:#66BB6A}#voice-status{text-align:center;font-size:.76rem;color:var(--text-soft);margin:0 0 1rem;padding:.5rem .7rem;background:var(--card);border-radius:8px;border:1px solid var(--border);display:none}
</style>
</head>

<body>
<div class="container">
<div class="level-header">
<div class="level-badge">Pre-A1 · Nivel Básico</div>
<h1>Grammar Summary</h1>
<div class="module-name">🪪 To Be — Afirmativo y Negativo</div>
<p class="subtitle">am / is / are · isn’t / aren’t / I’m not · 5 pasos × 5 ejercicios</p>
</div>
<div id="voice-status">⏳ Cargando voces del navegador...</div>
<div class="step-tabs" id="stepTabs"></div>
<div id="cardArea"></div>
<div class="summary-final" id="summaryFinal">
<h3>🎓 Lo que aprendiste — To Be: Afirmativo y Negativo</h3>
<ul id="summaryList"></ul>
<div class="total-score" id="totalScore"></div>
</div>
</div>
<script>
const ICON_PARTY="🎉";
const ICON_CHECK="✅";
const ICON_X="❌";
const ICON_BULB="💡";
const ICON_NOTE="📝";
const ICON_THINK="😕";
const DASH="—";
const TEXT_CORRECT="¡Correcto!";
const TEXT_INCORRECT="No es correcto";
const TEXT_OTHER_OPT="La otra opción";
const TEXT_CORRECT_IS="La respuesta correcta es";
const TEXT_REMEMBER="Recuerda";
const TEXT_SCORE="Puntuación";

soy» describe mi estado.</div></div></div><div class=\"info-illus\"><span class=\"emo\">🔢</span><span class=\"txt\"><b>Tres formas para yo/tú/él.</b> El verbo cambia con la persona: soy, eres, es.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👨‍👩‍👧</span><div class=\"eg-body\"><div class=\"en\">Nosotros <b>somos</b> una familia.</div><div class=\"es\">«Somos» es la forma de «ser» para nosotros.</div></div></div><div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Negar = «no» antes del verbo.</b> «No soy», «no eres», «no es». El «no» va delante.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">😔</span><div class=\"eg-body\"><div class=\"en\">Yo <b>no soy</b> feliz.</div><div class=\"es\">El «no» va antes del verbo «soy».</div></div></div><div class=\"why-box\"><span class=\"wt\">💡 ¿Por qué importa?</span>En inglés el verbo «to be» también cambia con la persona (am/is/are), pero el «no» se vuelve <b>not</b> y va <b>después</b> del verbo. Solo cambia la posición.</div>", "exercises": [{"q": "«Yo soy feliz» en negativo es:", "a": "a", "o": ["Yo no soy feliz", "Yo soy no feliz"], "fc": "«No» va ANTES del verbo en español: «no soy».", "fi": "«Soy no feliz» no es natural; el «no» va antes del verbo, no después.", "ex": "Yo no soy feliz → I am not happy", "tip": "Español: no + verbo · Inglés: verbo + not"}, {"q": "En «Ella es amable», ¿cuál es el verbo?", "a": "a", "o": ["es (ser)", "está (estar)"], "fc": "«Es» viene de «ser»; se usa para cualidades como «amable».", "fi": "«Está» viene de «estar» (estados temporales). «Amable» es una cualidad.", "ex": "Ella es amable → She is kind", "tip": "Ser = cualidades/identidad · Estar = estados temporales"}, {"q": "«Nosotros somos una familia» — «somos» viene de:", "a": "b", "o": ["estar", "ser"], "fc": "«Somos» es la forma de «ser» para nosotros. Identidad = ser.", "fi": "«Estar» sería «estamos». La identidad siempre usa «ser».", "ex": "Nosotros somos una familia → We are a family", "tip <div class=\"desc\">«I am» — soy / estoy.</div></div><div class=\"art-box eng\"><div class=\"word\">is</div><div class=\"role\">he / she / it</div><div class=\"desc\">«He is» — es / está.</div></div><div class=\"art-box eng\"><div class=\"word\">are</div><div class=\"role\">you / we / they</div><div class=\"desc\">«You are» — eres / somos.</div></div></div><div class=\"info-illus\"><span class=\"emo\">😊</span><span class=\"txt\"><b>I + am.</b> Para identidad o cualidad, igual que «yo soy». (happy = feliz)</span></div><div class=\"eg-card\"><span class=\"eg-emo\">😊</span><div class=\"eg-body\"><div class=\"en\">I <span class=\"g-verb\">am</span> happy.</div><div class=\"es\">Yo estoy feliz. (I = yo)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'I am happy.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'I am happy.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">👦</span><span class=\"txt\"><b>He / She / It + is.</b> Tercera persona singular, como «él es». (boy = niño)</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👦</span><div class=\"eg-body\"><div class=\"en\">He <span class=\"g-verb\">is</span> a boy.</div><div class=\"es\">Él es un niño. (he = él)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'He is a boy.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'He is a boy.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">👨‍👩‍👧</span><span class=\"txt\"><b>You / We + are.</b> Para «tú» y para plurales, como «nosotros somos». (family = familia)</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👨‍👩‍👧</span><div class=\"eg-body\"><div class=\"en\">We <span class=\"g-verb\">are</span> a family.</div><div class=\"es\">Nosotros somos una familia. (we = nosotros)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'We are a family.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'We are a family.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"why-box\"><span class=\"wt\">💡 ¿Por qué importa?</span>Solo hay <b>3 formas</b>: am, is, are. Si recuerdas que I→am, He/She/It→is, You/We→are, ya dominas casi todo.</div>", "exercises": [{"q": "«I ___» (Yo soy/estoy). ¿Qué forma de «to be» va?", "a": "a", "o": ["am", "is"], "fc": "I + am siempre van juntos. Es la única combinación posible.", "fi": "«Is» es para He/She/It, nunca para I.", "ex": "I am happy → Yo estoy feliz", "tip": "I + am — la pareja inseparable"}, {"q": "«You ___» (Tú eres). ¿Qué forma va?", "a": "b", "o": ["is", "are"], "fc": "You + are van juntos, en singular y plural.", "fi": "«Is» es solo para He/She/It, nunca para You.", "ex": "You are kind → Tú eres amable", "tip": "You/We + are — misma forma"}, {"q": "«He ___» (Él es). ¿Qué forma va?", "a": "a", "o": ["is", "am"], "fc": "He/She/It + is. La tercera persona singular siempre usa «is».", "fi": "«Am» es exclusivo de I. He necesita «is».", "ex": "He is a boy → Él es un niño", "tip": "He/She/It + is — tercera persona singular"}, {"q": "«We ___» (Nosotros somos). ¿Qué forma va?", "a": "a", "o": ["are", "is"], "fc": "We + are. Los plurales y You siempre usan «are».", "fi": "«Is» es singular. «We» es plural → are.", "ex": "We are a family → Nosotros somos una familia", "tip": "Plural = are · Singular 3ª persona = is"}, {"q": "¿Cuántas formas tiene «to be» en total?", "a": "a", "o": ["3 (am, is, are)", "2 (am, is)"], "fc": "am (I), is (He/She/It), are (You/We). Exactamente 3 formas.", "fi": "Falta «are». Sin «are» no puedes usar You ni We.", "ex": "I am / He is / We are — las 3 formas", "tip": "am-is-are: las 3 formas del verbo to be"}]}, {"icon": "⚡", "title": "Diferencias", "html": "<div class=\"section-label\">Paso 3</div><div class=\"section-title\">Paso 3: ⚡ Diferencias Importantes</div><div class=\"illus\"><span class=\"big\">🔄</span><span class=\"big\">↔️</span><span class=\"big\">✋</span></div><div class=\"section-desc\">Estas diferencias son las que más confunden. Compara los dos idiomas lado a lado.</div><div class=\"section-label\">Comparación Español ↔ English</div><div class=\"vs-grid\"><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>No</b> soy feliz. El «no» va <b>antes</b> del verbo.</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span>I am <b>not</b> happy. El «not» va <b>después</b> del verbo.</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>ser</b> y <b>estar</b>: dos verbos distintos.</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span><b>to be</b>: un solo verbo cubre ambos.</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span>El sujeto puede omitirse: «Soy feliz».</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span>El <b>sujeto es obligatorio</b>: «<b>I</b> am happy».</div></div></div><div class=\"alert-card\"><div class=\"atitle\">⭐ «Ser» y «estar» = un solo «to be»</div><p>🔁 «Soy feliz» (estado) y «Soy un niño» (identidad) usan el MISMO verbo en inglés: «I am happy» / «I am a boy». ¡No eliges entre dos verbos!</p></div><div class=\"section-label\">Negar: «not» después del verbo</div><div class=\"info-illus\"><span class=\"emo\">✅</span><span class=\"txt\"><b>Bien:</b> am/is/are + <b>not</b>. El «not» va después del verbo. (happy = feliz)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">😔</span><div class=\"eg-body\"><div class=\"en\">I am <span class=\"g-neg\">not</span> happy.</div><div class=\"es\">Yo no estoy feliz — «not» después de «am».</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'I am not happy.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'I am not happy.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"eg-card bad\"><span class=\"eg-emo\">🚫</span><div class=\"eg-body\"><div class=\"en\">I <span class=\"g-neg\">no</span> am happy.</div><div class=\"es\">«No» es español; en inglés se usa «not» después del verbo.</div></div></div><div class=\"info-illus\"><span class=\"emo\">👧</span><span class=\"txt\"><b>Bien:</b> con She/He/It el negativo es «is not» o «isn’t». (kind = amable)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">👧</span><div class=\"eg-body\"><div class=\"en\">She <span class=\"g-neg\">isn’t</span> kind.</div><div class=\"es\">Ella no es amable — isn’t = is not.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'She isn\\'t kind.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'She isn\\'t kind.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"eg-card bad\"><span class=\"eg-emo\">🚫</span><div class=\"eg-body\"><div class=\"en\">She <span class=\"g-neg\">no</span> is kind.</div><div class=\"es\">«No» no funciona en inglés; usa «isn’t».</div></div></div><div class=\"section-label\">Contracciones</div><div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">😊</span><span class=\"lbl\">I’m</span><span class=\"es\">I am</span></div><div class=\"viz-item\"><span class=\"ico\">🙅</span><span class=\"lbl\">isn’t</span><span class=\"es\">is not</span></div><div class=\"viz-item\"><span class=\"ico\">🙅</span><span class=\"lbl\">aren’t</span><span class=\"es\">are not</span></div><div class=\"viz-item\"><span class=\"ico\">🙅</span><span class=\"lbl\">I’m not</span><span class=\"es\">I am not</span></div></div>", "exercises": [{"q": "«I ___ not happy.» ¿Qué forma de «to be» va?", "a": "a", "o": ["am", "is"], "fc": "I am not happy. — I + am, luego «not» después.", "fi": "«I is» nunca es correcto. Con I siempre «am».", "ex": "I am not happy → Yo no estoy feliz", "tip": "I + am not = I’m not — la única forma"}, {"q": "«She ___ a boy.» (no es). ¿Forma negativa correcta?", "a": "b", "o": ["are not", "is not"], "fc": "She + is not. She es tercera persona singular → is.", "fi": "«Are not» es para You/We. She es singular → is not.", "ex": "She is not a boy → Ella no es un niño", "tip": "She/He/It + is not (isn’t)"}, {"q": "Contracción de «is not»:", "a": "a", "o": ["isn’t", "ain’t"], "fc": "is + not = isn’t. Es la contracción estándar y correcta.", "fi": "«Ain’t» no es estándar ni aceptado en inglés escolar.", "ex": "She isn’t kind → Ella no es amable", "tip": "isn’t = is not · aren’t = are not"}, {"q": "Contracción de «are not»:", "a": "b", "o": ["arnt", "aren’t"], "fc": "are + not = aren’t (apóstrofo entre «n» y «t»).", "fi": "«Arnt» sin apóstrofo no existe en inglés.", "ex": "You aren’t kind → Tú no eres amable", "tip": "El apóstrofo reemplaza la «o» de «not»"}, {"q": "«Soy feliz» y «Estoy feliz» en inglés:", "a": "a", "o": ["Ambos: «I am happy»", "Son diferentes en inglés"], "fc": "«To be» cubre tanto «ser» como «estar». Un solo verbo.", "fi": "En inglés no hay dos verbos separados. «I am» = soy Y estoy.", "ex": "I am happy = Estoy feliz / Soy feliz", "tip": "to be = ser + estar — la gran simplificación del inglés"}]}, {"icon": "💡", "title": "Consejos", "html": "<div class=\"section-label\">Paso 4</div><div class=\"section-title\">Paso 4: 💡 Consejos Prácticos</div><div class=\"illus\"><span class=\"big sm\">💡</span><span class=\"big sm\">🧠</span></div><div class=\"section-desc\">Trucos para usar «to be» sin errores. Cada tip viene seguido de su ejemplo.</div><div class=\"info-illus\"><span class=\"emo\">🔗</span><span class=\"txt\"><b>Tip 1 — Las 3 parejas mágicas:</b> I+am · He/She/It+is · You/We+are. Memorízalas y nunca fallas.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">😊</span><div class=\"eg-body\"><div class=\"en\">I <span class=\"g-verb\">am</span> · He <span class=\"g-verb\">is</span> · We <span class=\"g-verb\">are</span></div><div class=\"es\">Yo soy · Él es · Nosotros somos</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'I am. He is. We are.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'I am. He is. We are.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Tip 2 — Negativo = am/is/are + not.</b> Nunca uses «no» para negar el verbo be.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">😔</span><div class=\"eg-body\"><div class=\"en\">She is <span class=\"g-neg\">not</span> kind.</div><div class=\"es\">Ella no es amable. (not después del verbo)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'She is not kind.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'She is not kind.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">💬</span><span class=\"txt\"><b>Tip 3 — Contracciones naturales:</b> I’m · isn’t · aren’t. En conversación se usan casi siempre.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🗣️</span><div class=\"eg-body\"><div class=\"en\">I’m a boy. She <span class=\"g-neg\">isn’t</span> here.</div><div class=\"es\">Soy un niño. Ella no está aquí.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'I\\'m a boy. She isn\\'t here.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'I\\'m a boy. She isn\\'t here.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">⭐</span><span class=\"txt\"><b>Tip 4 — «I’m not» es única.</b> La única contracción negativa con I es «I’m not». NO existe «amn’t».</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🙅</span><div class=\"eg-body\"><div class=\"en\">I’m <span class=\"g-neg\">not</span> tired.</div><div class=\"es\">No estoy cansado. (nunca «amn’t»)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'I\\'m not tired.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'I\\'m not tired.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"note-box\"><span class=\"nt\">⚠️ Error típico del hispanohablante</span>En español omitimos el sujeto: «Soy feliz». En inglés es obligatorio: «<b>I</b> am happy» ✅, no «Am happy» ❌.</div><div class=\"formula-box\">✅ <span class=\"g-subj\">I</span> <span class=\"g-verb\">am</span> → I am <span class=\"g-neg\">not</span> / I’m <span class=\"g-neg\">not</span><br>✅ <span class=\"g-subj\">He/She/It</span> <span class=\"g-verb\">is</span> → <span class=\"g-neg\">isn’t</span> / is <span class=\"g-neg\">not</span><br>✅ <span class=\"g-subj\">You/We</span> <span class=\"g-verb\">are</span> → <span class=\"g-neg\">aren’t</span> / are <span class=\"g-neg\">not</span></div>", "exercises": [{"q": "Contracción de «I am»:", "a": "a", "o": ["I’m", "Im"], "fc": "I’m — con apóstrofo. Reemplaza la «a» de «am».", "fi": "«Im» sin apóstrofo no existe. Siempre I’m.", "ex": "I’m a boy → Yo soy un niño", "tip": "El apóstrofo reemplaza letras omitidas"}, {"q": "«He ___ a boy.» ¿Forma correcta?", "a": "a", "o": ["is", "are"], "fc": "He + is. Tercera persona singular siempre usa «is».", "fi": "«Are» es para You/We. He es singular → is.", "ex": "He is a boy → Él es un niño", "tip": "He/She/It → is · You/We → are"}, {"q": "«You ___ kind.» (no eres). ¿Forma correcta?", "a": "a", "o": ["aren’t", "isn’t"], "fc": "You + aren’t. «You are not» → aren’t.", "fi": "«Isn’t» = is not, pero You necesita «are not» → aren’t.", "ex": "You aren’t kind → Tú no eres amable", "tip": "You/We + aren’t · He/She/It + isn’t"}, {"q": "«It ___ a family.» (no es). ¿Forma correcta?", "a": "b", "o": ["aren’t", "isn’t"], "fc": "It + isn’t. It es singular (como He/She) → is not.", "fi": "«Aren’t» = are not, pero It es singular → isn’t.", "ex": "It isn’t a family → No es una familia", "tip": "It → is/isn’t — igual que He y She"}, {"q": "«We ___ happy.» ¿Forma correcta?", "a": "b", "o": ["is", "are"], "fc": "We + are. Los grupos (We) siempre usan «are».", "fi": "«Is» es singular. «We» es plural → are.", "ex": "We are happy → Nosotros estamos felices", "tip": "We/You → are — siempre, sin excepción"}]}, {"icon": "🎯", "title": "Práctica Final", "html": "<div class=\"section-label\">Paso 5</div><div class=\"section-title\">Paso 5: 🎯 Práctica Final — Reto</div><div class=\"illus\"><span class=\"big\">🎯</span><span class=\"big\">🔥</span></div><div class=\"section-desc\">Junta todo: elige bien la forma de <b>be</b> (am/is/are) y forma el <b>afirmativo</b> y el <b>negativo</b> correctamente.</div><div class=\"formula-box\">✅ <span class=\"g-subj\">Subject</span> + <span class=\"g-verb\">am/is/are</span> + <span class=\"g-comp\">complement</span><br>❌ <span class=\"g-subj\">Subject</span> + <span class=\"g-verb\">am/is/are</span> + <span class=\"g-neg\">not</span> + <span class=\"g-comp\">complement</span></div><div class=\"info-illus\"><span class=\"emo\">😊</span><span class=\"txt\"><b>Afirmativo con «I»:</b> I + am + cualidad. (happy = feliz)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">😊</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">I</span> <span class=\"g-verb\">am</span> <span class=\"g-comp\">happy</span>.</div><div class=\"es\">Yo estoy feliz.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'I am happy.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'I am happy.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">👨‍👩‍👧</span><span class=\"txt\"><b>Afirmativo con «We»:</b> We + are + grupo. (family = familia)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">👨‍👩‍👧</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">We</span> <span class=\"g-verb\">are</span> <span class=\"g-comp\">a family</span>.</div><div class=\"es\">Nosotros somos una familia.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'We are a family.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'We are a family.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"info-illus\"><span class=\"emo\">👧</span><span class=\"txt\"><b>Negativo con «She»:</b> She + isn’t + complemento. (boy = niño)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">👧</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">She</span> <span class=\"g-neg\">isn’t</span> <span class=\"g-comp\">a boy</span>.</div><div class=\"es\">Ella no es un niño.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"speak(this,'She isn\\'t a boy.','US')\"><span class=\"flag\">🇺🇸</span> US</button><button class=\"audio-btn\" onclick=\"speak(this,'She isn\\'t a boy.','UK')\"><span class=\"flag\">🇬🇧</span> UK</button></div></div></div><div class=\"alert-card\"><div class=\"atitle\">⚠️ Los 3 errores más comunes</div><p>❌ «I is happy» → ✅ «I <b>am</b> happy» — I siempre con am<br>❌ «She are kind» → ✅ «She <b>is</b> kind» — She siempre con is<br>❌ «I no am happy» → ✅ «I am <b>not</b> happy» — not, no «no»</p></div>", "exercises": [{"q": "«I ___ a boy.» ¿Forma correcta?", "a": "a", "o": ["am", "is"], "fc": "I + am. La pareja inseparable: I am a boy.", "fi": "«I is» nunca es correcto. Con I siempre «am».", "ex": "I am a boy → Yo soy un niño", "tip": "I + am — siempre juntos, sin excepción"}, {"q": "«She ___ kind.» (no es). ¿Forma correcta?", "a": "a", "o": ["isn’t", "aren’t"], "fc": "She + isn’t. She es tercera persona singular → is not → isn’t.", "fi": "«Aren’t» es para You/We, no para She.", "ex": "She isn’t kind → Ella no es amable", "tip": "She/He/It + isn’t · You/We + aren’t"}, {"q": "«We ___ the same age.» ¿Forma correcta?", "a": "a", "o": ["are", "is"], "fc": "We + are. Los grupos siempre usan «are».", "fi": "«Is» es singular. We es plural → are.", "ex": "We are the same age → Tenemos la misma edad", "tip": "We → are — siempre, igual que You"}, {"q": "«His dad ___ kind.» (no es). ¿Forma correcta?", "a": "b", "o": ["aren’t", "isn’t"], "fc": "«His dad» = él (singular) → isn’t.", "fi": "«Aren’t» = are not, pero «his dad» es singular → isn’t.", "ex": "His dad isn’t kind → Su papá no es amable", "tip": "Si el sujeto se reemplaza por He/She/It → isn’t"}, {"q": "«I ___ happy.» (no estoy). ¿Forma correcta?", "a": "b", "o": ["isn’t", "’m not"], "fc": "I’m not happy. La única contracción negativa con I. NO existe «amn’t».", "fi": "«Isn’t» = is not, pero I necesita «am not» → I’m not.", "ex": "I’m not happy → Yo no estoy feliz", "tip": "I’m not — la única forma. «Amn’t» no existe"}]}]};


/* ============ AUDIO (Web Speech API) ============ */
var voicesReady=false,usVoice=null,ukVoice=null,curBtn=null;
function loadVoices(){
  var voices=speechSynthesis.getVoices();
  if(!voices.length)return;
  voicesReady=true;
  var usP=[
    function(v){return v.lang==='en-US'&&/samantha|allison|ava|tom|alex|nicky|aaron/i.test(v.name)},
    function(v){return v.lang==='en-US'&&/female|woman/i.test(v.name)},
    function(v){return v.lang==='en-US'&&/google us/i.test(v.name)},
    function(v){return v.lang==='en-US'&&/microsoft.*online/i.test(v.name)},
    function(v){return v.lang==='en-US'},
    function(v){return v.lang.indexOf('en')===0&&/us|america/i.test(v.name)}
  ];
  var ukP=[
    function(v){return v.lang==='en-GB'&&/daniel|kate|serena|oliver|martha/i.test(v.name)},
    function(v){return v.lang==='en-GB'&&/male|man/i.test(v.name)},
    function(v){return v.lang==='en-GB'&&/google uk/i.test(v.name)},
    function(v){return v.lang==='en-GB'&&/microsoft.*online/i.test(v.name)},
    function(v){return v.lang==='en-GB'},
    function(v){return v.lang.indexOf('en')===0&&/uk|brit/i.test(v.name)}
  ];
  for(var i=0;i<usP.length;i++){var m=voices.find(usP[i]);if(m){usVoice=m;break}}
  for(var j=0;j<ukP.length;j++){var m2=voices.find(function(v){return ukP[j](v)&&v!==usVoice});if(m2){ukVoice=m2;break}}
  if(!ukVoice){ukVoice=voices.find(function(v){return v.lang==='en-AU'})||voices.find(function(v){return v.lang==='en-IE'})||voices.find(function(v){return v.lang.indexOf('en')===0&&v!==usVoice})}
  var st=document.getElementById('voice-status');
  if(usVoice&&ukVoice&&usVoice!==ukVoice){st.style.display='none'}
  else if(usVoice||ukVoice){st.innerHTML='⚠️ Tu navegador tiene voces limitadas. Para 2 acentos distintos usa <strong>Google Chrome</strong> o <strong>Microsoft Edge</strong>.';st.style.display='block';st.style.background='#FFF3E0';st.style.borderColor='#FFB74D'}
}
speechSynthesis.getVoices();
if(speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=loadVoices}
setTimeout(loadVoices,100);setTimeout(loadVoices,500);setTimeout(loadVoices,1500);
function speak(btn,text,accent){
  if(curBtn===btn&&speechSynthesis.speaking){speechSynthesis.cancel();btn.classList.remove('playing');curBtn=null;return}
  if(speechSynthesis.speaking){speechSynthesis.cancel();if(curBtn)curBtn.classList.remove('playing')}
  if(!voicesReady)loadVoices();
  var u=new SpeechSynthesisUtterance(text);
  u.rate=0.82;u.pitch=1;
  if(accent==='US'){u.lang='en-US';if(usVoice)u.voice=usVoice}else{u.lang='en-GB';if(ukVoice)u.voice=ukVoice}
  btn.classList.add('playing');curBtn=btn;
  u.onend=function(){btn.classList.remove('playing');curBtn=null};
  u.onerror=function(){btn.classList.remove('playing');curBtn=null};
  speechSynthesis.speak(u);
}


let curStep=0;const scores={};const answered={};

function renderStepTabs(){
var c=document.getElementById("stepTabs");c.innerHTML="";
DATA.steps.forEach(function(s,i){
var b=document.createElement("button");
b.className="step-tab"+(i===curStep?" active":"");
if(allAnswered(i)&&i!==curStep)b.classList.add("done");
b.textContent=(i+1)+". "+s.icon+" "+s.title;
b.addEventListener("click",function(){curStep=i;renderStepTabs();renderCard();document.getElementById("summaryFinal").classList.remove("show")});
c.appendChild(b);
});
}
function allAnswered(stepIdx){
for(var i=0;i<5;i++){if(!answered["s"+stepIdx+"e"+i])return false}
return true;
}
function renderCard(){
var s=DATA.steps[curStep];
var k="s"+curStep;
if(scores[k]===undefined)scores[k]=0;
var area=document.getElementById("cardArea");
area.innerHTML="";
var card=document.createElement("div");
card.className="card active";
card.innerHTML=s.html;
var exSec=document.createElement("div");
exSec.className="ex-section";
var h3=document.createElement("h3");
h3.textContent=EX_HEADER+" "+s.title;
exSec.appendChild(h3);
s.exercises.forEach(function(e,i){
var eid=k+"e"+i;
var div=document.createElement("div");
div.className="exercise";
div.id=eid;
var qDiv=document.createElement("div");
qDiv.className="exercise-q";
qDiv.innerHTML=(i+1)+". "+e.q;
div.appendChild(qDiv);
var opts=document.createElement("div");
opts.className="opts";
var btnA=document.createElement("button");
btnA.className="opt-btn";
btnA.textContent="a) "+e.o[0];
btnA.addEventListener("click",function(){chk(eid,"a",e.a)});
opts.appendChild(btnA);
var btnB=document.createElement("button");
btnB.className="opt-btn";
btnB.textContent="b) "+e.o[1];
btnB.addEventListener("click",function(){chk(eid,"b",e.a)});
opts.appendChild(btnB);
div.appendChild(opts);
var fbOk=document.createElement("div");
fbOk.className="fb fb-ok";
fbOk.id="fbok-"+eid;
var correctText=e.o[e.a==="a"?0:1];
var fbOkParts=[];
fbOkParts.push("<div class=\"fb-header\"><span class=\"fb-icon\">"+ICON_PARTY+"</span> "+TEXT_CORRECT+"</div>");
fbOkParts.push("<div class=\"fb-body\">");
fbOkParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_CHECK+"</span><div class=\"fb-text\"><span class=\"fb-correct-answer\">"+correctText+"</span> "+DASH+" "+e.fc+"</div></div>");
fbOkParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_BULB+"</span><div class=\"fb-text\">"+TEXT_OTHER_OPT+": "+e.fi+"</div></div>");
if(e.ex)fbOkParts.push("<div class=\"fb-example\">"+ICON_NOTE+" "+e.ex+"</div>");
if(e.tip)fbOkParts.push("<div class=\"fb-tip\"><strong>"+ICON_BULB+" "+TEXT_REMEMBER+":</strong> "+e.tip+"</div>");
fbOkParts.push("</div>");
fbOk.innerHTML=fbOkParts.join("");
div.appendChild(fbOk);
var fbBad=document.createElement("div");
fbBad.className="fb fb-bad";
fbBad.id="fbbad-"+eid;
var fbBadParts=[];
fbBadParts.push("<div class=\"fb-header\"><span class=\"fb-icon\">"+ICON_THINK+"</span> "+TEXT_INCORRECT+"</div>");
fbBadParts.push("<div class=\"fb-body\">");
fbBadParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_X+"</span><div class=\"fb-text\"><span class=\"fb-wrong-reason\">"+e.fi+"</span></div></div>");
fbBadParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_CHECK+"</span><div class=\"fb-text\">"+TEXT_CORRECT_IS+" <span class=\"fb-correct-answer\">"+correctText+"</span> "+DASH+" "+e.fc+"</div></div>");
if(e.ex)fbBadParts.push("<div class=\"fb-example\">"+ICON_NOTE+" "+e.ex+"</div>");
if(e.tip)fbBadParts.push("<div class=\"fb-tip\"><strong>"+ICON_BULB+" "+TEXT_REMEMBER+":</strong> "+e.tip+"</div>");
fbBadParts.push("</div>");
fbBad.innerHTML=fbBadParts.join("");
div.appendChild(fbBad);
exSec.appendChild(div);
if(answered[eid]){
var btns=div.querySelectorAll(".opt-btn");
btns.forEach(function(b){b.disabled=true});
var sel=answered[eid].sel;
var correct=e.a;
if(sel===correct){
div.classList.add("correct");
btns.forEach(function(b){if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-ok")});
fbOk.classList.add("show");
}else{
div.classList.add("incorrect");
btns.forEach(function(b){
if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-bad");
if(b.textContent.indexOf(correct+")")===0)b.classList.add("show-ok");
});
fbBad.classList.add("show");
}
}
});
var sb=document.createElement("div");
sb.className="score-bar";
sb.innerHTML="<div class=\"num\" id=\"sc-"+k+"\">"+scores[k]+"/5</div><div class=\"lbl\">"+TEXT_SCORE+"</div>";
exSec.appendChild(sb);
card.appendChild(exSec);
area.appendChild(card);
}
function chk(eid,sel,correct){
if(answered[eid])return;
answered[eid]={sel:sel};
var ex=document.getElementById(eid);
var btns=ex.querySelectorAll(".opt-btn");
btns.forEach(function(b){b.disabled=true});
var k=eid.match(/s\d+/)[0];
if(sel===correct){
ex.classList.add("correct");
btns.forEach(function(b){if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-ok")});
document.getElementById("fbok-"+eid).classList.add("show");
scores[k]=(scores[k]||0)+1;
}else{
ex.classList.add("incorrect");
btns.forEach(function(b){
if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-bad");
if(b.textContent.indexOf(correct+")")===0)b.classList.add("show-ok");
});
document.getElementById("fbbad-"+eid).classList.add("show");
}
document.getElementById("sc-"+k).textContent=scores[k]+"/5";
if(allAnswered(curStep)){renderStepTabs();}
if(curStep===4&&allAnswered(4)){
setTimeout(function(){
var sf=document.getElementById("summaryFinal");
var sl=document.getElementById("summaryList");
sl.innerHTML=DATA.summary.map(function(s){return "<li>"+s+"</li>"}).join("");
var total=0;
for(var i=0;i<5;i++)total+=(scores["s"+i]||0);
window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(total/25*100)}})); // JUCUM seguimiento
var ts=document.getElementById("totalScore");
if(ts)ts.innerHTML="<div class=\"big\">"+total+"/25</div><div class=\"small\">"+TEXT_TOTAL+"</div>";
sf.classList.add("show");
sf.scrollIntoView({behavior:"smooth"});
},500);
}
}
renderStepTabs();renderCard();

</script>
