<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --primary: #F59E0B; --primary-light: #FCD34D; --primary-dark: #D97706;
            --accent: #FBBF24; --bg-gradient-start: #FFFBEB; --bg-gradient-end: #FEF3C7;
            --text-dark: #78350F; --text-medium: #92400E; --text-light: #B45309;
            --success: #10B981; --success-light: #D1FAE5; --success-dark: #059669;
            --error: #EF4444; --error-light: #FEE2E2; --error-dark: #DC2626;
            --info: #3B82F6; --info-light: #DBEAFE; --info-dark: #1D4ED8;
            --purple: #8B5CF6; --purple-light: #EDE9FE; --purple-dark: #6D28D9;
            --orange-light: #FFEDD5; --orange-dark: #C2410C;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(245,158,11,0.15);
            --shadow-strong: 0 8px 30px rgba(245,158,11,0.25);
            --border-radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Nunito',sans-serif; background:linear-gradient(135deg,var(--bg-gradient-start) 0%,var(--bg-gradient-end) 100%); min-height:100vh; color:var(--text-dark); }
        .header { background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-soft); }
        .header-info { flex:1; }
        .header-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:600; color:white; }
        .header-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:2px; }
        .progress-indicator { background:rgba(255,255,255,0.3); padding:0.4rem 0.9rem; border-radius:20px; font-weight:700; color:white; font-size:0.9rem; white-space:nowrap; }
        .progress-container { padding:0; height:6px; background:rgba(255,255,255,0.3); }
        .progress-fill { height:100%; background:white; border-radius:0 3px 3px 0; transition:width .5s ease; width:0%; }
        main { padding:1.5rem; max-width:650px; margin:0 auto; }
        .instructions { background:white; border-radius:16px; padding:1rem 1.25rem; margin-bottom:1.25rem; box-shadow:var(--shadow-soft); border-left:5px solid var(--primary); display:flex; gap:0.75rem; align-items:flex-start; }
        .instructions-icon { font-size:1.6rem; flex-shrink:0; }
        .instructions-title { font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:600; color:var(--text-dark); margin-bottom:0.2rem; }
        .instructions-text { font-size:0.85rem; color:var(--text-medium); line-height:1.5; }
        .question-card { background:white; border-radius:var(--border-radius); box-shadow:var(--shadow-soft); padding:1.5rem; margin-bottom:1rem; animation:slideIn .4s ease; }
        .question-card.hidden { display:none; }
        @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
        .q-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
        .question-number { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:0.95rem; flex-shrink:0; }
        .topic-badge { display:inline-flex; align-items:center; gap:0.3rem; padding:0.2rem 0.7rem; border-radius:20px; font-size:0.72rem; font-weight:700; background:#FEF3C7; color:var(--text-medium); margin-left:auto; }
        .toggle-row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
        .toggle-btn { border:2px solid var(--primary-light); background:#FFFBEB; color:var(--text-medium); border-radius:20px; padding:0.4rem 0.9rem; font-family:'Nunito',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .toggle-btn:hover { background:var(--primary-light); }
        .toggle-btn.active { background:var(--primary); color:white; border-color:var(--primary); }
        .hint-box { background:#FFFDE7; border-left:4px solid var(--primary); padding:0.7rem 1rem; border-radius:0 10px 10px 0; margin-bottom:1rem; font-size:0.88rem; color:#78350F; line-height:1.5; display:none; }
        .hint-box.show { display:block; }
        .hint-label { font-weight:700; color:var(--primary-dark); display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; font-size:0.82rem; text-transform:uppercase; letter-spacing:.5px; }
        .translation { color:var(--text-light); font-style:italic; font-size:0.88rem; margin:0.5rem 0 1rem; padding:0.6rem 0.9rem; background:#FFFBEB; border-radius:10px; display:none; }
        .translation.show { display:block; }
        .feedback { margin-top:1.25rem; border-radius:16px; overflow:hidden; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
        .feedback.show { display:block; animation:fadeUp .35s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }
        .feedback.correct .fb-header { background:linear-gradient(135deg,var(--success),var(--success-dark)); }
        .feedback.incorrect .fb-header { background:linear-gradient(135deg,var(--error),var(--error-dark)); }
        .fb-icon { font-size:1.6rem; }
        .fb-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; color:white; font-weight:600; }
        .fb-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:1px; }
        .fb-body { background:white; border:2px solid; border-top:none; border-radius:0 0 16px 16px; padding:1.25rem; display:flex; flex-direction:column; gap:0.9rem; }
        .feedback.correct .fb-body { border-color:var(--success); }
        .feedback.incorrect .fb-body { border-color:var(--error); }
        .fb-block { border-radius:12px; padding:0.9rem 1rem; }
        .fb-block-title { font-weight:800; font-size:0.78rem; text-transform:uppercase; letter-spacing:.6px; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
        .fb-signal { background:#F0FDF4; border:1px solid #BBF7D0; }
        .fb-signal.wrong { background:#FFF1F2; border:1px solid #FECDD3; }
        .fb-signal .fb-block-title { color:var(--success-dark); }
        .fb-signal.wrong .fb-block-title { color:var(--error-dark); }
        .fb-text { font-size:0.92rem; color:var(--text-dark); line-height:1.55; }
        .signal-tag { display:inline-block; background:var(--success); color:white; border-radius:6px; padding:0.1rem 0.5rem; font-size:0.8rem; font-weight:700; margin:0 2px; }
        .signal-tag.red { background:var(--error); }
        .fb-compare { background:#F8FAFC; border:1px solid #E2E8F0; }
        .fb-compare-row { display:flex; align-items:baseline; gap:0.6rem; padding:0.35rem 0; border-bottom:1px dashed #E2E8F0; }
        .fb-compare-row:last-child { border-bottom:none; }
        .compare-label { font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; padding:0.15rem 0.5rem; border-radius:6px; flex-shrink:0; }
        .compare-label.wrong { background:var(--error-light); color:var(--error-dark); }
        .compare-label.right { background:var(--success-light); color:var(--success-dark); }
        .compare-text { font-size:0.95rem; color:var(--text-dark); line-height:1.5; }
        .word-wrong { color:var(--error); font-weight:700; text-decoration:line-through; }
        .word-right { color:var(--success-dark); font-weight:700; }
        .fb-error { background:var(--error-light); }
        .fb-error .fb-block-title { color:var(--error-dark); }
        .error-badge { display:inline-block; background:var(--error); color:white; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; }
        .word-swap { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; flex-wrap:wrap; }
        .ws-box { padding:0.4rem 1rem; border-radius:8px; font-weight:700; font-size:1rem; }
        .ws-wrong { background:white; color:var(--error); border:2px solid var(--error); text-decoration:line-through; }
        .ws-arrow { font-size:1.3rem; color:var(--text-medium); }
        .ws-right { background:var(--success); color:white; }
        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }
        .fb-why .fb-block-title { color:var(--success-dark); }
        .nav-buttons { display:flex; gap:0.75rem; margin-top:1.25rem; }
        .nav-btn { padding:0.8rem 1.2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .nav-btn.next { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; flex:1; }
        .nav-btn.prev { background:#F1F5F9; color:var(--text-dark); }
        .nav-btn:disabled { opacity:.4; cursor:default; }
        .nav-btn:not(:disabled):hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }
        .results-screen.show { display:block; animation:fadeUp .5s ease; }
        .results-emoji { font-size:4rem; margin-bottom:1rem; }
        .results-title { font-family:'Fredoka',sans-serif; font-size:2rem; margin-bottom:0.5rem; }
        .results-score { font-size:3rem; font-weight:800; color:var(--purple); margin:1rem 0; }
        .results-message { font-size:1.05rem; color:var(--text-medium); margin-bottom:1.5rem; }
        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }
        .star.earned { opacity:1; animation:starPop .5s ease; }
        @keyframes starPop { 0%{transform:scale(0)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }
        .sent-option { border:2.5px solid #E5E7EB; border-radius:14px; padding:1rem 1.1rem; cursor:pointer; transition:all .2s; background:white; text-align:left; font-family:'Nunito',sans-serif; display:flex; gap:0.75rem; align-items:flex-start; width:100%; }
        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>
</head><body>
    <header class="header">
        <div class="header-info">

    <main>

                <div class="instructions-title">Identifica la oración correcta</div>

                <button class="result-btn primary" onclick="location.reload()">🔄 Intentar de Nuevo</button>
            </div>
        </div>

    <script>
    const quizData = [{"badge":"🙋 pronombre sujeto","options":[{"text":"He is my best friend.","correct":true,"es":"Él es mi mejor amigo."},{"text":"Him is my best friend.","correct":false,"errorWord":"Him","correctWord":"He","errorType":"Objeto como sujeto","explanation":"«Him» significa «a él» (recibe la acción). Quien hace la acción, antes del verbo, es «He».","es":"Él es mi mejor amigo (pronombre de objeto como sujeto)."},{"text":"He is I best friend.","correct":false,"errorWord":"I","correctWord":"my","errorType":"Sujeto en lugar de posesivo","explanation":"Antes de «best friend» va el posesivo «my» (mi). «I» solo funciona como sujeto.","es":"Él es mi mejor amigo (sujeto en lugar de posesivo)."}],"clue":"He","clueExplain":"es el pronombre sujeto para él: va antes del verbo y hace la acción.","correctReason":"«He» (él) es el sujeto correcto antes del verbo, y «my» acompaña al sustantivo.","hint":"Pregúntate quién HACE la acción y qué palabra acompaña al sustantivo. Cada pronombre tiene su puesto."},{"badge":"🎯 sujeto y objeto","options":[{"text":"She always listens to me.","correct":true,"es":"Ella siempre me escucha."},{"text":"Her always listens to me.","correct":false,"errorWord":"Her","correctWord":"She","errorType":"Posesivo como sujeto","explanation":"«Her» es «su/a ella», no puede hacer la acción. El sujeto (ella) es «She».","es":"Ella siempre me escucha (posesivo/objeto como sujeto)."},{"text":"She always listens to I.","correct":false,"errorWord":"I","correctWord":"me","errorType":"Sujeto tras preposición","explanation":"Después de «to» va el pronombre objeto: «me». «I» solo va de sujeto.","es":"Ella siempre me escucha (sujeto después de una preposición)."}],"clue":"She → me","clueExplain":"quien hace la acción es «She»; quien la recibe, tras «to», es «me».","correctReason":"El sujeto «She» hace la acción y el objeto «me» la recibe después de «to».","hint":"Hay dos puestos: antes del verbo y después de «to». Revisa qué pronombre vive en cada uno."},{"badge":"🙋 pronombre sujeto","options":[{"text":"We are a happy family.","correct":true,"es":"Somos una familia feliz."},{"text":"Us are a happy family.","correct":false,"errorWord":"Us","correctWord":"We","errorType":"Objeto como sujeto","explanation":"«Us» significa «a nosotros» (recibe la acción). El sujeto es «We» (nosotros).","es":"Somos una familia feliz (pronombre de objeto como sujeto)."},{"text":"Our are a happy family.","correct":false,"errorWord":"Our","correctWord":"We","errorType":"Posesivo como sujeto","explanation":"«Our» (nuestro) siempre acompaña a un sustantivo: our family. El sujeto es «We».","es":"Somos una familia feliz (posesivo como sujeto)."}],"clue":"We","clueExplain":"incluye a quien habla y hace la acción: es el sujeto.","correctReason":"«We» (nosotros) es el pronombre sujeto: puede hacer la acción antes del verbo.","hint":"De las tres palabras parecidas, solo una puede HACER la acción. Las otras acompañan o reciben."},{"badge":"🙋 pronombre sujeto","options":[{"text":"They are the same age.","correct":true,"es":"Tienen la misma edad."},{"text":"Them are the same age.","correct":false,"errorWord":"Them","correctWord":"They","errorType":"Objeto como sujeto","explanation":"«Them» significa «a ellos» (recibe la acción). El sujeto es «They» (ellos).","es":"Tienen la misma edad (pronombre de objeto como sujeto)."},{"text":"Their are the same age.","correct":false,"errorWord":"Their","correctWord":"They","errorType":"Posesivo como sujeto","explanation":"«Their» (su, de ellos) acompaña a un sustantivo: their school. El sujeto es «They».","es":"Tienen la misma edad (posesivo como sujeto)."}],"clue":"They","clueExplain":"reemplaza a varias personas y hace la acción: es el sujeto.","correctReason":"«They» (ellos) es el pronombre sujeto correcto para varias personas.","hint":"Ellos HACEN la acción en esta oración. ¿Cuál de las tres formas puede hacer eso?"},{"badge":"🙋 pronombre sujeto","options":[{"text":"I am seven years old.","correct":true,"es":"Tengo siete años."},{"text":"Me am seven years old.","correct":false,"errorWord":"Me","correctWord":"I","errorType":"Objeto como sujeto","explanation":"«Me» recibe la acción (a mí). Quien habla y hace la acción es «I».","es":"Tengo siete años (pronombre de objeto como sujeto)."},{"text":"My am seven years old.","correct":false,"errorWord":"My","correctWord":"I","errorType":"Posesivo como sujeto","explanation":"«My» (mi) acompaña a un sustantivo: my name. El sujeto es «I».","es":"Tengo siete años (posesivo como sujeto)."}],"clue":"I","clueExplain":"es quien habla: el sujeto que va con «am».","correctReason":"«I» (yo) es el sujeto: habla de sí mismo y va antes de «am».","hint":"Quien habla de sí mismo usa un pronombre especial de sujeto. Los otros dos tienen otros trabajos."},{"badge":"📦 it para cosas","options":[{"text":"It is on my wall.","correct":true,"es":"Está en mi pared (la foto)."},{"text":"Its is on my wall.","correct":false,"errorWord":"Its","correctWord":"It","errorType":"Posesivo como sujeto","explanation":"«Its» es posesivo (su, de una cosa) y acompaña a un sustantivo. El sujeto para una cosa es «It».","es":"Está en mi pared (la foto) (posesivo como sujeto)."},{"text":"It is on me wall.","correct":false,"errorWord":"me","correctWord":"my","errorType":"Objeto en lugar de posesivo","explanation":"Antes de «wall» va el posesivo «my» (mi). «Me» recibe la acción, no acompaña sustantivos.","es":"Está en mi pared (la foto) (objeto en lugar de posesivo)."}],"clue":"It","clueExplain":"reemplaza una cosa (la foto); para cosas no se usa he/she.","correctReason":"«It» es el sujeto para una cosa, y «my» acompaña correctamente a «wall».","hint":"Habla de una COSA que está en la pared de alguien. Revisa el sujeto y el posesivo."},{"badge":"🎯 pronombre objeto","options":[{"text":"My mom stands next to him.","correct":true,"es":"Mi mamá está junto a él."},{"text":"My mom stands next to he.","correct":false,"errorWord":"he","correctWord":"him","errorType":"Sujeto tras preposición","explanation":"Después de «to» va el pronombre objeto: «him» (a él). «He» solo va de sujeto.","es":"Mi mamá está junto a él (sujeto después de la preposición)."},{"text":"Me mom stands next to him.","correct":false,"errorWord":"Me","correctWord":"My","errorType":"Objeto en lugar de posesivo","explanation":"Antes de «mom» va el posesivo «My» (mi). «Me» no acompaña sustantivos.","es":"Mi mamá está junto a él (objeto en lugar de posesivo)."}],"clue":"him","clueExplain":"va después de la preposición «to»: recibe la acción.","correctReason":"Tras «next to» va el objeto «him», y «My» acompaña bien a «mom».","hint":"Mira lo que viene después de «next to» y la palabra que acompaña a «mom». Dos puestos, dos reglas."},{"badge":"🎯 pronombre objeto","options":[{"text":"I love her a lot.","correct":true,"es":"La quiero mucho (a ella)."},{"text":"I love she a lot.","correct":false,"errorWord":"she","correctWord":"her","errorType":"Sujeto como objeto","explanation":"Después del verbo «love» va el pronombre objeto: «her» (a ella). «She» solo va de sujeto.","es":"La quiero mucho (a ella) (sujeto usado como objeto)."},{"text":"Me love her a lot.","correct":false,"errorWord":"Me","correctWord":"I","errorType":"Objeto como sujeto","explanation":"«Me» recibe la acción. Quien hace la acción de querer es «I».","es":"La quiero mucho (a ella) (pronombre de objeto como sujeto)."}],"clue":"her","clueExplain":"recibe la acción del verbo «love»: es el objeto.","correctReason":"«I» hace la acción y «her» la recibe: cada pronombre en su puesto.","hint":"Alguien quiere y alguien es querida. Revisa qué pronombre HACE y cuál RECIBE."},{"badge":"🔑 posesivo","options":[{"text":"His name is Carlos.","correct":true,"es":"Su nombre es Carlos."},{"text":"Him name is Carlos.","correct":false,"errorWord":"Him","correctWord":"His","errorType":"Objeto en lugar de posesivo","explanation":"«Him» recibe la acción (a él). Antes de «name» va el posesivo «His» (su, de él).","es":"Su nombre es Carlos (objeto en lugar de posesivo)."},{"text":"He name is Carlos.","correct":false,"errorWord":"He","correctWord":"His","errorType":"Sujeto en lugar de posesivo","explanation":"«He» es el sujeto (él). Antes de «name» va el posesivo «His».","es":"Su nombre es Carlos (sujeto en lugar de posesivo)."}],"clue":"His","clueExplain":"va antes del sustantivo «name»: indica que el nombre es de él.","correctReason":"«His» acompaña a «name»: es el posesivo correcto para él.","hint":"La palabra antes de «name» debe decir DE QUIÉN es. Solo una de las tres hace ese trabajo."},{"badge":"🔑 posesivo","options":[{"text":"Her food is always delicious.","correct":true,"es":"Su comida siempre es deliciosa."},{"text":"She food is always delicious.","correct":false,"errorWord":"She","correctWord":"Her","errorType":"Sujeto en lugar de posesivo","explanation":"«She» es el sujeto (ella). Antes de «food» va el posesivo «Her» (su, de ella).","es":"Su comida siempre es deliciosa (sujeto en lugar de posesivo)."},{"text":"Hers food is always delicious.","correct":false,"errorWord":"Hers","correctWord":"Her","errorType":"Posesivo sin sustantivo","explanation":"«Hers» va solo, sin sustantivo (The food is hers). Antes de «food» va «Her».","es":"Su comida siempre es deliciosa (posesivo que va solo, con sustantivo)."}],"clue":"Her","clueExplain":"antes del sustantivo «food»: indica que la comida es de ella.","correctReason":"«Her» + sustantivo es la forma correcta de decir «su comida».","hint":"Busca la palabra que dice DE QUIÉN es la comida. Una forma va con sustantivo; otra va sola."},{"badge":"🎯 pronombre objeto","options":[{"text":"Miss Rosa is patient with us.","correct":true,"es":"Miss Rosa es paciente con nosotros."},{"text":"Miss Rosa is patient with we.","correct":false,"errorWord":"we","correctWord":"us","errorType":"Sujeto tras preposición","explanation":"Después de «with» va el pronombre objeto: «us» (con nosotros). «We» solo va de sujeto.","es":"Miss Rosa es paciente con nosotros (sujeto después de la preposición)."},{"text":"Miss Rosa is patient with our.","correct":false,"errorWord":"our","correctWord":"us","errorType":"Posesivo tras preposición","explanation":"«Our» (nuestro) acompaña a un sustantivo. Tras «with» va el objeto «us».","es":"Miss Rosa es paciente con nosotros (posesivo después de la preposición)."}],"clue":"us","clueExplain":"va después de la preposición «with»: recibe la paciencia.","correctReason":"Tras «with» va el objeto «us»: la paciencia es CON nosotros.","hint":"Después de «with» no puede ir cualquiera. ¿Qué pronombre recibe la acción?"},{"badge":"🔑 posesivo","options":[{"text":"Dev and Ravi love their school.","correct":true,"es":"Dev y Ravi aman su escuela."},{"text":"Dev and Ravi love them school.","correct":false,"errorWord":"them","correctWord":"their","errorType":"Objeto en lugar de posesivo","explanation":"«Them» recibe la acción (a ellos). Antes de «school» va el posesivo «their» (su, de ellos).","es":"Dev y Ravi aman su escuela (objeto en lugar de posesivo)."},{"text":"Dev and Ravi love they school.","correct":false,"errorWord":"they","correctWord":"their","errorType":"Sujeto en lugar de posesivo","explanation":"«They» es el sujeto (ellos). Antes de «school» va el posesivo «their».","es":"Dev y Ravi aman su escuela (sujeto en lugar de posesivo)."}],"clue":"their","clueExplain":"antes del sustantivo «school»: la escuela es de ellos.","correctReason":"«Their» + sustantivo dice de quién es la escuela.","hint":"La palabra antes de «school» debe decir DE QUIÉN es. Piensa qué forma acompaña sustantivos."},{"badge":"📦 it para cosas","options":[{"text":"Yes, it is very nice.","correct":true,"es":"Sí, es muy bonita (la escuela)."},{"text":"Yes, its is very nice.","correct":false,"errorWord":"its","correctWord":"it","errorType":"Posesivo como sujeto","explanation":"«Its» es posesivo y acompaña a un sustantivo. El sujeto para una cosa es «it».","es":"Sí, es muy bonita (la escuela) (posesivo como sujeto)."},{"text":"Yes, him is very nice.","correct":false,"errorWord":"him","correctWord":"it","errorType":"Objeto como sujeto (y para cosas)","explanation":"«Him» recibe la acción y es para personas. El sujeto de una cosa (la escuela) es «it».","es":"Sí, es muy bonita (la escuela) (objeto y persona para una cosa)."}],"clue":"it","clueExplain":"reemplaza a la escuela (una cosa) y es el sujeto de «is».","correctReason":"«It» es el sujeto correcto para hablar de una cosa como la escuela.","hint":"Hablamos de la ESCUELA. ¿Qué pronombre reemplaza a una cosa y puede ser sujeto?"},{"badge":"🎯 pronombre objeto","options":[{"text":"Ana sits next to me.","correct":true,"es":"Ana se sienta junto a mí."},{"text":"Ana sits next to I.","correct":false,"errorWord":"I","correctWord":"me","errorType":"Sujeto tras preposición","explanation":"Después de «to» va el pronombre objeto: «me» (junto a mí). «I» solo va de sujeto.","es":"Ana se sienta junto a mí (sujeto después de la preposición)."},{"text":"Ana sits next to my.","correct":false,"errorWord":"my","correctWord":"me","errorType":"Posesivo tras preposición","explanation":"«My» (mi) acompaña a un sustantivo: my bag. Tras «to» va el objeto «me».","es":"Ana se sienta junto a mí (posesivo después de la preposición)."}],"clue":"me","clueExplain":"va después de «next to»: quien habla recibe la cercanía.","correctReason":"Tras «next to» va «me»: el pronombre objeto de quien habla.","hint":"¿Junto a QUIÉN se sienta Ana? Después de una preposición hay un solo pronombre posible."},{"badge":"🙋 sujeto no inicial","options":[{"text":"Every morning he sells fruit.","correct":true,"es":"Cada mañana él vende fruta."},{"text":"Every morning him sells fruit.","correct":false,"errorWord":"him","correctWord":"he","errorType":"Objeto como sujeto","explanation":"«Him» recibe la acción (a él). Quien vende, el sujeto, es «he» — aunque no vaya al inicio de la oración.","es":"Cada mañana él vende fruta (pronombre de objeto como sujeto)."},{"text":"Every morning his sells fruit.","correct":false,"errorWord":"his","correctWord":"he","errorType":"Posesivo como sujeto","explanation":"«His» (su, de él) acompaña a un sustantivo: his fruit. El sujeto es «he».","es":"Cada mañana él vende fruta (posesivo como sujeto)."}],"clue":"he","clueExplain":"hace la acción de vender, aunque la oración no empiece con él.","correctReason":"«He» es el sujeto de «sells», aunque la oración empiece con «Every morning».","hint":"El sujeto no siempre va al inicio. Busca quién HACE la acción de vender."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('\\b'+escReg(o.errorWord)+'\\b'),'<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=70?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=70?'¡Muy bien! Sigue practicando. 💪'
            :'Buen esfuerzo. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
