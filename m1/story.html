"es":"gracioso/a","ex":"He is very funny."},{"w":"old","es":"años (edad) / viejo","ex":"I am seven years old."}];
/* Cada oración alineada EN↔ES (para resaltado por oración en ambos idiomas) */
const STORYDATA = {"1":{"sTitle":"My Name Is Leo","sTitleEs":"Me llamo Leo","dTitle":"First Day at School","dTitleEs":"Primer día de clases","paras":[[["Hello! My name is Leo.","¡Hola! Me llamo Leo."],["I am seven years old.","Tengo siete años."],["My town is small and quiet.","Mi pueblo es pequeño y tranquilo."],["It is pretty in the morning.","Es bonito por la mañana."],["I am happy here.","Soy feliz aquí."]],[["This is my dad, Marco.","Este es mi papá, Marco."],["He is tall and kind.","Él es alto y amable."],["His fruit stand is small.","Su puesto de frutas es pequeño."],["The market is busy every day.","El mercado está ocupado cada día."],["Dad is not home at noon.","Papá no está en casa al mediodía."]],[["My mom is Irma.","Mi mamá es Irma."],["She is full of energy.","Ella está llena de energía."],["Her soup is delicious.","Su sopa es deliciosa."],["The kitchen is her happy place.","La cocina es su lugar feliz."],["I am her big helper.","Yo soy su gran ayudante."]],[["Lara is my little sister.","Lara es mi hermanita."],["She is only four.","Tiene solo cuatro años."],["The girl is small and funny.","La niña es pequeña y graciosa."],["We are good friends.","Somos buenos amigos."],["Our house is full of laughs.","Nuestra casa está llena de risas."]],[["My eyes are brown.","Mis ojos son cafés."],["My hair is short and black.","Mi cabello es corto y negro."],["I am not very tall.","No soy muy alto."],["But I am very fast.","Pero soy muy rápido."],["I am not quiet at home.","No soy callado en casa."]],[["Drawing animals is fun for me.","Dibujar animales es divertido para mí."],["My favorite color is green.","Mi color favorito es el verde."],["Football is my favorite game.","El fútbol es mi juego favorito."],["It is fun with friends.","Es divertido con amigos."],["We play in the street.","Jugamos en la calle."]],[["My best friend is Ravi.","Mi mejor amigo es Ravi."],["He is seven, like me.","Él tiene siete, como yo."],["We are the same age.","Tenemos la misma edad."],["Ravi is funny and kind.","Ravi es gracioso y amable."],["I am happy with him.","Soy feliz con él."]],[["My school is small.","Mi escuela es pequeña."],["My teacher is Miss Rosa.","Mi maestra es Miss Rosa."],["She is patient with us.","Es paciente con nosotros."],["Her class is my favorite.","Su clase es mi favorita."],["English is not hard with her.","El inglés no es difícil con ella."]],[["There is a dream inside me.","Hay un sueño en mí."],["I want to be a teacher.","Quiero ser maestro."],["It is a big job.","Es un gran trabajo."],["But I am not afraid.","Pero no tengo miedo."],["Mom says I can.","Mamá dice que puedo."]],[["My town is not big.","Mi pueblo no es grande."],["Our house is not new.","Nuestra casa no es nueva."],["But it is my home.","Pero es mi hogar."],["We are a happy family.","Somos una familia feliz."],["And I am happy too.","Y yo también soy feliz."]]],"datos":["La edad en inglés usa <b>to be</b>, no <i>have</i>: <span class=\"frase\">I am seven years old.</span> <span class=\"lit\">(lit. «soy siete años de viejo»)</span>",null,null,null,"«No soy…» = <b>I am not…</b> La negación va después de <b>to be</b>: <span class=\"frase\">I am not tall · Dad is not home.</span>",null,null,"«Su clase» (de ella) = <b>her</b> class · «su puesto» (de él) = <b>his</b> stand. El posesivo cambia según quién posee.",null,"<b>To be</b> cambia con la persona: <span class=\"frase\">I am · he/she/it is · we/you/they are.</span>"],"dlg":[["Leo","Hello! I am Leo.","¡Hola! Yo soy Leo."],["Ana","Hi, Leo. My name is Ana.","Hola, Leo. Mi nombre es Ana."],["Leo","Nice to meet you, Ana.","Mucho gusto, Ana."],["Leo","Are you new here?","¿Eres nueva aquí?"],["Ana","Yes, I am.","Sí, lo soy."],["Ana","It is my first day.","Es mi primer día."],["Leo","How old are you?","¿Cuántos años tienes?"],["Ana","I am seven. And you?","Tengo siete. ¿Y tú?"],["Leo","I am seven too!","¡Yo también tengo siete!"],["Ana","We are the same age.","Tenemos la misma edad."],["Ana","Is the teacher nice?","¿La maestra es amable?"],["Leo","Yes, she is.","Sí, lo es."],["Leo","Her name is Miss Rosa.","Su nombre es Miss Rosa."],["Ana","Is she strict?","¿Es estricta?"],["Leo","No, she is not.","No, no lo es."],["Leo","She is patient and kind.","Es paciente y amable."],["Ana","Who is that tall boy?","¿Quién es ese niño alto?"],["Leo","That is Dev.","Ese es Dev."],["Leo","He is Ravi's big brother.","Es el hermano mayor de Ravi."],["Ana","And who is Ravi?","¿Y quién es Ravi?"],["Leo","He is my best friend.","Es mi mejor amigo."],["Ana","Are they in our class?","¿Están en nuestra clase?"],["Leo","Ravi is. Dev is not.","Ravi sí. Dev no."],["Ana","Is this seat free?","¿Está libre este asiento?"],["Leo","Yes! You are next to me.","¡Sí! Estás junto a mí."],["Ana","Thank you. I am happy now.","Gracias. Ahora estoy feliz."]]},"2":{"sTitle":"Mia's Family Photo","sTitleEs":"La foto de la familia de Mia","dTitle":"The Family Photo","dTitleEs":"La foto familiar","paras":[[["There is a big photo.","Hay una foto grande."],["It is on my wall.","Está en mi pared."],["There are seven people in it.","Hay siete personas en ella."],["There is one dog too.","También hay un perro."],["I love that photo.","Amo esa foto."]],[["The tall man is my dad.","El hombre alto es mi papá."],["His name is Carlos.","Su nombre es Carlos."],["He is a bus driver.","Es chofer de bus."],["His smile is very big.","Su sonrisa es muy grande."],["I feel safe with him.","Me siento segura con él."]],[["My mom is next to him.","Mi mamá está junto a él."],["Her name is Elsa.","Su nombre es Elsa."],["She is a nurse.","Es enfermera."],["Her eyes are happy.","Sus ojos son felices."],["She always listens to me.","Siempre me escucha."]],[["My brother Nico is nine.","Mi hermano Nico tiene nueve."],["He is very funny.","Es muy gracioso."],["In the photo, he makes a face.","En la foto, hace una mueca."],["He is not quiet.","No es callado."],["We are good friends.","Somos buenos amigos."]],[["I am in the front.","Yo estoy adelante."],["My dress is light blue.","Mi vestido es celeste."],["I am seven years old.","Tengo siete años."],["My smile is very big.","Mi sonrisa es muy grande."],["I am happy that day.","Estoy feliz ese día."]],[["My aunt Lucia is there.","Mi tía Lucía está ahí."],["She is my mom's sister.","Es la hermana de mi mamá."],["She is from another city.","Es de otra ciudad."],["She visits us every year.","Nos visita cada año."],["Her visits are special.","Sus visitas son especiales."]],[["My grandma Norma is there.","Mi abuela Norma está ahí."],["Her hair is white.","Su cabello es blanco."],["Grandpa Raúl is with her.","El abuelo Raúl está con ella."],["They are both seventy.","Los dos tienen setenta."],["They are very sweet.","Son muy dulces."]],[["Our dog is in the photo.","Nuestro perro está en la foto."],["His name is Toby.","Su nombre es Toby."],["He is small and brown.","Es pequeño y marrón."],["He is next to me.","Está junto a mí."],["Toby is family too.","Toby también es familia."]],[["We take a photo every year.","Tomamos una foto cada año."],["There is a big lunch.","Hay un gran almuerzo."],["There are cousins and friends.","Hay primos y amigos."],["The house is very loud.","La casa está muy ruidosa."],["It is a happy day.","Es un día feliz."]],[["I look at it every day.","La miro cada día."],["My family is not perfect.","Mi familia no es perfecta."],["But our love is big.","Pero nuestro amor es grande."],["We are always together.","Siempre estamos juntos."],["That is the best thing.","Eso es lo mejor."]]],"datos":["«Hay» tiene dos formas: <b>There is</b> + uno <span class=\"frase\">(There is one dog)</span> · <b>There are</b> + varios <span class=\"frase\">(There are seven people)</span>.",null,"«Su nombre» cambia en inglés: <b>his</b> name (de él, Carlos) · <b>her</b> name (de ella, Elsa).",null,null,null,null,"A las mascotas queridas les decimos <b>he/she</b>: <span class=\"frase\">He is small and brown.</span> (Toby)",null,"«La miro» = <b>I look at it</b>. Las cosas (la foto) son <b>it</b>."],"dlg":[["Mia","Sam, look at this photo!","Sam, ¡mira esta foto!"],["Sam","How nice! Is it your family?","¡Qué linda! ¿Es tu familia?"],["Mia","Yes, it is.","Sí, lo es."],["Sam","How many people are there?","¿Cuántas personas hay?"],["Mia","There are seven people.","Hay siete personas."],["Mia","And there is one dog.","Y hay un perro."],["Sam","Who is the tall man?","¿Quién es el hombre alto?"],["Mia","He is my dad, Carlos.","Es mi papá, Carlos."],["Sam","Is he a teacher?","¿Es maestro?"],["Mia","No, he is not.","No, no lo es."],["Mia","He is a bus driver.","Es chofer de bus."],["Sam","And the woman next to him?","¿Y la mujer junto a él?"],["Mia","She is my mom, Elsa.","Es mi mamá, Elsa."],["Sam","Her smile is very kind.","Su sonrisa es muy amable."],["Sam","Is that boy your brother?","¿Ese niño es tu hermano?"],["Mia","Yes, he is.","Sí, lo es."],["Mia","His name is Nico.","Su nombre es Nico."],["Sam","How old is he?","¿Cuántos años tiene?"],["Mia","He is nine years old.","Tiene nueve años."],["Sam","Is there a cat at home?","¿Hay un gato en casa?"],["Mia","No, there is not.","No, no hay."],["Mia","But there is a dog, Toby.","Pero hay un perro, Toby."],["Sam","My family is small.","Mi familia es pequeña."],["Sam","There are three of us.","Somos tres."],["Mia","Every family is special.","Cada familia es especial."],["Sam","You are right, Mia.","Tienes razón, Mia."]]},"3":{"sTitle":"Saturday at the Park","sTitleEs":"Sábado en el parque","dTitle":"Baby Luli","dTitleEs":"La bebé Luli","paras":[[["Saturday is a special day.","El sábado es un día especial."],["There is no school today.","No hay escuela hoy."],["We are all at home.","Estamos todos en casa."],["Dad makes eggs for everyone.","Papá hace huevos para todos."],["Breakfast is slow and happy.","El desayuno es lento y feliz."]],[["After breakfast, we walk outside.","Después del desayuno, salimos a caminar."],["Grandpa comes with us.","El abuelo viene con nosotros."],["His walking sti <script>
(function(){
  var FX={i:0,playing:false,sents:[],cfg:null};
  try{ FX.cfg=JSON.parse(localStorage.getItem("jucum_focus_cfg")||"null"); }catch(e){}
  FX.cfg=FX.cfg||{accent:"US",rate:0.9,text:"both"};
  function $g(id){return document.getElementById(id);}
  window.openFocus=function(){
    try{ if(!PARAS||!PARAS.length) return; }catch(e){ return; }
    FX.sents=[]; PARAS.forEach(function(p){ (p.pairs||[]).forEach(function(q){ FX.sents.push({en:q.en,es:q.es}); }); });
    try{ pausePlay(); }catch(e){}
    try{ $g("fxov").setAttribute("data-level", document.getElementById("screen").getAttribute("data-level")||"a2"); }catch(e){} $g("fxov").style.display="block"; fxShowSet();
  };
  function fxShowSet(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){}
    $g("fxset").style.display="block"; $g("fxread").style.display="none"; fxPaint(); }
  window.fxGear=function(){ fxShowSet(); };
  window.fxCfg=function(k,v){ FX.cfg[k]=v; try{localStorage.setItem("jucum_focus_cfg",JSON.stringify(FX.cfg));}catch(e){} fxPaint(); };
  function fxPaint(){ ["US","GB"].forEach(function(a){ $g("fxa"+a).classList.toggle("on",FX.cfg.accent===a); });
    [[0.75,"fxr075"],[0.9,"fxr09"],[1,"fxr1"],[1.15,"fxr115"]].forEach(function(p){ $g(p[1]).classList.toggle("on",FX.cfg.rate===p[0]); });
    $g("fxten").classList.toggle("on",FX.cfg.text==="en"); $g("fxtboth").classList.toggle("on",FX.cfg.text==="both"); }
  window.fxStart=function(){ FX.i=0; $g("fxset").style.display="none"; $g("fxread").style.display="flex"; FX.playing=true; fxRender(); fxSay(); };
  window.closeFocus=function(){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} $g("fxov").style.display="none"; };
  function fxVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; var gb=(FX.cfg.accent==="GB"||FX.cfg.accent==="UK"); var want=gb?"en-gb":"en-us";
    var pref= gb?["Google UK English Female","Google UK English Male","Microsoft Sonia","Microsoft Libby","Microsoft Ryan","Microsoft Thomas","Daniel","Kate","Serena"]:["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Michelle","Microsoft Ana","Samantha","Alex"];
    var en=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0;});
    var exact=en.filter(function(v){return v.lang.replace("_","-").toLowerCase()===want;});
    for(var i=0;i<pref.length;i++){ for(var j=0;j<exact.length;j++){ if(exact[j].name&&exact[j].name.indexOf(pref[i])===0) return exact[j]; } }
    if(exact.length) return exact[0];
    for(var i2=0;i2<pref.length;i2++){ for(var j2=0;j2<en.length;j2++){ if(en[j2].name&&en[j2].name.indexOf(pref[i2])===0) return en[j2]; } }
    return en[0]||null; }catch(e){ return null; } }
  function fxRender(){ var s=FX.sents[FX.i]||{en:"",es:""};
    $g("fxcnt").textContent="ORACIÓN "+(FX.i+1)+" DE "+FX.sents.length;
    $g("fxen").textContent=s.en; $g("fxes").textContent=s.es;
    $g("fxes").style.display=FX.cfg.text==="both"?"block":"none";
    $g("fxplay").textContent=FX.playing?"⏸":"▶";
    $g("fxbar").style.width=(FX.sents.length?Math.round((FX.i+1)/FX.sents.length*100):0)+"%"; }
  function fxSay(){ try{ speechSynthesis.cancel(); var s=FX.sents[FX.i]; if(!s) return;
    var u=new SpeechSynthesisUtterance(s.en); u.rate=FX.cfg.rate; var v=fxVoice(); if(v){u.voice=v;u.lang=v.lang;} else u.lang="en-US";
    u.onend=function(){ if(!FX.playing) return; if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); setTimeout(function(){ if(FX.playing) fxSay(); },420); } else { FX.playing=false; fxRender(); } };
    speechSynthesis.speak(u); }catch(e){}
  }
  window.fxToggle=function(){ if(FX.playing){ FX.playing=false; try{speechSynthesis.cancel();}catch(e){} } else { FX.playing=true; fxSay(); } fxRender(); };
  window.fxPrev=function(){ if(FX.i>0){ FX.i--; fxRender(); if(FX.playing) fxSay(); } };
  window.fxNext=function(){ if(FX.i<FX.sents.length-1){ FX.i++; fxRender(); if(FX.playing) fxSay(); } };
})();
</script>
