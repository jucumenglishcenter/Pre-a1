<script>
/* ═══ METADATOS ═══ */
const MAT = {"title":{"es":"Resumen de Gramática","en":"Grammar Summary"},"subtitle":{"es":"Pasado Irregular · went · came · had · got","en":"Irregular Past · went · came · had · got"},"reportId":"sum-past-irr-1"};
const PASS = 75;
const STEPS = [{"icon":"🇪🇸","title":{"es":"Repaso en Español","en":"Spanish Recap"},"html":{"es":"<div class=\"gdesc\">En español no todos los verbos forman el pasado igual. «Caminar» hace <b>caminé</b> y sigue la regla. Pero «ir» hace <b>fui</b>, «venir» hace <b>vine</b> y «tener» hace <b>tuve</b>: esos son los <b>irregulares</b>.</div>\n<div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">🚶 Regular</div><div class=\"role\">Sigue la regla</div><div class=\"desc\">caminar → caminé</div></div><div class=\"art-box\"><div class=\"word\">⚡ Irregular</div><div class=\"role\">Cambia de forma</div><div class=\"desc\">ir → fui</div></div></div>\n<div class=\"info-illus\"><span class=\"emo\">✅</span><span class=\"txt\">Los irregulares <b>no siguen la regla</b>: cambian de forma y se aprenden de memoria.</span></div>\n<div class=\"info-illus\"><span class=\"emo\">🔔</span><span class=\"txt\">En este resumen verás cuatro de los más usados: <b>ir, venir, tener y conseguir</b>.</span></div>\n<div class=\"gnote life\">🌎 <b>De tu vida:</b> «Ayer fui a la escuela», «Mi abuela vino a casa», «Tuve una prueba», «Saqué una buena nota». Todo eso ya terminó: es pasado.</div>","en":"<div class=\"gdesc\">In Spanish, not every verb forms the past the same way. «Caminar» becomes <b>caminé</b> and follows the rule. But «ir» becomes <b>fui</b>, «venir» becomes <b>vine</b> and «tener» becomes <b>tuve</b>: those are the <b>irregular</b> ones.</div>\n<div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">🚶 Regular</div><div class=\"role\">Follows the rule</div><div class=\"desc\">caminar → caminé</div></div><div class=\"art-box\"><div class=\"word\">⚡ Irregular</div><div class=\"role\">Changes form</div><div class=\"desc\">ir → fui</div></div></div>\n<div class=\"info-illus\"><span class=\"emo\">✅</span><span class=\"txt\">Irregular verbs <b>do not follow the rule</b>: they change form and you learn them by heart.</span></div>\n<div class=\"info-illus\"><span class=\"emo\">🔔</span><span class=\"txt\">In this summary you will see four very common ones: <b>go, come, have and get</b>.</span></div>\n<div class=\"gnote life\">🌎 <b>From your life:</b> «Ayer fui a la escuela», «Mi abuela vino a casa», «Tuve una prueba». All of it already finished: it is past.</div>"},"checks":[{"q":{"es":"«Caminé» sigue la regla; «fui» no. Entonces «fui» es:","en":"«Caminé» follows the rule; «fui» does not. So «fui» is:"},"opts":{"es":["Un verbo irregular","Un verbo regular"],"en":["An irregular verb","A regular verb"]},"correct":0,"fb":{"why":{"es":"No sigue el patrón: cambia de forma.","en":"It does not follow the pattern: it changes form."},"tip":{"es":"irregular = cambia","en":"irregular = changes"}}},{"q":{"es":"«Vine» es el pasado de:","en":"«Vine» is the past of:"},"opts":{"es":["venir","ver"],"en":["venir (come)","ver (see)"]},"correct":0,"fb":{"why":{"es":"venir → vine.","en":"venir → vine."},"tip":{"es":"venir → vine","en":"venir → vine"}}},{"q":{"es":"«Tuve» es el pasado de:","en":"«Tuve» is the past of:"},"opts":{"es":["tener","tocar"],"en":["tener (have)","tocar (touch)"]},"correct":0,"fb":{"why":{"es":"tener → tuve.","en":"tener → tuve."},"tip":{"es":"tener → tuve","en":"tener → tuve"}}},{"q":{"es":"Los verbos irregulares hay que:","en":"Irregular verbs must be:"},"opts":{"es":["Aprenderlos de memoria","Buscarles la regla -ed"],"en":["Learned by heart","Given the -ed rule"]},"correct":0,"fb":{"why":{"es":"No tienen regla: se memorizan.","en":"They have no rule: you memorize them."},"tip":{"es":"de memoria","en":"by heart"}}},{"q":{"es":"«Ayer fui a la escuela» habla:","en":"«Ayer fui a la escuela» talks about:"},"opts":{"es":["Del pasado","Del futuro"],"en":["The past","The future"]},"correct":0,"fb":{"why":{"es":"«Ayer» ya terminó.","en":"«Ayer» already finished."},"tip":{"es":"ayer = pasado","en":"ayer = past"}}}]},{"icon":"🤝","title":{"es":"Similitudes","en":"Similarities"},"html":{"es":"<div class=\"gdesc\">El inglés hace lo mismo: casi todos los verbos agregan <b>-ed</b>, pero un grupo pequeño <b>cambia de forma</b>. Son los verbos irregulares.</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">🚶</span><span class=\"lbl\">go → went</span><span class=\"es\">fui / fue</span></div><div class=\"viz-item\"><span class=\"ico\">🚌</span><span class=\"lbl\">come → came</span><span class=\"es\">vine / vino</span></div><div class=\"viz-item\"><span class=\"ico\">🎒</span><span class=\"lbl\">have → had</span><span class=\"es\">tuve / tuvo</span></div><div class=\"viz-item\"><span class=\"ico\">⭐</span><span class=\"lbl\">get → got</span><span class=\"es\">conseguí / consiguió</span></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">Then I <span class=\"tag v\">went</span> to school.</div><div class=\"es\">Luego fui a la escuela.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Then I went to school.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Then I went to school.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">The bus <span class=\"tag v\">came</span> at seven.</div><div class=\"es\">El bus vino a las siete.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('The bus came at seven.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('The bus came at seven.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"sec-label\">Lo igual en los dos idiomas</div>\n<ul class=\"simlist\"><li>Los dos idiomas tienen verbos regulares e irregulares.</li><li>Los dos usan palabras señal: yesterday = ayer · last week = la semana pasada.</li><li>El orden no cambia: Sujeto + verbo + complemento.</li></ul>\n<div class=\"gnote\">👍 Buena noticia: son pocos y se repiten muchísimo. Con estos cuatro ya puedes contar casi cualquier día.</div>","en":"<div class=\"gdesc\">English does the same: almost every verb adds <b>-ed</b>, but a small group <b>changes form</b>. Those are the irregular verbs.</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">🚶</span><span class=\"lbl\">go → went</span><span class=\"es\">fui / fue</span></div><div class=\"viz-item\"><span class=\"ico\">🚌</span><span class=\"lbl\">come → came</span><span class=\"es\">vine / vino</span></div><div class=\"viz-item\"><span class=\"ico\">🎒</span><span class=\"lbl\">have → had</span><span class=\"es\">tuve / tuvo</span></div><div class=\"viz-item\"><span class=\"ico\">⭐</span><span class=\"lbl\">get → got</span><span class=\"es\">conseguí / consiguió</span></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">Then I <span class=\"tag v\">went</span> to school.</div><div class=\"es\">Luego fui a la escuela.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('Then I went to school.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('Then I went to school.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">The bus <span class=\"tag v\">came</span> at seven.</div><div class=\"es\">El bus vino a las siete.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('The bus came at seven.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('The bus came at seven.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"sec-label\">The same in both languages</div>\n<ul class=\"simlist\"><li>Both languages have regular and irregular verbs.</li><li>Both use signal words: yesterday · last week.</li><li>The order stays the same: Subject + verb + complement.</li></ul>\n<div class=\"gnote\">👍 Good news: there are few of them and they repeat a lot.</div>"},"checks":[{"q":{"es":"En inglés, el pasado de <b>go</b> es:","en":"In English, the past of <b>go</b> is:"},"opts":{"es":["went","goed"],"en":["went","goed"]},"correct":0,"fb":{"why":{"es":"go es irregular: go → went.","en":"go is irregular: go → went."},"tip":{"es":"go → went","en":"go → went"}}},{"q":{"es":"El pasado de <b>come</b> es:","en":"The past of <b>come</b> is:"},"opts":{"es":["came","comed"],"en":["came","comed"]},"correct":0,"fb":{"why":{"es":"come es irregular: come → came.","en":"come is irregular: come → came."},"tip":{"es":"come → came","en":"come → came"}}},{"q":{"es":"El pasado de <b>have</b> es:","en":"The past of <b>have</b> is:"},"opts":{"es":["had","haved"],"en":["had","haved"]},"correct":0,"fb":{"why":{"es":"have es irregular: have → had.","en":"have is irregular: have → had."},"tip":{"es":"have → had","en":"have → had"}}},{"q":{"es":"El pasado de <b>get</b> es:","en":"The past of <b>get</b> is:"},"opts":{"es":["got","getted"],"en":["got","getted"]},"correct":0,"fb":{"why":{"es":"get es irregular: get → got.","en":"get is irregular: get → got."},"tip":{"es":"get → got","en":"get → got"}}},{"q":{"es":"Los verbos irregulares en inglés:","en":"Irregular verbs in English:"},"opts":{"es":["Cambian de forma","Agregan -ed"],"en":["Change form","Add -ed"]},"correct":0,"fb":{"why":{"es":"Por eso se llaman irregulares.","en":"That is why they are irregular."},"tip":{"es":"cambian de forma","en":"they change form"}}}]},{"icon":"⚡","title":{"es":"Diferencias","en":"Differences"},"html":{"es":"<div class=\"gdesc\">En español cada persona tiene su forma: <b>fui, fuiste, fue, fuimos, fueron</b>. En inglés hay <b>UNA sola forma para todos</b>: <b>went</b>.</div>\n<table class=\"dtab\"><tr><th>Español</th><th>English</th><th>Explicación</th></tr>\n<tr><td>fui, fuiste, fue, fuimos, fueron</td><td class=\"en\">went</td><td>Una sola forma para todas las personas</td></tr>\n<tr><td>vine, viniste, vino, vinimos</td><td class=\"en\">came</td><td>I came · he came · we came</td></tr>\n<tr><td>tuve, tuviste, tuvo, tuvimos</td><td class=\"en\">had</td><td>I had · she had · they had</td></tr>\n<tr><td>conseguí, sacaste, consiguió</td><td class=\"en\">got</td><td>I got · you got · he got</td></tr></table>\n<div class=\"sec-label\">La misma forma para TODAS las personas</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">👤</span><span class=\"lbl\">I went</span><span class=\"es\">yo fui</span></div><div class=\"viz-item\"><span class=\"ico\">👉</span><span class=\"lbl\">You went</span><span class=\"es\">tú fuiste · ustedes fueron</span></div><div class=\"viz-item\"><span class=\"ico\">👦</span><span class=\"lbl\">He went</span><span class=\"es\">él fue</span></div><div class=\"viz-item\"><span class=\"ico\">👧</span><span class=\"lbl\">She went</span><span class=\"es\">ella fue</span></div><div class=\"viz-item\"><span class=\"ico\">🐶</span><span class=\"lbl\">It went</span><span class=\"es\">eso fue (animal/cosa)</span></div><div class=\"viz-item\"><span class=\"ico\">👨‍👩‍👧</span><span class=\"lbl\">We / They went</span><span class=\"es\">fuimos · fueron</span></div></div>\n<div class=\"sec-label\">⚠️ El error más común</div>\n<div class=\"info-illus\"><span class=\"emo\">❌</span><span class=\"txt\">No existe «goed» ni «haved». El verbo irregular <b>ya es pasado</b> por sí solo: went, came, had, got.</span></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">She <span class=\"tag v\">had</span> a big surprise.</div><div class=\"es\">Ella tenía una gran sorpresa.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('She had a big surprise.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('She had a big surprise.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card bad\" data-lab=\"❌ MAL\"><span class=\"emo\">💬</span><div><div class=\"en\">She <span class=\"tag v\">haved</span> a big surprise.</div><div class=\"es\">(forma inventada: no existe)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('She haved a big surprise.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('She haved a big surprise.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"gnote\">🧠 Truco: apréndelos en pareja, como una sola palabra: <b>go-went · come-came · have-had · get-got</b>.</div>","en":"<div class=\"gdesc\">In Spanish each person has its own form: <b>fui, fuiste, fue, fuimos, fueron</b>. In English there is <b>ONE form for everybody</b>: <b>went</b>.</div>\n<table class=\"dtab\"><tr><th>Español</th><th>English</th><th>Explanation</th></tr>\n<tr><td>fui, fuiste, fue, fuimos, fueron</td><td class=\"en\">went</td><td>One single form for all persons</td></tr>\n<tr><td>vine, viniste, vino, vinimos</td><td class=\"en\">came</td><td>I came · he came · we came</td></tr>\n<tr><td>tuve, tuviste, tuvo, tuvimos</td><td class=\"en\">had</td><td>I had · she had · they had</td></tr>\n<tr><td>conseguí, sacaste, consiguió</td><td class=\"en\">got</td><td>I got · you got · he got</td></tr></table>\n<div class=\"sec-label\">The same form for ALL persons</div>\n<div class=\"viz-grid\"><div class=\"viz-item\"><span class=\"ico\">👤</span><span class=\"lbl\">I went</span><span class=\"es\">yo fui</span></div><div class=\"viz-item\"><span class=\"ico\">👉</span><span class=\"lbl\">You went</span><span class=\"es\">tú fuiste · ustedes fueron</span></div><div class=\"viz-item\"><span class=\"ico\">👦</span><span class=\"lbl\">He went</span><span class=\"es\">él fue</span></div><div class=\"viz-item\"><span class=\"ico\">👧</span><span class=\"lbl\">She went</span><span class=\"es\">ella fue</span></div><div class=\"viz-item\"><span class=\"ico\">🐶</span><span class=\"lbl\">It went</span><span class=\"es\">eso fue</span></div><div class=\"viz-item\"><span class=\"ico\">👨‍👩‍👧</span><span class=\"lbl\">We / They went</span><span class=\"es\">fuimos · fueron</span></div></div>\n<div class=\"sec-label\">⚠️ The most common mistake</div>\n<div class=\"info-illus\"><span class=\"emo\">❌</span><span class=\"txt\">There is no «goed» or «haved». The irregular verb <b>is already the past</b>: went, came, had, got.</span></div>\n<div class=\"eg-card ok\" data-lab=\"✅ BIEN\"><span class=\"emo\">💬</span><div><div class=\"en\">She <span class=\"tag v\">had</span> a big surprise.</div><div class=\"es\">Ella tenía una gran sorpresa.</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('She had a big surprise.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('She had a big surprise.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"eg-card bad\" data-lab=\"❌ MAL\"><span class=\"emo\">💬</span><div><div class=\"en\">She <span class=\"tag v\">haved</span> a big surprise.</div><div class=\"es\">(invented form: it does not exist)</div><div class=\"audio-row\"><button class=\"audio-btn\" onclick=\"say('She haved a big surprise.','US')\">🇺🇸 US</button><button class=\"audio-btn\" onclick=\"say('She haved a big surprise.','UK')\">🇬🇧 UK</button></div></div></div>\n<div class=\"gnote\">🧠 Trick: learn them in pairs, like one word: <b>go-went · come-came · have-had · get-got</b>.</div>"},"checks":[{"q":{"es":"«Fui, fuiste, fue, fuimos» en inglés son:","en":"«Fui, fuiste, fue, fuimos» in English are:"},"opts":{"es":["Una sola forma: went","Cuatro formas distintas"],"en":["One single form: went","Four different forms"]},"correct":0,"fb":{"why":{"es":"El inglés usa went para todas las personas.","en":"English uses went for every person."},"tip":{"es":"una sola forma","en":"one form"}}},{"q":{"es":"¿Cuál está bien?","en":"Which one is right?"},"opts":{"es":["He went home","He goed home"],"en":["He went home","He goed home"]},"correct":0,"fb":{"why":{"es":"«goed» no existe.","en":"«goed» does not exist."},"tip":{"es":"went","en":"went"}}},{"q":{"es":"¿Cuál está bien?","en":"Which one is right?"},"opts":{"es":["We had lunch","We haved lunch"],"en":["We had lunch","We haved lunch"]},"correct":0,"fb":{"why":{"es":"«haved» no existe.","en":"«haved» does not function say(text,acc){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; const vs=speechSynthesis.getVoices()||[]; const want=acc==='US'?'en-US':'en-GB'; const v=vs.find(x=>x.lang===want)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0); if(v){u.voice=v;u.lang=v.lang;}else u.lang=want; speechSynthesis.speak(u); }catch(e){} }
function render(){ cur=0; coreDone=false; doneSteps=new Array(STEPS.length).fill(false); answers=STEPS.map(s=>new Array(s.checks.length).fill(null)); bState={order:[],locked:false};
  document.getElementById('results').classList.remove('show'); document.getElementById('mbody').style.display='block'; document.getElementById('msbanner').style.display='none';
  renderTabs(); applyLang(); showStep(0); }
function renderTabs(){ document.getElementById('steptabs').innerHTML=STEPS.map((s,i)=>`<button class="stab${i===0?' on':''}${doneSteps[i]?' done':''}" id="stab${i}" onclick="goStep(${i})">${s.icon} ${i+1}</button>`).join(''); }
function applyLang(){ const t=L();
  document.getElementById('lsEs').classList.toggle('on',info==='es'); document.getElementById('lsEn').classList.toggle('on',info==='en');
  document.getElementById('mhtitle').textContent=MAT.title[info]; document.getElementById('mhsub').textContent=document.getElementById('screen').getAttribute('data-level').toUpperCase().replace('-',' · ')+' · '+MAT.subtitle[info];
  document.getElementById('unT').textContent=t.unT; document.getElementById('unP').textContent=t.unP;
  document.getElementById('helpT').textContent=t.helpT; document.getElementById('helpTips').innerHTML='<div style="font-size:11.5px;color:var(--text-soft);font-weight:700;margin-bottom:6px">'+t.tipsT+'</div>'+t.tips.map(x=>'<div class="helptip">• <span>'+x+'</span></div>').join('');
  document.getElementById('kpT').textContent=t.kpT; document.getElementById('lBack').textContent=t.back; document.getElementById('lRetry').textContent=t.retry;
  updateMilestone(); renderStep(); }
function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';
  let html=`<div class="gcard"><div class="sec-label">${cur+1}. ${s.icon} ${s.title[info]}</div>${s.html[info]}`;
  if(s.builder) html+=builderHtml(); html+=`</div>`;
  const ansd=answers[cur].filter(x=>x!==null).length;
  html+=`<div class="check"><div class="check-h">🧠 ${t.checkH}<span class="cprog">${ansd}/${s.checks.length}</span></div><div class="check-sub">${t.checkSub}</div>`;
  s.checks.forEach((c,ci)=>{ const sel=answers[cur][ci]; const done=sel!==null; const ok=sel===c.correct;
    let fb='';
    if(done){ const f=c.fb; fb=`<div class="cfb show ${ok?'ok':'no'}"><div class="cfbh">${ok?'✅ '+t.cOk:'❌ '+t.cBad}</div><div class="cfbb">`+
      `<div class="fblk why"><b>🔍 ${t.fWhy}</b>${f.why[info]}</div>`+
      (f.contrast?`<div class="fblk contrast"><b>⚠ ${t.fNo}</b>${f.contrast[info]}</div>`:'')+
      (f.ex?`<div class="fblk ex"><b>📝 ${t.fEx}</b>${f.ex[info]}</div>`:'')+
      (f.tip?`<div class="fblk tip"><b>💡 ${t.fTip}</b>${f.tip[info]}</div>`:'')+`</div></div>`; }
    const trBtn = (c.tr && info==='es') ? `<button class="ctransbtn" onclick="this.nextElementSibling.classList.toggle('show')">🌐 ${t.seeTr}</button><div class="ctrans">${c.tr.es}</div>` : '';
    html+=`<div class="citem"><p class="cq"><span class="n">${ci+1}.</span> ${c.q[info]}</p>${trBtn}<div class="copts">`+
      c.opts[info].map((o,k)=>{ let cl='copt'; if(done){ if(k===c.correct)cl+=' ok'; else if(k===sel)cl+=' no'; } return `<button class="${cl}" ${done?'disabled':''} onclick="checkAns(${ci},${k})">${o}</button>`; }).join('')+
      `</div>${fb}</div>`;
  });
  html+=`</div>`;
  document.getElementById('stepArea').innerHTML=html;
  if(s.builder) initBuilder();
  document.getElementById('navPrev').textContent=t.prev; document.getElementById('navPrev').disabled=cur===0;
  document.getElementById('navNext').textContent= cur===STEPS.length-1? t.finish : t.next;
  document.getElementById('pfill').style.width=(doneSteps.filter(Boolean).length/STEPS.length*100)+'%';
}
function checkAns(ci,k){ if(answers[cur][ci]!==null) return; answers[cur][ci]=k;
  if(answers[cur].every(x=>x!==null)){ doneSteps[cur]=true; document.getElementById('stab'+cur).classList.add('done'); }
  if([0,1,2].every(i=>doneSteps[i]) && !coreDone){ coreDone=true; try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{type:'summary', core:true, mat:MAT.reportId}})); }catch(e){} toast(L().msToast); }
  updateMilestone(); renderStep(); }
function updateMilestone(){ const b=document.getElementById('msbanner'); if([0,1,2].every(i=>doneSteps[i])){ b.style.display='block'; b.textContent=L().msCore; } else b.style.display='none'; }
function builderHtml(){ const t=L(); return `<div class="builder"><div class="bh">🧩 ${t.bH}</div><div class="bsub">${t.bSub}</div><div class="tray" id="tray" data-ph="${t.trayPh}"></div><div class="bank" id="bank"></div><button class="bcheck" id="bchk" onclick="checkBuild()" disabled>${t.bcheck}</button><div class="bres" id="bres"></div></div>`; }
function initBuilder(){ bState={order:[],locked:false}; const sh=[...BUILD.answer.keys()].sort(()=>Math.random()-.5);
  document.getElementById('bank').innerHTML=sh.map(idx=>`<button class="tile ${BUILD.answer[idx].c}" id="tile${idx}" onclick="placeTile(${idx})">${BUILD.answer[idx].w}</button>`).join(''); document.getElementById('tray').innerHTML=''; }
function placeTile(idx){ if(bState.locked)return; bState.order.push(idx); document.getElementById('tile'+idx).classList.add('placed'); const tr=document.getElementById('tray'); const b=document.createElement('button'); b.className='tile '+BUILD.answer[idx].c; b.textContent=BUILD.answer[idx].w; b.onclick=()=>removeTile(idx,b); tr.appendChild(b); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function removeTile(idx,el){ if(bState.locked)return; bState.order=bState.order.filter(x=>x!==idx); el.remove(); document.getElementById('tile'+idx).classList.remove('placed'); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function checkBuild(){ const t=L(); bState.locked=true; const ok=bState.order.join(',')===BUILD.answer.map((_,i)=>i).join(','); document.querySelectorAll('#tray .tile').forEach(x=>x.style.pointerEvents='none');
  const r=document.getElementById('bres'); r.className='bres show '+(ok?'ok':'no'); r.innerHTML=(ok?'✅ '+t.bOk:'❌ '+t.bNo)+`<div class="bex"><div class="tr">${BUILD.answer.map(a=>a.w).join(' ')} — <i>${BUILD.tr[info]}</i></div><button class="audio-btn" onclick="say('${BUILD.say}','US')">🇺🇸 US</button><button class="audio-btn" onclick="say('${BUILD.say}','UK')">🇬🇧 UK</button></div>`; }
function showStep(i){ cur=i; document.querySelectorAll('.stab').forEach((b,x)=>b.classList.toggle('on',x===i)); renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
function goStep(i){ showStep(i); }
function navStep(d){ if(d<0){ if(cur>0) showStep(cur-1); return; } if(cur<STEPS.length-1){ showStep(cur+1); return; } const inc=answers.findIndex(a=>a.some(x=>x===null)); if(inc>=0){ toast(L().finishNeed); showStep(inc); } else finish(); }
function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
  let tot=0,corr=0; answers.forEach((arr,si)=>arr.forEach((k,ci)=>{ if(k!==null){tot++; if(k===STEPS[si].checks[ci].correct)corr++;} })); const pct=tot?Math.round(corr/tot*100):0; const pass=pct>=PASS;
  const db=document.getElementById('doneBar'); db.classList.toggle('fail',!pass); db.textContent= pass? t.done : t.failBar; document.getElementById('fscore').textContent=pct; document.getElementById('fphrase').textContent= pass? t.phrase : t.phraseFail;
  document.getElementById('kpList').innerHTML=SUMMARY[info].map(s=>`<li>${s}</li>`).join('');
  document.getElementById('surprise').style.display= pass? 'block':'none';
  if(pass){ document.getElementById('medalEm').textContent=BADGE.emoji; document.getElementById('surT').textContent=t.surT; document.getElementById('surBadge').textContent=t.surBadge(BADGE.name[info]); document.getElementById('surP').textContent=t.surP; document.getElementById('xpWin').textContent=t.xp(BADGE.xp); }
  try{ window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:pct, pass:pass, type:'summary', badge:BADGE.name.en, xp:BADGE.xp, mat:MAT.reportId, final:true}})); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'}); }
function restart(){ render(); }
function openHelp(){document.getElementById('helpov').classList.add('show');} function closeHelp(){document.getElementById('helpov').classList.remove('show');}
function setInfo(l){ info=l; applyLang(); }
function setLevel(lv){ document.getElementById('screen').setAttribute('data-level',lv); info= lv==='a2'?'en':'es'; render(); }
function volver(){ if(document.referrer){ location.href=document.referrer; } else if(history.length>1){ history.back(); } else { toast(info==='es'?'Vuelve a tu práctica en la plataforma':'Go back to your practice'); } }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.mat')){ e.preventDefault(); toast(info==='es'?'Material protegido © JUCUM EC':'Protected material © JUCUM EC'); }});
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
/* FIN DEL MOTOR */
setLevel(document.getElementById('screen').getAttribute('data-level')||'pre-a1');
</script>
