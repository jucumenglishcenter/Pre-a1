<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fill in the Blanks - Possessive Adjectives | JUCUM English</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #F59E0B; --primary-light: #FCD34D; --primary-dark: #D97706;
            --accent: #FBBF24; --bg-gradient-start: #FFFBEB; --bg-gradient-end: #FEF3C7;
            --text-dark: #78350F; --text-medium: #92400E; --text-light: #B45309;
            --success: #10B981; --success-light: #D1FAE5; --success-dark: #059669;
            --error: #EF4444; --error-light: #FEE2E2; --error-dark: #DC2626;
            --info: #3B82F6; --info-light: #DBEAFE; --info-dark: #1D4ED8;
            --purple: #8B5CF6; --purple-light: #EDE9FE; --purple-dark: #6D28D9;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(245,158,11,0.15);
            --shadow-strong: 0 8px 30px rgba(245,158,11,0.25);
            --border-radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Nunito',sans-serif; background:linear-gradient(135deg,var(--bg-gradient-start) 0%,var(--bg-gradient-end) 100%); min-height:100vh; color:var(--text-dark); }

        .header { background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); padding:1rem 1.5rem; display:flex; align-items:center; gap:1rem; position:sticky; top:0; z-index:100; box-shadow:var(--shadow-soft); }
        .back-btn { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.3); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1.4rem; text-decoration:none; color:var(--text-dark); transition:all .2s; flex-shrink:0; }
        .back-btn:hover { background:rgba(255,255,255,0.5); transform:scale(1.1); }
        .header-info { flex:1; }
        .header-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:600; color:white; }
        .header-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:2px; }
        .progress-indicator { background:rgba(255,255,255,0.3); padding:0.4rem 0.9rem; border-radius:20px; font-weight:700; color:white; font-size:0.9rem; white-space:nowrap; }
        .progress-container { padding:0; height:6px; background:rgba(255,255,255,0.3); }
        .progress-fill { height:100%; background:white; border-radius:0 3px 3px 0; transition:width .5s ease; width:0%; }

        main { padding:1.5rem; max-width:650px; margin:0 auto; }
        .instructions { background:white; border-radius:16px; padding:1rem 1.25rem; margin-bottom:1.25rem; box-shadow:var(--shadow-soft); border-left:5px solid var(--primary); display:flex; gap:0.75rem; align-items:flex-start; }
        .instructions-icon { font-size:1.6rem; flex-shrink:0; }
        .instructions-title { font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:600; color:var(--text-dark); margin-bottom:0.2rem; }
        .instructions-text { font-size:0.85rem; color:var(--text-medium); line-height:1.5; }

        .question-card { background:white; border-radius:var(--border-radius); box-shadow:var(--shadow-soft); padding:1.5rem; margin-bottom:1rem; animation:slideIn .4s ease; }
        .question-card.hidden { display:none; }
        @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }

        .q-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
        .question-number { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:0.95rem; flex-shrink:0; }
        .topic-badge { display:inline-flex; align-items:center; gap:0.3rem; padding:0.2rem 0.7rem; border-radius:20px; font-size:0.72rem; font-weight:700; background:#EDE9FE; color:#7C3AED; }

        .hint-box { background:#FFFDE7; border-left:4px solid var(--primary); padding:0.7rem 1rem; border-radius:0 10px 10px 0; margin-bottom:1rem; font-size:0.88rem; color:#78350F; line-height:1.5; }
        .hint-label { font-weight:700; color:var(--primary-dark); display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; font-size:0.82rem; text-transform:uppercase; letter-spacing:.5px; }

        .question-text { font-size:1.1rem; line-height:1.7; margin-bottom:0.4rem; font-weight:600; }
        .blank { display:inline-block; min-width:80px; padding:0.2rem 0.6rem; background:var(--primary-light); border:2px dashed var(--primary-dark); border-radius:8px; text-align:center; font-weight:700; color:var(--primary-dark); transition:all .3s; }
        .blank.correct { background:var(--success-light); border:2px solid var(--success); color:var(--success-dark); }
        .blank.incorrect { background:var(--error-light); border:2px solid var(--error); color:var(--error-dark); }
        .translation { color:var(--text-light); font-style:italic; font-size:0.85rem; margin-bottom:1rem; }

        .options-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.7rem; margin-top:0.5rem; }
        .option-btn { padding:0.9rem 0.5rem; border:2.5px solid #E5E7EB; border-radius:12px; background:white; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all .2s; color:var(--text-dark); }
        .option-btn:hover:not(:disabled) { border-color:var(--primary); background:var(--primary-light); transform:translateY(-2px); }
        .option-btn:disabled { cursor:default; }
        .option-btn.correct { border-color:var(--success); background:var(--success-light); color:var(--success-dark); }
        .option-btn.incorrect { border-color:var(--error); background:var(--error-light); color:var(--error-dark); }

        .feedback { margin-top:1.25rem; border-radius:16px; overflow:hidden; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
        .feedback.show { display:block; animation:fadeUp .35s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

        .fb-header { padding:0.9rem 1.25rem; display:flex; align-items:center; gap:0.75rem; }
        .feedback.correct .fb-header { background:linear-gradient(135deg,var(--success),var(--success-dark)); }
        .feedback.incorrect .fb-header { background:linear-gradient(135deg,var(--error),var(--error-dark)); }
        .fb-icon { font-size:1.6rem; }
        .fb-title { font-family:'Fredoka',sans-serif; font-size:1.1rem; color:white; font-weight:600; }
        .fb-subtitle { font-size:0.8rem; color:rgba(255,255,255,0.85); margin-top:1px; }

        .fb-body { background:white; border:2px solid; border-top:none; border-radius:0 0 16px 16px; padding:1.25rem; display:flex; flex-direction:column; gap:0.9rem; }
        .feedback.correct .fb-body { border-color:var(--success); }
        .feedback.incorrect .fb-body { border-color:var(--error); }

        .fb-block-title { font-weight:800; font-size:0.78rem; text-transform:uppercase; letter-spacing:.6px; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.4rem; }

        .fb-compare { background:#F8FAFC; border:1px solid #E2E8F0; border-radius:12px; padding:0.9rem 1rem; }
        .fb-compare-row { display:flex; align-items:baseline; gap:0.6rem; padding:0.35rem 0; border-bottom:1px dashed #E2E8F0; }
        .fb-compare-row:last-child { border-bottom:none; }
        .compare-label { font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; padding:0.15rem 0.5rem; border-radius:6px; flex-shrink:0; }
        .compare-label.wrong { background:var(--error-light); color:var(--error-dark); }
        .compare-label.right { background:var(--success-light); color:var(--success-dark); }
        .compare-text { font-size:0.95rem; color:var(--text-dark); line-height:1.5; }
        .word-wrong { color:var(--error); font-weight:700; text-decoration:line-through; }
        .word-right { color:var(--success-dark); font-weight:700; }

        .fb-error { background:var(--error-light); border-radius:12px; padding:0.9rem 1rem; }
        .error-badge { display:inline-block; background:var(--error); color:white; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; margin-left:auto; }
        .fb-error .fb-block-title { color:var(--error-dark); }
        .error-word-row { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; }
        .ew-box { padding:0.4rem 1rem; border-radius:8px; font-weight:700; font-size:1rem; }
        .ew-wrong { background:white; color:var(--error); border:2px solid var(--error); text-decoration:line-through; }
        .ew-arrow { font-size:1.3rem; color:var(--text-medium); }
        .ew-right { background:var(--success); color:white; }
        .error-rule { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }

        .fb-rule { background:var(--info-light); border:1px solid #BFDBFE; border-radius:12px; padding:0.9rem 1rem; }
        .fb-rule .fb-block-title { color:var(--info-dark); }
        .rule-formula { background:white; border-radius:8px; padding:0.5rem 0.9rem; font-family:'Fredoka',sans-serif; font-size:0.95rem; color:var(--info-dark); font-weight:600; margin-bottom:0.6rem; text-align:center; border:1px solid #BFDBFE; }
        .rule-examples { display:flex; flex-wrap:wrap; gap:0.4rem; }
        .rule-ex { display:flex; align-items:center; gap:0.3rem; font-size:0.82rem; background:white; border:1px solid #BFDBFE; border-radius:6px; padding:0.2rem 0.5rem; }
        .rule-ex .base { color:var(--info-dark); font-weight:600; }
        .rule-ex .arrow { color:#94A3B8; }
        .rule-ex .past { color:var(--success-dark); font-weight:700; }

        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; border-radius:12px; padding:0.9rem 1rem; }
        .fb-why .fb-block-title { color:var(--success-dark); }
        .fb-why-text { font-size:0.92rem; color:var(--text-dark); line-height:1.55; }

        .nav-buttons { display:flex; gap:0.75rem; margin-top:1.25rem; }
        .nav-btn { padding:0.8rem 1.2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .nav-btn.next { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; flex:1; }
        .nav-btn.prev { background:#F1F5F9; color:var(--text-dark); }
        .nav-btn:disabled { opacity:.4; cursor:default; }
        .nav-btn:not(:disabled):hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }

        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }
        .results-screen.show { display:block; animation:fadeUp .5s ease; }
        .results-emoji { font-size:4rem; margin-bottom:1rem; }
        .results-title { font-family:'Fredoka',sans-serif; font-size:2rem; margin-bottom:0.5rem; }
        .results-score { font-size:3rem; font-weight:800; color:var(--purple); margin:1rem 0; }
        .results-message { font-size:1.05rem; color:var(--text-medium); margin-bottom:1.5rem; }
        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }
        .star.earned { opacity:1; animation:starPop .5s ease; }
        @keyframes starPop { 0%{transform:scale(0)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn.secondary { background:#F1F5F9; color:var(--text-dark); }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
    
        /* ---- Botón Ver en español (traducción oculta) ---- */
        .translate-wrap { margin-top:0.6rem; }
        .translate-btn { display:inline-flex; align-items:center; gap:0.4rem; background:var(--bg-gradient-end); color:var(--primary-dark); border:1.5px solid var(--primary-light); border-radius:20px; padding:0.4rem 0.9rem; font-family:'Nunito',sans-serif; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all .2s; }
        .translate-btn:hover { background:var(--primary-light); color:var(--text-dark); }
        .translation-es { display:none; margin-top:0.6rem; background:#FFFDE7; border-left:4px solid var(--primary); border-radius:0 10px 10px 0; padding:0.6rem 0.9rem; color:var(--text-medium); font-style:italic; font-size:0.88rem; line-height:1.5; }
        .translation-es.show { display:block; animation:fadeUp .25s ease; }

    </style>
</head>
<body>
    <header class="header">
        <a href="panel-prea1.html" class="back-btn">←</a>
        <div class="header-info">
            <div class="header-title">📝 Fill in the Blanks</div>
            <div class="header-subtitle">💛 Pre-A1 · Possessive Adjectives</div>
        </div>
        <div class="progress-indicator"><span id="currentQ">1</span>/10</div>
    </header>
    <div class="progress-container"><div class="progress-fill" id="progressFill"></div></div>

    <main>
        <div class="instructions">
            <div class="instructions-icon">👤</div>
            <div>
                <div class="instructions-title">Completa con el adjetivo posesivo</div>
                <div class="instructions-text">Mira el sujeto de la oración. Elige el posesivo que le corresponde (my, your, his, her, our, their).</div>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <div class="results-screen" id="resultsScreen">
            <div class="results-emoji">🎉</div>
            <div class="results-title">¡Completado!</div>
            <div class="results-score" id="finalScore">0/10</div>
            <div class="stars-container">
                <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
            </div>
            <div class="results-message" id="resultsMessage"></div>
            <div class="results-buttons">
                <button class="result-btn primary" onclick="location.reload()">🔄 Intentar de Nuevo</button>
                <a href="panel-prea1.html" class="result-btn secondary">← Volver al Módulo</a>
            </div>
        </div>
    </main>

    <script>
    const quizData = [
    {
        "id": 1,
        "sentence": "Tom feeds _____ dog before dinner every day.",
        "translation": "Tom alimenta a su perro antes de la cena todos los días.",
        "hint": "Mira quién hace la acción de alimentar.",
        "options": [
            "her",
            "his",
            "their"
        ],
        "correct": "his",
        "feedback": {
            "her": {
                "errorType": "Posesivo de género incorrecto",
                "explanation": "'Her' es el posesivo de 'she' (ella). Pero Tom es un chico — corresponde a 'he', y su posesivo es 'his'.",
                "rule": "he → his (de él) / she → her (de ella)"
            },
            "their": {
                "errorType": "Posesivo plural en singular",
                "explanation": "'Their' es el posesivo de 'they' (ellos/ellas — plural). Tom es UNA persona (singular masculino) → 'his'.",
                "rule": "they → their (plural) / he → his (singular)"
            }
        },
        "correctReason": "Tom es masculino singular → 'he'. El posesivo de 'he' es 'his'. Por eso 'Tom feeds his dog' (su perro, de él).",
        "rule": "he → his (masculino singular)",
        "examples": [
            "his dog",
            "his bag",
            "his book"
        ]
    },
    {
        "id": 2,
        "sentence": "Ana looks for _____ cat under the bed near the door.",
        "translation": "Ana busca a su gato bajo la cama cerca de la puerta.",
        "hint": "Fíjate en quién busca al gato.",
        "options": [
            "his",
            "our",
            "her"
        ],
        "correct": "her",
        "feedback": {
            "his": {
                "errorType": "Posesivo de género incorrecto",
                "explanation": "'His' es el posesivo de 'he' (él). Pero Ana es una chica — corresponde a 'she', y su posesivo es 'her'.",
                "rule": "she → her (de ella) / he → his (de él)"
            },
            "our": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'Our' es el posesivo de 'we' (nosotros). Pero el sujeto es Ana sola → necesitamos 'her' (de ella).",
                "rule": "we → our (nosotros) / she → her (de ella)"
            }
        },
        "correctReason": "Ana es femenino singular → 'she'. El posesivo de 'she' es 'her'. 'Ana looks for her cat' (su gato, de ella).",
        "rule": "she → her (femenino singular)",
        "examples": [
            "her cat",
            "her bag",
            "her room"
        ]
    },
    {
        "id": 3,
        "sentence": "We sit near _____ teacher during class every morning.",
        "translation": "Nos sentamos cerca de nuestra maestra durante la clase todas las mañanas.",
        "hint": "¿Quién se sienta cerca de la maestra? Mira el sujeto.",
        "options": [
            "our",
            "their",
            "your"
        ],
        "correct": "our",
        "feedback": {
            "their": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'Their' es de 'they' (ellos — tercera persona plural). Pero 'we' es PRIMERA persona plural → 'our'.",
                "rule": "we → our / they → their"
            },
            "your": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'Your' es el posesivo de 'you' (tú/ustedes — SEGUNDA persona). Pero el sujeto es 'we' (primera persona) → 'our'.",
                "rule": "you → your / we → our"
            }
        },
        "correctReason": "'We' (nosotros) tiene como posesivo 'our'. 'We sit near our teacher' (nuestra maestra).",
        "rule": "we → our (primera persona plural)",
        "examples": [
            "our teacher",
            "our class",
            "our school"
        ]
    },
    {
        "id": 4,
        "sentence": "I put _____ book inside the desk before class.",
        "translation": "Yo pongo mi libro dentro del escritorio antes de la clase.",
        "hint": "Fíjate en quién pone el libro.",
        "options": [
            "your",
            "my",
            "his"
        ],
        "correct": "my",
        "feedback": {
            "your": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'Your' es el posesivo de 'you' (tú). Pero el sujeto es 'I' (yo) — su posesivo es 'my'.",
                "rule": "I → my / you → your"
            },
            "his": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'His' es el posesivo de 'he' (él, tercera persona). Pero el sujeto es 'I' (primera persona) → 'my'.",
                "rule": "I → my / he → his"
            }
        },
        "correctReason": "El sujeto 'I' (yo) tiene como posesivo 'my' (mi). 'I put my book' (mi libro).",
        "rule": "I → my (primera persona singular)",
        "examples": [
            "my book",
            "my bag",
            "my dog"
        ]
    },
    {
        "id": 5,
        "sentence": "Mia and Ana ride _____ bikes during the afternoon.",
        "translation": "Mia y Ana montan sus bicicletas durante la tarde.",
        "hint": "Mira cuántas personas montan las bicicletas.",
        "options": [
            "her",
            "our",
            "their"
        ],
        "correct": "their",
        "feedback": {
            "her": {
                "errorType": "Posesivo singular en plural",
                "explanation": "'Her' es para UNA persona femenina (she). Pero Mia y Ana son DOS personas — son 'they'. El posesivo de 'they' es 'their'.",
                "rule": "she → her (singular) / they → their (plural)"
            },
            "our": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'Our' es el posesivo de 'we' (nosotros — primera persona). Pero Mia y Ana son 'they' (tercera persona plural) → 'their'.",
                "rule": "we → our / they → their"
            }
        },
        "correctReason": "'Mia and Ana' = 'they' (ellas). El posesivo de 'they' es 'their'. 'Their bikes' (sus bicicletas, de ellas).",
        "rule": "they → their (tercera persona plural)",
        "examples": [
            "their bikes",
            "their books",
            "their dogs"
        ]
    },
    {
        "id": 6,
        "sentence": "Is this _____ book? You left it on the desk.",
        "translation": "¿Es este tu libro? Lo dejaste en el escritorio.",
        "hint": "La segunda oración te dice a quién va dirigida la pregunta.",
        "options": [
            "your",
            "my",
            "his"
        ],
        "correct": "your",
        "feedback": {
            "my": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'My' es de 'I' (yo). Pero la pregunta es dirigida a 'you' (tú) — y la segunda oración dice 'YOU left it'. El posesivo de 'you' es 'your'.",
                "rule": "I → my / you → your"
            },
            "his": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'His' es de 'he' (él). Pero la pregunta es a 'you' (tú) — confirmado por 'YOU left it'. El posesivo es 'your'.",
                "rule": "he → his / you → your"
            }
        },
        "correctReason": "'You' (tú) tiene como posesivo 'your'. La pista clave: 'YOU left it' nos dice que el sujeto es 'you'.",
        "rule": "you → your (segunda persona)",
        "examples": [
            "your book",
            "your bag",
            "your house"
        ]
    },
    {
        "id": 7,
        "sentence": "The cat sleeps inside _____ box near the window.",
        "translation": "El gato duerme dentro de su caja cerca de la ventana.",
        "hint": "Es un animal. Piensa qué posesivo usamos para animales sin saber su sexo.",
        "options": [
            "his",
            "their",
            "its"
        ],
        "correct": "its",
        "feedback": {
            "his": {
                "errorType": "Posesivo de género — animal genérico",
                "explanation": "'His' se usa cuando sabemos que es macho. Pero aquí solo decimos 'the cat' sin saber el sexo. Para animales genéricos: 'its'.",
                "rule": "Animal sin género especificado → its"
            },
            "their": {
                "errorType": "Posesivo plural en singular",
                "explanation": "'Their' es plural (de varios). Pero hablamos de UN gato. Para un animal singular sin género: 'its'.",
                "rule": "it → its (singular) / they → their (plural)"
            }
        },
        "correctReason": "'The cat' = 'it' (animal sin género especificado). Su posesivo es 'its' (sin apóstrofe — ¡cuidado, no confundir con 'it's' = it is!).",
        "rule": "it → its (animal/cosa singular)",
        "examples": [
            "its box",
            "its food",
            "its tail"
        ]
    },
    {
        "id": 8,
        "sentence": "My brother shows me _____ new bike near the park.",
        "translation": "Mi hermano me muestra su bicicleta nueva cerca del parque.",
        "hint": "Mira quién muestra la bicicleta (no quién la ve).",
        "options": [
            "her",
            "his",
            "my"
        ],
        "correct": "his",
        "feedback": {
            "her": {
                "errorType": "Posesivo de género incorrecto",
                "explanation": "'Her' es de 'she' (ella). Pero 'brother' = hermano = chico = 'he'. El posesivo de 'he' es 'his'.",
                "rule": "he → his / she → her"
            },
            "my": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'My' es de 'I' (yo). Pero el sujeto que muestra la bici es 'my brother' (él) — el posesivo de 'he' es 'his'. ¡Ojo: la bici es de mi hermano, no mía!",
                "rule": "Sujeto = hermano (he) → su posesivo es 'his'"
            }
        },
        "correctReason": "El sujeto que muestra es 'my brother' = 'he' (masculino singular). Su posesivo es 'his'. La bici es de él.",
        "rule": "he → his (masculino singular)",
        "examples": [
            "his bike",
            "his book",
            "his bag"
        ]
    },
    {
        "id": 9,
        "sentence": "We finish _____ homework before dinner every day.",
        "translation": "Nosotros terminamos nuestra tarea antes de la cena todos los días.",
        "hint": "Fíjate en cuántas personas terminan la tarea.",
        "options": [
            "our",
            "my",
            "their"
        ],
        "correct": "our",
        "feedback": {
            "my": {
                "errorType": "Posesivo singular en plural",
                "explanation": "'My' es de 'I' (yo — uno solo). Pero el sujeto es 'we' (nosotros — varios). El posesivo de 'we' es 'our'.",
                "rule": "I → my (singular) / we → our (plural)"
            },
            "their": {
                "errorType": "Posesivo de tercera persona",
                "explanation": "'Their' es de 'they' (ellos — TERCERA persona). Pero el sujeto es 'we' (PRIMERA persona plural) → 'our'.",
                "rule": "we → our (1ra persona) / they → their (3ra persona)"
            }
        },
        "correctReason": "'We' (nosotros — primera persona plural) tiene como posesivo 'our' (nuestro/nuestra).",
        "rule": "we → our",
        "examples": [
            "our homework",
            "our class",
            "our house"
        ]
    },
    {
        "id": 10,
        "sentence": "Mia and her sister play with _____ dolls inside the room.",
        "translation": "Mia y su hermana juegan con sus muñecas dentro del cuarto.",
        "hint": "Cuenta cuántas personas juegan.",
        "options": [
            "her",
            "our",
            "their"
        ],
        "correct": "their",
        "feedback": {
            "her": {
                "errorType": "Posesivo singular en plural",
                "explanation": "'Her' es para UNA persona femenina. Pero aquí son DOS (Mia y su hermana) → 'they'. El posesivo de 'they' es 'their'.",
                "rule": "she → her (singular) / they → their (plural)"
            },
            "our": {
                "errorType": "Posesivo de persona incorrecta",
                "explanation": "'Our' es de 'we' (nosotros — primera persona). Pero el narrador no se incluye — habla de 'Mia y su hermana' = 'they' (tercera persona plural).",
                "rule": "we → our / they → their"
            }
        },
        "correctReason": "'Mia and her sister' = 'they' (dos personas). El posesivo de 'they' es 'their'. 'Their dolls' (sus muñecas, de ellas).",
        "rule": "they → their (tercera persona plural)",
        "examples": [
            "their dolls",
            "their toys",
            "their house"
        ]
    }
];
    const TOPIC_BADGE = {"icon": "👤", "label": "Possessives"};

    let currentQuestion = 0;
    let score = 0;
    let answered = new Array(quizData.length).fill(false);

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function initQuiz() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        quizData.forEach((q, index) => container.appendChild(createQuestionCard(q, index)));
        showQuestion(0);
        updateProgress();
    }

    function createQuestionCard(q, index) {
        const card = document.createElement('div');
        card.className = `question-card ${index !== 0 ? 'hidden' : ''}`;
        card.id = `question-${index}`;
        const shuffled = shuffleArray(q.options);

        card.innerHTML = `
            <div class="q-header">
                <div class="question-number">${index + 1}</div>
                <span class="topic-badge">${TOPIC_BADGE.icon} ${TOPIC_BADGE.label}</span>
            </div>
            <div class="hint-box">
                <div class="hint-label">💡 Pista</div>
                ${q.hint}
            </div>
            <p class="question-text">${q.sentence.replace('_____', `<span class="blank" id="blank-${index}">?</span>`)}</p>
            <div class="translate-wrap">
                <button class="translate-btn" id="translate-btn-${index}" onclick="toggleTranslation(${index})">🌐 Ver en español</button>
                <div class="translation-es" id="translation-${index}">${q.translation}</div>
            </div>
            <div class="options-grid" id="options-${index}">
                ${shuffled.map((opt, i) => `
                    <button class="option-btn" data-idx="${i}" data-opt="${opt}" onclick="selectAnswer(${index}, this)">${opt}</button>
                `).join('')}
            </div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index === 0 ? 'disabled' : ''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>
                    ${index === quizData.length - 1 ? 'Ver Resultados 🎉' : 'Siguiente →'}
                </button>
            </div>
        `;
        return card;
    }

    function selectAnswer(qi, btn) {
        if (answered[qi]) return;
        answered[qi] = true;
        const selected = btn.getAttribute('data-opt');
        const q = quizData[qi];
        const isCorrect = selected === q.correct;
        if (isCorrect) score++;

        const blank = document.getElementById(`blank-${qi}`);
        blank.textContent = selected;
        blank.className = `blank ${isCorrect ? 'correct' : 'incorrect'}`;

        document.querySelectorAll(`#options-${qi} .option-btn`).forEach(b => {
            b.disabled = true;
            const t = b.getAttribute('data-opt');
            if (t === q.correct) b.classList.add('correct');
            else if (t === selected) b.classList.add('incorrect');
        });

        buildFeedback(qi, selected, isCorrect, q);
        document.getElementById(`next-${qi}`).disabled = false;
        updateProgress();
    }

    function buildFeedback(qi, selected, isCorrect, q) {
        const el = document.getElementById(`feedback-${qi}`);
        el.className = `feedback show ${isCorrect ? 'correct' : 'incorrect'}`;

        const ruleExamples = q.examples.map(e => {
            if (e.includes(' → ')) {
                const p = e.split(' → ');
                return `<span class="rule-ex"><span class="base">${p[0]}</span><span class="arrow">→</span><span class="past">${p[1]}</span></span>`;
            } else {
                return `<span class="rule-ex"><span class="past">${e}</span></span>`;
            }
        }).join('');

        if (isCorrect) {
            el.innerHTML = `
                <div class="fb-header">
                    <span class="fb-icon">✅</span>
                    <div>
                        <div class="fb-title">¡Correcto!</div>
                        <div class="fb-subtitle">Elegiste la palabra correcta</div>
                    </div>
                </div>
                <div class="fb-body">
                    <div class="fb-rule">
                        <div class="fb-block-title">📐 Regla aplicada</div>
                        <div class="rule-formula">${q.rule}</div>
                        <div class="rule-examples">${ruleExamples}</div>
                    </div>
                    <div class="fb-why">
                        <div class="fb-block-title">💡 ¿Por qué es correcta?</div>
                        <div class="fb-why-text">${q.correctReason}</div>
                    </div>
                </div>
            `;
        } else {
            const err = q.feedback[selected] || { errorType: 'Error', explanation: 'Respuesta incorrecta.', rule: '' };
            el.innerHTML = `
                <div class="fb-header">
                    <span class="fb-icon">❌</span>
                    <div>
                        <div class="fb-title">Incorrecto</div>
                        <div class="fb-subtitle">Revisemos juntos qué pasó</div>
                    </div>
                </div>
                <div class="fb-body">
                    <div class="fb-compare">
                        <div class="fb-block-title" style="color:#64748B;">🔄 Tu respuesta vs. la correcta</div>
                        <div class="fb-compare-row">
                            <span class="compare-label wrong">Tú escribiste</span>
                            <span class="compare-text"><span class="word-wrong">${selected}</span></span>
                        </div>
                        <div class="fb-compare-row">
                            <span class="compare-label right">Correcto</span>
                            <span class="compare-text"><span class="word-right">${q.correct}</span></span>
                        </div>
                    </div>
                    <div class="fb-error">
                        <div class="fb-block-title">⚠️ Tipo de error: <span class="error-badge">${err.errorType}</span></div>
                        <div class="error-word-row">
                            <span class="ew-box ew-wrong">${selected}</span>
                            <span class="ew-arrow">→</span>
                            <span class="ew-box ew-right">${q.correct}</span>
                        </div>
                        <div class="error-rule">${err.explanation}</div>
                        ${err.rule ? `<div style="margin-top:0.5rem;font-size:0.82rem;color:var(--error-dark);font-weight:700;">📌 ${err.rule}</div>` : ''}
                    </div>
                    <div class="fb-rule">
                        <div class="fb-block-title">📐 La regla correcta</div>
                        <div class="rule-formula">${q.rule}</div>
                        <div class="rule-examples">${ruleExamples}</div>
                    </div>
                    <div class="fb-why">
                        <div class="fb-block-title">💡 ¿Por qué es correcta la respuesta?</div>
                        <div class="fb-why-text">${q.correctReason}</div>
                    </div>
                </div>
            `;
        }
    }

    function showQuestion(i) {
        document.querySelectorAll('.question-card').forEach((c, idx) => c.classList.toggle('hidden', idx !== i));
        document.getElementById('currentQ').textContent = i + 1;
        currentQuestion = i;
    }

    function nextQuestion(i) {
        if (i < quizData.length - 1) showQuestion(i + 1);
        else showResults();
    }

    function prevQuestion() { if (currentQuestion > 0) showQuestion(currentQuestion - 1); }

    function updateProgress() {
        const done = answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width = (done / quizData.length * 100) + '%';
    }

    function showResults() {
        document.querySelectorAll('.question-card').forEach(c => c.classList.add('hidden'));
        const rs = document.getElementById('resultsScreen');
        rs.classList.add('show');
        const pct = score / quizData.length * 100;
        document.getElementById('finalScore').textContent = `${score}/${quizData.length}`;
        let stars = pct >= 90 ? 3 : pct >= 70 ? 2 : 1;
        document.getElementById('resultsMessage').textContent = pct >= 90
            ? '¡Excelente! Dominas este tema. 🏆'
            : pct >= 70 ? '¡Muy bien! Sigue practicando. 💪'
            : 'Buen esfuerzo. Repasa las reglas e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s, i) => {
            if (i < stars) setTimeout(() => s.classList.add('earned'), i * 300);
        });
    }

    
    function toggleTranslation(i) {
        const box = document.getElementById('translation-' + i);
        const btn = document.getElementById('translate-btn-' + i);
        if (!box) return;
        const isShown = box.classList.toggle('show');
        if (btn) btn.innerHTML = isShown ? '🙈 Ocultar traducción' : '🌐 Ver en español';
    }

    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
