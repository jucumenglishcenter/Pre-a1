<script>
/* ═══ METADATOS ═══ */
const MAT = { title:{es:'Resumen de Gramática',en:'Grammar Summary'}, subtitle:{es:'Los Posesivos (de quién es)',en:'Possessives (whose it is)'}, reportId:'sum-possessives' };
const PASS = 75;
const STEPS = [
  { icon:'🇪🇸', title:{es:'Repaso en Español',en:'Spanish Recap'},
    html:{
      es:`<div class="gdesc">Para decir <b>de quién es algo</b>, en español usas «<b>mi/tu/su</b>» o la palabra «<b>de</b>»: «<b>mi</b> libro», «el carro <b>de</b> Ana».</div>
        <div class="art-hero"><div class="art-box"><div class="word">mi / tu / su</div><div class="role">Adjetivo</div><div class="desc">«Mi casa», «tu perro».</div></div><div class="art-box"><div class="word">de Ana</div><div class="role">Con «de»</div><div class="desc">«El libro de Ana.»</div></div></div>
        ${ii('🔑','«mi, tu, su, nuestro» van antes del objeto y dicen de quién es.')}
        ${ii('🔗','«de + persona» también muestra posesión: «la mochila de Juan».')}
        <div class="gnote life">🌎 <b>De tu vida:</b> «Es mi teléfono», «Ese es el carro de mi papá». En inglés son my/your/his/her y el apóstrofo «\'s».</div>`,
      en:`<div class="gdesc">To say <b>whose something is</b>, Spanish uses «<b>mi/tu/su</b>» or the word «<b>de</b>»: «<b>mi</b> libro», «el carro <b>de</b> Ana».</div>
        <div class="art-hero"><div class="art-box"><div class="word">mi / tu / su</div><div class="role">Adjective</div><div class="desc">«Mi casa», «tu perro».</div></div><div class="art-box"><div class="word">de Ana</div><div class="role">With «de»</div><div class="desc">«El libro de Ana.»</div></div></div>
        ${ii('🔑','«mi, tu, su, nuestro» go before the object and say whose it is.')}
        ${ii('🔗','«de + person» also shows possession: «la mochila de Juan».')}
        <div class="gnote life">🌎 <b>From your life:</b> «Es mi teléfono», «Ese es el carro de mi papá». In English they are my/your/his/her and the apostrophe «\'s».</div>`
    },
    checks:[
      { q:{es:'Los posesivos dicen:',en:'Possessives say:'}, opts:{es:['De quién es algo','Dónde está algo'],en:['Whose something is','Where something is']}, correct:0, fb:{ why:{es:'Indican posesión.',en:'They show possession.'}, tip:{es:'de quién',en:'whose'}} },
      { q:{es:'«Mi casa» — «mi» indica:',en:'«Mi casa» — «mi» indicates:'}, opts:{es:['Que es mía','Dónde está'],en:['That it\'s mine','Where it is']}, correct:0, fb:{ why:{es:'Es posesivo.',en:'It\'s possessive.'}, tip:{es:'mi = mía',en:'mi = mine'}} },
      { q:{es:'«El libro de Ana» usa:',en:'«El libro de Ana» uses:'}, opts:{es:['«de» + persona','un verbo'],en:['«de» + person','a verb']}, correct:0, fb:{ why:{es:'«de» muestra de quién.',en:'«de» shows whose.'}, tip:{es:'de + persona',en:'de + person'}} },
      { q:{es:'«mi, tu, su» van:',en:'«mi, tu, su» go:'}, opts:{es:['Antes del objeto','Al final'],en:['Before the object','At the end']}, correct:0, fb:{ why:{es:'mi casa, tu perro.',en:'mi casa, tu perro.'}, tip:{es:'antes',en:'before'}} },
      { q:{es:'«Es tu teléfono» indica que es:',en:'«Es tu teléfono» indicates it\'s:'}, opts:{es:['Tuyo','Mío'],en:['Yours','Mine']}, correct:0, fb:{ why:{es:'«tu» = de ti.',en:'«tu» = yours.'}, tip:{es:'tu = tuyo',en:'tu = yours'}} }
    ] },
  { icon:'🤝', title:{es:'Similitudes',en:'Similarities'},
    html:{
      es:`<div class="gdesc">El inglés tiene los mismos adjetivos posesivos, uno por persona.</div>
        <table class="dtab"><tr><th>Persona</th><th>Posesivo</th><th>Español</th></tr>
          <tr><td>I</td><td class="en">my</td><td>mi</td></tr>
          <tr><td>you</td><td class="en">your</td><td>tu</td></tr>
          <tr><td>he</td><td class="en">his</td><td>su (de él)</td></tr>
          <tr><td>she</td><td class="en">her</td><td>su (de ella)</td></tr>
          <tr><td>we</td><td class="en">our</td><td>nuestro</td></tr>
          <tr><td>they</td><td class="en">their</td><td>su (de ellos)</td></tr>
        </table>
        ${eg('This is <span class="tag s">my</span> book.','Este es mi libro.','ok')}
        ${eg('That is <span class="tag s">her</span> bag.','Esa es su mochila (de ella).','ok')}
        <div class="sec-label">Lo igual en los dos idiomas</div>
        <ul class="simlist"><li>Los dos tienen un posesivo por persona (my = mi, your = tu).</li><li>Los dos van antes del objeto: my book = mi libro.</li><li>Los dos pueden mostrar de quién con el nombre de la persona.</li></ul>
        <div class="gnote">👍 my, your, his, her, our, their. Lo nuevo: his/her según el dueño, y el apóstrofo «\'s» (siguiente paso).</div>`,
      en:`<div class="gdesc">English has the same possessive adjectives, one per person.</div>
        <table class="dtab"><tr><th>Person</th><th>Possessive</th><th>Español</th></tr>
          <tr><td>I</td><td class="en">my</td><td>mi</td></tr>
          <tr><td>you</td><td class="en">your</td><td>tu</td></tr>
          <tr><td>he</td><td class="en">his</td><td>su (de él)</td></tr>
          <tr><td>she</td><td class="en">her</td><td>su (de ella)</td></tr>
          <tr><td>we</td><td class="en">our</td><td>nuestro</td></tr>
          <tr><td>they</td><td class="en">their</td><td>su (de ellos)</td></tr>
        </table>
        ${eg('This is <span class="tag s">my</span> book.','This is my book.','ok')}
        ${eg('That is <span class="tag s">her</span> bag.','That is her bag.','ok')}
        <div class="sec-label">What is the same in both languages</div>
        <ul class="simlist"><li>Both have one possessive per person (my = mi, your = tu).</li><li>Both go before the object: my book = mi libro.</li><li>Both can show whose with the person\'s name.</li></ul>
        <div class="gnote">👍 my, your, his, her, our, their. The new part: his/her by owner, and the apostrophe «\'s» (next step).</div>`
    },
    checks:[
      { q:{es:'«my» = ',en:'«my» = '}, opts:{es:['mi','tu'],en:['mi','tu']}, correct:0, fb:{ why:{es:'my = mi.',en:'my = mi.'}, tip:{es:'my = mi',en:'my = mi'}} },
      { q:{es:'«your» = ',en:'«your» = '}, opts:{es:['tu','su'],en:['tu','su']}, correct:0, fb:{ why:{es:'your = tu.',en:'your = tu.'}, tip:{es:'your = tu',en:'your = tu'}} },
      { q:{es:'«our» = ',en:'«our» = '}, opts:{es:['nuestro','su'],en:['nuestro','su']}, correct:0, fb:{ why:{es:'our = nuestro.',en:'our = nuestro.'}, tip:{es:'our = nuestro',en:'our = nuestro'}} },
      { q:{es:'«their» = ',en:'«their» = '}, opts:{es:['su (de ellos)','mi'],en:['su (de ellos)','mi']}, correct:0, fb:{ why:{es:'their = de ellos.',en:'their = de ellos.'}, tip:{es:'their = de ellos',en:'their = de ellos'}} },
      { q:{es:'El posesivo va:',en:'The possessive goes:'}, opts:{es:['Antes del objeto','Después'],en:['Before the object','After']}, correct:0, fb:{ why:{es:'my book.',en:'my book.'}, tip:{es:'antes',en:'before'}} }
    ] },
  { icon:'⚡', title:{es:'Diferencias',en:'Differences'},
    html:{
      es:`<div class="gdesc">Dos cosas que el español no marca igual: <b>his vs her</b> dependen del <b>dueño</b> (no del objeto), y la posesión con nombres usa el apóstrofo <b>\'s</b>.</div>
        <table class="dtab"><tr><th>Inglés</th><th>Español</th><th>Clave</th></tr>
          <tr><td class="en">his car</td><td>su carro</td><td>el dueño es ÉL</td></tr>
          <tr><td class="en">her car</td><td>su carro</td><td>la dueña es ELLA</td></tr>
          <tr><td class="en">Ana's car</td><td>el carro de Ana</td><td>nombre + \'s</td></tr>
        </table>
        <div class="sec-label">⚠️ his/her dependen del DUEÑO, no del objeto</div>
        ${ii('👦','«his» = de él · «her» = de ella. No importa si el objeto es carro o casa: «his house», «her house».')}
        ${ii('🔑','Posesión con nombre: persona + <b>\'s</b> + objeto: «Maria\'s phone» = el teléfono de María.')}
        ${eg('She loves <span class="tag s">her</span> dog.','Ella ama a su perro. (de ella → her)','ok')}
        ${eg('She loves his dog (siendo de ella).','Si es de ella → «her dog».','bad')}
        <div class="gnote">📍 his = de él · her = de ella (según el dueño). Nombre + \'s = «de» (John\'s book = el libro de John).</div>`,
      en:`<div class="gdesc">Two things Spanish doesn\'t mark the same: <b>his vs her</b> depend on the <b>owner</b> (not the object), and possession with names uses the apostrophe <b>\'s</b>.</div>
        <table class="dtab"><tr><th>English</th><th>Español</th><th>Key</th></tr>
          <tr><td class="en">his car</td><td>su carro</td><td>the owner is HE</td></tr>
          <tr><td class="en">her car</td><td>su carro</td><td>the owner is SHE</td></tr>
          <tr><td class="en">Ana's car</td><td>el carro de Ana</td><td>name + \'s</td></tr>
        </table>
        <div class="sec-label">⚠️ his/her depend on the OWNER, not the object</div>
        ${ii('👦','«his» = his (he) · «her» = hers (she). It doesn\'t matter if the object is a car or a house: «his house», «her house».')}
        ${ii('🔑','Possession with a name: person + <b>\'s</b> + object: «Maria\'s phone» = el teléfono de María.')}
        ${eg('She loves <span class="tag s">her</span> dog.','She loves her dog. (her → she)','ok')}
        ${eg('She loves his dog (when it\'s hers).','If it\'s hers → «her dog».','bad')}
        <div class="gnote">📍 his = his (he) · her = hers (she), by owner. Name + \'s = «de» (John\'s book = el libro de John).</div>`
    },
    checks:[
      { q:{es:'«___ car» (el dueño es él):',en:'«___ car» (the owner is he):'}, opts:{es:['his','her'],en:['his','her']}, correct:0, fb:{ why:{es:'De él → his.',en:'His → his.'}, ex:{es:'his car → su carro (de él)',en:'his car'}, tip:{es:'de él → his',en:'his → his'}} },
      { q:{es:'«___ bag» (la dueña es ella):',en:'«___ bag» (the owner is she):'}, opts:{es:['her','his'],en:['her','his']}, correct:0, fb:{ why:{es:'De ella → her.',en:'Hers → her.'}, ex:{es:'her bag → su mochila (de ella)',en:'her bag'}, tip:{es:'de ella → her',en:'hers → her'}} },
      { q:{es:'«el teléfono de María» en inglés:',en:'«el teléfono de María» in English:'}, opts:{es:['Maria\'s phone','phone of Maria'],en:['Maria\'s phone','phone of Maria']}, correct:0, fb:{ why:{es:'Nombre + \'s.',en:'Name + \'s.'}, ex:{es:'Maria\'s phone → el teléfono de María',en:'Maria\'s phone'}, tip:{es:'nombre + \'s',en:'name + \'s'}} },
      { q:{es:'his/her dependen de:',en:'his/her depend on:'}, opts:{es:['El dueño','El objeto'],en:['The owner','The object']}, correct:0, fb:{ why:{es:'De quién es, no de qué cosa.',en:'Whose it is, not what.'}, tip:{es:'el dueño',en:'the owner'}} },
      { q:{es:'«John ___ book» (de John):',en:'«John ___ book» (John\'s):'}, opts:{es:['\'s','of'],en:['\'s','of']}, correct:0, fb:{ why:{es:'Persona + \'s.',en:'Person + \'s.'}, ex:{es:'John\'s book → el libro de John',en:'John\'s book'}, tip:{es:'+ \'s',en:'+ \'s'}} }
    ] },
  { icon:'💡', title:{es:'Tips Prácticos',en:'Practical Tips'},
    html:{
      es:`<div class="gdesc">Las dos formas de mostrar posesión:</div>
        <div class="fbox"><div class="frm"><span class="pill s">posesivo</span><span class="plus">+ objeto</span><span class="pill v">nombre + \'s</span><span class="plus">+ objeto</span></div><div class="fex"><span class="s">my</span> book · <span class="v">Ana's</span> book</div></div>
        ${ii('👤','<b>Tip 1 — Posesivo según la persona:</b> my, your, his, her, its, our, their.')}
        ${ii('🔑','<b>Tip 2 — Apóstrofo \'s:</b> con el dueño (persona): Tom\'s dog, my sister\'s car.')}
        ${ii('⚠️','<b>Tip 3 — its ≠ it\'s:</b> «its» = su (de un animal/cosa, sin apóstrofo) · «it\'s» = it is.')}
        <div class="alert-card"><div class="atitle">⚠️ Error típico</div><p>❌ «the car of John» → ✅ «<b>John\'s</b> car».<br>❌ «her car» cuando es de él → ✅ «<b>his</b> car».</p></div>`,
      en:`<div class="gdesc">The two ways to show possession:</div>
        <div class="fbox"><div class="frm"><span class="pill s">possessive</span><span class="plus">+ object</span><span class="pill v">name + \'s</span><span class="plus">+ object</span></div><div class="fex"><span class="s">my</span> book · <span class="v">Ana's</span> book</div></div>
        ${ii('👤','<b>Tip 1 — Possessive by person:</b> my, your, his, her, its, our, their.')}
        ${ii('🔑','<b>Tip 2 — Apostrophe \'s:</b> with the owner (person): Tom\'s dog, my sister\'s car.')}
        ${ii('⚠️','<b>Tip 3 — its ≠ it\'s:</b> «its» = its (animal/thing, no apostrophe) · «it\'s» = it is.')}
        <div class="alert-card"><div class="atitle">⚠️ Common mistake</div><p>❌ «the car of John» → ✅ «<b>John\'s</b> car».<br>❌ «her car» when it\'s his → ✅ «<b>his</b> car».</p></div>`
    },
    checks:[
      { q:{es:'«el perro de Tom» en inglés:',en:'«el perro de Tom» in English:'}, opts:{es:['Tom\'s dog','the dog of Tom'],en:['Tom\'s dog','the dog of Tom']}, correct:0, fb:{ why:{es:'Nombre + \'s.',en:'Name + \'s.'}, ex:{es:'Tom\'s dog → el perro de Tom',en:'Tom\'s dog'}, tip:{es:'+ \'s',en:'+ \'s'}} },
      { q:{es:'«___ name is Ana.» (de ella):',en:'«___ name is Ana.»:'}, opts:{es:['Her','His'],en:['Her','His']}, correct:0, fb:{ why:{es:'De ella → her.',en:'Hers → her.'}, ex:{es:'Her name is Ana → Se llama Ana',en:'Her name is Ana'}, tip:{es:'de ella → her',en:'hers → her'}} },
      { q:{es:'«The dog wags ___ tail.» (su, del perro):',en:'«The dog wags ___ tail.»:'}, opts:{es:['its','it\'s'],en:['its','it\'s']}, correct:0, fb:{ why:{es:'Posesivo «its» sin apóstrofo.',en:'Possessive «its», no apostrophe.'}, ex:{es:'its tail → su cola',en:'its tail'}, tip:{es:'posesivo → its',en:'possessive → its'}} },
      { q:{es:'«___ house is big.» (de ellos):',en:'«___ house is big.» (they):'}, opts:{es:['Their','His'],en:['Their','His']}, correct:0, fb:{ why:{es:'De ellos → their.',en:'Theirs → their.'}, ex:{es:'Their house → su casa (de ellos)',en:'Their house'}, tip:{es:'de ellos → their',en:'theirs → their'}} },
      { q:{es:'«___ car» (el dueño es él):',en:'«___ car» (the owner is he):'}, opts:{es:['his','her'],en:['his','her']}, correct:0, fb:{ why:{es:'De él → his.',en:'His → his.'}, ex:{es:'his car → su carro (de él)',en:'his car'}, tip:{es:'de él → his',en:'his → his'}} }
    ] },
  { icon:'✨', title:{es:'Práctica Final',en:'Final Practice'}, builder:true,
    html:{
      es:`<div class="gdesc">Junta todo: posesivo según la persona, o nombre + \'s. Arma la oración.</div>
        <div class="cboxes"><div class="cbox s"><span class="cl">posesivos</span><span class="cv">my · your · his · her · its · our · their</span></div><div class="cbox o"><span class="cl">his vs her</span><span class="cv">según el dueño (de él / de ella)</span></div><div class="cbox p"><span class="cl">nombre + 's</span><span class="cv">Ana's book = el libro de Ana</span></div></div>
        <div class="sec-label">Las reglas en una oración</div>
        ${eg('This is <span class="tag s">my</span> pencil.','Este es mi lápiz.','ok')}
        ${eg('He likes <span class="tag s">his</span> new bike.','A él le gusta su bici nueva. (de él)','ok')}
        ${eg('That is <b style="color:#7B1FA2">Sara\'s</b> house.','Esa es la casa de Sara.','ok')}
        <div class="alert-card"><div class="atitle">⚠️ Los 3 errores más comunes</div><p>❌ «the book of Ana» → ✅ «<b>Ana\'s</b> book»<br>❌ «her car» (siendo de él) → ✅ «<b>his</b> car»<br>❌ «it\'s tail» → ✅ «<b>its</b> tail»</p></div>`,
      en:`<div class="gdesc">Put it together: possessive by person, or name + \'s. Build the sentence.</div>

function say(text,acc){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.82; const vs=speechSynthesis.getVoices()||[]; const want=acc==='US'?'en-US':'en-GB'; const v=vs.find(x=>x.lang===want)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0); if(v){u.voice=v;u.lang=v.lang;}else u.lang=want; speechSynthesis.speak(u); }catch(e){} }
function render(){ cur=0; coreDone=false; doneSteps=new Array(STEPS.length).fill(false); answers=STEPS.map(s=>new Array(s.checks.length).fill(null)); bState={order:[],locked:false};

function renderTabs(){ document.getElementById('steptabs').innerHTML=STEPS.map((s,i)=>`<button class="stab${i===0?' on':''}${doneSteps[i]?' done':''}" id="stab${i}" onclick="goStep(${i})">${s.icon} ${i+1}</button>`).join(''); }
function applyLang(){ const t=L();
  document.getElementById('lsEs').classList.toggle('on',info==='es'); document.getElementById('lsEn').classList.toggle('on',info==='en');
  document.getElementById('mhtitle').textContent=MAT.title[info]; document.getElementById('mhsub').textContent=document.getElementById('screen').getAttribute('data-level').toUpperCase().replace('-',' · ')+' · '+MAT.subtitle[info];
  document.getElementById('unT').textContent=t.unT; document.getElementById('unP').textContent=t.unP;

  document.getElementById('kpT').textContent=t.kpT; document.getElementById('lBack').textContent=t.back; document.getElementById('lRetry').textContent=t.retry;
  updateMilestone(); renderStep(); }
function renderStep(){ const t=L(), s=STEPS[cur]; curLab= info==='es'?'EJEMPLO':'EXAMPLE';
  let html=`<div class="gcard"><div class="sec-label">${cur+1}. ${s.icon} ${s.title[info]}</div>${s.html[info]}`;
  if(s.builder) html+=builderHtml(); html+=`</div>`;
  const ansd=answers[cur].filter(x=>x!==null).length;
  html+=`<div class="check"><div class="check-h">🧠 ${t.checkH}<span class="cprog">${ansd}/${s.checks.length}</span></div><div class="check-sub">${t.checkSub}</div>`;
  s.checks.forEach((c,ci)=>{ const sel=answers[cur][ci]; const done=sel!==null; const ok=sel===c.correct;
    let fb='';
    if(done){ const f=c.fb; fb=`<div class="cfb show ${ok?'ok':'no'}"><div class="cfbh">${ok?'✅ '+t.cOk:'❌ '+t.cBad}</div><div class="cfbb">`+

function removeTile(idx,el){ if(bState.locked)return; bState.order=bState.order.filter(x=>x!==idx); el.remove(); document.getElementById('tile'+idx).classList.remove('placed'); document.getElementById('bchk').disabled=bState.order.length!==BUILD.answer.length; }
function checkBuild(){ const t=L(); bState.locked=true; const ok=bState.order.join(',')===BUILD.answer.map((_,i)=>i).join(','); document.querySelectorAll('#tray .tile').forEach(x=>x.style.pointerEvents='none');

function finish(){ const t=L(); document.getElementById('mbody').style.display='none'; document.getElementById('results').classList.add('show');
