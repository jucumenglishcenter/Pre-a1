<style>
:root{--bg:#ECEAE3;--card:#fff;--text:#2A2A2A;--text-soft:#777;--border:#E8E5DC;

body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;}
a{color:var(--xp);}a:hover{color:#B34700;}

.mhead{position:sticky;top:0;z-index:40;background:var(--xg);padding:14px 18px;display:flex;align-items:center;gap:11px;color:#fff;}

.mbody{position:relative;z-index:1;padding:16px 16px 30px;flex:1;}

async function sbFetch(path,opts){
  var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort();},7000);
  try{
    var r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({signal:ctrl.signal,headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},(opts&&opts.headers)||{})},opts||{}));

}

 {t:'Fragmento 1',p:["Every morning starts the same. Mom opens my door. Wake up, Leo! she says. I get up slowly. The sun comes in.","First, I wash my face. Then I brush my teeth. Lara brushes her teeth too. She sings with the brush. It takes a long time.","Dad makes breakfast every day. He gets bread and fruit. Mom makes hot tea. I take the cups. We eat together at seven.","After breakfast, I get my bag. I keep my books in it. Mom gives me an apple. She kisses my head. Have a good day! she says."]},
 {t:'Fragmento 2',p:["My name is Mia. I am seven years old. I can do many things. Some things are hard. But I practice every day.","I can draw very well. I draw my dog Toby. I use three colors. My drawings go on the wall. Mom loves every one.","I can run fast too. I race with Nico. He runs very fast. Sometimes he lets me win. We laugh at the end.","I cannot swim yet. Water goes in my nose. Dad says, Take your time. He can swim very well. Soon I can do it too."]},

const BANK={"adults":[{"part":"L","lvl":1,"type":"single","audio":"He makes breakfast every day.","prompt":{"es":"🔊 Escucha y elige la imagen correcta:","en":"Listen and choose the picture:"},"opts":["Prepara el desayuno","Toma el bus","Llama por teléfono","Toma su mochila"],"pics":{"Prepara el desayuno":"<span class=\"sc\"><span class=\"s1\">🍳</span></span>","Toma el bus":"<span class=\"sc\"><span class=\"s1\">🚌</span></span>","Llama por teléfono":"<span class=\"sc\"><span class=\"s1\">📞</span></span>","Toma su mochila":"<span class=\"sc\"><span class=\"s1\">🎒</span></span>"},"correct":"Prepara el desayuno","why":{"es":"🍳 <b>make breakfast</b> = preparar el desayuno. Ojo: <b>take</b> = tomar/llevar y <b>call</b> = llamar.","en":"make breakfast."}},{"part":"L","lvl":2,"type":"single","audio":"She gives me an apple.","prompt":{"es":"🔊 Escucha y elige la imagen correcta:","en":"Listen and choose the picture:"},"opts":["Ella me da una manzana","Ella toma una manzana","Ella pide una manzana","Ella guarda una manzana"],"pics":{"Ella me da una manzana":"<span class=\"sc row\"><span class=\"s1\">🤲</span><span class=\"s1\">🍎</span></span>","Ella toma una manzana":"<span class=\"sc\"><span class=\"s1\">🍏</span></span>","Ella pide una manzana":"<span class=\"sc\"><span class=\"s1\">🙋</span></span>","Ella guarda una manzana":"<span class=\"sc\"><span class=\"s1\">🎒</span></span>"},"correct":"Ella me da una manzana","why":{"es":"🤲 <b>give</b> = dar · <b>take</b> = tomar · <b>ask</b> = pedir/preguntar · <b>keep</b> = guardar. Los cuatro se parecen: escucha el verbo.","en":"give = dar."}},{"part":"L","lvl":2,"type":"single","audio":"Mom calls me two times.","prompt":{"es":"🔊 ¿Cuántas veces lo llama su mamá?","en":"How many times?"},"opts":["Dos","Una","Tres"],"correct":"Dos","why":{"es":"📞 <b>call</b> = llamar · <b>two times</b> = dos veces.","en":"two times."}},{"part":"L","lvl":2,"type":"single","audio":"I keep my books in my bag.","prompt":{"es":"🔊 ¿Qué hace con sus libros?","en":"What does he do with his books?"},"opts":["Los guarda en su mochila","Los deja en la mesa","Los presta a un amigo"],"correct":"Los guarda en su mochila","why":{"es":"🎒 <b>keep</b> = guardar/mantener. «I keep my books in my bag» = guardo mis libros en mi mochila.","en":"keep = guardar."}},{"part":"L","lvl":2,"type":"single","audio":"She does not wake up late.","prompt":{"es":"🔊 ¿Qué palabras hacen NEGATIVA la oración?","en":"Which words make it negative?"},"opts":["does not","do not","is not"],"correct":"does not","why":{"es":"🚫 Con <b>she/he/it</b> el negativo es <b>does not</b> (doesn't). Con I/you/we/they es <b>do not</b> (don't).","en":"does not."}},{"part":"L","lvl":3,"type":"single","audio":"Do you have a dog?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["Yes, I do.","Yes, I am.","Yes, I have a.","Yes, he does."],"correct":"Yes, I do.","why":{"es":"✅ Si preguntan con <b>Do you…?</b>, la respuesta corta lleva <b>do</b>: Yes, I <b>do</b>. «Yes, I am» sirve para «Are you…?».","en":"Yes, I do."}},{"part":"L","lvl":3,"type":"single","audio":"What do you do after school?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["I play football.","Yes, I do.","I am after school.","Do you play?"],"correct":"I play football.","why":{"es":"❓ Las preguntas con <b>What</b> piden información, no un sí/no: se responde con la acción («I play football»).","en":"What → información."}},{"part":"L","lvl":2,"type":"single","audio":"He can swim very well.","prompt":{"es":"🔊 ¿Qué dice de él?","en":"What does she say about him?"},"opts":["Que sabe nadar muy bien","Que no sabe nadar","Que quiere nadar"],"correct":"Que sabe nadar muy bien","why":{"es":"🏊 <b>can</b> = poder/saber hacer algo. «He can swim» = él sabe nadar. El negativo sería «cannot / can't».","en":"can swim."}},{"part":"L","lvl":2,"type":"single","audio":"We ask the teacher a question.","prompt":{"es":"🔊 ¿Qué hacen?","en":"What do they do?"},"opts":["Le preguntan a la maestra","Le dan algo a la maestra","Llaman a la maestra"],"correct":"Le preguntan a la maestra","why":{"es":"🙋 <b>ask</b> = preguntar/pedir · <b>give</b> = dar · <b>call</b> = llamar.","en":"ask = preguntar."}},{"part":"L","lvl":2,"type":"single","rev":1,"audio":"Are you seven years old?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["Yes, I am.","Yes, I do.","Yes, I have."],"correct":"Yes, I am.","why":{"es":"✅ Con <b>Are you…?</b> se responde con <b>am</b>: Yes, I am. 🔁 Repaso del M1 — compáralo con «Do you…? → Yes, I do».","en":"Yes, I am."}},{"part":"L","lvl":2,"type":"single","rev":1,"audio":"We are the same age.","prompt":{"es":"🔊 ¿Qué significa?","en":"What does it mean?"},"opts":["Tenemos la misma edad","Somos amigos","Vamos a la misma escuela"],"correct":"Tenemos la misma edad","why":{"es":"🎂 <b>same</b> = mismo · <b>age</b> = edad. 🔁 Repaso del M1.","en":"same age."}},{"part":"L","lvl":3,"type":"order","audio":"She does not have a car.","prompt":{"es":"🔊 Escucha y ARMA la oración con las fichas: 🧩","en":"Listen and build the sentence:"},"chips":["She","does","not","have","a","car."],"why":{"es":"🎧 «She <b>does not have</b> a car». Con she el negativo es «does not» y el verbo queda en base (have, no «has»).","en":"She does not have a car."}},{"part":"L","lvl":3,"type":"cloze","audio":"My mom gives me an apple every day.","prompt":{"es":"🔊 Escucha y completa con las palabras de arriba:","en":"Listen and complete with the words above:"},"bank":["gives","give","day","week","takes"],"text":["My mom ",{"g":"g1"}," me an apple every ",{"g":"g2"},"."],"key":{"g1":"gives","g2":"day"},"why":{"es":"🎧 «My mom <b>gives</b> me an apple every <b>day</b>». Con «my mom» (she) el verbo lleva -s.","en":"gives · day."}},{"part":"R","lvl":1,"type":"single","frag":1,"prompt":{"es":"¿Quién prepara el desayuno?","en":"Who makes breakfast?"},"opts":["Su papá","Su mamá","Su hermana"],"correct":"Su papá","why":{"es":"📖 «<b>Dad</b> makes breakfast every day» = su papá prepara el desayuno.","en":"Dad makes breakfast."}},{"part":"R","lvl":1,"type":"single","frag":1,"prompt":{"es":"¿A qué hora comen juntos?","en":"What time do they eat?"},"opts":["A las siete","A las ocho","A las seis"],"correct":"A las siete","why":{"es":"🕖 «We eat together <b>at seven</b>» = comemos juntos a las siete.","en":"at seven."}},{"part":"R","lvl":2,"type":"single","frag":1,"prompt":{"es":"¿Qué hace Lara con el cepillo?","en":"What does Lara do?"},"opts":["Canta mientras se cepilla","Lo guarda en la mochila","Lo pierde"],"correct":"Canta mientras se cepilla","why":{"es":"🎵 «She <b>sings</b> with the brush» = canta con el cepillo (y por eso tarda mucho).","en":"She sings."}},{"part":"R","lvl":3,"type":"multi","frag":1,"prompt":{"es":"Marca TODAS las oraciones verdaderas según el texto:","en":"Mark ALL true sentences:"},"opts":["Su mamá abre la puerta","Su papá consigue pan y fruta","Él guarda sus libros en la mochila","Su mamá prepara el desayuno"],"correct":["Su mamá abre la puerta","Su papá consigue pan y fruta","Él guarda sus libros en la mochila"],"why":{"es":"✅ El desayuno lo prepara el <b>papá</b>; la mamá hace el té («Mom makes hot tea»). Las otras tres sí están en el texto.","en":"Dad makes breakfast."}},{"part":"R","lvl":1,"type":"single","frag":2,"prompt":{"es":"¿Qué sabe hacer muy bien Mia?","en":"What can Mia do very well?"},"opts":["Dibujar","Nadar","Cocinar"],"correct":"Dibujar","why":{"es":"🎨 «I <b>can draw</b> very well» = sé dibujar muy bien. (Nadar todavía no: «I cannot swim yet».)","en":"draw."}},{"part":"R","lvl":3,"type":"single","frag":2,"prompt":{"es":"El texto dice «Sometimes he lets me win». ¿Qué nos dice eso de Nico?","en":"What does that tell us about Nico?"},"opts":["Que es bueno con su hermana","Que corre despacio","Que no le gusta jugar"],"correct":"Que es bueno con su hermana","why":{"es":"🤝 Él corre muy rápido, pero <b>a veces la deja ganar</b>: lo hace por cariño, no porque sea lento.","en":"He is kind."}},{"part":"R","lvl":2,"type":"boxes","frag":2,"single":true,"prompt":{"es":"Coloca cada trozo del texto frente a su significado:","en":"Match each piece with its meaning:"},"chips":["I can do many things.","I use three colors.","I cannot swim yet."],"boxes":[{"id":"a","lab":"Puedo hacer muchas cosas."},{"id":"b","lab":"Uso tres colores."},{"id":"c","lab":"Todavía no sé nadar."}],"key":{"a":["I can do many things."],"b":["I use three colors."],"c":["I cannot swim yet."]},"why":{"es":"🔍 Pistas: <b>can</b> = poder · <b>use</b> = usar · <b>cannot… yet</b> = todavía no puedo.","en":"can · use · cannot yet."}},{"part":"R","lvl":2,"type":"single","frag":3,"prompt":{"es":"¿Qué NO le gusta al niño del texto?","en":"What does he NOT like?"},"opts":["Las mañanas temprano","Las matemáticas","El arte"],"correct":"Las mañanas temprano","why":{"es":"🌅 «I <b>do not like</b> early mornings» = no me gustan las mañanas temprano. (Matemáticas y arte sí le gustan.)","en":"early mornings."}},{"part":"R","lvl":3,"type":"seq","prompt":{"es":"Ordena la conversación (1 → 5):","en":"Order the conversation (1 → 5):"},"items":["Hi Mia! Do you have your bag?","Yes, I do. My books are inside.","Do you take the bus to school?","No, I do not. I walk with Nico.","Great! We can walk together today."],"why":{"es":"💬 Se ordena por la lógica: pregunta → responde con «Yes, I do» → nueva pregunta → responde con «No, I do not» → propuesta final. Pista: «Yes, I do» solo responde a una pregunta con <b>Do</b>.","en":"Conversation logic."}},{"part":"R","lvl":2,"type":"single","rev":1,"text":"There is a big photo. There are seven people in it. There is one dog too.","prompt":{"es":"🔁 Repaso del M1 · ¿Cuántas personas hay en la foto?","en":"How many people are in the photo?"},"opts":["Siete","Una","Dos"],"correct":"Siete","why":{"es":"7️⃣ «There <b>are</b> seven people» → varios. Y «There <b>is</b> one dog» → uno solo. 🔁 Repaso del M1.","en":"seven people."}},{"part":"R","lvl":3,"type":"boxes","single":true,"prompt":{"es":"Coloca cada trozo del texto frente a su significado:","en":"Match each piece with its meaning:"},"chips":["I do not like early mornings.","Mia does not wake up late.","She makes her bed fast.","I study for tests."],"boxes":[{"id":"a","lab":"No me gustan las mañanas temprano."},{"id":"b","lab":"Mia no se levanta tarde."},{"id":"c","lab":"Ella hace su cama rápido."},{"id":"d","lab":"Yo estudio para los exámenes."}],"key":{"a":["I do not like early mornings."],"b":["Mia does not wake up late."],"c":["She makes her bed fast."],"d":["I study for tests."]},"why":{"es":"🔍 Compara los negativos: <b>I do not</b> (yo) y <b>Mia does not</b> (ella). En afirmativo, ella lleva -s: she make<b>s</b>.","en":"do not vs does not."}},{"part":"V","lvl":2,"type":"match","prompt":{"es":"Une cada oración con su traducción:","en":"Match each sentence with its translation:"},"left":["I have a dog.","She makes tea.","We can swim.","He takes the bus."],"right":["Yo tengo un perro.","Ella prepara té.","Nosotros sabemos nadar.","Él toma el bus."],"why":{"es":"🔍 <b>have</b> = tener · <b>make</b> = hacer/preparar · <b>can</b> = poder/saber · <b>take</b> = tomar.","en":"have · make · can · take."}},{"part":"V","lvl":3,"type":"cloze","prompt":{"es":"Completa el texto con las palabras de arriba:","en":"Complete the text with the words above:"},"bank":["get","use","keep","give","come","ask"],"text":["Every morning I ",{"g":"g1"}," up early. My mom likes to ",{"g":"g2"}," me an apple. I ",{"g":"g3"}," my books in my bag. At school I ",{"g":"g4"}," three colors to draw."],"key":{"g1":"get","g2":"give","g3":"keep","g4":"use"},"why":{"es":"🌅 <b>get up</b> = levantarse · <b>give</b> = dar · <b>keep</b> = guardar · <b>use</b> = usar. Ojo: después de <b>to</b> el verbo va en forma base (to give). Sobran «come» y «ask».","en":"get · give · keep · use."}},{"part":"V","lvl":2,"type":"single","prompt":{"es":"¿Cuál de estas NO es una acción (verbo)?","en":"Which one is NOT an action?"},"opts":["call","ask","repeat","kind"],"correct":"kind","why":{"es":"🕵️ call (llamar), ask (preguntar) y repeat (repetir) son acciones. <b>kind</b> = amable: describe a una persona.","en":"kind is an adjective."}},{"part":"V","lvl":2,"type":"single","prompt":{"es":"¿Qué significa «take»?","en":"What does \"take\" mean?"},"opts":["tomar / llevar","dar","guardar"],"correct":"tomar / llevar","why":{"es":"✋ <b>take</b> = tomar/llevar. Es lo contrario de <b>give</b> (dar): yo <b>take</b> lo que tú me <b>give</b>.","en":"take = tomar."}},{"part":"V","lvl":2,"type":"single","prompt":{"es":"¿Qué significa «become»?","en":"What does \"become\" mean?"},"opts":["convertirse en","venir","empezar"],"correct":"convertirse en","why":{"es":"🦋 <b>become</b> = convertirse en, llegar a ser: «We became friends» = nos hicimos amigos. Cuidado: <b>come</b> = venir.","en":"become = convertirse."}},{"part":"V","lvl":1,"type":"single","prompt":{"es":"¿Qué significa «come»?","en":"What does \"come\" mean?"},"opts":["venir","ir","correr"],"correct":"venir","why":{"es":"🚶 <b>come</b> = venir (hacia acá) · go = ir (hacia allá).","en":"come = venir."}},{"part":"V","lvl":2,"type":"single","prompt":{"es":"¿Qué significa «repeat»?","en":"What does \"repeat\" mean?"},"opts":["repetir","recordar","responder"],"correct":"repetir","why":{"es":"🔁 <b>repeat</b> = repetir. En clase: «Repeat after me» = repitan después de mí.","en":"repeat = repetir."}},{"part":"V","lvl":2,"type":"single","prompt":{"es":"En «Mom calls me two times», ¿qué significa «calls»?","en":"In \"Mom calls me\", \"calls\" means…"},"opts":["llama","cuenta","cuida"],"correct":"llama","why":{"es":"📞 <b>call</b> = llamar (por teléfono o de viva voz).","en":"call = llamar."}},{"part":"V","lvl":2,"type":"single","prompt":{"es":"En «We ask a question», ¿qué significa «ask»?","en":"In \"We ask a question\", \"ask\" means…"},"opts":["preguntar","responder","escuchar"],"correct":"preguntar","why":{"es":"🙋 <b>ask</b> = preguntar o pedir. Responder es <b>answer</b>.","en":"ask = preguntar."}},{"part":"V","lvl":1,"type":"single","rev":1,"prompt":{"es":"🔁 Repaso del M1 · ¿Qué significa «family»?","en":"What does \"family\" mean?"},"opts":["familia","amigo","casa"],"correct":"familia","why":{"es":"👨‍👩‍👧 <b>family</b> = familia. 🔁 Repaso del M1.","en":"family = familia."}},{"part":"V","lvl":2,"type":"single","rev":1,"prompt":{"es":"🔁 Repaso del M1 · En «His fruit stand is small», ¿qué significa «his»?","en":"What does \"his\" mean?"},"opts":["de él","de ella","a él"],"correct":"de él","why":{"es":"👨 <b>his</b> = de él, antes del sustantivo. <b>him</b> = a él, después del verbo o preposición. 🔁 Repaso del M1.","en":"his = de él."}},{"part":"V","lvl":2,"type":"single","rev":1,"prompt":{"es":"🔁 Repaso del M1 · ¿Qué significa «everyone»?","en":"What does \"everyone\" mean?"},"opts":["todos","alguien","nadie"],"correct":"todos","why":{"es":"👨‍👩‍👧‍👦 <b>everyone</b> = todos. 🔁 Repaso del M1.","en":"everyone = todos."}},{"part":"V","lvl":2,"type":"single","rev":1,"prompt":{"es":"🔁 Repaso del M1 · ¿Qué significa «age»?","en":"What does \"age\" mean?"},"opts":["edad","año","mismo"],"correct":"edad","why":{"es":"🎂 <b>age</b> = edad · year = año · same = mismo. 🔁 Repaso del M1.","en":"age = edad."}},{"part":"V","lvl":3,"type":"match","prompt":{"es":"Une cada oración con su traducción:","en":"Match each sentence with its translation:"},"left":["I keep my books.","We ask a question.","He takes the bus.","They repeat the word."],"right":["Guardo mis libros.","Hacemos una pregunta.","Él toma el bus.","Ellos repiten la palabra."],"why":{"es":"🔍 <b>keep</b> = guardar · <b>ask</b> = preguntar/pedir · <b>take</b> = tomar · <b>repeat</b> = repetir.","en":"keep · ask · take · repeat."}},{"part":"V","lvl":3,"type":"cloze","prompt":{"es":"Completa el texto con las palabras de arriba:","en":"Complete the text with the words above:"},"bank":["become","come","call","use","ask","get"],"text":["Every morning I ",{"g":"g1"}," up early. At school we ",{"g":"g2"}," the computer. If I need help, I ",{"g":"g3"}," the teacher. My grandma likes to ",{"g":"g4"}," me on the phone."],"key":{"g1":"get","g2":"use","g3":"ask","g4":"call"},"why":{"es":"🌅 <b>get up</b> = levantarse · <b>use</b> = usar · <b>ask</b> = preguntar · <b>call</b> = llamar. Sobran «become» y «come».","en":"get · use · ask · call."}},{"part":"G","lvl":2,"type":"tap","prompt":{"es":"Toca la palabra INCORRECTA: 👆","en":"Tap the INCORRECT word:"},"words":["She","don’t","like","tests."],"err":1,"fix":"doesn’t","why":{"es":"👧 Con <b>she</b> el negativo es <b>doesn’t</b>: She doesn’t like tests.","en":"She doesn’t."}},{"part":"G","lvl":2,"type":"tap","prompt":{"es":"Toca la palabra INCORRECTA: 👆","en":"Tap the INCORRECT word:"},"words":["Dad","get","bread","and","fruit."],"err":1,"fix":"gets","why":{"es":"👨 «Dad» es él → el verbo lleva <b>-s</b>: Dad <b>gets</b> bread.","en":"Dad gets."}},{"part":"G","lvl":3,"type":"tap","prompt":{"es":"Toca la palabra INCORRECTA: 👆","en":"Tap the INCORRECT word:"},"words":["Does","she","goes","to","school","early?"],"err":2,"fix":"go","why":{"es":"❓ Después de <b>Does</b> el verbo va en su forma base: Does she <b>go</b>…? La -s ya está en «Does».","en":"Does she go…?"}},{"part":"G","lvl":2,"type":"boxes","text":"Dad makes breakfast every day.","prompt":{"es":"Coloca cada ficha en su casilla:","en":"Place each chip in its box:"},"chips":["Dad","makes","breakfast every day"],"boxes":[{"id":"S","lab":"Sujeto (¿quién?)"},{"id":"V","lab":"Verbo (acción)"},{"id":"C","lab":"Complemento (el resto)"}],"key":{"S":["Dad"],"V":["makes"],"C":["breakfast every day"]},"why":{"es":"👤 <b>Sujeto</b> = quién hace la acción (Dad) · 🏃 <b>Verbo</b> = la acción (makes) · 🎯 <b>Complemento</b> = qué y cuándo (breakfast every day). En español: «Papá / prepara / el desayuno cada día».","en":"Subject · verb · complement."}},{"part":"G","lvl":1,"type":"order","prompt":{"es":"Ordena las fichas: 🧩","en":"Order the chips:"},"tr":"«No me gustan las mañanas temprano.»","chips":["I","do","not","like","early","mornings."],"why":{"es":"🧩 Negativo del Present Simple: sujeto + <b>do not</b> + verbo base + resto.","en":"I do not like early mornings."}},{"part":"G","lvl":2,"type":"order","prompt":{"es":"Ordena las fichas para hacer la PREGUNTA: 🧩","en":"Order the chips (question):"},"tr":"«¿Se levanta ella temprano?»","chips":["Does","she","get","up","early?"],"why":{"es":"❓ Pregunta con he/she/it: <b>Does</b> + sujeto + verbo base. Nunca «Does she gets».","en":"Does she get up early?"}},{"part":"G","lvl":2,"type":"single","prompt":{"es":"Completa: «___ you like math?» ➗","en":"Complete: \"___ you like math?\""},"opts":["Do","Does","Are"],"correct":"Do","why":{"es":"❓ Con <b>you</b> la pregunta empieza con <b>Do</b>. «Does» va con he/she/it y «Are» es del verbo to be.","en":"Do you like…?"}},{"part":"G","lvl":3,"type":"single","prompt":{"es":"Completa: «___ does she go after school?» (pregunta por el LUGAR) 🏠","en":"Complete (asks about PLACE):"},"opts":["Where","What","Who"],"correct":"Where","why":{"es":"📍 <b>Where</b> = dónde (lugar) · What = qué (cosa) · Who = quién (persona).","en":"Where = lugar."}},{"part":"G","lvl":2,"type":"single","rev":1,"prompt":{"es":"🔁 Repaso del M1 · Completa: «There ___ seven people in the photo.»","en":"Complete: \"There ___ seven people…\""},"opts":["are","is","be"],"correct":"are","why":{"es":"7️⃣ Varios → There <b>are</b>. Uno solo → There is. 🔁 Repaso del M1.","en":"There are."}},{"part":"G","lvl":2,"type":"boxes","prompt":{"es":"Coloca cada palabra en la columna de su negativo:","en":"Sort each word by its negative:"},"chips":["I","he","they","she","we","my mom"],"boxes":[{"id":"dont","lab":"… DON’T"},{"id":"doesnt","lab":"… DOESN’T"}],"key":{"dont":["I","they","we"],"doesnt":["he","she","my mom"]},"why":{"es":"🚫 <b>don’t</b> con I, you, we, they · <b>doesn’t</b> con he, she, it y una persona (my mom). Y después del negativo el verbo va en su forma base: she doesn’t <b>make</b>.","en":"don’t vs doesn’t."}},{"part":"G","lvl":3,"type":"boxes","prompt":{"es":"Coloca cada sujeto en la columna de su pregunta:","en":"Sort each subject by its question word:"},"chips":["I","she","they","my dad","we","it"],"boxes":[{"id":"do","lab":"DO … ?"},{"id":"does","lab":"DOES … ?"}],"key":{"do":["I","they","we"],"does":["she","my dad","it"]},"why":{"es":"❓ <b>Do</b> con I, you, we, they · <b>Does</b> con he, she, it y una persona (my dad). Después de Does el verbo va en base.","en":"Do vs Does."}}],"kids":[{"part":"L","lvl":1,"type":"single","audio":"He makes breakfast every day.","prompt":{"es":"🔊 Escucha y elige la imagen correcta:","en":"Listen and choose the picture:"},"opts":["Prepara el desayuno","Toma el bus","Llama por teléfono","Toma su mochila"],"pics":{"Prepara el desayuno":"<span class=\"sc\"><span class=\"s1\">🍳</span></span>","Toma el bus":"<span class=\"sc\"><span class=\"s1\">🚌</span></span>","Llama por teléfono":"<span class=\"sc\"><span class=\"s1\">📞</span></span>","Toma su mochila":"<span class=\"sc\"><span class=\"s1\">🎒</span></span>"},"correct":"Prepara el desayuno","why":{"es":"🍳 <b>make breakfast</b> = preparar el desayuno.","en":"make breakfast."}},{"part":"L","lvl":2,"type":"single","audio":"She gives me an apple.","prompt":{"es":"🔊 Escucha y elige la imagen correcta:","en":"Listen and choose the picture:"},"opts":["Ella me da una manzana","Ella toma una manzana","Ella guarda una manzana","Ella pide una manzana"],"pics":{"Ella me da una manzana":"<span class=\"sc row\"><span class=\"s1\">🤲</span><span class=\"s1\">🍎</span></span>","Ella toma una manzana":"<span class=\"sc\"><span class=\"s1\">🍏</span></span>","Ella guarda una manzana":"<span class=\"sc\"><span class=\"s1\">🎒</span></span>","Ella pide una manzana":"<span class=\"sc\"><span class=\"s1\">🙋</span></span>"},"correct":"Ella me da una manzana","why":{"es":"🤲 <b>give</b> = dar (take = tomar · keep = guardar · ask = pedir).","en":"give = dar."}},{"part":"L","lvl":2,"type":"single","audio":"Mom calls me two times.","prompt":{"es":"🔊 ¿Cuántas veces lo llama?","en":"How many times?"},"opts":["Dos","Una","Tres"],"correct":"Dos","why":{"es":"📞 <b>call</b> = llamar · two = dos.","en":"two times."}},{"part":"L","lvl":2,"type":"single","audio":"He can swim very well.","prompt":{"es":"🔊 ¿Qué dice de él?","en":"What does she say about him?"},"opts":["Que sabe nadar muy bien","Que no sabe nadar","Que quiere nadar"],"correct":"Que sabe nadar muy bien","why":{"es":"🏊 <b>can</b> = poder/saber. He can swim = él sabe nadar.","en":"can swim."}},{"part":"L","lvl":3,"type":"single","audio":"Do you have a dog?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["Yes, I do.","Yes, I am.","Yes, he does."],"correct":"Yes, I do.","why":{"es":"✅ Con <b>Do you…?</b> se responde «Yes, I <b>do</b>».","en":"Yes, I do."}},{"part":"L","lvl":2,"type":"single","audio":"I keep my books in my bag.","prompt":{"es":"🔊 ¿Qué hace con sus libros?","en":"What does he do with his books?"},"opts":["Los guarda en su mochila","Los deja en la mesa","Los regala"],"correct":"Los guarda en su mochila","why":{"es":"🎒 <b>keep</b> = guardar.","en":"keep = guardar."}},{"part":"L","lvl":1,"type":"single","rev":1,"audio":"There is one dog in the photo.","prompt":{"es":"🔊 ¿Cuántos perros hay?","en":"How many dogs?"},"opts":["Uno","Dos","Ninguno"],"correct":"Uno","why":{"es":"1️⃣ <b>There is</b> = hay uno. 🔁 Repaso del M1.","en":"There is one."}},{"part":"L","lvl":2,"type":"single","rev":1,"audio":"Are you seven years old?","prompt":{"es":"🔊 Escucha la pregunta y elige TU respuesta:","en":"Listen and choose your answer:"},"opts":["Yes, I am.","Yes, I do.","Yes, I have."],"correct":"Yes, I am.","why":{"es":"✅ Con <b>Are you…?</b> → «Yes, I am». 🔁 Repaso del M1.","en":"Yes, I am."}},{"part":"L","lvl":3,"type":"order","audio":"I do not like eggs.","prompt let lang='es',QS=[],LIMIT=0,picks=[],plays=[],cur=0,remain=0,timer=null,startedAt=0,exits=0,submitted=false,lastTimedOut=false,myAttempts=[];
const fmt=s=>Math.floor(s/60)+':'+String(Math.max(0,s)%60).padStart(2,'0');
function fy(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[.?!¿¡,]+\s*$/,'').replace(/\s+/g,' ').trim();}
function eqSet(a,b){if(a.length!==b.length)return false;const s=new Set(a);return b.every(x=>s.has(x));}
function isRight(q,p){
  if(!q||p==null)return false;
  if((q.type==='order'||q.type==='multi')&&!Array.isArray(p))return false;
  if(q.type==='single')return p===q.correct;
  if(q.type==='multi')return Array.isArray(p)&&eqSet(p,q.correct);
  if(q.type==='write')return q.acc.some(a=>norm(a)===norm(p));
  if(q.type==='tap')return p===q.err;
  if(q.type==='order')return Array.isArray(p)&&p.length===q.chips.length&&p.every((c,i)=>c===q.chips[i]);
  if(q.type==='boxes'){const st=p||{};const n=[].concat.apply([],Object.keys(st).map(k=>st[k]||[])).length;
    return n===q.chips.length&&Object.keys(q.key).every(k=>eqSet(st[k]||[],q.key[k]));}
  if(q.type==='cloze')return Object.keys(q.key).every(g=>(p||{})[g]===q.key[g]);
  if(q.type==='match')return q.left.every((_,li)=>(p||{})[li]===li);
  if(q.type==='seq')return Array.isArray(p)&&p.length===q.items.length&&p.every((v,x)=>v===x);
  return false;
}
function isAnswered(i){const q=QS[i],p=picks[i];
  if(p==null)return false;
  if(q.type==='multi')return p.length>0;
  if(q.type==='write')return String(p).trim()!=='';
  if(q.type==='order')return p.length===q.chips.length;
  if(q.type==='boxes')return [].concat.apply([],Object.keys(p).map(k=>p[k]||[])).length===q.chips.length;
  if(q.type==='cloze')return Object.keys(q.key).every(g=>!!p[g]);
  if(q.type==='match')return Object.keys(p).length===q.left.length;
  if(q.type==='seq')return Array.isArray(p)&&p.length===q.items.length;
  return true;}
function ansText(q,p){
  if(!q||p==null)return null;
  if(q.type==='order'&&!Array.isArray(p))return String(p);
  if(q.type==='multi'&&!Array.isArray(p))return String(p);
  if(q.type==='tap')return q.words[p];
  if(q.type==='boxes')return q.boxes.map(b=>b.lab+': '+((p||{})[b.id]||[]).join(' / ')).join(' · ');
  if(q.type==='cloze')return Object.keys(q.key).map((g,x)=>(x+1)+') '+((p||{})[g]||'—')).join(' · ');
  if(q.type==='match')return q.left.map((tx,li)=>(li+1)+') '+(q.right[(p||{})[li]]||'—')).join(' · ');
  if(q.type==='seq')return (Array.isArray(p)?p:[]).map(x=>q.items[x]).join(' → ');
  if(q.type==='order')return p.join(' ');
  if(Array.isArray(p))return p.length?p.join(', '):null;
  return String(p).trim()||null;}
function corrText(q){
  if(q.type==='single')return q.correct;
  if(q.type==='multi')return q.correct.join(', ');
  if(q.type==='write')return q.show||q.acc[0];
  if(q.type==='tap')return '«'+q.words[q.err]+'» → '+q.fix;
  if(q.type==='boxes')return q.boxes.map(b=>b.lab+': '+(q.key[b.id]||[]).join(' / ')).join(' · ');
  if(q.type==='cloze')return Object.keys(q.key).map((g,x)=>(x+1)+') '+q.key[g]).join(' · ');
  if(q.type==='match')return q.left.map((tx,li)=>tx+' → '+q.right[li]).join(' · ');
  if(q.type==='seq')return q.items.map((tx,x)=>(x+1)+') '+tx).join(' · ');
  if(q.type==='order')return q.chips.join(' ');
  return '';}

function startExam(resume){
  const prog=resume?loadProg():null;
  if(prog&&prog.v===VARIANT){startedAt=prog.s;picks=prog.p||[];cur=Math.min(prog.c||0,QS.length-1);exits=prog.x||0;plays=prog.pl||[];}
  else{startedAt=Date.now();picks=new Array(QS.length).fill(null);plays=new Array(QS.length).fill(0);cur=0;exits=0;}
  while(picks.length<QS.length)picks.push(null);

const SEL={},MSEL={},PAIRC=['#42A5F5','#66BB6A','#AB47BC','#EF6C00'];
function bxSel(i,c){SEL[i]=(SEL[i]===c?null:c);renderQ(i);}
function bxDrop(i,bid){const q=QS[i];if(!SEL[i])return;const st=Object.assign({},picks[i]||{});

  st[bid]=(st[bid]||[]).concat([SEL[i]]);picks[i]=st;SEL[i]=null;saveProg();renderQ(i);}

const CHEERS=['🌟 ¡Vas muy bien! Sigue así.','💪 ¡Buen ritmo! Confía en lo que practicaste.','🚀 ¡Ya pasaste otra parte! Respira y continúa.','🌱 Cada pregunta también es práctica. ¡Sigue!','🎯 ¡Excelente concentración! Ya falta menos.','🏅 ¡Tu esfuerzo se nota! Vamos con calma.'];

function askSubmit(){
  const t=T[lang];const missing=QS.map((_,i)=>i).filter(i=>!isAnswered(i));
  document.getElementById('modal').innerHTML=`<div class="mbox"><div class="me">${missing.length?'🤔':'🎓'}</div><h3>${t.confirmT}</h3>
    <p>${missing.length?t.confirmMiss(missing.length):t.confirmOk}</p>
    <button class="mb1" onclick="closeModal();submitExam(false)">${t.confirmGo}</button>

  document.getElementById('modal').classList.add('show');

function closeModal(){document.getElementById('modal').classList.remove('show');}
function compute(){
  const agg={};PORDER.forEach(p=>agg[p]={h:0,t:0});
  let correct=0;
  QS.forEach((q,i)=>{agg[q.part].t++;if(isRight(q,picks[i])){agg[q.part].h++;correct++;}});
  let score=0;PORDER.forEach(p=>{const a=agg[p];if(a.t)score+=(a.h/a.t)*PARTS[p].w;});
  score=Math.round(score);
  const answers=QS.map((q,i)=>({i,p:picks[i],ok:isRight(q,picks[i])}));
  return {score,correct,total:QS.length,agg,answers,duration:Math.min(LIMIT,Math.floor((Date.now()-startedAt)/1000))};
}

    attempt_no:(myAttempts.length||0)+1,score:A.score,correct:A.correct,total:A.total,duration_sec:A.duration,
    timed_out:!!timedOut,sections:Object.assign({_bv:BANKV},secs),answers:A.answers,ready:A.score>=passMark(VARIANT),created_at:new Date().toISOString()};
  myAttempts.push(row);saveLocalAttempt(row);clearProg();cloudSaveAttempt(row);
  try{window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:A.score,pass:passMark(VARIANT),type:'exam',mat:'PreA1_M2_Examen_'+VARIANT,topic:'examen-m2'}}));}catch(e){}
  hideAll();
  const R=document.getElementById('results');R.style.display='block';R.classList.add('show');
  const passed=A.score>=passMark(VARIANT);
  R.innerHTML=`<div class="verdict ${passed?'hi':''}"><div class="em">${passed?'🎉':'🌱'}</div><div class="score">${A.score}<small>/100</small></div><h2>${passed?t.pass:t.fail}</h2><p>${passed?t.passS:t.failS}</p></div>
    ${timedOut?`<div class="timeoutbar" style="display:block">${t.timeout}</div>`:''}
    <div class="strip"><div class="stat"><b>${A.correct}/${A.total}</b><span>${t.hits}</span></div><div class="stat"><b>${fmt(A.duration)}</b><span>${t.time}</span></div><div class="stat"><b>${A.score}</b><span>${t.score}</span></div><div class="stat"><b>${passMark(VARIANT)}</b><span>${t.needed}</span></div></div>
    <div class="rblock"><h3>${t.breakT}</h3><p class="sub">${t.breakS}</p>${PORDER.map(p=>{const a=A.agg[p];if(!a.t)return'';const pc=Math.round(a.h/a.t*100);const col=pc>=75?'#2E7D32':pc>=50?'#F9A825':'#C62828';
      return `<div class="srow"><span class="snm">${PARTS[p].emo} ${PARTS[p].name[lang]}</span><span class="sbar"><i style="width:${pc}%;background:${col}"></i></span><span class="spct" style="color:${col}">${a.h}/${a.t}</span></div>`;}).join('')}</div>
    <div class="rblock" style="background:#FFFDF6"><p style="margin:0;font-size:13px;line-height:1.6;font-weight:600">${t.resNote}</p></div>
    <div class="neuro"><span class="nem">🧠</span><div>${t.neuroEnd}</div></div>
    <button class="rev-toggle" onclick="toggleRev('rev',this)">${t.revShow}</button><div class="review" id="rev">${buildReview(A.answers,QS,'s')}</div>
    <div class="rbtns"><button class="rbtn" onclick="goBack()">${t.backPlat}</button></div>`;
  window.scrollTo({top:0});
}

/* ═══════════ VIGILANCIA DE PESTAÑA ═══════════ */
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&!submitted&&document.getElementById('mbody').style.display==='block'){exits++;saveProg();}
  else if(!document.hidden&&exits>0&&!submitted&&document.getElementById('mbody').style.display==='block'){toast(T[lang].tabWarn);}
});

/* ═══════════ REVISIÓN (alumno y profesor) ═══════════ */
function sameBank(a){return !!(a&&a.sections&&a.sections._bv===BANKV);}
function oldVerNote(){return '<div style="background:#FFF3E0;border:1.5px solid #FFB74D;border-radius:10px;padding:9px 12px;font-size:12px;color:#8A5100;font-weight:700;line-height:1.55">ℹ️ Este intento es de una <b>versión anterior</b> del examen. Se conserva su nota, pero el detalle pregunta por pregunta no se puede mostrar (las preguntas cambiaron).</div>';}
function buildReview(answers,bank,who){const t=T[lang];return (answers||[]).map(x=>{const q=bank&&bank[x.i];if(!q)return'';const yours=ansText(q,x.p);
  return `<div class="rvq"><div class="rvh"><span class="rvn">#${x.i+1} · ${PARTS[q.part].emo} ${PARTS[q.part].name[lang]}</span><span class="rvmark">${x.ok?'✅':'❌'}</span></div>
  <p class="rvp">${q.prompt[lang]}${q.text?` <span style="color:var(--text-soft);font-weight:600">— ${esc(q.text)}</span>`:''}${q.audio?` <span style="color:var(--text-soft);font-weight:600">🎧 "${esc(q.audio)}"</span>`:''}</p>
  <div class="rva">${x.ok?`<span class="good">${t.correctAns}${esc(corrText(q))}</span>`:`<span class="yours">${who==='t'?t.yourAns:t.myAns}${yours?esc(yours):t.noAns}</span><br><span class="good">${t.correctAns}${esc(corrText(q))}</span>`}${q.why?`<div class="rvwhy">💡 ${q.why[lang]||q.why.es}</div>`:''}</div></div>`;}).join('');}
function toggleRev(id,btn){const el=document.getElementById(id);const show=!el.classList.contains('show');el.classList.toggle('show',show);btn.textContent=show?T[lang].revHide:T[lang].revShow;}

/* ═══════════ PANEL DEL PROFESOR ═══════════ */
let tData=null,tGroupSel='';
async function renderTeacher(){
  const t=T[lang],el=document.getElementById('teacherview');
  el.innerHTML=`<div class="t-hero"><h2>👩‍🏫 ${t.tT}</h2><p>${t.tS}</p></div>${langHTML()}<div id="tbody"><div class="empty">${t.tLoad}</div></div>`;
  try{
    const [students,groups,attempts]=await Promise.all([
      sbFetch('users?role=eq.student&select=id,full_name,username,group_id,level'),
      sbFetch('groups?select=id,name,level'),
      sbFetch('diagnostic_attempts?activity_id=eq.'+encodeURIComponent(ACT)+'&order=created_at.asc&select=*')
    ]);
    tData={students:students||[],groups:groups||[],attempts:attempts||[]};
    if(GROUP)tGroupSel=GROUP;
    paintTeacher();
  }catch(e){document.getElementById('tbody').innerHTML=`<div class="empty">${t.tFail}</div>`;}
}
function paintTeacher(){
  const t=T[lang];if(!tData)return;
  const byUser={};tData.attempts.forEach(a=>{(byUser[a.user_id]=byUser[a.user_id]||[]).push(a);});
  const gname={};tData.groups.forEach(g=>gname[g.id]=g.name);
  let studs=tData.students.filter(s=>byUser[s.id]&&byUser[s.id].length);
  if(tGroupSel)studs=studs.filter(s=>s.group_id===tGroupSel);
  studs.sort((a,b)=>byUser[b.id][0].score-byUser[a.id][0].score);
  const groupsWith=[...new Set(tData.students.filter(s=>byUser[s.id]&&byUser[s.id].length).map(s=>s.group_id))];
  const opts=`<option value="">${t.tAll}</option>`+tData.groups.filter(g=>groupsWith.includes(g.id)).map(g=>`<option value="${g.id}" ${g.id===tGroupSel?'selected':''}>${esc(g.name||g.id)}</option>`).join('');
  const avg=studs.length?Math.round(studs.reduce((s,x)=>s+byUser[x.id][0].score,0)/studs.length):0;
  const rows=studs.map(s=>{
    const a=byUser[s.id][0];const sec=a.sections||{};const v=sec._v==='kids'?'🧒':'🧑';const ex=sec._exits||0;
    const ini=(s.full_name||s.username||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const dt=new Date(a.created_at||Date.now());
    const partline=PORDER.map(p=>sec[p]&&sec[p].t?PARTS[p].emo+' '+sec[p].h+'/'+sec[p].t:'').filter(Boolean).join(' · ');
    return `<div class="t-student"><div class="t-srow">
      <div class="t-ava">${ini||'?'}</div>
      <div class="t-sinfo"><b>${esc(s.full_name||s.username||s.id)}</b><span>${esc(gname[s.group_id]||'')} · ${v} · ${dt.toLocaleDateString('es-PE',{day:'numeric',month:'short'})} ${dt.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})}${a.timed_out?' · ⏱':''}</span></div>
      ${ex?`<span class="t-flag">📵 ${ex} ${t.tExits}</span>`:''}
      <span class="t-sc" style="color:${a.score>=75?'var(--correct)':a.score>=51?'#B26A00':'var(--wrong)'}">${a.score}</span></div>
      <div class="t-att"><span>${partline}</span><button style="margin-left:auto" onclick='tReview(${JSON.stringify(s.id)})'>${t.view}</button></div></div>`;
  }).join('');
  document.getElementById('tbody').innerHTML=`
    <div class="t-controls"><label>${t.tGroup}</label><select class="t-sel" onchange="tGroupSel=this.value;paintTeacher()">${opts}</select><button class="t-refresh" onclick="renderTeacher()">${t.tRefresh}</button></div>
    <div class="t-summary"><div class="t-sum"><b>${studs.length}</b><span>${t.tDone}</span></div><div class="t-sum"><b>${avg}</b><span>${t.tAvg} /100</span></div></div>
    ${studs.length?rows:`<div class="empty">${t.tNone}</div>`}`;
}
function tReview(sid){
  const a=(tData.attempts.filter(x=>x.user_id===sid))[0];if(!a)return;
  const s=tData.students.find(x=>x.id===sid)||{};const t=T[lang];
  const bank=BANK[(a.sections&&a.sections._v)||'adults'];
  hideAll();const el=document.getElementById('reviewview');el.style.display='block';
  const dt=new Date(a.created_at||Date.now());
  el.innerHTML=`<button class="backbtn" onclick="backToTeacher()">${t.back}</button>
    <div class="rv-head"><div class="big">${a.score}</div><div class="meta"><b>${esc(s.full_name||sid)}</b>
    <span>${a.correct}/${a.total} · ${Math.round((a.duration_sec||0)/60)} min · ${dt.toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'})}${a.timed_out?' · ⏱':''}${(a.sections&&a.sections._exits)?' · 📵 '+a.sections._exits:''}</span></div></div>
    <div style="margin-top:14px">${sameBank(a)?buildReview(a.answers||[],bank,'t'):oldVerNote()}</div>
    <button class="backbtn" style="margin-top:6px" onclick="backToTeacher()">${t.back}</button>`;
  window.scrollTo({top:0});
}
function backToTeacher(){hideAll();document.getElementById('teacherview').style.display='block';paintTeacher();window.scrollTo({top:0});}

/* ═══════════ VARIOS ═══════════ */
function setLang(l){lang=l;
  if(document.getElementById('hub').style.display!=='none'){(!VARIANT||!BANK[VARIANT])?renderPicker():renderHub();}
  if(document.getElementById('mbody').style.display!=='none')renderQ(cur);
  if(document.getElementById('teacherview').style.display!=='none'&&tData)paintTeacher();}
function goBack(){if(document.referrer){history.back();}else{try{window.dispatchEvent(new CustomEvent('jucum:back'));}catch(e){}}}
let chimed=0;function chime(){try{const C=new (window.AudioContext||window.webkitAudioContext)();[0,.35].forEach(function(d){const o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.type='sine';o.frequency.value=d?659:523;g.gain.setValueAtTime(0.0001,C.currentTime+d);g.gain.exponentialRampToValueAtTime(0.12,C.currentTime+d+0.03);g.gain.exponentialRampToValueAtTime(0.0001,C.currentTime+d+0.5);o.start(C.currentTime+d);o.stop(C.currentTime+d+0.55);});}catch(e){}}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.app')){e.preventDefault();toast(T[lang].protect);}});
window.addEventListener('beforeunload',function(){if(!submitted&&document.getElementById('mbody').style.display==='block')saveProg();});

route();
</script>
