<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Summary — Possessive Adjectives | Pre-A1 | JUCUM</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
--bg:#FAFAF6;--card:#fff;--text:#2A2A2A;--text-soft:#777;--border:#E8E5DC;
--shadow:0 3px 16px rgba(0,0,0,.06);--radius:14px;
--lp:#F9A825;--ld:#E65100;--ll:#FFF9C4;--lm:#FFECB3;
--lg:linear-gradient(135deg,#F9A825,#FF8F00);--lglow:rgba(249,168,37,.15);
--badge-text:#4E3800;
--subj:#1565C0;--subj-bg:#E3F2FD;
--verb:#E53935;--verb-bg:#FFEBEE;
--comp:#00897B;--comp-bg:#E0F2F1;
--neg:#AD1457;--neg-bg:#FCE4EC;
--quest:#7B1FA2;--quest-bg:#F3E5F5;
--ok:#2E7D32;--ok-bg:#E8F5E9;
--err:#C62828;--err-bg:#FFEBEE;
--note-bg:#FFFDE7;--note-border:#FBC02D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:1.5rem 1rem;-webkit-font-smoothing:antialiased}
.container{max-width:780px;margin:0 auto}

.level-header{text-align:center;padding:2rem;border-radius:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:1.2rem;background:var(--lg)}
.level-header::before{content:'';position:absolute;top:-40%;right:-15%;width:250px;height:250px;background:rgba(255,255,255,.1);border-radius:50%}
.level-header h1{font-family:'Fredoka',sans-serif;font-size:1.8rem;font-weight:600;position:relative;z-index:1}
.level-header .module-name{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:500;opacity:.95;position:relative;z-index:1;margin-top:.2rem}
.level-header .subtitle{opacity:.8;font-size:.85rem;position:relative;z-index:1;margin-top:.15rem}
.level-badge{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ll);color:var(--badge-text);padding:4px 12px;border-radius:20px;border:1.5px solid var(--lm);margin-bottom:.8rem;position:relative;z-index:1}

.step-tabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.step-tab{padding:.45rem .85rem;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--card);transition:.2s;font-family:'Nunito',sans-serif}
.step-tab:hover{background:var(--ll)}
.step-tab.active{background:var(--ll);border-color:var(--lp);color:var(--ld)}
.step-tab.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-bottom:1.2rem;box-shadow:var(--shadow);border-top:3.5px solid var(--lp);display:none}
.card.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.section-label{display:flex;align-items:center;gap:.5rem;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--ld);margin-bottom:.3rem}
.section-label::before{content:"";width:20px;height:3px;background:var(--lp);border-radius:2px}
.section-title{font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:600;margin-bottom:.1rem}
.section-desc{font-size:.85rem;color:var(--text-soft);margin-bottom:1rem;line-height:1.6}

/* GRAMMAR TAGS - inline-block prevents overlap */
.g-subj,.g-verb,.g-comp,.g-neg,.g-quest,.g-prep,.g-time,.g-art{display:inline-block;padding:1px 7px;border-radius:4px;font-weight:700;margin:0 1px;line-height:1.5}
.g-subj{background:var(--subj-bg);color:var(--subj);border-bottom:2.5px solid var(--subj)}
.g-verb{background:var(--verb-bg);color:var(--verb);border-bottom:2.5px solid var(--verb)}
.g-comp{background:var(--comp-bg);color:var(--comp);border-bottom:2.5px solid var(--comp)}
.g-neg{background:var(--neg-bg);color:var(--neg);border-bottom:2.5px solid var(--neg)}
.g-quest{background:var(--quest-bg);color:var(--quest);border-bottom:2.5px solid var(--quest)}
.g-prep{background:#FFE0B2;color:#E65100;border-bottom:2.5px solid #FB8C00}
.g-time{background:#F8BBD0;color:#AD1457;border-bottom:2.5px solid #C2185B}
.g-art{background:#FFF59D;color:#F57F17;border-bottom:2.5px solid #FBC02D}

.g-table{width:100%;border-collapse:separate;border-spacing:0;margin:.8rem 0;border-radius:10px;overflow:hidden;font-size:.83rem;border:1px solid var(--border)}
.g-table th{background:var(--lg);color:#fff;padding:.65rem .6rem;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.g-table td{padding:.6rem;border-bottom:1px solid #f0f0f0;vertical-align:middle;line-height:1.65}
.g-table tr:nth-child(even) td{background:var(--ll)}
.g-table tr:last-child td{border-bottom:none}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.8rem 0}
.compare-card{padding:1rem;border-radius:12px;text-align:center}
.compare-card.esp{background:var(--ll);border:2px solid var(--lm)}
.compare-card.eng{background:var(--subj-bg);border:2px solid #90CAF9}
.compare-card h4{font-family:'Fredoka',sans-serif;font-size:.85rem;margin-bottom:.5rem}
.compare-card.esp h4{color:var(--ld)}
.compare-card.eng h4{color:var(--subj)}
.compare-card ul{list-style:none;font-size:.82rem;color:var(--text-soft)}
.compare-card li{padding:3px 0;line-height:1.5}

.formula-box{background:var(--note-bg);border:2px solid var(--note-border);border-radius:12px;padding:1rem;margin:.8rem 0;text-align:center;font-family:'Fredoka',sans-serif;font-size:.95rem;color:var(--ld);line-height:2.1}
.tip-card{background:var(--ll);border-radius:10px;padding:.8rem 1rem;margin:.5rem 0;font-size:.83rem;border-left:3px solid var(--lp);line-height:1.65}
.tip-card strong{color:var(--ld)}
.alert-card{background:var(--err-bg);border:2px solid #EF5350;border-radius:10px;padding:.8rem 1rem;margin:.8rem 0}
.alert-card .atitle{font-family:'Fredoka',sans-serif;color:var(--err);font-size:.82rem;margin-bottom:.3rem}
.alert-card p{font-size:.82rem;color:var(--text-soft);line-height:1.65}

.viz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.8rem 0}
.viz-item{padding:.7rem .5rem;border-radius:10px;text-align:center;background:var(--card);border:1.5px solid var(--lm);font-size:.82rem}
.viz-item .ico{font-size:1.6rem;display:block;margin-bottom:.3rem}
.viz-item .lbl{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.95rem;display:block}
.viz-item .es{font-style:italic;color:var(--text-soft);font-size:.74rem;display:block;margin-top:2px}

.rule-grid{display:grid;grid-template-columns:1fr;gap:.5rem;margin:.8rem 0}
.rule-item{padding:.7rem 1rem;border-radius:10px;background:var(--card);border:1.5px solid var(--lm);display:flex;align-items:flex-start;gap:.7rem}
.rule-item .num{font-family:'Fredoka',sans-serif;background:var(--lp);color:#fff;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem}
.rule-item .info{flex:1;font-size:.85rem;line-height:1.6}
.rule-item .info strong{color:var(--ld);display:block;margin-bottom:2px}

.timeline{display:flex;align-items:center;justify-content:space-between;margin:1rem 0;padding:.8rem;background:var(--ll);border-radius:12px;border:1.5px solid var(--lm);gap:.4rem;flex-wrap:wrap}
.tl-point{flex:1;min-width:75px;text-align:center;padding:.5rem .3rem;background:#fff;border-radius:8px;border:2px solid var(--lm)}
.tl-point .ico{font-size:1.3rem;display:block}
.tl-point .lbl{font-family:'Fredoka',sans-serif;font-size:.78rem;color:var(--ld);margin-top:2px;display:block}
.tl-arrow{color:var(--lp);font-size:1.2rem;font-weight:700}

.ex-row{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .8rem;border-radius:10px;margin:.4rem 0;font-size:.88rem;transition:background .2s}
.ex-row:hover{background:var(--lglow)}
.ex-row .icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.ex-row .body{flex:1;min-width:0}
.ex-row .en{font-weight:700;color:var(--text);line-height:1.7;word-spacing:1px}
.ex-row .es{font-family:'Lora',serif;font-style:italic;font-size:.82rem;color:var(--text-soft);margin-top:3px;line-height:1.5}
.ex-right{border-left:3px solid var(--ok);background:var(--ok-bg)}
.ex-wrong{border-left:3px solid var(--err);background:var(--err-bg)}

.ex-section{margin-top:1.2rem;padding-top:1rem;border-top:2px dashed var(--lm)}
.ex-section h3{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.95rem;margin-bottom:.8rem}
.exercise{background:#fafafa;border-radius:12px;padding:1rem;margin-bottom:.7rem;border:2px solid #eee;transition:.2s}
.exercise.correct{border-color:var(--ok);background:var(--ok-bg)}
.exercise.incorrect{border-color:var(--err);background:var(--err-bg)}
.exercise-q{font-size:.9rem;margin-bottom:.7rem;line-height:1.55;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.opt-btn{padding:.7rem .55rem;border:2px solid #e0e0e0;border-radius:10px;background:var(--card);color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s;font-family:'Nunito',sans-serif;text-align:center;line-height:1.35}
.opt-btn:hover:not(:disabled){border-color:var(--lp);background:var(--ll)}
.opt-btn:disabled{cursor:not-allowed;opacity:.7}
.opt-btn.sel-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt-btn.sel-bad{background:var(--err);color:#fff;border-color:var(--err)}
.opt-btn.show-ok{background:var(--ok);color:#fff;border-color:var(--ok)}

.fb{margin-top:.7rem;padding:0;border-radius:12px;font-size:.82rem;display:none;line-height:1.6;overflow:hidden}
.fb.show{display:block;animation:fbSlide .35s ease}
@keyframes fbSlide{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:600px;transform:translateY(0)}}
.fb-header{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;font-family:'Fredoka',sans-serif;font-size:.88rem;font-weight:600}
.fb.fb-ok .fb-header{background:#C8E6C9;color:var(--ok)}
.fb.fb-bad .fb-header{background:#FFCDD2;color:var(--err)}
.fb-header .fb-icon{font-size:1.2rem}
.fb-body{padding:.8rem 1rem}
.fb.fb-ok .fb-body{background:var(--ok-bg)}
.fb.fb-bad .fb-body{background:var(--err-bg)}
.fb-row{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem}
.fb-row:last-child{margin-bottom:0}
.fb-row .fb-dot{font-size:.95rem;flex-shrink:0;margin-top:1px}
.fb-row .fb-text{flex:1;line-height:1.55}
.fb-row .fb-text strong{color:var(--text)}
.fb-correct-answer{color:var(--ok);font-weight:700}
.fb-wrong-reason{color:var(--err);font-weight:600}
.fb-example{display:inline-block;margin-top:.5rem;padding:5px 12px;border-radius:6px;font-size:.79rem;font-weight:700}
.fb.fb-ok .fb-example{background:#A5D6A7;color:#1B5E20}
.fb.fb-bad .fb-example{background:#EF9A9A;color:#B71C1C}
.fb-tip{margin-top:.5rem;padding:.5rem .75rem;border-radius:8px;background:var(--note-bg);border:1px solid var(--note-border);font-size:.78rem;color:#6D4C00;line-height:1.5}
.fb-tip strong{color:var(--ld)}

.score-bar{text-align:center;padding:.8rem;background:var(--ll);border-radius:10px;margin-top:.8rem;border:1px solid var(--lm)}
.score-bar .num{font-family:'Fredoka',sans-serif;font-size:1.4rem;color:var(--ld)}
.score-bar .lbl{font-size:.7rem;color:var(--lp);font-weight:700;text-transform:uppercase;letter-spacing:1px}

.summary-final{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.6rem;margin-top:1rem;box-shadow:var(--shadow);border-top:3.5px solid var(--ok);display:none}
.summary-final.show{display:block;animation:fadeIn .4s ease}
.summary-final h3{font-family:'Fredoka',sans-serif;color:var(--ok);margin-bottom:.6rem;font-size:1.15rem}
.summary-final ul{list-style:none}
.summary-final li{padding:5px 0 5px 22px;position:relative;font-size:.85rem;color:var(--text-soft);line-height:1.6}
.summary-final li:before{content:"\2713";position:absolute;left:0;color:var(--lp);font-weight:700;font-size:1rem}
.summary-final .total-score{margin-top:1rem;padding:.8rem;background:var(--ll);border-radius:10px;text-align:center;font-family:'Fredoka',sans-serif}
.summary-final .total-score .big{font-size:1.6rem;color:var(--ld)}
.summary-final .total-score .small{font-size:.8rem;color:var(--text-soft);font-weight:600}

@media(max-width:600px){
.level-header h1{font-size:1.4rem}
.card{padding:1.2rem}
.compare-grid,.viz-grid{grid-template-columns:1fr 1fr}
.timeline{flex-direction:column}
.tl-arrow{transform:rotate(90deg)}
.opts{grid-template-columns:1fr}
}

.why-box{background:#EDF7ED;border:1.5px solid #A5D6A7;border-left:4px solid var(--ok);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.83rem;line-height:1.6}.why-box .wt{font-family:'Fredoka',sans-serif;color:var(--ok);font-size:.8rem;display:block;margin-bottom:.2rem}.note-box{background:var(--note-bg);border:1.5px solid var(--note-border);border-left:4px solid var(--lp);border-radius:10px;padding:.7rem .9rem;margin:.7rem 0;font-size:.83rem;line-height:1.6}.note-box .nt{font-family:'Fredoka',sans-serif;color:var(--ld);font-size:.8rem;display:block;margin-bottom:.2rem}.illus{display:flex;justify-content:center;align-items:center;gap:.5rem;margin:.4rem 0 1rem;background:linear-gradient(135deg,#FFF9C4,#FFECB3);border:2px dashed var(--lm);border-radius:16px;padding:1rem}.illus .big{font-size:3.2rem;line-height:1}.illus .big.sm{font-size:2.4rem}.info-illus{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.8rem 1rem;margin:.6rem 0}.info-illus .emo{font-size:2.4rem;line-height:1;flex-shrink:0}.info-illus .txt{font-size:.85rem;line-height:1.55}.info-illus .txt b{color:var(--ld)}.eg-card{position:relative;display:flex;align-items:center;gap:.7rem;background:#E3F2FD;border:2px solid #64B5F6;border-radius:12px;padding:1rem .9rem .9rem;margin:.4rem 0 1.1rem}.eg-card .eg-emo{font-size:2.3rem;line-height:1;flex-shrink:0}.eg-card .eg-body .en{font-weight:800;color:#0D47A1;font-size:.95rem;line-height:1.4}.eg-card .eg-body .es{font-family:'Lora',serif;font-style:italic;color:#1565C0;font-size:.82rem;margin-top:3px}.eg-card::before{content:'\1F4DD EJEMPLO';position:absolute;top:-11px;left:14px;background:#1565C0;color:#fff;font-family:'Fredoka',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.06em;padding:2px 9px;border-radius:20px}.eg-card.ok{background:#E8F5E9;border-color:#81C784}.eg-card.ok .en{color:#1B5E20}.eg-card.ok .es{color:#2E7D32}.eg-card.ok::before{content:'\2705 BIEN';background:#2E7D32}.eg-card.bad{background:#FFEBEE;border-color:#EF9A9A}.eg-card.bad .en{color:#B71C1C}.eg-card.bad .es{color:#C62828}.eg-card.bad::before{content:'\274C MAL';background:#C62828}
.art-hero{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.8rem 0}.art-hero.three{grid-template-columns:1fr 1fr 1fr}.art-box{background:#fff;border:2px solid var(--lm);border-radius:16px;padding:1rem .9rem;text-align:center;box-shadow:0 2px 10px rgba(249,168,37,.10)}.art-box .word{font-family:'Fredoka',sans-serif;font-size:2.6rem;font-weight:700;color:var(--ld);line-height:1;background:linear-gradient(135deg,#FFF9C4,#FFE082);border-radius:12px;padding:.5rem 0;margin-bottom:.5rem}.art-box.eng .word{background:linear-gradient(135deg,#E3F2FD,#90CAF9);color:#0D47A1}.art-box .role{font-family:'Fredoka',sans-serif;font-size:.78rem;color:var(--lp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}.art-box.eng .role{color:#1976D2}.art-box .desc{font-size:.8rem;color:var(--text-soft);line-height:1.5}.vs-grid{margin:.8rem 0}.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:.5rem;margin:.55rem 0}.vs-side{border-radius:12px;padding:.7rem .8rem;font-size:.84rem;line-height:1.45}.vs-side .flag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.2rem;opacity:.85}.vs-side.es{background:var(--ll);border:1.5px solid var(--lm)}.vs-side.es .flag{color:var(--ld)}.vs-side.en{background:#E3F2FD;border:1.5px solid #90CAF9}.vs-side.en .flag{color:#1565C0}.vs-mid{display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--lp)}@media(max-width:600px){.art-hero,.art-hero.three{grid-template-columns:1fr}.vs-row{grid-template-columns:1fr;gap:.3rem}.vs-mid{transform:rotate(90deg);padding:.1rem 0}}</style>
</head>
<body>
<div class="container">
<div class="level-header">
<div class="level-badge">Pre-A1 · Nivel Básico</div>
<h1>Grammar Summary</h1>
<div class="module-name">👤 Adjetivos Posesivos</div>
<p class="subtitle">Decir de quién es algo · 5 pasos × 5 ejercicios</p>
</div>
<div class="step-tabs" id="stepTabs"></div>
<div id="cardArea"></div>
<div class="summary-final" id="summaryFinal">
<h3>🎓 Resumen del Tema</h3>
<ul id="summaryList"></ul>
<div class="total-score" id="totalScore"></div>
</div>
</div>
<script>
const ICON_PARTY="🎉";
const ICON_CHECK="✅";
const ICON_X="❌";
const ICON_BULB="💡";
const ICON_NOTE="📝";
const ICON_THINK="😕";
const DASH="—";
const TEXT_CORRECT="¡Correcto!";
const TEXT_INCORRECT="No es correcto";
const TEXT_OTHER_OPT="La otra opción";
const TEXT_CORRECT_IS="La respuesta correcta es";
const TEXT_REMEMBER="Recuerda";
const TEXT_SCORE="Puntuación";
const TEXT_TOTAL="Total del tema";
const EX_HEADER="✏️ Ejercicios —";

const DATA={"summary": ["<b>my</b> (mi) · <b>your</b> (tu) · <b>his</b> (de él) · <b>her</b> (de ella)", "<b>its</b> (de un animal/cosa, singular) · <b>our</b> (nuestro) · <b>their</b> (de ellos)", "<b>their</b> = de ellos: para varios dueños, personas, animales o cosas en plural", "Van ANTES del sustantivo: my dog (mi perro), their books (sus libros de ellos)", "his y her dependen del <b>DUEÑO</b>, no del objeto poseído", "El “su” del español se reparte: his, her, its, your, their"], "steps": [{"icon": "🇪🇸", "title": "Repaso en Español", "html": "<div class=\"section-label\">Paso 1</div><div class=\"section-title\">Paso 1: 🇪🇸 Repaso en Español</div><div class=\"illus\"><span class=\"big\">👤</span><span class=\"big\">🔑</span></div><div class=\"section-desc\">Un posesivo dice <b>DE QUIÉN</b> es algo y va <b>antes del sustantivo</b>: <b>mi</b> perro, <b>tu</b> casa, <b>su</b> libro.</div><div class=\"section-label\">Los posesivos en grande</div><div class=\"art-hero three\"><div class=\"art-box\"><div class=\"word\">Mi</div><div class=\"role\">De mí</div><div class=\"desc\">Lo uso para algo que me pertenece a mí: mi perro, mi casa, mi familia.</div></div><div class=\"art-box\"><div class=\"word\">Tu</div><div class=\"role\">De ti</div><div class=\"desc\">Lo uso para algo de la persona con quien hablo: tu libro, tu mamá.</div></div><div class=\"art-box\"><div class=\"word\">Su</div><div class=\"role\">De él / de ella</div><div class=\"desc\">Para una sola persona. Es ambiguo: puede ser de él o de ella. El contexto lo aclara.</div></div></div><div class=\"art-hero\"><div class=\"art-box\"><div class=\"word\">Su</div><div class=\"role\">De ellos / de ellas</div><div class=\"desc\">También significa “de ellos”: cuando hay VARIOS dueños, sean personas, animales o cosas.</div></div><div class=\"art-box\"><div class=\"word\">Nuestro</div><div class=\"role\">De nosotros</div><div class=\"desc\">Lo uso para algo que compartimos: nuestro pueblo, nuestra escuela.</div></div></div><div class=\"why-box\"><span class=\"wt\">💡 Mi truco personal</span>Antes de traducir “su” al inglés, me pregunto: ¿DE QUIÉN es? Si es de un hombre → his; de una mujer → her; de un animal/cosa → its; de varios (de ellos) → their. Así elijo bien.</div><div class=\"info-illus\"><span class=\"emo\">🐶</span><span class=\"txt\"><b>El posesivo va antes del sustantivo.</b> Igual que en inglés: posesivo + cosa.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🐶</span><div class=\"eg-body\"><div class=\"en\"><b>Mi</b> perro corre rápido.</div><div class=\"es\">El perro es mío; \"mi\" va antes de \"perro\".</div></div></div><div class=\"info-illus\"><span class=\"emo\">👥</span><span class=\"txt\"><b>“Su” también es “de ellos”.</b> Cuando hay varios dueños (personas, animales o cosas).</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👨‍👩‍👦</span><div class=\"eg-body\"><div class=\"en\"><b>Su</b> casa (de ellos) es grande.</div><div class=\"es\">La casa pertenece a varias personas → de ellos.</div></div></div><div class=\"info-illus\"><span class=\"emo\">👥</span><span class=\"txt\"><b>Nuestro = de nosotros.</b> Para algo que compartimos varios.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🏘️</span><div class=\"eg-body\"><div class=\"en\"><b>Nuestro</b> pueblo es bonito.</div><div class=\"es\">El pueblo es de nosotros (de un grupo que me incluye).</div></div></div><div class=\"why-box\"><span class=\"wt\">💡 ¿Por qué importa?</span>En español “su” cubre muchas personas, pero en inglés se separan: his, her, its, their, your. Entender de quién hablamos es la clave.</div>", "exercises": [{"q": "¿Qué expresa un posesivo?", "a": "b", "o": ["el lugar donde está algo", "de quién es algo"], "fc": "El posesivo indica posesión: de quién es la cosa.", "fi": "El lugar se expresa con preposiciones (en, cerca).", "ex": "mi perro → el perro es mío", "tip": "Posesivo = de quién es"}, {"q": "En \"Mi perro corre\", ¿dónde se coloca \"mi\"?", "a": "a", "o": ["antes del sustantivo", "después del sustantivo"], "fc": "El posesivo va antes: \"mi perro\".", "fi": "\"perro mi\" no es natural en español.", "ex": "mi perro → posesivo + sustantivo", "tip": "Posesivo primero, sustantivo después"}, {"q": "¿Por qué \"su\" puede ser confuso en español?", "a": "b", "o": ["solo sirve para una persona", "sirve para él, ella, ellos y usted"], "fc": "\"su\" cubre muchas personas a la vez, por eso es ambiguo.", "fi": "No se limita a una sola persona; puede ser de varios.", "ex": "su casa → ¿de él, de ella, de ellos?", "tip": "El inglés separa: his, her, their, your"}, {"q": "\"Nuestro\" indica que algo pertenece a:", "a": "b", "o": ["ellos", "nosotros"], "fc": "\"nuestro\" = de nosotros.", "fi": "\"de ellos\" sería otro posesivo distinto.", "ex": "nuestro pueblo → de nosotros", "tip": "nuestro = de nosotros (our)"}, {"q": "\"Tu libro está cerca\": ¿de quién es el libro?", "a": "a", "o": ["de la persona con quien hablo", "mío"], "fc": "\"tu\" se refiere a la persona con quien hablo.", "fi": "Lo mío sería \"mi libro\", no \"tu libro\".", "ex": "tu libro → de la persona con quien hablo", "tip": "tu = de ti (your)"}]}, {"icon": "🤝", "title": "Similitudes", "html": "<div class=\"section-label\">Paso 2</div><div class=\"section-title\">Paso 2: 🤝 Similitudes ESP ↔ ENG</div><div class=\"illus\"><span class=\"big\">🇪🇸</span><span class=\"big\">🤝</span><span class=\"big\">🇬🇧</span></div><div class=\"section-desc\">Los posesivos funcionan muy parecido en ambos idiomas: van antes del sustantivo y cada persona tiene el suyo.</div><table class=\"g-table\"><tr><th>Dueño</th><th>🇪🇸 Español</th><th>🇬🇧 English</th></tr><tr><td>yo</td><td>mi</td><td><span class=\"g-subj\">my</span></td></tr><tr><td>tú</td><td>tu</td><td><span class=\"g-subj\">your</span></td></tr><tr><td>él</td><td>su</td><td><span class=\"g-subj\">his</span></td></tr><tr><td>ella</td><td>su</td><td><span class=\"g-subj\">her</span></td></tr><tr><td>nosotros</td><td>nuestro</td><td><span class=\"g-subj\">our</span></td></tr></table><div class=\"info-illus\"><span class=\"emo\">🐶</span><span class=\"txt\"><b>my = mi.</b> Para algo mío. (dog = perro)</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🐶</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">My</span> dog is happy.</div><div class=\"es\">Mi perro está feliz. (happy = feliz)</div></div></div><div class=\"info-illus\"><span class=\"emo\">📖</span><span class=\"txt\"><b>her = su (de ella).</b> El dueño es una mujer. (book = libro)</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👩</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">Her</span> book is new.</div><div class=\"es\">Su libro (de ella) es nuevo. (new = nuevo)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🏫</span><span class=\"txt\"><b>our = nuestro.</b> Para algo de nosotros. (school = escuela)</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👥</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">Our</span> school is big.</div><div class=\"es\">Nuestra escuela es grande. (big = grande)</div></div></div><div class=\"why-box\"><span class=\"wt\">💡 ¿Por qué importa?</span>Como en español, el posesivo va <b>siempre antes</b> del sustantivo: my book = mi libro. Misma posición, solo cambian las palabras.</div>", "exercises": [{"q": "El estudiante nuevo se presenta: \"___ name is Tom.\" (name = nombre)", "a": "a", "o": ["My", "Your"], "fc": "El que habla se refiere a sí mismo → \"My name\" (mi nombre).", "fi": "\"Your\" sería del interlocutor (tu nombre).", "ex": "My name is Tom → Mi nombre es Tom", "tip": "Hablo de mí → my"}, {"q": "\"This is ___ school. We study here.\" (school = escuela, we = nosotros)", "a": "b", "o": ["their", "our"], "fc": "\"We\" → el posesivo es \"our\" (nuestra).", "fi": "\"their\" (de ellos) sería de otras personas.", "ex": "our school → nuestra escuela", "tip": "We → our (nuestro)"}, {"q": "¿Dónde va el posesivo en inglés? (book = libro)", "a": "b", "o": ["después del sustantivo", "antes del sustantivo"], "fc": "Antes, igual que en español: \"my book\" (mi libro).", "fi": "\"book my\" no existe en inglés.", "ex": "my book → posesivo + sustantivo", "tip": "Posesivo + sustantivo"}, {"q": "\"Is this ___ pencil? It belongs to you.\" (pencil = lápiz, belongs to you = te pertenece)", "a": "a", "o": ["your", "my"], "fc": "Pertenece a \"you\" → \"your pencil\" (tu lápiz).", "fi": "\"my\" sería del que habla (mi lápiz).", "ex": "your pencil → tu lápiz", "tip": "De ti → your"}, {"q": "\"Tom loves ___ dog.\" (loves = ama, dog = perro; el perro es de Tom)", "a": "a", "o": ["his", "her"], "fc": "Tom es hombre → \"his dog\" (su perro de él).", "fi": "\"her\" sería de una mujer, pero el dueño es Tom.", "ex": "his dog → su perro (de él)", "tip": "Dueño hombre → his"}]}, {"icon": "⚡", "title": "Diferencias", "html": "<div class=\"section-label\">Paso 3</div><div class=\"section-title\">Paso 3: ⚡ Diferencias Importantes</div><div class=\"illus\"><span class=\"big\">👨</span><span class=\"big\">↔️</span><span class=\"big\">👩</span></div><div class=\"section-desc\">La gran diferencia: el español usa un solo “su”, pero el inglés elige según el dueño. Compara lado a lado:</div><div class=\"section-label\">Comparación Español ↔ English</div><div class=\"vs-grid\"><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>su</b> (de él)<br>Su perro corre.</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span><b>his</b> (dueño hombre)<br>His dog runs.</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>su</b> (de ella)<br>Su perro corre.</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span><b>her</b> (dueña mujer)<br>Her dog runs.</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>su</b> (de ellos / ellas)<br>Su perro corre.</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span><b>their</b> (varios dueños)<br>Their dog runs.</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>su</b> de cosas/animales en plural<br>Los perros y su comida.</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span><b>their</b> también para plural de cosas/animales<br>The dogs and their food.</div></div><div class=\"vs-row\"><div class=\"vs-side es\"><span class=\"flag\">🇪🇸 Español</span><b>mis</b> libros (cambia a plural)</div><div class=\"vs-mid\">↔️</div><div class=\"vs-side en\"><span class=\"flag\">🇬🇧 English</span><b>my</b> books (no cambia)</div></div></div><div class=\"section-label\">Cada posesivo inglés, explicado</div><div class=\"art-hero three\"><div class=\"art-box eng\"><div class=\"word\">his</div><div class=\"role\">De él (hombre)</div><div class=\"desc\">Lo uso cuando el dueño es un hombre o un niño.</div></div><div class=\"art-box eng\"><div class=\"word\">her</div><div class=\"role\">De ella (mujer)</div><div class=\"desc\">Lo uso cuando la dueña es una mujer o una niña.</div></div><div class=\"art-box eng\"><div class=\"word\">its</div><div class=\"role\">De un animal/cosa (uno)</div><div class=\"desc\">Lo uso para algo de UN solo animal o UNA cosa (neutro, singular).</div></div></div><div class=\"art-hero\"><div class=\"art-box eng\"><div class=\"word\">their</div><div class=\"role\">De ellos / de ellas</div><div class=\"desc\">Lo uso cuando hay VARIOS dueños: personas, animales o cosas en plural (the dogs → their, the books → their).</div></div><div class=\"art-box eng\"><div class=\"word\">our</div><div class=\"role\">De nosotros</div><div class=\"desc\">Lo uso para algo que compartimos en grupo.</div></div></div><div class=\"info-illus\"><span class=\"emo\">👨</span><span class=\"txt\"><b>his</b> se usa cuando el dueño es <b>hombre</b>. (house = casa)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">👨</span><div class=\"eg-body\"><div class=\"en\">Tom cleans <span class=\"g-subj\">his</span> house.</div><div class=\"es\">Tom limpia su casa (de él). (cleans = limpia)</div></div></div><div class=\"eg-card bad\"><span class=\"eg-emo\">🚫</span><div class=\"eg-body\"><div class=\"en\">Tom cleans her house.</div><div class=\"es\">Incorrecto: el dueño es Tom (hombre), no \"her\".</div></div></div><div class=\"info-illus\"><span class=\"emo\">👩</span><span class=\"txt\"><b>her</b> se usa cuando la dueña es <b>mujer</b>. (cat = gato)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">👩</span><div class=\"eg-body\"><div class=\"en\">Sara feeds <span class=\"g-subj\">her</span> cat.</div><div class=\"es\">Sara alimenta a su gato (de ella). (feeds = alimenta)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🐱</span><span class=\"txt\"><b>its</b> se usa para <b>UN animal o UNA cosa</b> (singular). (tail = cola)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">🐶</span><div class=\"eg-body\"><div class=\"en\">The dog wags <span class=\"g-subj\">its</span> tail.</div><div class=\"es\">El perro mueve su cola. (wags = mueve)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🐕</span><span class=\"txt\"><b>their</b> = de ellos. También para <b>cosas o animales en plural</b>. (dogs = perros, food = comida)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">🐕</span><div class=\"eg-body\"><div class=\"en\">The dogs eat <span class=\"g-subj\">their</span> food.</div><div class=\"es\">Los perros comen su comida (de ellos). — varios animales → their.</div></div></div><div class=\"eg-card bad\"><span class=\"eg-emo\">🚫</span><div class=\"eg-body\"><div class=\"en\">The dogs eat its food.</div><div class=\"es\">Incorrecto: son varios perros (plural) → their, no its.</div></div></div><div class=\"alert-card\"><div class=\"atitle\">⭐ Caso especial: its vs it’s, y singular vs plural</div><p>🐱 <b>its</b> = de UN animal/cosa: The cat licks <b>its</b> paw (su pata).<br>🐕 <b>their</b> = de VARIOS (animales o cosas en plural): The cats lick <b>their</b> paws.<br>⚠️ <b>it’s</b> (con apóstrofo) = it is (es), NO es posesivo.</p></div><div class=\"info-illus\"><span class=\"emo\">🔀</span><span class=\"txt\"><b>El posesivo no cambia por número.</b> \"my\" es igual en singular y plural. (books = libros)</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">📚</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">my</span> book / <span class=\"g-subj\">my</span> books</div><div class=\"es\">mi libro / mis libros — \"my\" no cambia.</div></div></div>", "exercises": [{"q": "\"Sara feeds ___ cat.\" (feeds = alimenta, cat = gato; el gato es de Sara)", "a": "b", "o": ["his", "her"], "fc": "Sara es mujer → \"her cat\" (su gato de ella).", "fi": "\"his\" indicaría un dueño hombre.", "ex": "her cat → su gato (de ella)", "tip": "Dueña mujer → her"}, {"q": "\"The dog wags ___ tail.\" (wags = mueve, tail = cola; la cola es del perro)", "a": "b", "o": ["his", "its"], "fc": "Para un animal/cosa neutra → \"its tail\" (su cola).", "fi": "\"his\" se usa para personas masculinas.", "ex": "its tail → su cola (de un animal)", "tip": "Animal o cosa → its"}, {"q": "\"The dogs eat ___ food.\" (dogs = perros, eat = comen, food = comida; son varios perros)", "a": "a", "o": ["their", "its"], "fc": "Varios perros (plural) → \"their food\" (su comida de ellos).", "fi": "\"its\" es para UN solo animal; aquí hay varios perros.", "ex": "their food → su comida (de varios animales)", "tip": "Animales/cosas en PLURAL → their"}, {"q": "\"The students bring ___ notebooks.\" (bring = traen, notebooks = cuadernos; de los estudiantes)", "a": "b", "o": ["our", "their"], "fc": "Varios dueños (they) → \"their notebooks\".", "fi": "\"our\" (nuestro) sería de nosotros.", "ex": "their notebooks → sus cuadernos (de ellos)", "tip": "Varios dueños → their"}, {"q": "¿Cuántas palabras del inglés cubren el \"su\" del español?", "a": "a", "o": ["varias: his, her, its, their, your", "una sola para todo"], "fc": "El inglés reparte \"su\" según el dueño.", "fi": "No hay una única traducción de \"su\".", "ex": "his / her / its / their / your → todos pueden ser “su”", "tip": "“su” se reparte según el dueño"}]}, {"icon": "💡", "title": "Tips", "html": "<div class=\"section-label\">Paso 4</div><div class=\"section-title\">Paso 4: 💡 Tips Prácticos</div><div class=\"illus\"><span class=\"big sm\">💡</span><span class=\"big sm\">🧠</span></div><div class=\"section-desc\">Trucos para elegir el posesivo correcto. Cada tip viene seguido de su ejemplo.</div><div class=\"info-illus\"><span class=\"emo\">🔍</span><span class=\"txt\"><b>Tip 1:</b> Pregunta “¿DE QUIÉN es?”. Hombre → his, mujer → her, UN animal/cosa → its, VARIOS (de ellos) → their.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🐕</span><div class=\"eg-body\"><div class=\"en\">The dogs love <span class=\"g-subj\">their</span> home.</div><div class=\"es\">Los perros aman su hogar (de ellos). — varios animales → their. (home = hogar)</div></div></div><div class=\"info-illus\"><span class=\"emo\">🔀</span><span class=\"txt\"><b>Tip 2:</b> El posesivo no cambia por plural. \"my book\" → \"my books\".</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📚</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">My</span> books are here.</div><div class=\"es\">Mis libros están aquí. (no se dice \"mys\")</div></div></div><div class=\"info-illus\"><span class=\"emo\">🚫</span><span class=\"txt\"><b>Tip 3:</b> Nunca pongas artículo antes del posesivo. Di \"my book\", no \"the my book\".</span></div><div class=\"eg-card\"><span class=\"eg-emo\">📖</span><div class=\"eg-body\"><div class=\"en\"><span class=\"g-subj\">My</span> book is open.</div><div class=\"es\">Mi libro está abierto. (open = abierto)</div></div></div><div class=\"info-illus\"><span class=\"emo\">⚠️</span><span class=\"txt\"><b>Tip 4:</b> its = posesivo (su); it’s = it is (es). ¡No los confundas!</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🐱</span><div class=\"eg-body\"><div class=\"en\">The cat finds <span class=\"g-subj\">its</span> toy.</div><div class=\"es\">El gato encuentra su juguete. (toy = juguete)</div></div></div><div class=\"note-box\"><span class=\"nt\">⚠️ Error típico del hispanohablante</span>Como en español decimos “su” para todo, es fácil poner \"his\" cuando el dueño es mujer. Recuerda: la dueña mujer siempre lleva <b>her</b>.</div><div class=\"formula-box\"><span class=\"g-subj\">Posesivo</span> + sustantivo<br>my · your · his · her · its · our · their</div>", "exercises": [{"q": "\"Mr. Lee parks ___ car here.\" (parks = estaciona, car = auto; Mr. Lee es hombre)", "a": "a", "o": ["his", "her"], "fc": "Mr. Lee es hombre → \"his car\" (su auto de él).", "fi": "\"her\" sería de una mujer.", "ex": "his car → su auto (de él)", "tip": "Dueño hombre → his"}, {"q": "\"The bird builds ___ nest.\" (builds = construye, nest = nido; el nido es del pájaro)", "a": "b", "o": ["his", "its"], "fc": "Animal neutro → \"its nest\" (su nido).", "fi": "\"his\" se reserva para personas masculinas.", "ex": "its nest → su nido (de un animal)", "tip": "Animal o cosa → its"}, {"q": "\"We clean ___ classroom.\" (clean = limpiamos, classroom = salón; we = nosotros)", "a": "b", "o": ["their", "our"], "fc": "\"We\" → \"our classroom\" (nuestro salón).", "fi": "\"their\" (de ellos) sería de otros.", "ex": "our classroom → nuestro salón", "tip": "We → our"}, {"q": "¿Cuál es correcto? (book = libro)", "a": "a", "o": ["my book", "the my book"], "fc": "No se combina artículo + posesivo: solo \"my book\".", "fi": "\"the my book\" pone dos determinantes juntos (the + my).", "ex": "my book → sin artículo delante", "tip": "Nada de artículo antes del posesivo"}, {"q": "\"Anna and Sam love ___ new house.\" (love = aman, house = casa; son dos dueños)", "a": "a", "o": ["their", "his"], "fc": "Dos dueños → \"their house\" (su casa de ellos).", "fi": "\"his\" sería de un solo hombre.", "ex": "their house → su casa (de ellos)", "tip": "Varios dueños → their"}]}, {"icon": "🎯", "title": "Práctica Final", "html": "<div class=\"section-label\">Paso 5</div><div class=\"section-title\">Paso 5: 🎯 Práctica Final — Reto</div><div class=\"illus\"><span class=\"big\">🎯</span><span class=\"big\">🔥</span></div><div class=\"section-desc\">Junta todo: identifica al dueño (hombre, mujer, animal, varios) y elige el posesivo correcto.</div><div class=\"formula-box\">Identifica al <b>dueño</b> y elige:<br><span class=\"g-subj\">my · your · his · her · its · our · their</span></div><div class=\"info-illus\"><span class=\"emo\">👧🐱</span><span class=\"txt\"><b>Dos dueños distintos:</b> una persona (her) y un animal (its) en la misma frase.</span></div><div class=\"eg-card\"><span class=\"eg-emo\">👧</span><div class=\"eg-body\"><div class=\"en\">Mia loves <span class=\"g-subj\">her</span> cat, and it cleans <span class=\"g-subj\">its</span> fur.</div><div class=\"es\">Mia ama a su gata, y ella limpia su pelaje. (fur = pelaje)</div></div></div><div class=\"info-illus\"><span class=\"emo\">👨‍👩‍👧</span><span class=\"txt\"><b>Grupo que me incluye:</b> uso our (nuestro).</span></div><div class=\"eg-card\"><span class=\"eg-emo\">🏘️</span><div class=\"eg-body\"><div class=\"en\">My family and I love <span class=\"g-subj\">our</span> town.</div><div class=\"es\">Mi familia y yo amamos nuestro pueblo. (town = pueblo)</div></div></div><div class=\"info-illus\"><span class=\"emo\">⚠️</span><span class=\"txt\"><b>its vs it’s:</b> el posesivo correcto es \"its\" (sin apóstrofo).</span></div><div class=\"eg-card ok\"><span class=\"eg-emo\">🐶</span><div class=\"eg-body\"><div class=\"en\">The dog eats <span class=\"g-subj\">its</span> food.</div><div class=\"es\">El perro come su comida. (food = comida)</div></div></div><div class=\"alert-card\"><div class=\"atitle\">⚠️ Errores Comunes</div><p>❌ \"The dog eats it’s food\" → ✅ \"eats <b>its</b> food\" (posesivo, sin apóstrofo)<br>❌ \"Sara and Tom love his house\" → ✅ \"love <b>their</b> house\" (varios dueños)<br>❌ \"the her book\" → ✅ \"<b>her</b> book\" (sin artículo)</p></div>", "exercises": [{"q": "\"Tom and Ana walk ___ dog.\" (walk = pasean, dog = perro; dos dueños)", "a": "b", "o": ["his", "their"], "fc": "Dos dueños → \"their dog\" (su perro de ellos).", "fi": "\"his\" sería de un solo hombre.", "ex": "their dog → su perro (de ellos)", "tip": "Varios dueños → their"}, {"q": "\"My brother helps ___ mother.\" (brother = hermano, helps = ayuda, mother = madre; la madre de él)", "a": "a", "o": ["his", "her"], "fc": "La madre es del hermano (hombre) → \"his mother\".", "fi": "\"her\" indicaría una dueña mujer.", "ex": "his mother → su madre (de él)", "tip": "Dueño hombre → his"}, {"q": "\"We respect ___ teacher, Mr. Diaz.\" (respect = respetamos, teacher = profesor)", "a": "a", "o": ["our", "their"], "fc": "\"We\" → \"our teacher\" (nuestro profesor).", "fi": "\"their\" implicaría que el profesor es de otras personas.", "ex": "our teacher → nuestro profesor", "tip": "We → our"}, {"q": "¿Cuál frase es totalmente correcta? (paw = pata, toy = juguete)", "a": "b", "o": ["The cat licks it’s paw and finds it’s toy.", "The cat licks its paw and finds its toy."], "fc": "\"its\" (sin apóstrofo) es el posesivo correcto.", "fi": "\"it’s\" significa \"it is\" (es), no posesión.", "ex": "its paw / its toy → su pata / su juguete", "tip": "it’s = it is · its = posesivo"}, {"q": "\"She feeds ___ bird, and the bird sings in ___ cage.\" (bird = pájaro, cage = jaula)", "a": "a", "o": ["her / its", "its / her"], "fc": "El pájaro es de ella (her bird); la jaula es del pájaro (its cage).", "fi": "El orden está invertido: dueña del pájaro = ella; jaula = del pájaro.", "ex": "her bird / its cage → su pájaro / su jaula", "tip": "Cada posesivo concuerda con su dueño"}]}]};

let curStep=0;const scores={};const answered={};

function renderStepTabs(){
var c=document.getElementById("stepTabs");c.innerHTML="";
DATA.steps.forEach(function(s,i){
var b=document.createElement("button");
b.className="step-tab"+(i===curStep?" active":"");
if(allAnswered(i)&&i!==curStep)b.classList.add("done");
b.textContent=(i+1)+". "+s.icon+" "+s.title;
b.addEventListener("click",function(){curStep=i;renderStepTabs();renderCard();document.getElementById("summaryFinal").classList.remove("show")});
c.appendChild(b);
});
}

function allAnswered(stepIdx){
for(var i=0;i<5;i++){if(!answered["s"+stepIdx+"e"+i])return false}
return true;
}

function renderCard(){
var s=DATA.steps[curStep];
var k="s"+curStep;
if(scores[k]===undefined)scores[k]=0;
var area=document.getElementById("cardArea");
area.innerHTML="";

var card=document.createElement("div");
card.className="card active";
card.innerHTML=s.html;

var exSec=document.createElement("div");
exSec.className="ex-section";
var h3=document.createElement("h3");
h3.textContent=EX_HEADER+" "+s.title;
exSec.appendChild(h3);

s.exercises.forEach(function(e,i){
var eid=k+"e"+i;
var div=document.createElement("div");
div.className="exercise";
div.id=eid;

var qDiv=document.createElement("div");
qDiv.className="exercise-q";
qDiv.innerHTML=(i+1)+". "+e.q;
div.appendChild(qDiv);

var opts=document.createElement("div");
opts.className="opts";
var btnA=document.createElement("button");
btnA.className="opt-btn";
btnA.textContent="a) "+e.o[0];
btnA.addEventListener("click",function(){chk(eid,"a",e.a)});
opts.appendChild(btnA);
var btnB=document.createElement("button");
btnB.className="opt-btn";
btnB.textContent="b) "+e.o[1];
btnB.addEventListener("click",function(){chk(eid,"b",e.a)});
opts.appendChild(btnB);
div.appendChild(opts);

var fbOk=document.createElement("div");
fbOk.className="fb fb-ok";
fbOk.id="fbok-"+eid;
var correctText=e.o[e.a==="a"?0:1];
var fbOkParts=[];
fbOkParts.push("<div class=\"fb-header\"><span class=\"fb-icon\">"+ICON_PARTY+"</span> "+TEXT_CORRECT+"</div>");
fbOkParts.push("<div class=\"fb-body\">");
fbOkParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_CHECK+"</span><div class=\"fb-text\"><span class=\"fb-correct-answer\">"+correctText+"</span> "+DASH+" "+e.fc+"</div></div>");
fbOkParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_BULB+"</span><div class=\"fb-text\">"+TEXT_OTHER_OPT+": "+e.fi+"</div></div>");
if(e.ex)fbOkParts.push("<div class=\"fb-example\">"+ICON_NOTE+" "+e.ex+"</div>");
if(e.tip)fbOkParts.push("<div class=\"fb-tip\"><strong>"+ICON_BULB+" "+TEXT_REMEMBER+":</strong> "+e.tip+"</div>");
fbOkParts.push("</div>");
fbOk.innerHTML=fbOkParts.join("");
div.appendChild(fbOk);

var fbBad=document.createElement("div");
fbBad.className="fb fb-bad";
fbBad.id="fbbad-"+eid;
var fbBadParts=[];
fbBadParts.push("<div class=\"fb-header\"><span class=\"fb-icon\">"+ICON_THINK+"</span> "+TEXT_INCORRECT+"</div>");
fbBadParts.push("<div class=\"fb-body\">");
fbBadParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_X+"</span><div class=\"fb-text\"><span class=\"fb-wrong-reason\">"+e.fi+"</span></div></div>");
fbBadParts.push("<div class=\"fb-row\"><span class=\"fb-dot\">"+ICON_CHECK+"</span><div class=\"fb-text\">"+TEXT_CORRECT_IS+" <span class=\"fb-correct-answer\">"+correctText+"</span> "+DASH+" "+e.fc+"</div></div>");
if(e.ex)fbBadParts.push("<div class=\"fb-example\">"+ICON_NOTE+" "+e.ex+"</div>");
if(e.tip)fbBadParts.push("<div class=\"fb-tip\"><strong>"+ICON_BULB+" "+TEXT_REMEMBER+":</strong> "+e.tip+"</div>");
fbBadParts.push("</div>");
fbBad.innerHTML=fbBadParts.join("");
div.appendChild(fbBad);

exSec.appendChild(div);

if(answered[eid]){
var btns=div.querySelectorAll(".opt-btn");
btns.forEach(function(b){b.disabled=true});
var sel=answered[eid].sel;
var correct=e.a;
if(sel===correct){
div.classList.add("correct");
btns.forEach(function(b){if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-ok")});
fbOk.classList.add("show");
}else{
div.classList.add("incorrect");
btns.forEach(function(b){
if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-bad");
if(b.textContent.indexOf(correct+")")===0)b.classList.add("show-ok");
});
fbBad.classList.add("show");
}
}
});

var sb=document.createElement("div");
sb.className="score-bar";
sb.innerHTML="<div class=\"num\" id=\"sc-"+k+"\">"+scores[k]+"/5</div><div class=\"lbl\">"+TEXT_SCORE+"</div>";
exSec.appendChild(sb);

card.appendChild(exSec);
area.appendChild(card);
}

function chk(eid,sel,correct){
if(answered[eid])return;
answered[eid]={sel:sel};
var ex=document.getElementById(eid);
var btns=ex.querySelectorAll(".opt-btn");
btns.forEach(function(b){b.disabled=true});
var k=eid.match(/s\d+/)[0];
if(sel===correct){
ex.classList.add("correct");
btns.forEach(function(b){if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-ok")});
document.getElementById("fbok-"+eid).classList.add("show");
scores[k]=(scores[k]||0)+1;
}else{
ex.classList.add("incorrect");
btns.forEach(function(b){
if(b.textContent.indexOf(sel+")")===0)b.classList.add("sel-bad");
if(b.textContent.indexOf(correct+")")===0)b.classList.add("show-ok");
});
document.getElementById("fbbad-"+eid).classList.add("show");
}
document.getElementById("sc-"+k).textContent=scores[k]+"/5";

if(allAnswered(curStep)){
renderStepTabs();
}

if(curStep===4&&allAnswered(4)){
setTimeout(function(){
var sf=document.getElementById("summaryFinal");
var sl=document.getElementById("summaryList");
sl.innerHTML=DATA.summary.map(function(s){return "<li>"+s+"</li>"}).join("");
var total=0;
for(var i=0;i<5;i++)total+=(scores["s"+i]||0);
var ts=document.getElementById("totalScore");
if(ts)ts.innerHTML="<div class=\"big\">"+total+"/25</div><div class=\"small\">"+TEXT_TOTAL+"</div>";
sf.classList.add("show");
sf.scrollIntoView({behavior:"smooth"});
},500);
}
}

renderStepTabs();renderCard();


</script>
</body>
</html>
