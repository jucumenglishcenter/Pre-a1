    <style>
        :root {

        .compare-text { font-size:0.95rem; color:var(--text-dark); line-height:1.5; }

        .fb-error { background:var(--error-light); }
        .fb-error .fb-block-title { color:var(--error-dark); }
        .error-badge { display:inline-block; background:var(--error); color:white; padding:0.2rem 0.6rem; border-radius:6px; font-size:0.75rem; font-weight:700; }
        .word-swap { display:flex; align-items:center; justify-content:center; gap:0.75rem; margin:0.6rem 0; flex-wrap:wrap; }
        .ws-box { padding:0.4rem 1rem; border-radius:8px; font-weight:700; font-size:1rem; }
        .ws-wrong { background:white; color:var(--error); border:2px solid var(--error); text-decoration:line-through; }
        .ws-arrow { font-size:1.3rem; color:var(--text-medium); }
        .ws-right { background:var(--success); color:white; }
        .error-text { font-size:0.88rem; color:var(--error-dark); line-height:1.5; }
        .fb-why { background:#F0FDF4; border:1px solid #BBF7D0; }

        .nav-buttons { display:flex; gap:0.75rem; margin-top:1.25rem; }

        .results-screen { display:none; text-align:center; padding:2rem 1.5rem; }

        .results-emoji { font-size:4rem; margin-bottom:1rem; }
        .results-title { font-family:'Fredoka',sans-serif; font-size:2rem; margin-bottom:0.5rem; }

        .results-message { font-size:1.05rem; color:var(--text-medium); margin-bottom:1.5rem; }
        .stars-container { display:flex; justify-content:center; gap:0.5rem; margin:1.5rem 0; }
        .star { font-size:2.5rem; opacity:.3; transition:all .5s ease; }

        .results-buttons { display:flex; flex-direction:column; gap:1rem; margin-top:2rem; }
        .result-btn { padding:1rem 2rem; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:0.5rem; transition:all .2s; }
        .result-btn.primary { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:white; }
        .result-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-soft); }
        .q-label { font-size:0.88rem; color:var(--text-medium); font-weight:600; }
        .sentence-options { display:flex; flex-direction:column; gap:0.7rem; margin-bottom:0.5rem; }
        .sent-option { border:2.5px solid #E5E7EB; border-radius:14px; padding:1rem 1.1rem; cursor:pointer; transition:all .2s; background:white; text-align:left; font-family:'Nunito',sans-serif; display:flex; gap:0.75rem; align-items:flex-start; width:100%; }
        .sent-option:hover:not(.disabled) { border-color:var(--primary); background:var(--bg-gradient-start); transform:translateX(4px); }
        .sent-option.disabled { cursor:default; }
        .sent-option.correct { border-color:var(--success); background:var(--success-light); }
        .sent-option.incorrect { border-color:var(--error); background:var(--error-light); }
        .option-letter { width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.8rem; flex-shrink:0; font-family:'Fredoka',sans-serif; }
        .sent-option.correct .option-letter { background:var(--success); color:white; }
        .sent-option.incorrect .option-letter { background:var(--error); color:white; }
        .option-text { font-size:0.97rem; color:var(--text-dark); line-height:1.5; font-weight:600; flex:1; }
        .option-status { font-size:1.1rem; flex-shrink:0; display:none; }
        .sent-option.disabled .option-status { display:block; }
        .error-highlight { color:var(--error); font-weight:800; text-decoration:underline wavy; }
        .correct-highlight { color:var(--success-dark); font-weight:800; }
    </style>

    <script>
    const quizData = [{"badge":"1️⃣ una persona","options":[{"text":"I was ill last week.","correct":true,"es":"Estuve enfermo la semana pasada."},{"text":"I were ill last week.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Forma equivocada","explanation":"Esa forma es para varios (you, we, they); el sujeto aquí es una sola persona.","es":"Estuve enfermo la semana pasada (forma para varios)."},{"text":"I am ill last week.","correct":false,"errorWord":"am","correctWord":"was","errorType":"Presente con señal de pasado","explanation":"«Last week» habla del pasado: el presente no encaja.","es":"Estoy enfermo la semana pasada (tiempos mezclados)."}],"clue":"last week + I","clueExplain":"la señal habla del pasado y el sujeto es una sola persona.","correctReason":"El sujeto es uno solo y la oración habla de la semana pasada.","hint":"Mira la señal de tiempo y pregúntate: ¿el sujeto es uno o son varios?"},{"badge":"👥 you","options":[{"text":"You were at home.","correct":true,"es":"Tú estabas en casa."},{"text":"You was at home.","correct":false,"errorWord":"was","correctWord":"were","errorType":"Forma equivocada","explanation":"Esa forma es para un solo sujeto (I, he, she, it); con «you» no se usa.","es":"Tú estabas en casa (forma equivocada)."},{"text":"You is at home.","correct":false,"errorWord":"is","correctWord":"were","errorType":"Presente y forma equivocada","explanation":"Es presente y además esa forma nunca acompaña a «you».","es":"Tú está en casa (presente y forma equivocada)."}],"clue":"you","clueExplain":"este sujeto usa SIEMPRE la misma forma del pasado, sea una persona o varias.","correctReason":"Con «you» se usa la forma del pasado que también usan we y they.","hint":"¿Qué forma del pasado acompaña siempre a «you»? Recuérdala antes de elegir."},{"badge":"1️⃣ una mascota","options":[{"text":"Coco was very small.","correct":true,"es":"Coco era muy pequeño."},{"text":"Coco were very small.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Forma equivocada","explanation":"Esa forma es para varios; Coco es uno solo.","es":"Coco era muy pequeño (forma para varios)."},{"text":"Coco are very small.","correct":false,"errorWord":"are","correctWord":"was","errorType":"Presente y forma equivocada","explanation":"La historia cuenta cómo ERA Coco antes: va en pasado, y esa forma es de varios.","es":"Coco son muy pequeño (presente de varios)."}],"clue":"Coco = uno","clueExplain":"un solo perrito usa la forma del pasado para una persona o cosa.","correctReason":"Coco es UNO (como he/it) y la oración describe el pasado.","hint":"Coco es UNO solo. ¿Qué forma del pasado le toca a un solo perrito?"},{"badge":"👥 varias cosas","options":[{"text":"His ears were soft.","correct":true,"es":"Sus orejas eran suaves."},{"text":"His ears was soft.","correct":false,"errorWord":"was","correctWord":"were","errorType":"Forma equivocada","explanation":"Esa forma es para uno solo; las orejas son dos (they).","es":"Sus orejas eran suaves (forma para uno)."},{"text":"His ears is soft.","correct":false,"errorWord":"is","correctWord":"were","errorType":"Presente y forma equivocada","explanation":"Es presente y de un solo sujeto; aquí son varias cosas en el pasado.","es":"Sus orejas es suave (presente de uno)."}],"clue":"ears = varias","clueExplain":"dos orejas son «they»: usan la forma del pasado para varios.","correctReason":"El sujeto son DOS orejas: la forma del pasado para varios.","hint":"El sujeto son DOS orejas. ¿Forma de uno o de varios? ¿Presente o pasado?"},{"badge":"1️⃣ una cosa","options":[{"text":"The water was very cold.","correct":true,"es":"El agua estaba muy fría."},{"text":"The water were very cold.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Forma equivocada","explanation":"«The water» es una sola cosa (it): no usa la forma de varios.","es":"El agua estaba muy fría (forma para varios)."},{"text":"The water are very cold.","correct":false,"errorWord":"are","correctWord":"was","errorType":"Presente y forma equivocada","explanation":"Es presente y de varios; aquí es una cosa en el pasado.","es":"El agua están muy fría (presente de varios)."}],"clue":"the water = it","clueExplain":"una sola cosa usa la forma del pasado de it.","correctReason":"«The water» es UNA cosa y la historia la describe en pasado.","hint":"«The water» es una sola cosa (it). Piensa qué forma del pasado le corresponde."},{"badge":"👥 we","options":[{"text":"We were so happy.","correct":true,"es":"Estábamos muy felices."},{"text":"We was so happy.","correct":false,"errorWord":"was","correctWord":"were","errorType":"Forma equivocada","explanation":"Esa forma es para uno solo; «we» somos varios.","es":"Estábamos muy felices (forma para uno)."},{"text":"We is so happy.","correct":false,"errorWord":"is","correctWord":"were","errorType":"Presente y forma equivocada","explanation":"Es presente y de un solo sujeto; «we» somos varios y ya pasó.","es":"Nosotros está muy feliz (presente de uno)."}],"clue":"we = varios","clueExplain":"«we» siempre usa la forma del pasado para varios.","correctReason":"«We» somos varios: lleva la forma del pasado para varios.","hint":"«We» somos varios. Revisa cuál opción usa la forma del pasado que les toca."},{"badge":"👥 varias cosas","options":[{"text":"My eyes were tired.","correct":true,"es":"Mis ojos estaban cansados."},{"text":"My eyes was tired.","correct":false,"errorWord":"was","correctWord":"were","errorType":"Forma equivocada","explanation":"Los ojos son dos (they): no usan la forma de uno solo.","es":"Mis ojos estaban cansados (forma para uno)."},{"text":"My eyes be tired.","correct":false,"errorWord":"be","correctWord":"were","errorType":"Verbo sin conjugar","explanation":"«be» es la forma base del verbo: aquí va conjugado en pasado.","es":"Mis ojos estar cansados (verbo sin conjugar)."}],"clue":"eyes = dos","clueExplain":"dos ojos son «they»: forma del pasado para varios.","correctReason":"Dos ojos = varios: la forma del pasado correcta para they.","hint":"Los ojos son dos. Y ojo: una opción dejó el verbo sin conjugar."},{"badge":"🚫 negativo","options":[{"text":"He was not hungry.","correct":true,"es":"Él no tenía hambre."},{"text":"He were not hungry.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Forma equivocada","explanation":"«He» es uno solo: no usa la forma de varios.","es":"Él no tenía hambre (forma para varios)."},{"text":"He not was hungry.","correct":false,"errorWord":"not was","correctWord":"was not","errorType":"Orden del negativo","explanation":"El «not» va DESPUÉS de la forma del verbo, no antes.","es":"Él no tenía hambre (not en el lugar equivocado)."}],"clue":"negativo","clueExplain":"el «not» se coloca después del verbo en pasado.","correctReason":"La forma correcta para «he» + el «not» en su lugar: después del verbo.","hint":"Dos cosas: la forma que le toca a «he» y el LUGAR donde va el «not»."},{"badge":"🚫 negativo","options":[{"text":"It was not a good day.","correct":true,"es":"No fue un buen día."},{"text":"It not was a good day.","correct":false,"errorWord":"not was","correctWord":"was not","errorType":"Orden del negativo","explanation":"El «not» va después del verbo, nunca antes.","es":"No fue un buen día (not en el lugar equivocado)."},{"text":"It were not a good day.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Forma equivocada","explanation":"«It» es una sola cosa: no usa la forma de varios.","es":"No fue un buen día (forma para varios)."}],"clue":"negativo","clueExplain":"primero el verbo en pasado y después el «not».","correctReason":"«It» lleva su forma de uno y el «not» va después del verbo.","hint":"Fíjate en el orden de las palabras y en la forma que le toca a «it»."},{"badge":"❓ pregunta","options":[{"text":"Were you ill yesterday?","correct":true,"es":"¿Estuviste enfermo ayer?"},{"text":"Was you ill yesterday?","correct":false,"errorWord":"Was","correctWord":"Were","errorType":"Forma equivocada","explanation":"Con «you» nunca se usa esa forma, ni en preguntas.","es":"¿Estuviste enfermo ayer? (forma equivocada)."},{"text":"You were ill yesterday?","correct":false,"errorWord":"You were","correctWord":"Were you","errorType":"Orden de pregunta","explanation":"En las preguntas, el verbo va PRIMERO y el sujeto después.","es":"Tú estuviste enfermo ayer? (orden de oración normal)."}],"clue":"pregunta","clueExplain":"en las preguntas el verbo del pasado se adelanta al sujeto.","correctReason":"El verbo va primero (es pregunta) y es la forma que acompaña a «you».","hint":"Es una pregunta: ¿qué palabra debe ir primero? ¿Y cuál forma acompaña a «you»?"},{"badge":"❓ pregunta","options":[{"text":"Where were you?","correct":true,"es":"¿Dónde estabas?"},{"text":"Where was you?","correct":false,"errorWord":"was","correctWord":"were","errorType":"Forma equivocada","explanation":"Con «you» no se usa esa forma, tampoco después de Where.","es":"¿Dónde estabas? (forma equivocada)."},{"text":"Where you were?","correct":false,"errorWord":"you were","correctWord":"were you","errorType":"Orden de pregunta","explanation":"Después de la palabra de pregunta, el verbo va antes del sujeto.","es":"¿Dónde tú estabas? (orden de oración normal)."}],"clue":"Where + pregunta","clueExplain":"tras la palabra de pregunta, el verbo se adelanta al sujeto.","correctReason":"Tiene el orden de pregunta y la forma que acompaña a «you».","hint":"En las preguntas en inglés el orden cambia. ¿Cuál opción lo respeta?"},{"badge":"🔎 there was","options":[{"text":"There was one green apple.","correct":true,"es":"Había una manzana verde."},{"text":"There were one green apple.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Concordancia con there","explanation":"Una sola manzana: se usa la forma de una cosa.","es":"Había una manzana verde (forma para varias)."},{"text":"There be one green apple.","correct":false,"errorWord":"be","correctWord":"was","errorType":"Verbo sin conjugar","explanation":"«be» es la forma base: aquí va conjugada en pasado.","es":"Haber una manzana verde (verbo sin conjugar)."}],"clue":"one apple","clueExplain":"con UNA sola cosa, «había» usa la forma de uno.","correctReason":"Es una sola manzana: la forma de una cosa en pasado.","hint":"¿Cuántas manzanas hay? Eso decide la forma. Una opción ni siquiera conjugó el verbo."},{"badge":"🔎 there were","options":[{"text":"There were five small seeds.","correct":true,"es":"Había cinco semillitas."},{"text":"There was five small seeds.","correct":false,"errorWord":"was","correctWord":"were","errorType":"Concordancia con there","explanation":"Son cinco semillas (varias): se usa la forma de varios.","es":"Había cinco semillitas (forma para una)."},{"text":"There are five small seeds yesterday.","correct":false,"errorWord":"are","correctWord":"were","errorType":"Presente con señal de pasado","explanation":"«Yesterday» pide pasado: el presente no encaja.","es":"Hay cinco semillitas ayer (tiempos mezclados)."}],"clue":"five seeds","clueExplain":"con VARIAS cosas, «había» usa la forma de varios.","correctReason":"Son cinco semillas (varias) y la oración habla del pasado.","hint":"Cuenta las semillas y busca la señal de tiempo."},{"badge":"👥 varias personas","options":[{"text":"My friends were there.","correct":true,"es":"Mis amigos estaban allí."},{"text":"My friends was there.","correct":false,"errorWord":"was","correctWord":"were","errorType":"Forma equivocada","explanation":"«Friends» son varios: no usan la forma de uno solo.","es":"Mis amigos estaban allí (forma para uno)."},{"text":"My friends is there.","correct":false,"errorWord":"is","correctWord":"were","errorType":"Presente y forma equivocada","explanation":"Es presente y de uno solo; aquí son varios en el pasado.","es":"Mis amigos está allí (presente de uno)."}],"clue":"friends = varios","clueExplain":"varios amigos usan la forma del pasado para varios.","correctReason":"«Friends» son varios y la historia ya pasó.","hint":"«Friends» termina en -s: son varios. ¿Y hablamos del presente o del pasado?"},{"badge":"1️⃣ una cosa","options":[{"text":"The soup was hot.","correct":true,"es":"La sopa estaba caliente."},{"text":"The soup were hot.","correct":false,"errorWord":"were","correctWord":"was","errorType":"Forma equivocada","explanation":"«The soup» es una sola cosa: no usa la forma de varios.","es":"La sopa estaba caliente (forma para varias)."},{"text":"The soup is hot yesterday.","correct":false,"errorWord":"is","correctWord":"was","errorType":"Presente con señal de pasado","explanation":"«Yesterday» habla de ayer: el presente no encaja.","es":"La sopa está caliente ayer (tiempos mezclados)."}],"clue":"the soup = it","clueExplain":"una sola cosa usa la forma del pasado de it.","correctReason":"«The soup» es UNA cosa y se describe en pasado.","hint":"«The soup» es una sola cosa. Y cuidado con mezclar presente y ayer."}];
    let currentQuestion=0, score=0;
    let answered=new Array(quizData.length).fill(false);

    function initQuiz(){
        const c=document.getElementById('questionsContainer'); c.innerHTML='';
        quizData.forEach((q,i)=>{ q.shuffled=shuffle(q.options); c.appendChild(card(q,i)); });
        showQuestion(0); updateProgress();
    }
    function card(q,index){
        const d=document.createElement('div'); const L=['A','B','C'];
        d.className='question-card'+(index!==0?' hidden':''); d.id='question-'+index;
        const opts=q.shuffled.map((opt,oi)=>`
            <button class="sent-option" data-idx="${oi}" onclick="selectOption(${index},${oi})">
                <div class="option-letter">${L[oi]}</div>
                <div class="option-text" id="opttext-${index}-${oi}">${opt.text}</div>
                <div class="option-status"></div>
            </button>`).join('');
        const transRows=q.shuffled.map((opt,oi)=>`<div style="margin-bottom:0.3rem;"><strong>${L[oi]}.</strong> ${opt.es||''}</div>`).join('');
        d.innerHTML=`
            <div class="q-header">
                <div class="question-number">${index+1}</div>
                <span class="q-label">Elige la oración correcta:</span>
                <span class="topic-badge">${q.badge}</span>
            </div>
            <div class="toggle-row">
                <button class="toggle-btn" id="hintbtn-${index}" onclick="toggleHint(${index})">💡 Ver pista</button>
                <button class="toggle-btn" id="transbtn-${index}" onclick="toggleTrans(${index})">Ver en español</button>
            </div>
            <div class="hint-box" id="hint-${index}"><div class="hint-label">💡 Pista</div>${q.hint}</div>
            <div class="translation" id="trans-${index}">🇪🇸 Compara el sentido de cada opción:<br>${transRows||'(traducción no disponible)'}</div>
            <div class="sentence-options" id="options-${index}">${opts}</div>
            <div class="feedback" id="feedback-${index}"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" onclick="prevQuestion()" ${index===0?'disabled':''}>← Anterior</button>
                <button class="nav-btn next" id="next-${index}" onclick="nextQuestion(${index})" disabled>${index===quizData.length-1?'Ver Resultados 🎉':'Siguiente →'}</button>
            </div>`;
        return d;
    }
    function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function selectOption(qi,oi){
        if(answered[qi])return; answered[qi]=true;
        const q=quizData[qi]; const sel=q.shuffled[oi]; const ok=sel.correct;
        const correctOpt=q.shuffled.find(o=>o.correct); if(ok)score++;
        document.querySelectorAll('#options-'+qi+' .sent-option').forEach((b,i)=>{
            b.classList.add('disabled'); const o=q.shuffled[i];
            const st=b.querySelector('.option-status');
            if(o.correct){ b.classList.add('correct'); st.textContent='✅'; }
            else if(i===oi){ b.classList.add('incorrect'); st.textContent='❌'; }
            else { st.textContent=''; }
            const tx=document.getElementById('opttext-'+qi+'-'+i);
            if(o.correct){ tx.innerHTML=o.text; }
            else { tx.innerHTML=o.text.replace(new RegExp('\\b'+escReg(o.errorWord)+'\\b'),'<span class="error-highlight">'+o.errorWord+'</span>'); }
        });
        feedback(qi,sel,ok,correctOpt,q);
        document.getElementById('next-'+qi).disabled=false; updateProgress();
    }
    function feedback(qi,sel,ok,correctOpt,q){
        const el=document.getElementById('feedback-'+qi);
        el.className='feedback show '+(ok?'correct':'incorrect');
        const errs=q.shuffled.filter(o=>!o.correct);
        const errBlocks=errs.map(e=>`
            <div class="fb-block fb-error"><div class="fb-block-title">⚠️ Error: <span class="error-badge">${e.errorType}</span></div>
                <div class="word-swap"><span class="ws-box ws-wrong">${e.errorWord}</span><span class="ws-arrow">→</span><span class="ws-box ws-right">${e.correctWord}</span></div>
                <div class="error-text">${e.explanation}</div></div>`).join('');
        if(ok){
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">✅</span><div><div class="fb-title">¡Correcto!</div><div class="fb-subtitle">Veamos por qué las otras estaban mal</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag">${q.clue}</span> ${q.clueExplain}</div></div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        } else {
            el.innerHTML=`
                <div class="fb-header"><span class="fb-icon">❌</span><div><div class="fb-title">Incorrecto</div><div class="fb-subtitle">Revisemos juntos</div></div></div>
                <div class="fb-body">
                    <div class="fb-block fb-signal wrong"><div class="fb-block-title">🔍 La señal clave</div><div class="fb-text"><span class="signal-tag red">${q.clue}</span> ${q.clueExplain}</div></div>
                    <div class="fb-block fb-compare"><div class="fb-block-title" style="color:#64748B;">🔄 Tu elección vs. la correcta</div>
                        <div class="fb-compare-row"><span class="compare-label wrong">Tú elegiste</span><span class="compare-text"><span class="word-wrong">${sel.text}</span></span></div>
                        <div class="fb-compare-row"><span class="compare-label right">Correcta</span><span class="compare-text"><span class="word-right">${correctOpt.text}</span></span></div>
                    </div>
                    ${errBlocks}
                    <div class="fb-block fb-why"><div class="fb-block-title">💡 ¿Por qué es correcta la oración correcta?</div><div class="fb-text">${q.correctReason}</div></div>
                </div>`;
        }
    }
    function showQuestion(i){
        document.querySelectorAll('.question-card').forEach((c,idx)=>c.classList.toggle('hidden',idx!==i));
        document.getElementById('currentQ').textContent=i+1;
        currentQuestion=i;
    }
    function nextQuestion(i){ if(i<quizData.length-1) showQuestion(i+1); else showResults(); }
    function prevQuestion(){ if(currentQuestion>0) showQuestion(currentQuestion-1); }
    function updateProgress(){
        const done=answered.filter(Boolean).length;
        document.getElementById('progressFill').style.width=(done/quizData.length*100)+'%';
    }
    function toggleHint(i){
        const b=document.getElementById('hint-'+i), btn=document.getElementById('hintbtn-'+i);
        b.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=b.classList.contains('show')?'💡 Ocultar pista':'💡 Ver pista';
    }
    function toggleTrans(i){
        const t=document.getElementById('trans-'+i), btn=document.getElementById('transbtn-'+i);
        t.classList.toggle('show'); btn.classList.toggle('active');
        btn.textContent=t.classList.contains('show')?'Ocultar español':'Ver en español';
    }
    function showResults(){
        document.querySelectorAll('.question-card').forEach(c=>c.classList.add('hidden'));
        document.getElementById('resultsScreen').classList.add('show');
        const pct=score/quizData.length*100;
        window.dispatchEvent(new CustomEvent('jucum:done',{detail:{score:Math.round(pct)}}));
        document.getElementById('finalScore').textContent=score+'/'+quizData.length;
        let stars=pct>=90?3:pct>=70?2:1;
        document.getElementById('resultsMessage').textContent=pct>=90
            ?'¡Excelente trabajo! 🏆':pct>=70?'¡Muy bien! Sigue practicando. 💪'
            :'Buen esfuerzo. Repasa e inténtalo de nuevo. 📚';
        document.querySelectorAll('.star').forEach((s,i)=>{ if(i<stars) setTimeout(()=>s.classList.add('earned'),i*300); });
    }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    document.addEventListener('DOMContentLoaded', initQuiz);
    </script>
<script src="https://jucum-english-center.netlify.app/jucum-connect.js"></script>
</body>
</html>
